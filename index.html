<!DOCTYPE html>
<!-- Spin the Food play harness. Game state: food.* (event-sourced). Family Cookbook from DB. -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- 2026-08-11: maximum-scale/user-scalable added - without them, iOS Safari's
     autozoom-on-input (triggered by any focused input/textarea/select with a
     computed font-size under 16px, which many of this app's compact fields
     use) or a fast double-tap being misread as a zoom gesture would leave the
     whole page zoomed in with no automatic reset, per user report ("often
     after interacting with the UI... the whole screen zooms in a few
     percent... I have to zoom out manually every time"). This app is used
     like a native app (standalone PWA manifest, bottom-sheet modals) so
     locking pinch-zoom out entirely is the standard fix rather than auditing
     every small font-size individually. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFD700">
<title>Spin the Food</title>
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Spin%20the%20Food%22%2C%22short_name%22%3A%22SpinFood%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23fafaf7%22%2C%22theme_color%22%3A%22%23f59e0b%22%2C%22start_url%22%3A%22.%22%2C%22icons%22%3A%5B%5D%7D">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --amber:#FFE34D; --amber-d:#B8923C; --amber-tint:#fff8e0; --amber-text:#6b5400; --green:#10b981; --teal:#0032FF; --teal-d:#0026bf; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #fafaf7; color: #1f2937; overscroll-behavior: none;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 88px; }

  /* identity gate */
  .gate { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 40px 28px; gap: 14px; text-align: center; }
  .gate h1 { font-size: 30px; }
  .gate p { color: #888; margin-bottom: 10px; }
  .who-btn {
    display: flex; align-items: center; gap: 14px; background: #fff; border: 2px solid #eee;
    border-radius: 18px; padding: 16px 20px; font-size: 18px; font-weight: 700; cursor: pointer; text-align: left;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; width: 100%;
  }
  .who-btn:active { background: var(--amber-tint); border-color: var(--amber); }
  .who-btn .em { font-size: 30px; }
  .who-btn small { display: block; font-weight: 400; color: #999; font-size: 13px; }

  /* onboarding */
  .ob { flex: 1; display: flex; flex-direction: column; padding: 22px 24px 30px; }
  .ob-nav { display: flex; align-items: center; gap: 10px; }
  .ob-back { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; padding: 0 4px; }
  .ob-prog { display: flex; gap: 5px; flex: 1; }
  .ob-prog i { height: 4px; flex: 1; border-radius: 2px; background: #eee; }
  .ob-prog i.done { background: var(--amber); }
  .ob-q { font-size: 24px; font-weight: 800; line-height: 1.25; margin: 18px 0 18px; }
  .ob-big { display: flex; flex-direction: column; gap: 12px; }
  .ob-big .btn { font-size: 17px; padding: 17px; }
  .ob-note { color: #999; font-size: 13px; padding-top: 12px; }
  .ob-text { width: 100%; min-height: 110px; border: 2px solid #e5e7eb; border-radius: 16px; padding: 12px; font-size: 15px; font-family: inherit; resize: none; background: #fff; }
  .ob-next { margin-top: auto; }
  .mealgrid { display: grid; grid-template-columns: 52px repeat(3, 1fr); gap: 6px; font-size: 12px; }
  .mealgrid.two { grid-template-columns: 52px repeat(2, 1fr); }
  .mealgrid.one { grid-template-columns: 52px 1fr; }
  .mealgrid .hd { text-align: center; color: #888; font-weight: 600; padding: 2px 0; }
  .mealgrid .dy { color: #666; font-weight: 700; align-self: center; }
  .mealgrid .hd.bulk, .mealgrid .dy.bulk { cursor: pointer; border-radius: 8px; user-select: none; -webkit-tap-highlight-color: transparent; }
  .mealgrid .hd.bulk { padding: 6px 2px; }
  .mealgrid .dy.bulk { padding: 4px 6px; }
  .mealgrid .hd.bulk:active, .mealgrid .dy.bulk:active { background: #f3f4f6; }
  .mealgrid .hd.bulk.dim, .mealgrid .dy.bulk.dim { color: #ccc; }
  .mg-cell { height: 34px; border-radius: 9px; background: #ecfdf5; border: 1.5px solid var(--green); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; touch-action: none; user-select: none; }
  .mg-cell.off { background: #f5f5f4; border-color: #e5e7eb; color: #ccc; }
  .ob-sum { background: #fff; border: 1.5px solid #eee; border-radius: 16px; padding: 14px; font-size: 14px; line-height: 1.7; }

  /* top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 8px; }
  .me-pill { display: flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid #eee; border-radius: 999px; padding: 5px 12px 5px 6px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .me-pill .em { font-size: 20px; }
  .presence { display: flex; gap: 3px; }
  .presence .p { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; background: #fff; border: 1.5px solid #eee; opacity: .35; }
  .presence .p.on { opacity: 1; border-color: var(--green); }
  .screen-title { padding: 2px 20px 8px; }
  .screen-title h2 { font-size: 22px; }
  .screen-title .sub { color: #888; font-size: 13px; }

  .btn { border: none; border-radius: 15px; padding: 13px 20px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn-primary { background: var(--amber); color: var(--amber-text); box-shadow: 0 4px 0 var(--amber-d); }
  .btn-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--amber-d); }
  .btn-ghost { background: #fff; color: #444; border: 2px solid #e5e7eb; }
  .chip { background: #fff; border: 1.5px solid #e5e7eb; border-radius: 13px; padding: 8px 13px; font-size: 14px; cursor: pointer; user-select: none; }
  .chip.on { border-color: var(--amber); background: var(--amber-tint); font-weight: 600; }
  .chips-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
  .banner { margin: 12px 18px; padding: 13px 15px; border-radius: 16px; background: linear-gradient(135deg,#10b981,#059669); color: #fff; font-weight: 700; font-size: 14px; text-align: center; }

  /* AI fill CTA - the big glaring button at the top of an empty menu */
  .ai-fill {
    margin: 4px 16px 12px; padding: 14px 18px; border: none; border-radius: 18px;
    background: var(--amber);
    color: var(--amber-text); font-weight: 800; font-size: 16px; cursor: pointer;
    width: calc(100% - 32px); box-shadow: 0 6px 0 var(--amber-d); text-align: left;
    display: flex; flex-direction: column; gap: 3px;
  }
  .ai-fill small { display: block; font-weight: 400; font-size: 12px; opacity: .9; }
  .ai-fill:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--amber-d); }

  /* menu (D) */
  .menu-ai-tip { margin: 0 16px 10px; padding: 10px 14px; background: var(--amber-tint); color: var(--amber-text); border-radius: 12px; font-size: 12.5px; line-height: 1.5; }
  .menu-confirm-row { margin: 4px 16px 16px; padding: 10px 14px; background: #1f2937; color: #fff; border-radius: 12px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .menu-list { padding: 0 14px; display: flex; flex-direction: column; gap: 8px; }
  .day-block { background: #fff; border: 2px solid #eee; border-radius: 16px; overflow: hidden; }
  .day-block.locked { border-color: var(--green); }
  .day-hd { padding: 6px 12px 4px; font-weight: 800; font-size: 13px; color: #555; background: #fafaf9; border-bottom: 1px solid #f0f0ee; }
  .slot { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid #f7f7f5; min-height: 42px; }
  .slot:last-child { border-bottom: none; }
  .slot.awaiting { background: #fffbeb; }
  .slot-ico { width: 20px; font-size: 14px; }
  .slot-main { flex: 1; }
  .slot-dish { font-size: 13px; font-weight: 600; }
  .slot-dish.empty { color: #bbb; font-weight: 400; }
  .slot-cook { font-size: 11px; color: #999; margin-top: 1px; }
  .slot-edit { background: none; border: none; font-size: 15px; cursor: pointer; color: #cbd5e1; }
  .ai-note-badge { background: none; border: none; font-size: 15px; cursor: pointer; padding: 0 2px; }
  .mini-row { display: flex; gap: 6px; margin-top: 4px; }
  .mini-btn { border: 1.5px solid #e5e7eb; background: #fff; border-radius: 10px; padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer; color: #555; }
  .mini-btn.accept { border-color: var(--green); color: #059669; }
  .mini-btn.reject { border-color: #ef4444; color: #ef4444; }
  .prop { margin: 4px 12px 8px; padding: 8px 10px; background: #fff; border: 1px dashed var(--amber); border-radius: 10px; font-size: 12px; }

  /* spin deck (A) */
  .filter-row { display: flex; gap: 6px; padding: 0 18px 8px; overflow-x: auto; }
  .filter-row .chip { font-size: 12px; padding: 6px 11px; white-space: nowrap; }
  /* filter icon button - width matches the search bar's height via normal flex
     cross-axis stretch (its row sibling, the search input, sets that height). */
  .filter-icon-btn { flex: 0 0 auto; width: 46px; border: 1.5px solid #e5e7eb; background: #fff; border-radius: 12px; cursor: pointer; color: #555; display: flex; align-items: center; justify-content: center; }
  .filter-icon-btn.on { border-color: var(--amber); background: var(--amber-tint); color: var(--amber-text); }
  /* inline SVG "sliders" icon (three lines with a knob on each, staggered) - the
     standard "Filters" glyph used by Airbnb/LinkedIn/Amazon etc. SVG renders
     identically everywhere, unlike an emoji (font-dependent) or a CSS border-triangle
     hack (inconsistent across browsers). Both stroke and fill use currentColor, so
     recoloring the icon on "on" state is just the button's `color` change above. */
  .filter-icon-btn svg { width: 18px; height: 18px; }
  .filter-dropdown { position: relative; display: inline-block; }
  .filter-dropdown-full { display: block; width: 100%; }
  .dropdown-btn { border: 1.5px solid #e5e7eb; background: #fff; border-radius: 13px; padding: 8px 13px; font-size: 14px; cursor: pointer; color: #333; display: flex; align-items: center; gap: 6px; }
  .dropdown-btn.on { border-color: var(--amber); background: var(--amber-tint); font-weight: 600; }
  .dropdown-btn .dd-arrow { font-size: 10px; color: #999; flex: 0 0 auto; }
  .dropdown-btn-full { width: 100%; box-sizing: border-box; justify-content: space-between; }
  .dropdown-btn-full .dropdown-summary { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .dropdown-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 200px; max-height: 260px; overflow-y: auto; background: #fff; border: 1.5px solid #e5e7eb; border-radius: 14px; box-shadow: 0 12px 28px rgba(0,0,0,.14); padding: 6px; }
  .dropdown-menu-full { width: 100%; box-sizing: border-box; min-width: 0; }
  .dropdown-item { padding: 9px 11px; font-size: 14px; border-radius: 9px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dropdown-item:hover { background: #f8fafc; }
  .dropdown-item.on { background: var(--amber-tint); font-weight: 600; }
  .dropdown-item .dd-check { color: var(--amber); opacity: 0; font-size: 13px; }
  /* edge-to-edge single-toggle chip (currently just hide-inactive) */
  .chip-full { display: block; width: 100%; box-sizing: border-box; text-align: center; margin-bottom: 7px; }
  .dropdown-item.on .dd-check { opacity: 1; }
  /* search-bar typeahead suggestions - a floating list of matching recipe names under
     the input, so search isn't "type and hope the swipe deck updated somewhere below". */
  .search-suggest { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30; max-height: 240px; overflow-y: auto; background: #fff; border: 1.5px solid #e5e7eb; border-radius: 14px; box-shadow: 0 12px 28px rgba(0,0,0,.14); padding: 6px; }
  .search-suggest-item { padding: 9px 11px; font-size: 14px; border-radius: 9px; cursor: pointer; }
  .search-suggest-item:hover { background: #f8fafc; }
  .search-clear-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border: none; border-radius: 50%; background: #e5e7eb; color: #6b7280; font-size: 12px; line-height: 1; align-items: center; justify-content: center; cursor: pointer; padding: 0; z-index: 5; }
  .search-clear-btn:hover { background: #d1d5db; }
  /* 2026-08-11: was a fixed calc(100vh - 430px) tuned by eye for one device -
     left a growing dead gap between the caption row and the bottom nav on
     taller screens as the surrounding chrome (filter row, quick toggles)
     shrank over time. `.stack` is now a flex item that fills whatever's
     actually left over in #app's flex column (see `.spin-stack-outer`
     below) - no magic constant to re-tune per device/session ever again.
     Only takes effect where an ancestor is display:flex - `.wish-stack`'s
     wrapper (renderWishPicker's plain position:relative div) isn't, so this
     is a no-op there and its own fixed height (below) still wins. */
  .stack { position: relative; flex: 1 1 auto; min-height: 220px; margin: 0 22px; }
  /* margin-bottom mirrors the ~16px gap already above the card (filter-row's
     own 8px bottom padding + the (closed) adv-filter-panel wrapper's 8px
     margin, see renderSpin()) - without it, a max-height card leaves nothing
     but the fixed nav's own reserved padding between the swipe-tip labels
     and the nav pill, which reads as touching/overlapping it. */
  .spin-stack-outer { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; max-height: 440px; margin-bottom: 16px; }
  .wish-stack { height: 300px; margin: 0; }
  .scard { position: absolute; inset: 0; background: #fff; border-radius: 22px; border: 2px solid #eee; overflow: hidden; box-shadow: 0 10px 26px rgba(0,0,0,.08); touch-action: none; user-select: none; }
  .scard .ph { height: 60%; display: flex; align-items: center; justify-content: center; font-size: 82px; position: relative; background-size: cover; background-position: center; background-repeat: no-repeat; }
  .scard .ph small { position: absolute; bottom: 8px; left: 10px; font-size: 9px; color: rgba(255,255,255,.85); background: rgba(0,0,0,.25); padding: 2px 6px; border-radius: 6px; }
  /* Enrich action for Thin Cards - a ✨ "AI can do more with this" affordance,
     floating bottom-left of the photo (replaces the old static "Add
     ingredients" text badge that used to sit here - this button IS the "add
     ingredients" action now, not just a label pointing at one). Shared
     between the Spin card and the detail/about hero (`.dtl-hero`) so the
     action sits in the exact same corner wherever a Thin Card's photo is
     shown - opposite corner from `.qhide` (top-left), so it never collides. */
  .scard .enrich-fab, .dtl-hero .enrich-fab { position: absolute; bottom: 10px; left: 10px; z-index: 3; width: 34px; height: 34px; border: none; border-radius: 50%; background: rgba(217,119,6,.92); color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; box-shadow: 0 2px 8px rgba(0,0,0,.22); }
  /* Icon reflects CURRENT state, not the tap action: open eye = visible (light
     green circle), closed eye = hidden (orange circle) - an inline SVG for both
     (not the 🙈 monkey emoji) so "closed eye" reads as an actual shut eyelid,
     not an unrelated animal. */
  .scard .qhide, .dtl-hero .qhide { position: absolute; top: 12px; left: 12px; z-index: 3; width: 34px; height: 34px; border: none; border-radius: 50%; background: #dcfce7; color: #16a34a; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; box-shadow: 0 2px 8px rgba(0,0,0,.22); }
  .scard .qhide.off, .dtl-hero .qhide.off { background: #ffedd5; color: #c2410c; }
  /* Same photo-carousel chrome (nav arrows, dots, pending/approve UI, "add a
     photo" CTA) is reused verbatim on the recipe detail view's hero, via
     photoSlideHtml() - `.dtl-hero` just needs `position:relative` (it already
     has it) for these absolutely-positioned pieces to anchor correctly. */
  .scard .pnav, .dtl-hero .pnav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 34px; height: 34px; border: none; border-radius: 50%; background: rgba(0,0,0,.35); color: #fff; font-size: 20px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; }
  .scard .pnav.prev, .dtl-hero .pnav.prev { left: 10px; }
  .scard .pnav.next, .dtl-hero .pnav.next { right: 10px; }
  .scard .pdots, .dtl-hero .pdots { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 3; display: flex; gap: 5px; }
  .scard .pdots span, .dtl-hero .pdots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.5); }
  .scard .pdots span.on, .dtl-hero .pdots span.on { background: #fff; }
  .scard .photo-pending-badge, .dtl-hero .photo-pending-badge { position: absolute; top: 10px; right: 10px; z-index: 3; background: rgba(217,119,6,.92); color: #fff; font-size: 10.5px; font-weight: 800; padding: 4px 9px; border-radius: 20px; }
  /* Top-right "remove this photo" X, approved (non-pending) slides only -
     pending slides show .photo-pending-badge in the same corner instead,
     never both at once (see photoSlideHtml). */
  .scard .photo-remove-btn, .dtl-hero .photo-remove-btn { position: absolute; top: 10px; right: 10px; z-index: 3; width: 28px; height: 28px; border: none; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; }
  .scard .photo-approve-row, .dtl-hero .photo-approve-row { position: absolute; bottom: 12px; left: 12px; z-index: 3; display: flex; gap: 8px; }
  .scard .pbtn, .dtl-hero .pbtn { border: none; border-radius: 10px; padding: 7px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
  .scard .pbtn.approve, .dtl-hero .pbtn.approve { background: rgba(5,150,105,.92); color: #fff; }
  .scard .pbtn.decline, .dtl-hero .pbtn.decline { background: rgba(220,38,38,.92); color: #fff; }
  .scard .add-photo-cta, .dtl-hero .add-photo-cta { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #fff; background: rgba(0,0,0,.18); cursor: pointer; touch-action: manipulation; font-weight: 700; font-size: 14px; }
  .scard .add-photo-cta .ic, .dtl-hero .add-photo-cta .ic { font-size: 40px; }
  .scard .bd { padding: 16px; }
  .scard .ti { font-weight: 800; font-size: 22px; }
  .scard .mt { font-size: 13px; color: #888; margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
  .stamp { position: absolute; top: 20px; font-size: 24px; font-weight: 900; padding: 4px 14px; border-radius: 10px; border: 4px solid; opacity: 0; }
  .stamp.yes { left: 16px; color: var(--green); border-color: var(--green); transform: rotate(-14deg); }
  .stamp.no { right: 16px; color: #ef4444; border-color: #ef4444; transform: rotate(14deg); }
  /* the like/nope round buttons were dropped - the card stack already has full
     swipe-gesture support (drag left/right), so they were pure duplication. The
     Add-new-recipe button (no gesture equivalent) tried floating over the card
     stack's corner first, but it got visually buried behind the card there -
     now sits to the left of the search bar instead, styled like its filter-icon
     sibling for a tidy matched pair either side of the search input. */
  .round-btn { width: 58px; height: 58px; border-radius: 50%; border: 2px solid #eee; background: #fff; font-size: 25px; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .hint { margin: 8px 20px; font-size: 11px; color: #aaa; text-align: center; }

  /* wish (C) */
  .card { margin: 8px 18px; background: #fff; border-radius: 18px; padding: 15px; border: 2px solid #e5e7eb; }
  .card.granted { border-color: var(--green); background: #ecfdf5; }
  .wish-head { display: flex; gap: 12px; align-items: center; }
  .wish-dish { font-size: 38px; }
  .wish-title { font-weight: 800; font-size: 17px; }
  .wish-by { font-size: 12px; color: #888; }
  .dots { display: flex; gap: 4px; margin-top: 10px; align-items: center; font-size: 12px; color: #888; min-height: 22px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 1.5px solid #ccc; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
  .status { font-size: 12px; margin-top: 10px; color: var(--amber-d); font-weight: 600; }
  .status.ok { color: #059669; }

  /* duel (B) */
  .duel { margin: 8px 18px; background: #fff; border-radius: 18px; padding: 14px; border: 2px solid #e5e7eb; cursor: pointer; position: relative; }
  .duel.voted { border-color: #6366f1; background: #eef2ff; }
  .duel.win { border-color: var(--green); background: #ecfdf5; }
  .duel .pitch { font-size: 13px; color: #555; font-style: italic; margin-top: 6px; }
  .crown-em { font-size: 15px; }

  /* activity */
  .activity { margin: 10px 18px 0; }
  .activity .a { font-size: 12px; color: #777; padding: 5px 0; border-bottom: 1px solid #f0f0ee; }
  .activity .a b { color: #444; }

  /* modal */
  /* 2026-08-11: was z-index 40, below .detail-overlay's 90 - any modal()
     opened while the recipe detail screen is open (confirmDeleteRecipe,
     the enrich sheet from the edit-mode "Edit" button, etc.) rendered fully
     invisible behind it. Bumped above .detail-overlay but below
     .photo-lightbox (200), which manages its own separate stacking. */
  .veil { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 150; display: flex; align-items: flex-end; }
  #app { position: relative; }
  .modal { background: #fff; width: 100%; max-width: 480px; margin: 0 auto; border-radius: 24px 24px 0 0; padding: 18px 20px 26px; animation: up .22s ease; max-height: 82vh; overflow-y: auto; }
  @keyframes up { from { transform: translateY(30%); } to { transform: none; } }
  .modal h3 { font-size: 17px; margin-bottom: 10px; }
  .sect { font-size: 12px; color: #888; font-weight: 700; margin: 12px 0 6px; text-transform: uppercase; }

  /* bottom nav */
  /* Floating frosted-glass bar (Apple "liquid glass" take): detached from the screen
     edges with rounded corners, a blurred translucent fill so whatever's scrolled
     underneath still tints through it, and a soft outer glow instead of a hard
     border/shadow. */
  .nav {
    position: fixed; bottom: calc(10px + env(safe-area-inset-bottom)); left: 12px; right: 12px;
    max-width: 456px; margin: 0 auto; display: flex; padding: 8px 4px; overflow: visible;
    border-radius: 26px; border: 1px solid rgba(255,255,255,.6);
    background: rgba(255,255,255,.62);
    -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
    box-shadow: 0 10px 30px rgba(0,0,0,.10), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .nav button { flex: 1; background: none; border: none; font-size: 11px; color: #8b8f99; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 600; }
  /* fixed line-height (not just font-size) on every tab's icon, so every icon
     occupies exactly the same box height in the flex column regardless of how
     big its glyph actually renders - that's what keeps every label the same
     distance below its icon, Menu included. */
  .nav button .ic { font-size: 26px; line-height: 30px; }
  .nav button.on { color: var(--amber-d); }
  /* the Menu bubble - poking up above the bar like a FAB, so the weekly-plan tab
     reads as "the important one" at a glance rather than just another equal-weight
     label. Just a faint frosted glass disc now (no colored glow behind it - that
     amber-tint version read as "yellow background" rather than a subtle accent, so
     it's gone). Text stays blue (`--teal-d`) - that's the only thing that marks it
     as "on"/selected now.
     Sized and raised entirely via `transform` (bigger font-size + translateY), not
     an explicit width/height/margin - transform is purely visual and never changes
     an element's contribution to the flex layout, so no matter how big or how far
     up this renders, "Menu"'s label stays locked to the exact same line-height box
     (and therefore the exact same distance below its icon) as every other tab.
     No disc/glow behind the glyph at all - a visible circle here was bleeding
     down far enough to cover the top of the "Menu" label itself, so this is
     just the bigger icon floating with nothing behind it. */
  .nav button.big .ic {
    position: relative; display: inline-block; font-size: 34px;
    transform: translateY(-14px);
  }
  .nav button.big { color: var(--teal-d); font-weight: 700; }
  /* swipe-discovery "tip bubbles" over the card - tappable, and each does exactly
     what swiping that direction does (left = skip, right = onto the menu), so
     they teach the gesture rather than compete with it. No disc/background of
     their own at all now - just the icon floating directly on a blurred,
     hard-edge-free glow (the same `::before` trick as the Menu nav bubble), so
     there's no crisp circular boundary anywhere, only a soft translucent cloud.
     Every card gets an explicit inline z-index (10 minus its stack depth, see
     stackHtml()) so the top card can layer over the ones behind it - these need
     to clear that top value (z-index:10) to actually show. Sits near the bottom
     of the card - `.qhide` moved to the top-left corner, so the bottom corners
     are clear for these now. Inset 16px on all three sides (left/right/bottom) -
     the same 16px as `.scard .bd`'s own padding, so the left bubble lines up with
     where the recipe title's text starts, and the right/bottom sides mirror it
     for a symmetric margin all around.
     `align-items` is flex-start/flex-end (not center) per side - the button box
     is wider than its glyph, so centering the glyph inside a 16px-inset box left
     its visible left edge floating well past the title's actual text edge. Left-
     (resp. right-)aligning the glyph inside the box puts the glyph itself, not
     just its box, flush with that inset.
     These buttons are siblings of `.stack` (not inside it), and `.stack` itself
     carries `margin: 0 22px` - so the card's real left/right edge sits 22px in
     from this wrapper's edge, and `.bd`'s own 16px padding is on top of that.
     38px (22 + 16) is what actually lines the glyph up with the title text. */
  .swipe-tip {
    position: absolute; bottom: 16px; z-index: 20;
    border: none; cursor: pointer; background: none;
    width: 60px; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: center; gap: 2px;
    font-size: 17px; font-weight: 800; color: #f59e0b;
  }
  .swipe-tip.left { left: 38px; align-items: flex-start; }
  .swipe-tip.right { right: 38px; align-items: flex-end; }
  /* No ✕/🗓 icon glyph anymore, per direct request - the arrow alone (3x
     bigger than before) is the entire hint now. */
  .swipe-tip .tip-arrow { font-size: 27px; font-weight: 800; line-height: 1; opacity: .8; }
  /* 2026-08-11: the "Next"/"Onto menu" caption used to live in its own row
     below the whole card (`.spin-caption-row`, now removed) - once the card
     started flex-growing to fill the screen (see `.spin-stack-outer`), that
     row could land far enough down to collide with or hide behind the fixed
     bottom nav. Folded the label back into the same button as its arrow
     (stacked underneath, same flex column) - it's now physically impossible
     for the label to end up anywhere other than exactly next to its arrow. */
  .swipe-tip .tip-label { font-size: 10.5px; font-weight: 700; line-height: 1.1; opacity: .85; }

  /* 2026-08-11: bumped above .veil's new 150 - toasts (e.g. "Save failed")
     routinely fire while a modal is open and must stay visible on top of it. */
  .toast { position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 10px 18px; border-radius: 14px; font-size: 13px; z-index: 160; max-width: 88%; text-align: center; }
  .offline { position: fixed; top: 0; left: 0; right: 0; background: #ef4444; color: #fff; text-align: center; font-size: 12px; padding: 4px; z-index: 170; }

  /* recipe detail view - full-screen literal flip, everywhere the Spin card appears (issue #16) */
  .detail-overlay { position: fixed; inset: 0; z-index: 90; background: #fafaf7; overflow-y: auto;
    transform: scale(.35) rotateY(-75deg); transform-origin: center; opacity: 0; transition: transform .32s cubic-bezier(.34,1.4,.64,1), opacity .22s; }
  .detail-overlay.open { transform: scale(1) rotateY(0deg); opacity: 1; }
  .detail-overlay.closing { transform: scale(.35) rotateY(75deg); opacity: 0; }
  .dtl-hd { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: rgba(250,250,247,.94); backdrop-filter: blur(6px); border-bottom: 1px solid #eee; }
  .dtl-back { background: #fff; border: 1.5px solid #eee; border-radius: 50%; width: 38px; height: 38px; font-size: 17px; cursor: pointer; flex-shrink: 0; }
  /* `contain` (not `cover`) - a photo taken in whatever aspect ratio the
     family's phone shot it in shouldn't get cropped/stretched to fill a fixed
     240px strip, unlike the Spin card's small preview where cropping is the
     right trade-off. The dark fill letterboxes any photo that isn't exactly
     that ratio. Tapping the photo itself (not the nav arrows/dots/etc, see
     openPhotoLightbox() wiring) opens it full-screen, uncropped either way. */
  .dtl-hero { width: 100%; height: 240px; background-size: contain; background-position: center; background-repeat: no-repeat; background-color: #1a1a1a; position: relative; cursor: zoom-in; }
  .dtl-hero .em { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 88px; }
  .photo-lightbox { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
  .photo-lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: default; }
  .photo-lightbox .lb-close { position: absolute; top: 14px; right: 14px; z-index: 1; width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(255,255,255,.15); color: #fff; font-size: 18px; cursor: pointer; }
  .dtl-banner { margin: 10px 16px; padding: 10px 13px; border-radius: 14px; font-size: 12.5px; font-weight: 600; }
  .dtl-banner.edit { background: var(--amber-tint); border: 1px dashed var(--amber); color: var(--amber-text); }
  .dtl-banner.fork { background: #eef2ff; border: 1px dashed #6366f1; color: #3730a3; }
  .dtl-editbar { position: sticky; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(0deg,#fafaf7 60%,rgba(250,250,247,0)); display: flex; gap: 8px; }
  .dtl-editbar .btn { flex: 1; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
// Pinned to an exact version (not the floating "@2" tag) - esm.sh's "latest 2.x"
// resolution briefly pointed at a build (2.112.1) whose own sub-module paths
// (auth-js/postgrest-js/realtime-js) 404'd straight from their CDN. An unpinned
// import means production is exposed to that recurring at any time, with no
// deploy on our side to explain it. Bump deliberately if a newer version is
// ever needed, not automatically.
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.50.0";

const SUPABASE_URL = "https://jelvmygvviomdlrziskr.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplbHZteWd2dmlvbWRscnppc2tyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzNzE3MzksImV4cCI6MjA4OTk0NzczOX0.oRatIEeI84VrgrGksRWzROMn9JzppP0y0oaIUaSeJWQ";
// detectSessionInUrl handles the magic-link callback: Supabase Auth appends
// #access_token=... to the URL after email confirmation, and this option makes
// supabase-js parse it, persist the session to localStorage, and clean the URL.
const sb = createClient(SUPABASE_URL, SUPABASE_ANON, {
  realtime: { params: { eventsPerSecond: 5 } },
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "implicit" },
});

// Safari Private Browsing can block localStorage — keep an in-memory mirror so gates
// (language picker, family key) still advance after a tap.
const stfMem = {};
function stfGet(key) {
  try {
    const v = localStorage.getItem(key);
    if (v != null) { stfMem[key] = v; return v; }
  } catch (e) { console.warn("[stf] storage read blocked:", e.message); }
  return stfMem[key] ?? null;
}
function stfSet(key, val) {
  stfMem[key] = val;
  try { localStorage.setItem(key, val); } catch (e) { console.warn("[stf] storage write blocked:", e.message); }
}
function stfDel(key) {
  delete stfMem[key];
  try { localStorage.removeItem(key); } catch (e) { /* noop */ }
}

// Family key is the shared "room". It must survive a lost ?family= param
// (installed PWAs open at start_url "." with no query), so once seen it is
// remembered on the device. Otherwise members silently split into separate kitchens.
function resolveFamilyKey() {
  const q = new URLSearchParams(location.search).get("family");
  if (q) { stfSet("stf_family", q); return q; }
  return stfGet("stf_family") || "kobzar-demo";
}
const FAMILY_KEY = resolveFamilyKey();

// ── auth + membership (Week 1 cutover) ─────────────────────────────
// Every family member now signs in via Supabase Auth magic link. After sign-in,
// spin_food_my_membership() returns the caller's food.family_members row.
// The old hardcoded FAMILY picker is now the invitation-onboarding step for
// invitees; existing members skip straight to the app.
let authSession = null;   // Supabase Auth session (null before sign-in)
let membership = null;    // { member_id, family_id, family_name, avatar_role, other_label, display_name, is_owner, is_cook, ... } or null

// Week 1 backward-compat map: the game engine uses "mom"/"dad"/"gran"/"kid" as
// slot ids everywhere (game state, wishes, activity feed, presence). The new
// avatar_role enum has 6 values (mom, dad, grandpa, grandma, kid, other).
// Grandpa/grandma collapse to "gran"; "other" falls back to "dad" for Week 1.
// Week 3 rewires the FAMILY array to real DB rows and retires this map.
const AVATAR_TO_LEGACY = {
  mom: "mom", dad: "dad", grandpa: "gran", grandma: "gran", kid: "kid", other: "dad",
};

// When a real membership arrives, override the hardcoded FAMILY slot's display
// name (and is_cook flag if we have it) so the topbar/pill/menu show real names
// instead of "Mom" / "Dad" / "Granny".
function applyMembershipToFamily(memberRow) {
  if (!membership) return;
  const slot = memberRow || FAMILY.find(m => m.id === membership.member_id);
  if (slot && membership.display_name) {
    slot.en = membership.display_name;
    slot.ru = membership.display_name;
  }
  if (slot && typeof membership.is_cook === "boolean") slot.cook = membership.is_cook;
}

async function refreshMembership() {
  const { data, error } = await sb.rpc("spin_food_my_membership");
  if (error) { console.error("[stf-auth] membership fetch failed:", error); membership = null; return; }
  membership = data;
  applyMembershipToFamily();
}

// The invitation token in ?invite=<hex>. Present only for invitees arriving via
// magic-link email. We stash it early so onAuthStateChange can pick it up.
const inviteTokenInUrl = new URLSearchParams(location.search).get("invite");

// ── language: chosen FIRST, before identity; carried through the whole app ──
// stf_lang = device default (pre-sign-in). stf_ob_lang_<member_id> = per-person
// onboarding choice so a new family member never inherits a sibling's Russian.
let lang = null;

function onboardLangKey(memberId) {
  return memberId ? `stf_ob_lang_${memberId}` : null;
}

function syncLangFromStorage() {
  const memberId = membership?.member_id;
  if (memberId) {
    const ob = stfGet(onboardLangKey(memberId));
    if (ob) { lang = ob; return; }
  }
  lang = stfGet("stf_lang") || lang || null;
}

function saveLangChoice(l, { forOnboard = false } = {}) {
  lang = l;
  stfSet("stf_lang", l);
  const memberId = membership?.member_id || me;
  if (forOnboard && memberId) {
    stfSet(onboardLangKey(memberId), l);
  }
}

function needsDeviceLangGate() {
  return !stfGet("stf_lang") && !lang;
}

function needsOnboardLangGate(memberId) {
  return memberId && !stfGet(onboardLangKey(memberId));
}

// ── unit system: separate preference from UI language (SPEC_RECIPE_I18N.md
// decision #10) - defaults per-language (en -> imperial, ru -> metric) but
// independently overridable via the Settings screen's "Units" section
// (saveUnitsChoice). Client-local only, same storage pattern as stf_lang -
// no server column, nothing to sync across devices for v1.
function unitsSystem() {
  const stored = stfGet("stf_units");
  if (stored === "metric" || stored === "imperial") return stored;
  return lang === "ru" ? "metric" : "imperial";
}
function saveUnitsChoice(sys) {
  if (sys !== "metric" && sys !== "imperial") return;
  stfSet("stf_units", sys);
}

// Safari iOS often drops addEventListener on buttons replaced by innerHTML.
// Expose a global handler for inline onclick (most reliable), plus a module fn.
// This is the one and only language gate: device-level, shown before sign-in.
// Per-member language overrides (settings screen, invitation accept) are a
// separate, always-available concern and don't need their own gate screen.
function pickLanguage(code) {
  if (code !== "en" && code !== "ru") return;
  saveLangChoice(code);
  render();
}
globalThis.stfPickLang = pickLanguage;

syncLangFromStorage();
const T = (en, ru) => (lang === "ru" ? ru : en);

// ── static data (Family Cookbook loaded from DB; FAMILY roster from members RPC) ──
let FAMILY = [];
let DISHES = [];
let activePlanId = null;
let lastEventSeq = 0;
let loadInFlight = false;
let loadError = null;

function profileCacheKey(memberId) {
  return memberId ? `stf_profile_${memberId}` : null;
}

function restoreProfile(memberId) {
  try {
    const raw = stfGet(profileCacheKey(memberId));
    if (raw) return JSON.parse(raw);
  } catch (e) {
    console.warn("[stf-data] profile cache read failed:", e);
  }
  return null;
}

function cacheProfile(memberId, profile) {
  if (!memberId || !profile) return;
  try {
    stfSet(profileCacheKey(memberId), JSON.stringify(profile));
  } catch (e) {
    console.warn("[stf-data] profile cache write failed:", e);
  }
}

function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} timed out (${Math.round(ms / 1000)}s)`)), ms)),
  ]);
}

// 2026-08-10 (SPEC gap: photo-upload timeouts with zero server-side trace -
// see food.client_diagnostics migration comment for the full story) - a
// minimal, best-effort breadcrumb logger for exactly this class of "the
// browser says it failed but nothing shows up on the server" report.
// Fire-and-forget on purpose: a logging call must never block or throw into
// whatever real flow is calling it. Captures navigator.connection where the
// browser exposes it (mainly Chrome/Android; Safari/iOS does not) since
// that's the one client-side signal `withTimeout()` alone can never give us.
function logClientDiagnostic(eventType, details = {}) {
  try {
    const conn = navigator.connection || navigator.webkitConnection || navigator.mozConnection;
    const enriched = {
      ...details,
      online: navigator.onLine,
      visibility: document.visibilityState,
      network: conn ? { effectiveType: conn.effectiveType, downlinkMbps: conn.downlink, rttMs: conn.rtt, saveData: conn.saveData } : null,
    };
    sb.rpc("spin_food_log_client_diagnostic", { p_event_type: eventType, p_details: enriched }).then(null, () => {});
  } catch (e) {
    // Never let diagnostics logging itself become a new source of errors.
  }
}

const AVATAR_EMOJI = { mom: "👩", dad: "👨", grandpa: "👴", grandma: "👵", kid: "👧", other: "🧑" };

function avatarEmoji(role) { return AVATAR_EMOJI[role] || "🧑"; }

// ── food.units: fixed vocabulary, loaded once (SPEC_RECIPE_I18N.md
// decision #8/#14 - not user-extensible, so no reason to reload per
// recipe). Populates UNITS_BY_SLUG for convertQty() below.
let UNITS = [];
let UNITS_BY_SLUG = {};
let unitsLoaded = false;
async function loadUnits() {
  if (unitsLoaded) return;
  const { data, error } = await sb.rpc("spin_food_units_list");
  if (error) { console.error("[stf-data] units:", error); return; }
  UNITS = data || [];
  UNITS_BY_SLUG = {};
  UNITS.forEach(u => { UNITS_BY_SLUG[u.slug] = u; });
  unitsLoaded = true;
}
const METRIC_UNIT_SLUGS = new Set(["gram", "kilogram", "milliliter", "liter", "celsius"]);

function roundToIncrement(val, inc) {
  if (!inc) return val;
  return Math.round(val / inc) * inc;
}

// Picks the most cook-friendly target unit for a base-unit value (grams or
// milliliters) in the wanted system, per SPEC_RECIPE_I18N.md decision #13 -
// e.g. 5ml reads better as "1 tsp" than "0.02 cups".
function bestTargetSlug(kind, wantMetric, baseVal) {
  if (kind === "mass") return wantMetric
    ? (baseVal >= 1000 ? "kilogram" : "gram")
    : (baseVal >= 453.592 ? "pound" : "ounce");
  if (kind === "volume") {
    if (wantMetric) return baseVal >= 1000 ? "liter" : "milliliter";
    if (baseVal < 14.7868) return "teaspoon";
    if (baseVal < 236.588) return "tablespoon";
    return "cup";
  }
  return null;
}

// Converts ing.qty/ing.unit_slug into the viewer's preferred system
// (SPEC_RECIPE_I18N.md decision #9/#11/#13). Same-dimension only - mass<->volume
// is never attempted (no ingredient density data). Returns null (show the
// original text unconverted) when the unit is unrecognized, already in the
// wanted system, a count unit (no equivalent), or a conversion factor is
// missing - "accept as-is" fallback, same convention as unmatched ingredients.
function convertQty(qty, unitSlug) {
  const num = Number(qty);
  // matchUnitSlug() resolves legacy/alias unit text (e.g. "kg", "clove")
  // saved before server-side unit normalization existed - see its own
  // comment below for why this fallback is needed.
  const u = unitSlug ? UNITS_BY_SLUG[matchUnitSlug(unitSlug) || unitSlug] : null;
  if (!u || !Number.isFinite(num)) return null;
  const wantMetric = unitsSystem() === "metric";
  const isMetricUnit = METRIC_UNIT_SLUGS.has(u.slug);
  if (wantMetric === isMetricUnit) return null; // already in the desired system
  if (u.kind === "count") return null; // passthrough, no cross-system equivalent

  if (u.kind === "temperature") {
    const outSlug = wantMetric ? "celsius" : "fahrenheit";
    const target = UNITS_BY_SLUG[outSlug];
    if (!target) return null;
    const outVal = wantMetric ? (num - 32) * 5 / 9 : num * 9 / 5 + 32;
    return { qty: roundToIncrement(outVal, target.round_increment), unit: target };
  }

  if (u.to_base_factor == null) return null;
  const baseVal = num * u.to_base_factor;
  const targetSlug = bestTargetSlug(u.kind, wantMetric, baseVal);
  const target = targetSlug ? UNITS_BY_SLUG[targetSlug] : null;
  if (!target || target.to_base_factor == null) return null;
  const outVal = baseVal / target.to_base_factor;
  return { qty: roundToIncrement(outVal, target.round_increment), unit: target };
}

// Client-side twin of spin-food-import's/spin-food-translate-recipe's
// UNIT_ALIASES/matchUnitSlug() (same Deno functions, same table). Needed
// because recipes saved before that server-side normalization existed (or
// via a path that predates it) can still carry raw abbreviated/free-text
// units ("kg", "ml", "clove") in the DB that never match a canonical
// food.units slug directly - this fallback resolves them the same way the
// server would, so already-saved recipes localize correctly without a
// backfill migration.
const UNIT_ALIASES = {
  g: "gram", gr: "gram", gram: "gram", grams: "gram", "г": "gram", "гр": "gram", "грамм": "gram", "граммов": "gram", "грамма": "gram",
  kg: "kilogram", kilo: "kilogram", kilos: "kilogram", kilogram: "kilogram", kilograms: "kilogram", "кг": "kilogram", "килограмм": "kilogram",
  oz: "ounce", ounce: "ounce", ounces: "ounce", "унция": "ounce", "унции": "ounce",
  lb: "pound", lbs: "pound", pound: "pound", pounds: "pound", "фунт": "pound", "фунта": "pound",
  ml: "milliliter", milliliter: "milliliter", milliliters: "milliliter", millilitre: "milliliter", "мл": "milliliter", "миллилитр": "milliliter",
  l: "liter", liter: "liter", liters: "liter", litre: "liter", litres: "liter", "л": "liter", "литр": "liter",
  tsp: "teaspoon", teaspoon: "teaspoon", teaspoons: "teaspoon", "ч.л.": "teaspoon", "чайная ложка": "teaspoon", "чайных ложки": "teaspoon", "чайных ложек": "teaspoon",
  tbsp: "tablespoon", tablespoon: "tablespoon", tablespoons: "tablespoon", "ст.л.": "tablespoon", "столовая ложка": "tablespoon", "столовых ложки": "tablespoon", "столовых ложек": "tablespoon",
  cup: "cup", cups: "cup", "чашка": "cup", "чашки": "cup", "стакан": "cup", "стакана": "cup",
  "°c": "celsius", c: "celsius", celsius: "celsius",
  "°f": "fahrenheit", f: "fahrenheit", fahrenheit: "fahrenheit",
  pc: "piece", pcs: "piece", piece: "piece", pieces: "piece", clove: "piece", cloves: "piece", "шт": "piece", "шт.": "piece", "штука": "piece", "штуки": "piece", "штук": "piece",
};
// Resolves any unit text (canonical slug, either language's name, or a known
// alias/abbreviation) to the canonical food.units slug, or null if nothing
// matches.
function matchUnitSlug(text) {
  if (!text) return null;
  const norm = String(text).trim().toLowerCase();
  if (!norm) return null;
  if (UNITS_BY_SLUG[norm]) return norm;
  const byName = UNITS.find(u => (u.name_en || "").toLowerCase() === norm || (u.name_ru || "").toLowerCase() === norm);

// vocabulary/settings picker, but recipe ingredient lines read much more
// naturally with the short form ("г", "мл") the same way a recipe card
// would print it. English keeps the full food.units.name_en as-is (never
// asked to change) - only Russian gets this short-form override, keyed by
// slug so it applies uniformly regardless of which legacy/alias unit text
// resolved to it.
const UNIT_SHORT_RU = {
  gram: "г", kilogram: "кг", ounce: "унц.", pound: "фунт",
  milliliter: "мл", liter: "л", teaspoon: "ч.л.", tablespoon: "ст.л.",
  cup: "чашка", piece: "шт", celsius: "°C", fahrenheit: "°F",

// rendered (ingredientLine() below, its edit-mode editor, and the import
// review dialog) so short-form Russian units stay consistent no matter
// which code path resolved the record.
function unitLabel(rec) {
  if (!rec) return "";
  if (lang === "ru") return UNIT_SHORT_RU[rec.slug] || rec.name_ru || rec.slug;

}
// Localizes a food.units slug (canonical, or a legacy/alias form like "kg")
// for display in the viewer's UI language - shared by the persisted-recipe
// ingredient list (ingredientLine() below), its edit-mode editor, and the
// import review dialog (openImportReview()).
function unitDisplay(slug) {
  if (!slug) return "";

  if (!rec) return slug;
  return unitLabel(rec) || slug;

// Resolves user-typed unit text (either language, a known alias, or the raw
// slug itself) back to the canonical food.units slug for storage;
// unrecognized text is kept as free text, same lenient fallback the field
// always had.
function unitFromInput(text) {
  const t = (text || "").trim();

// logic) - used when saving a hand-edited ingredient name so ingredient_slug
// stays consistent instead of going stale/blank.
function slugifyIngredientName(name) {
  let s = (name || "").trim().toLowerCase();
  s = s.replace(/[^\w\s\-]/gu, "");
  s = s.replace(/\s+/g, "_");

function recipeToDish(r) {

  const meals = (r.meal_types && r.meal_types.length) ? r.meal_types : ["dinner"];
  return {
    id: r.id,

    family_id: r.family_id ?? null,

    en: r.title_en || r.title,

    c: r.cuisine || "family",

    special: [],
    allergens: r.allergen_flags || [],
    photo_url: r.photo_url,

    creator_name: r.creator_name || null,

// Fisher-Yates - deckOrder is shuffled with this rather than left in the
// SQL query's `order by title asc`, so Spin doesn't hand out the same
// alphabetically-first recipe on every visit / after every background
// refresh.
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
async function loadCatalog() {
  // Grant-aware binder: family's own cookbook UNION every cookbook the
  // family has an active grant on (STF Global platform, chef personal
  // if a chef is engaged). See spin_food_list_recipes_for_family in
  // 20260815120100_food_multi_tenancy_public_wrappers.sql.
  //
  // Before Session A this called spin_food_list_family_cookbook, which is
  // family-scoped only and does NOT surface platform recipes - which
  // meant a fresh YouTube import (now routed to the platform cookbook
  // per T6 SPEC_CREATOR_MECHANIC.md) would not show up in the Spin deck,
  // Menu picker or cookbook browse. This swap fixes that regression as
  // part of the platform-routing change.
  //
  // Return shape is identical (setof food.family_cookbook_recipes) - a
  // drop-in for recipeToDish. p_family_id defaults to the caller's
  // family, so we omit it here.
  const { data: recipes, error: re } = await sb.rpc("spin_food_list_recipes_for_family", { p_limit: 500, p_offset: 0 });
  if (re) console.error("[stf-data] cookbook:", re);
  DISHES = (recipes || []).map(recipeToDish);
  // Keep whatever relative order the user is already mid-swipe through
  // (any of these ids already in deckOrder), and only shuffle in the ids
  // that are new since the last load (freshly added recipes, or the very
  // first load of the session) - so routine background refreshes (e.g.
  // after uploading a photo) don't scramble a deck the user is partway
  // through.
  const known = new Set(deckOrder);
  const stillPresent = new Set(DISHES.map(d => d.id));
  const kept = deckOrder.filter(id => stillPresent.has(id));
  const fresh = shuffled(DISHES.map(d => d.id).filter(id => !known.has(id)));
  deckOrder = [...kept, ...fresh];
  const { data: members, error: me } = await sb.rpc("spin_food_list_family_members");
  if (me) console.error("[stf-data] members:", me);
  FAMILY = (members || []).map(m => ({
    id: m.member_id,
    em: avatarEmoji(m.avatar_role),
    en: m.name,
    ru: m.name,
    cook: !!m.is_cook,
    avatar_role: m.avatar_role,
  }));
  if (membership) {
    const mine = FAMILY.find(m => m.id === membership.member_id);
    if (mine) applyMembershipToFamily(mine);
  }
}

function snapshotToGame(snap) {
  const week = emptyWeek();
  // Meal-grain refactor (2026-08-18): the server now returns a nested `meals`
  // array with 1..N `dishes` per meal instead of the flat `slots` array. The
  // legacy client model is still "one recipe per meal cell", so we collapse
  // each meal down to its "primary" dish (first main_course by course_role;
  // else the first dish by sort_order) and expose only that in game.week.
  // Additional dishes (starters, sides, desserts) are ignored until the
  // Sprint 4 multi-dish UI lands. The `game.mealIds` parallel map remembers
  // the meal_id + primary dish_id for every cell so event emissions can
  // target the right server row - even for cells the UI shows as "empty".
  const mealIds = { 0:{}, 1:{}, 2:{}, 3:{}, 4:{}, 5:{}, 6:{} };
  const pickPrimary = (dishes) => {
    if (!dishes || !dishes.length) return null;
    const main = dishes.find(d => d.course_role === "main_course");
    if (main) return main;
    return [...dishes].sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0))[0];
  };
  for (const m of (snap.meals || [])) {
    const primary = pickPrimary(m.dishes);
    if (!primary) continue; // meal with no dishes (should not happen post-cascade)
    mealIds[m.day_of_week][m.meal_type] = {
      mealId: m.id,
      primaryDishId: primary.id,
    };
    // A blank primary dish can still carry an ai_note (§19: "no safe recipe" /
    // "no qualified cook") - keep it as a note-only stub so renderMenu can
    // badge it, instead of skipping it entirely.
    if (!primary.recipe_id && !primary.proposal) {
      const note = primary.ai_note || m.ai_note || null;
      if (note) week[m.day_of_week][m.meal_type] = { dish: null, aiNote: note };
      continue;
    }
    const slot = {
      dish: primary.recipe_id,
      cook: primary.cook_member_id,
      by: primary.assigned_by_member_id,
      viaAi: primary.assigned_via === "ai",
      accepted: !!primary.accepted_at,
      leftover: !!primary.is_leftover,
      // SPEC_AI_PREFILL.md #19: set only when scheduled AI pre-fill had to
      // override a Day Rule or leave the slot's original pick short - cleared
      // by the server the moment a human touches the dish (food.apply_event).
      aiNote: primary.ai_note || null,
    };
    if (primary.proposal) {
      slot.proposal = {
        dish: primary.proposal.recipe_id,
        cook: primary.proposal.cook_member_id,
        by: primary.proposal.assigned_by_member_id,
        viaAi: primary.proposal.assigned_via === "ai",
      };
    }
    week[m.day_of_week][m.meal_type] = slot;
  }
  const wishes = (snap.wishes || []).map(w => ({
    id: w.id,
    kind: "dish",
    dish: w.recipe_id,
    by: w.wished_by_member_id,
    wishCook: w.wish_cook_member_id || "any",
    votes: w.votes || [],
    day: w.target_day,
    meal: w.target_meal_type || "dinner",
    committed: w.status === "granted" ? "granted" : null,
  }));
  const duel = snap.duel ? {
    open: snap.duel.status === "open",
    proposals: (snap.duel.proposals || []).map(p => ({
      id: p.id,
      dish: p.recipe_id,
      chef: p.chef_member_id,
      pitch: p.pitch || "",
      votes: p.votes || [],
    })),
  } : { open: false, proposals: [] };
  const activity = (snap.events || []).map(e => ({
    id: String(e.seq),
    who: me,
    text: e.event_type.replace(/_/g, " "),
    ts: new Date(e.created_at).getTime(),
  }));
  if (snap.events && snap.events.length) lastEventSeq = snap.events[0].seq;
  // Profiles are shared, safety-critical state (allergies, cook availability) -
  // hydrate from the server's member rows so every family member sees every
  // other member's registered profile, not just their own device's cache.
  const profiles = { ...(game?.profiles || {}) };
  for (const m of (snap.members || [])) {
    if (!m.eater_profile && !m.cook_profile) continue; // not registered yet
    profiles[m.member_id] = {
      isCook: !!m.is_cook,
      allergies: m.allergen_flags || [],
      top3: m.eater_profile?.top3 || "",
      eatGrid: m.eater_profile?.eatGrid || {},
      avail: m.cook_profile?.avail || [],
      cookGrid: m.cook_profile?.cookGrid || {},
      techniques: m.cook_profile?.techniques || [],
      appliances: m.cook_profile?.appliances || [],
      registeredAt: m.eater_profile?.registeredAt || Date.now(),
    };
  }
  return {
    week,
    mealIds,
    locked: snap.plan?.status === "confirmed",
    wishes,
    duel,
    activity,
    profiles,
    // SPEC_AI_PREFILL.md #7/#14: [{day_of_week, rule_kind, rule_value}], owner-editable.
    dayRules: snap.day_rules || [],
  };
}

function isoLocalDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function nextMondayIso() {
  const d = new Date();
  const day = d.getDay();
  const add = day === 0 ? 1 : day === 1 ? 7 : 8 - day;
  d.setDate(d.getDate() + add);
  return isoLocalDate(d);
}

async function ensureActivePlan() {
  // Weekly-cycle refactor (2026-08-18): active_plan_id has been retired
  // server-side. spin_food_snapshot's JIT hook (food.fire_pending_milestones)
  // already ensures the current + next week plans exist before returning,
  // so we no longer have to conditionally create anything - the "current
  // plan" is always the plan matching snap.current_week_start_date, which
  // is snap.plan.id in the new shape. The legacy client keeps operating on
  // ONE plan at a time (the current-week plan); the next-week plan is
  // ignored here until Sprint 4 lands the two-mode Menu tab.
  let { data: snap, error } = await sb.rpc("spin_food_snapshot");
  if (error) throw error;
  const currentPlanId = snap?.plan?.id;
  if (!currentPlanId) {
    // Defensive: JIT hook should have created this. If it didn't, fall back
    // to explicit create_plan for the current-week Monday.
    const weekStart = snap?.current_week_start_date || nextMondayIso();
    const { data: created, error: ce } = await sb.rpc("spin_food_create_plan", {
      p_week_start_date: weekStart,
      p_set_active: true,
    });
    if (ce) throw ce;
    activePlanId = created?.plan_id;
    if (!activePlanId) throw new Error("create_plan returned no plan_id");
    ({ data: snap } = await sb.rpc("spin_food_snapshot"));
  } else {
    activePlanId = currentPlanId;
  }
  return snap;
}

function slotPayload(day, mealKey, extra = {}) {
  // Meal-grain refactor (2026-08-18): dish_* server events target a specific
  // dish_id (+ meal_id) rather than the retired (plan, day, meal_type) tuple.
  // We still pass day/meal_type for observability in the event log, but the
  // authoritative routing is via dish_id/meal_id from game.mealIds - looked
  // up here so every emission call site stays unchanged.
  const meta = game?.mealIds?.[day]?.[mealKey];
  const base = {
    plan_id: activePlanId,
    day,
    meal_type: mealKey,
  };
  if (meta) {
    base.meal_id = meta.mealId;
    base.dish_id = meta.primaryDishId;
  }
  return { ...base, ...extra };
}

const PROTEIN_GROUP_META = {
  meat:     { ic: "🥩", en: "Meat",          ru: "Мясо" },
  fish:     { ic: "🐟", en: "Fish",          ru: "Рыба" },
  seafood:  { ic: "🦐", en: "Seafood",       ru: "Морепродукты" },
  egg:      { ic: "🥚", en: "Egg",           ru: "Яйца" },
  dairy:    { ic: "🧀", en: "Dairy",         ru: "Молочное" },
  plant:    { ic: "🥗", en: "Plant-based",   ru: "Растительное" },

// A thick card's empty protein_groups[] means "fully plant-based" (every ingredient
// resolved, none carried a protein class) - a thin/unclassified card's empty array
// means "we don't know," a different fact that must not be shown as "plant-based".
function dishProteinGroups(d) {
  if (d.card_state !== "thick") return ["untagged"];

function availableProteinGroups() {
  const present = new Set(DISHES.flatMap(dishProteinGroups));

function timeBucket(d) { return d.t <= 20 ? "quick" : d.t <= 45 ? "medium" : "long"; }

// itself carries the full schema.org list (keto/paleo/omnivore included too).
const DIET_META = {
  vegetarian:  { en: "Vegetarian",  ru: "Вегетарианское" },
  vegan:       { en: "Vegan",       ru: "Веганское" },
  pescatarian: { en: "Pescatarian", ru: "Пескетарианское" },
  gluten_free: { en: "Gluten-free", ru: "Без глютена" },
  dairy_free:  { en: "Dairy-free",  ru: "Без молочного" },
  halal:       { en: "Halal",       ru: "Халяль" },
  kosher:      { en: "Kosher",      ru: "Кошер" },
};
// hideInactive defaults FALSE: marking a recipe inactive (About tab toggle, or the
// quick-hide eye icon on a Spin card) opts it out of the automatic AI weekly fill,
// but should NOT silently vanish it from Spin/Wish too - that surprised people into
// thinking the recipe was gone. Inactive recipes now stay visible everywhere by
// default; "Hide inactive recipes" is an opt-in filter the user turns on themselves
// if they specifically want them out of the way.
function newAdvFilters() {
  return {
    meal: new Set(), proteins: new Set(), cuisines: new Set(), diets: new Set(),
    time: new Set(), diff: new Set(), hideInactive: false,
    soupOnly: false, grillOnly: false, vegOnly: false,
  };
}
// Every Set-backed group here is OR-within-group ("breakfast or lunch"), AND-across-
// groups (protein AND cuisine AND ...) - the one deliberate exception is `diets`,
// where AND-within-group is correct because diet_compatible_with really does mean
// "suitable for all of these at once" (vegan AND gluten-free), not either/or.
function matchesAdvFilters(d, f) {
  if (f.meal.size && !d.meals.some(m => f.meal.has(m))) return false;
  if (f.proteins.size && !dishProteinGroups(d).some(g => f.proteins.has(g))) return false;
  if (f.cuisines.size && !f.cuisines.has(d.c)) return false;
  if (f.time.size && !f.time.has(timeBucket(d))) return false;
  if (f.diff.size && !f.diff.has(diffKey(d))) return false;
  if (f.diets.size && ![...f.diets].every(k => d.diet_compatible_with.includes(k))) return false;
  if (f.hideInactive && !d.is_active) return false;
  if (f.soupOnly && !d.soup) return false;

  if (f.vegOnly && !dishIsVeg(d)) return false;

}

// AI populate. Empty slots get accepted:false so the assigned cook must accept.
// A slot that currently holds AI's own earlier suggestion (viaAi) is fair game
// for AI to silently refresh - re-running "Generate with AI" over its own guess
// isn't a meaningful edit for anyone to review (user report, 2026-08-08: having
// to accept/reject a pile of proposals just to re-roll AI's own picks was pure
// friction). Only a slot a human deliberately chose (viaAi false - whether that
// human is the one clicking regenerate or someone else) becomes a proposal the
// family must approve, matching the existing swap flow. Mutates game.week for
// the instant render, and returns the food.events this needs to become durable -
// the caller must apply every one of them, or the fill is a local-only illusion
// that reverts on the next sync/reload/other-device view.
function aiPopulateWeek() {
  const cookIds = FAMILY.filter(m => m.cook).map(m => m.id);
  const cooks = cookIds.length ? cookIds : FAMILY.map(m => m.id);
  const events = [];
  if (!cooks.length) return { overwrittenCount: 0, events };
  // Session B: slot_filled is now grant-aware server-side (assert_recipe_accessible_to_family),
  // so platform/chef-granted recipes are safe to plan directly - no fork, no filter needed.
  const plannable = DISHES;
  const bf = plannable.filter(d => d.meals.includes("breakfast"));
  const soups = plannable.filter(d => d.soup);
  const mains = plannable.filter(d => d.meals.includes("dinner"));
  let si = 0;
  const overwritten = [];
  const fillOrPropose = (day, mealKey, dishId, cook, isLeftover = false) => {
    const cur = game.week[day][mealKey];
    if (cur && cur.dish && !cur.viaAi) {
      game.week[day][mealKey].proposal = { dish: dishId, cook, by: me, viaAi: true };
      overwritten.push(1);
      events.push(["dish_proposal_created", slotPayload(day, mealKey, { proposal: { recipe_id: dishId, cook_member_id: cook, assigned_by_member_id: me, assigned_via: "ai" } })]);
    } else {
      game.week[day][mealKey] = { dish: dishId, cook, by: me, viaAi: true, accepted: false, leftover: isLeftover };
      events.push(["dish_assigned", slotPayload(day, mealKey, { recipe_id: dishId, cook_member_id: cook, assigned_by_member_id: me, assigned_via: "ai", is_leftover: isLeftover })]);
    }
  };
  for (let i = 0; i < 7; i++) {
    // breakfast (skip weekends)
    if (i < 5 && bf.length) fillOrPropose(i, "breakfast", bf[i % bf.length].id, cooks[i % cooks.length]);
    // lunch (soup, day-2 leftover)
    if ((!game.week[i].lunch || !game.week[i].lunch?.leftover) && soups.length) {
      const s = soups[si++ % soups.length], ck = cooks[(i + 1) % cooks.length];
      fillOrPropose(i, "lunch", s.id, ck);
      if (i + 1 < 7 && !game.week[i + 1].lunch) fillOrPropose(i + 1, "lunch", s.id, ck, true);
    }
    // dinner (skip Sat)
    if (i !== 5 && mains.length) fillOrPropose(i, "dinner", mains[i % mains.length].id, cooks[(i + 2) % cooks.length]);

function rid() { return Math.random().toString(36).slice(2, 9); }

let lastSeenTs = 0;

async function load() {

    await withTimeout((async () => {
      await Promise.all([loadCatalog(), loadUnits(), loadFamilyFeed()]);
      const snap = await ensureActivePlan();
      game = snapshotToGame(snap);
      if (!game.profiles) game.profiles = {};
      if (me) {
        const cached = restoreProfile(me);
        if (cached) game.profiles[me] = cached;
      }
      if (!game.activity.length) {
        game.activity = [{ id: rid(), who: me, text: T("Family kitchen opened — plan next week", "Семейная кухня открыта — планируем следующую неделю"), ts: Date.now() }];
      }

  } catch (e) {
    console.error("[stf-data] load failed:", e);
    loadError = e?.message || String(e);

      const cached = restoreProfile(me);
      if (cached) game.profiles[me] = cached;

async function kickLoad() {

// Apply a fresher remote state. Deferred while a modal is open, mid-registration, or the

// never disrupts what the user is filling in.
function shouldDefer() {
  if (modalOpen) return true;
  // 2026-08-11: the recipe detail view isn't tracked in modalOpen (it's a
  // separate full-screen overlay, not a modal()), so a background sync tick
  // while it's open used to be let through unchecked. render() itself never
  // touches #detailOverlay, but there's no upside to letting remote state
  // land mid-interaction (e.g. while a photo upload or edit is in flight) -
  // treat an open detail view the same as a modal.
  if (detailOpen) return true;
  if (me && game && !game.profiles[me] && ob && ob.step > 0) return true;
  const ae = document.activeElement;
  if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) return true;

  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) {

function applyRemote(state, ts) {
  if (!state || !state.week) return;
  if (ts && ts <= lastSeenTs) return;   // ignore stale / our own echo
  lastSeenTs = ts || lastSeenTs;
  game = state; if (!game.profiles) game.profiles = {};
  if (shouldDefer()) { pendingRemote = true; return; }
  render();

// Belt-and-braces sync: realtime is the fast path, but mobile browsers silently
