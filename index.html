    acceptBtn.disabled = true; acceptBtn.textContent = tr('anonymous.joining');
    note.textContent = ""; note.style.color = "#888";
    // See the create-household handler's matching comment (2026-08-18): the
    // call itself, not just the post-success bootstrap, needs a ceiling and
    // a catch, or a stuck/never-resolving request leaves this button frozen
    // on "Присоединяемся..." forever with no way to retry.
    let joinResult;
    try {
      joinResult = await rpcWithTimeout("spin_food_accept_invitation", {
        p_token: inviteTokenInUrl,
        p_avatar_role: selRole,
        p_display_name: nameInput.value.trim(),
        p_other_label: selRole === "other" ? otherInput.value.trim() : null,
      }, 45000, "Accept invitation");
    } catch (e) {
      logClientDiagnostic("accept_invitation_call_exception", { message: e?.message || String(e), stack: e?.stack || null });
      note.textContent = tr('anonymous.couldnt-reach-the-server-check-your-connection-a');
      note.style.color = "#ef4444";
      acceptBtn.disabled = false;
      acceptBtn.textContent = tr('anonymous.try-again');
      return;
    }
    const { data, error } = joinResult;
    if (error) {
      note.textContent = tr('anonymous.couldnt-join') + error.message;
      note.style.color = "#ef4444";
      acceptBtn.disabled = false;
      acceptBtn.textContent = tr('anonymous.try-again');
      return;
    }
    // Success. Strip ?invite= from the URL so a refresh doesn't retry the flow.
    const url = new URL(location.href);
    url.searchParams.delete("invite");
    history.replaceState({}, "", url.toString());
    // The account row is already committed server-side at this point - any
    // failure below is purely in the client's post-join bootstrap, not a
    // failed join. Caught so it can't leave the button stuck on "Joining..."
    // forever with no feedback (2026-08-18: same class of bug as the create-
    // household hang below - see its comment for the full story).
    try {
      await bootstrapSessionAfterJoin({
        memberId: data,
        onboardLocaleOnly: true,
        welcomeToast: false,
      });
      toast("Welcome to the family kitchen 🍲");
    } catch (e) {
      logClientDiagnostic("accept_invitation_post_join_exception", { message: e?.message || String(e), stack: e?.stack || null });
      note.textContent = tr('anonymous.joined-but-couldnt-finish-loading-tap-to-retry')
        + (e?.message ? ` (${e.message})` : "");
      note.style.color = "#ef4444";
      acceptBtn.disabled = false;
      acceptBtn.textContent = tr('anonymous.retry');
      acceptBtn.onclick = async () => {
        acceptBtn.disabled = true;
        note.textContent = "";
        try {
          await bootstrapSessionAfterJoin({ memberId: me || data, onboardLocaleOnly: true, welcomeToast: false });
          toast("Welcome to the family kitchen 🍲");
        } catch (retryErr) {
          logClientDiagnostic("accept_invitation_post_join_exception", { message: retryErr?.message || String(retryErr), stack: retryErr?.stack || null, retry: true });
          note.textContent = tr('anonymous.joined-but-couldnt-finish-loading-tap-to-retry')
            + (retryErr?.message ? ` (${retryErr.message})` : "");
          note.style.color = "#ef4444";
          acceptBtn.disabled = false;
        }
      };
    }
  };
}

        style="width:100%;padding:12px;font-size:15px;border:2px solid #e5e7eb;border-radius:12px">
    </div>
    <div class="sect" style="margin-top:14px">${tr('renderCreateHouseholdOnboarding.do-you-have-a-private-chef')}</div>

  const nameHouseholdInput = document.getElementById("householdNameInput");

  const captureState = () => ({

  });
  document.querySelectorAll("#obLangWrap [data-ol]").forEach(c => c.onclick = () => {

  const validate = () => {

  createBtn.onclick = async () => {

    createBtn.disabled = true; createBtn.textContent = tr('anonymous.creating');
    note.textContent = ""; note.style.color = "#888";
    // 2026-08-18: two separate real attempts (both with non-ASCII names) left

    // the second attempt (which should have hit the "already belongs to a
    // family" guard and returned fast). That rules out "server rejected it
    // and the client mishandled the error" - the RPC call itself never

    // before the call even fired vs. a genuinely stuck network request), but
    // either way the ENTIRE handler - including the initial call, not just
    // the post-success bootstrap - needs a hard ceiling and a catch-all, or
    // this is unrecoverable without a page reload. withTimeout() forces a
    // resolution either way; the outer try/catch guarantees the button is
    // never left stuck silently again, regardless of which line failed.
    let createResult;
    const householdLen = nameHouseholdInput.value.trim().length;
    logClientDiagnostic("create_family_start", { household_name_len: householdLen, lang });
    try {
      await ensureAuthReady();

        p_household_name: nameHouseholdInput.value.trim(),
        p_avatar_role: selRole,

        p_other_label: selRole === "other" ? otherInput.value.trim() : null,
        p_has_private_chef: hasPrivateChef,
      }, 45000, "Create family");
    } catch (e) {
      const rawMsg = e?.message || String(e);
      logClientDiagnostic("create_family_call_exception", { message: rawMsg, stack: e?.stack || null, household_name_len: householdLen });
      note.textContent = createFamilyConnectionErrorText(rawMsg);
      note.style.color = "#ef4444";
      createBtn.disabled = false;
      createBtn.textContent = tr('anonymous.try-again');
      return;
    }
    const { data, error } = createResult;
    if (error) {
      note.textContent = createFamilyErrorText(error.message);
      note.style.color = "#ef4444";
      createBtn.disabled = false;
      createBtn.textContent = tr('anonymous.try-again');
      return;

    // The family+owner row is already committed server-side at this point
    // (confirmed 2026-08-18: a family created via this RPC shows up in the DB
    // even when the button below appears to "hang" forever). Everything from
    // here on is client-side bootstrap with no local error handling, so ANY
    // exception (a stale/null membership, a realtime subscribe hiccup, etc.)
    // used to be swallowed by the page's global unhandledrejection handler -
    // which shows a toast but has no idea which button to re-enable - leaving
    // "Создаём..." on screen forever with no way to proceed or retry. Wrapped
    // so a failure here is always recoverable instead of looking like a hang.
    try {
      await bootstrapSessionAfterJoin({
        memberId: data,
        onboardLocaleOnly: false,
        invitePrivateChef: hasPrivateChef,
      });
    } catch (e) {
      logClientDiagnostic("create_family_post_create_exception", { message: e?.message || String(e), stack: e?.stack || null });
      note.textContent = tr('anonymous.kitchen-created-but-couldnt-finish-loading-tap-t')

      note.style.color = "#ef4444";
      createBtn.disabled = false;
      createBtn.textContent = tr('anonymous.retry');
      createBtn.onclick = async () => {
        createBtn.disabled = true;
        note.textContent = "";
        try {
          await bootstrapSessionAfterJoin({ memberId: me || data, invitePrivateChef: hasPrivateChef });
        } catch (retryErr) {
          logClientDiagnostic("create_family_post_create_exception", { message: retryErr?.message || String(retryErr), stack: retryErr?.stack || null, retry: true });
          note.textContent = tr('anonymous.kitchen-created-but-couldnt-finish-loading-tap-t')
            + (retryErr?.message ? ` (${retryErr.message})` : "");
          note.style.color = "#ef4444";
          createBtn.disabled = false;
        }
      };
    }
  };
}

// Owner-only. Prompts for an email, calls the spin-food-invite Edge Function,
// which creates the food.family_invitations row and sends the magic-link email.
function openInviteFlow({ forPrivateChef = false } = {}) {
  const v = modal(`<h3>${forPrivateChef ? "🧑‍🍳" : "👥"} ${forPrivateChef
    ? tr('openInviteFlow.invite-your-private-chef')
    : tr('openInviteFlow.invite-family-member')}</h3>
    <div style="font-size:13px;color:#666;margin-bottom:10px">
      ${forPrivateChef
        ? tr('openInviteFlow.theyll-get-a-one-tap-magic-link-on-first-sign-in')
        : tr('openInviteFlow.theyll-get-a-one-tap-magic-link-on-first-sign-in-2')}
    </div>
    <div class="sect">${tr('openInviteFlow.email-address')}</div>
    <input id="inviteEmail" type="email" inputmode="email" placeholder="them@example.com"
      style="width:100%;padding:12px;font-size:15px;border:2px solid #e5e7eb;border-radius:12px">
    <button class="btn btn-primary" id="inviteGo" style="width:100%;margin-top:14px">
      ✉️ ${tr('openInviteFlow.send-invitation')}
    </button>
    <div id="inviteNote" style="color:#888;font-size:13px;margin-top:10px;line-height:1.5"></div>`);

  const input = v.querySelector("#inviteEmail");
  const go = v.querySelector("#inviteGo");
  const note = v.querySelector("#inviteNote");
  input.focus();
  const submit = async () => {
    const email = (input.value || "").trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      note.textContent = tr('submit.that-doesnt-look-like-a-valid-email');
      note.style.color = "#ef4444";
      return;
    }
    go.disabled = true; go.textContent = tr('submit.sending');
    const accessToken = authSession?.access_token;
    if (!accessToken) { note.textContent = "Session expired, please sign in again."; note.style.color = "#ef4444"; return; }
    let resp, result;
    try {
      resp = await fetch(SUPABASE_URL + "/functions/v1/spin-food-invite", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ email }),
      });
      result = await resp.json();
    } catch (e) {
      note.textContent = "Network error: " + (e?.message || e);
      note.style.color = "#ef4444";
      go.disabled = false; go.textContent = "✉️ " + tr('submit.send-invitation');
      return;
    }
    if (!result?.ok) {
      note.textContent = tr('submit.failed') + (result?.error || "unknown");
      note.style.color = "#ef4444";
      go.disabled = false; go.textContent = "✉️ " + tr('submit.send-invitation');
      return;
    }
    note.innerHTML = `📬 ${tr('submit.sent-to')} <b>${email}</b>.<br>${tr('submit.they-have-14-days-to-accept')}`;
    note.style.color = "#059669";
    go.textContent = "✓ " + tr('submit.sent');
    setTimeout(() => closeModal(), 2500);
  };
  go.onclick = submit;

// weekday, consumed by the Thursday scheduled AI pre-fill (§5.3/§9/§10) - never
// affects manual assignment, Spin, Wish, or Duel.
const DAY_RULE_KINDS = ["none", "protein_type", "diet_suitability", "cuisine"];
const DAY_RULE_PROTEIN_VALUES = ["meat", "fish", "seafood", "egg", "dairy"];

// food.cuisines' seed rows (20260819000000_food_day_rules_cuisine_v1.sql).
// "Random World Cuisine" isn't a real cuisine - it's a sentinel rule_value
// ('random') telling Auto-Menu to pick any recognized world cuisine rather
// than pin the day to one specific kitchen.
const WORLD_CUISINES = [
  "random", "italian", "chinese", "japanese", "mexican", "indian", "thai", "french",
  "greek", "spanish", "korean", "vietnamese", "turkish", "middle_eastern", "american", "mediterranean",
];
function dayRuleKindLabel(k) {

    none: tr('dayRuleKind.none'),

    diet_suitability: tr('dayRuleKind.diet-day'),
    cuisine: tr('dayRuleKind.cuisine-day'),

}
function dayRuleProteinLabel(v) {

}
function dayRuleDietLabel(v) {
  return ({
    vegan: tr('dayRuleDiet.vegan'), vegetarian: tr('dayRuleDiet.vegetarian'),

    "dairy-free": tr('dayRuleDiet.dairy-free'),

}
function dayRuleValueLabel(kind, v) {
  if (kind === "protein_type") return dayRuleProteinLabel(v);
  if (kind === "diet_suitability") return dayRuleDietLabel(v);
  if (kind === "cuisine") return v === "random" ? worldCuisineDayLabel(v) : cuisineVocabLabel(v);
  return v;
}
function worldCuisineDayLabel(v) {
  if (v === "random") return tr("worldCuisineLabel.random") || "Random";

}
// Factored out of openDayRules() (2026-08-18) so the exact same rows +
// autosave-per-cell behavior can be mounted either in the Settings modal or
// as a full-screen onboarding step (renderDayRulesOnboarding) without
// duplicating the save/rerender wiring.
function dayRulesRowHtml(rulesByDay, di) {
  const r = rulesByDay[di] || { rule_kind: "none", rule_value: null };
  const fixedValues = r.rule_kind === "protein_type" ? DAY_RULE_PROTEIN_VALUES
    : r.rule_kind === "diet_suitability" ? DAY_RULE_DIET_VALUES : null;
  const needsCuisineSelect = r.rule_kind === "cuisine";

    <div class="day-hd">${dayN(di)}</div>

      <div class="chips-wrap" data-drkind="${di}">${DAY_RULE_KINDS.map(k =>
        `<div class="chip ${r.rule_kind === k ? "on" : ""}" data-k="${k}">${dayRuleKindLabel(k)}</div>`).join("")}</div>
      ${fixedValues ? `<div class="chips-wrap" data-drval="${di}" style="margin-top:6px">${fixedValues.map(v =>

      ${needsCuisineSelect ? `<select data-drcuisine="${di}" style="width:100%;margin-top:6px;padding:8px 10px;font-size:13px;border:1.5px solid #e5e7eb;border-radius:10px">
        ${WORLD_CUISINES.map(v => `<option value="${v}" ${r.rule_value === v ? "selected" : ""}>${worldCuisineDayLabel(v)}</option>`).join("")}

}
// root must already contain the markup from dayRulesRowHtml() for every day
// (under #drRows) plus a #drNote element - wires clicks/autosave into it.
function mountDayRules(root, rulesByDay) {
  const note = root.querySelector("#drNote");
  // 2026-08-19 fix: a Postgres error from a prior save (e.g. the
  // now-fixed premature-save bug below) painted this note red via
  // note.style.color, and nothing ever reset it back - so a *later*,
  // fully successful "Saving..." could still render in red, looking like
  // a fresh failure. Every save attempt now starts by clearing the color.
  const save = async (di, kind, value) => {
    note.style.color = ""; note.textContent = tr('save.saving');
    try {
      const { error } = await withTimeout(
        sb.rpc("spin_food_day_rules_set", { p_day_of_week: di, p_rule_kind: kind, p_rule_value: value || "" }),
        15000,
        "Day rule save"
      );
      if (error) {
        logClientDiagnostic("day_rules_set_error", { message: error?.message || String(error), kind, value });
        note.textContent = tr('save.failed') + error.message; note.style.color = "#ef4444"; return;
      }
    } catch (e) {
      logClientDiagnostic("day_rules_set_exception", { message: e?.message || String(e), stack: e?.stack || null, kind, value });
      note.textContent = tr('save.something-went-wrong-check-your-connection-and-t');
      note.style.color = "#ef4444"; return;
    }
    rulesByDay[di] = { day_of_week: di, rule_kind: kind, rule_value: value || null };
    game.dayRules = Object.values(rulesByDay);
    note.textContent = "✓ " + tr('save.saved');
    note.style.color = "#059669";
  };
  const rerenderRow = di => {
    const row = root.querySelector(`[data-drday="${di}"]`);
    row.outerHTML = dayRulesRowHtml(rulesByDay, di);
    wireRow(di);
  };
  const wireRow = di => {
    root.querySelectorAll(`[data-drkind="${di}"] .chip`).forEach(c => c.onclick = () => {
      const kind = c.dataset.k;
      const r = rulesByDay[di] || {};
      // Switching kind clears the old value - a leftover 'meat' value under a
      // freshly-picked 'cuisine' kind would violate the value_contract check.
      const value = kind === "none" ? null : (kind === r.rule_kind ? r.rule_value : null);
      rulesByDay[di] = { day_of_week: di, rule_kind: kind, rule_value: value };
      rerenderRow(di);
      // 2026-08-19 fix: kinds other than 'none' require a non-null value
      // (rule_value_contract), but the user hasn't picked one yet the very
      // first time they switch to protein_type/diet_suitability/cuisine on
      // a day - saving here with value=null always failed server-side
      // (silently, save() only surfaces it as a red note). Wait for the
      // value/cuisine picker click instead; 'none' has no value to wait
      // for, so it still saves immediately.
      if (kind === "none" || value !== null) save(di, kind, value);
    });
    root.querySelectorAll(`[data-drval="${di}"] .chip`).forEach(c => c.onclick = () => {
      const kind = rulesByDay[di]?.rule_kind || "none";
      const value = c.dataset.v;
      rulesByDay[di] = { day_of_week: di, rule_kind: kind, rule_value: value };
      rerenderRow(di);
      save(di, kind, value);
    });
    const cuisineSelect = root.querySelector(`[data-drcuisine="${di}"]`);
    if (cuisineSelect) cuisineSelect.onchange = () => {
      const value = cuisineSelect.value;
      rulesByDay[di] = { day_of_week: di, rule_kind: "cuisine", rule_value: value };
      save(di, "cuisine", value);
    };
  };
  DAYS.forEach((_, di) => wireRow(di));
}
function openDayRules() {
  const rulesByDay = {};
  (game.dayRules || []).forEach(r => { rulesByDay[r.day_of_week] = r; });
  const v = modal(`<h3>🗓 ${tr('openDayRules.day-rules')}</h3>
    <div style="font-size:13px;color:#666;margin-bottom:10px">${tr('openDayRules.owner-only-the-thursday-ai-pre-fill-tries-to-fol')}</div>
    <div id="drRows">${DAYS.map((_, di) => dayRulesRowHtml(rulesByDay, di)).join("")}</div>
    <div id="drNote" style="font-size:12px;color:#999;margin-top:4px;min-height:16px"></div>`);
  mountDayRules(v, rulesByDay);
}

function commonTimezones() {

  } catch (e) { /* fall through to the curated list below */ }
  return ["Europe/Amsterdam", "Europe/London", "Europe/Berlin", "Europe/Kyiv", "Europe/Moscow",

}
function timezoneDetected() {

}

async function saveTimezoneAndThen(btnId, onOk) {
  const btn = document.getElementById(btnId);

  // stalled network request here left the button stuck on "Saving..."

  logClientDiagnostic("set_family_timezone_start", {});

// Converts food.families.default_meal_shapes' server shape

// Drag (or click) across mg-cell tiles to paint on/off without lifting finger or mouse button.
function wireObGridPaint(root, { cellSelector, getKey, isOn, setOn, refreshCell, onEnd }) {
  let painting = false;
  let modeOn = true;
  const visited = new Set();
  const paint = cell => {
    const key = getKey(cell);
    if (visited.has(key)) return;
    visited.add(key);
    if (isOn(key) === modeOn) return;
    setOn(key, modeOn);
    refreshCell(cell, modeOn);
  };
  const end = () => {
    if (!painting) return;
    painting = false;
    visited.clear();
    onEnd?.();
  };
  root.querySelectorAll(cellSelector).forEach(cell => {
    cell.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      e.preventDefault();
      painting = true;
      modeOn = !isOn(getKey(cell));
      visited.clear();
      paint(cell);
      cell.setPointerCapture(e.pointerId);
    });
    cell.addEventListener("pointermove", e => {
      if (!painting) return;
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const target = hit?.closest?.(cellSelector);
      if (target && root.contains(target)) paint(target);
    });
    cell.addEventListener("pointerup", end);
    cell.addEventListener("pointercancel", end);
    cell.addEventListener("lostpointercapture", end);
  });
}

function cuisineVocabLabel(slug) {
  if (!slug) return "";
  const rec = CUISINES_BY_SLUG[slug];
  const li = rec?.labels_i18n;
  if (li && typeof li === "object" && li[lang]) return li[lang];
  if (lang === "ru" && li?.ru) return li.ru;
  if (rec?.label_en) return rec.label_en;
  const key = slug === "middle_eastern" ? "middle-eastern" : slug;
  const fromCatalog = tr(`worldCuisineLabel.${key}`);
  if (fromCatalog && !fromCatalog.startsWith("worldCuisineLabel.")) return fromCatalog;
  return String(slug).replace(/_/g, " ").replace(/\b\w/g, ch => ch.toUpperCase());
}
function cuisineLabel(c) {

  if (deckAdv.diets.size && ![...deckAdv.diets].every(k => d.diet_compatible_with.includes(k))) { deckAdv.diets.clear(); changed = true; }
  if (deckAdv.soupOnly && !d.soup) { deckAdv.soupOnly = false; changed = true; }

function ingredientLine(ing, scaleFactor = 1, nameLocale = null) {

async function refreshDishFromCatalog(d) {

async function requestRecipeTranslation(d) {

  const targetLocale = lang;
  if (!targetLocale || !["en", "ru", "uk", "nl"].includes(targetLocale)) return;
  detailTranslationLoading = true;
  renderDetailOverlay();
  try {
    detailShowTranslation = false;
    await hydrateDishContent(d, targetLocale);
    if (dishSourceLang(d) === targetLocale) return;
    const res = await invokeWithTimeout("spin-food-translate-recipe-locale", {
      body: { recipe_id: d.id, target_locale: targetLocale },
    }, INGEST_CLIENT_TIMEOUT_MS);
    if (res.error || res.data?.ok === false) {
      toast(tr('detailHeaderHtml.translation-failed'));
    } else {
      d._machineTranslated = true;
      d._resolvedLocale = null;
      await refreshDishFromCatalog(d);

  if (!Array.isArray(d.instructions) || !d.instructions.length) return [];
  const contentL = detailOpen === d.id && !detailEditMode ? detailContentLocale(d) : lang;
  return d.instructions.map(s => typeof s === "string"
    ? { text: s, text_en: s, text_ru: null, photo_urls: [] }

        text: stepLangText(s, contentL),

function openDetail(id) {
  if (!dish(id)) return;
  detailOpen = id; detailEditMode = false; detailDraft = null; detailSaving = false; detailScaleTo = null;
  detailShowTranslation = false; detailTranslationLoading = false;
  renderDetailOverlay();
  const d = dish(detailOpen);
  if (d && recipeNeedsTranslation(d)) {
    hydrateDishContent(d, lang).then(() => {
      if (detailOpen === id) renderDetailOverlay();
    });
  } else if (d && d._resolvedLocale !== lang) {
    hydrateDishContent(d, lang).then(() => {
      if (detailOpen === id) renderDetailOverlay();
    });
  }
}
function closeDetail() {
  const el = document.getElementById("detailOverlay");
  detailEditMode = false; detailDraft = null;
  if (!el) { detailOpen = null; return; }
  el.classList.remove("open"); el.classList.add("closing");
  setTimeout(() => { el.remove(); detailOpen = null; }, 260);
}
function renderDetailOverlay() {
  document.getElementById("detailOverlay")?.remove();
  const d = dish(detailOpen);
  if (!d) { detailOpen = null; return; }
  const wrap = document.createElement("div");
  wrap.id = "detailOverlay";
  wrap.className = "detail-overlay";
  wrap.innerHTML = detailView(d);
  document.body.appendChild(wrap);
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add("open")));
  wireDetailOverlay(wrap, d);
}

// Top block of the single detail pane (2026-08-09) - hero photo carousel
// through the pending-edit/thin-card/fork banners. Originally duplicated
// across a separate "cook"/"about" tab pair; the tabs are gone (2026-08-09
// follow-up - taxonomy/diet/allergen/links content now lives at the bottom
// of this same pane, right after Instructions - see detailView()'s
// `aboutHtml`/`linksHtml()`), so this is just the header now.
// The old "Include in weekly menu planning" switch+description block is gone -
// replaced by the same 👁/🙈 quick-hide button, same toggleRecipeActive()
// logic and same Hide/Show tooltips, as the Spin card (see stackHtml()) -
// just anchored to this hero's top-left corner instead of the card's.
function detailHeaderHtml(d) {
  const photo = photoSlideHtml(d, { allowRemove: detailEditMode });
  const enrichBtn = `<button class="enrich-fab" id="dtlEnrichBtn" title="${tr('detailHeaderHtml.enrich-this-recipe')}" aria-label="${tr('detailHeaderHtml.enrich-this-recipe')}">✨</button>`;
  const eyeBtn = d.is_active
    ? `<button class="qhide" id="dtlActiveEye" ${detailSaving ? "disabled" : ""} title="${tr('detailHeaderHtml.hide')}" aria-label="${tr('detailHeaderHtml.hide')}">${EYE_OPEN_SVG}</button>`
    : `<button class="qhide off" id="dtlActiveEye" ${detailSaving ? "disabled" : ""} title="${tr('detailHeaderHtml.show')}" aria-label="${tr('detailHeaderHtml.show')}">${EYE_CLOSED_SVG}</button>`;
  return `<div class="dtl-hero" style="${photo.bgStyle}">${photo.inner}${enrichBtn}${eyeBtn}</div>
    <div style="padding:14px 16px">
      ${detailEditMode
        ? `<input id="dtlTitleInput" value="${detailEditTitleForDisplay(d, detailDraft).replace(/"/g, "&quot;")}" placeholder="${tr('detailHeaderHtml.recipe-name')}" style="width:100%;font-weight:800;font-size:18px;border:2px solid #e5e7eb;border-radius:10px;padding:8px 10px;font-family:inherit">`
        : `<div style="display:flex;align-items:flex-start;gap:10px">
            <div style="flex:1;font-weight:800;font-size:24px;line-height:1.25">${detailTitleName(d)}</div>
            ${detailTranslateBtnHtml(d)}
          </div>
          ${detailTranslationBadge(d)}`}
      <div class="mt" style="margin-top:8px">
        ${detailEditMode
          ? `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px">⏱ <input id="dtlTimeInput" type="number" min="1" value="${detailDraft.cookTimeMinutes ?? ""}" style="width:56px;border:1px solid #eee;border-radius:8px;padding:4px 6px;font-size:13px"> ${tr('detailHeaderHtml.min')}</span>
            <span id="dtlDiffPicker" style="display:inline-flex;gap:3px;cursor:pointer;margin-right:10px;vertical-align:middle">${[1, 2, 3].map(n => `<span data-diffval="${n}" style="opacity:${n <= detailDraft.difficulty ? "1" : "0.25"};font-size:15px">●</span>`).join("")}</span>
            <span id="dtlCuisineWrap" style="display:inline-flex;gap:4px;align-items:center">
              <select id="dtlCuisineSelect" style="max-width:160px;border:1px solid #eee;border-radius:8px;padding:4px 6px;font-size:13px">
                <option value="">${tr('detailHeaderHtml.cuisine')}</option>
                ${cuisineOptionsList().map(slug => `<option value="${slug}" ${detailDraft.cuisine === slug ? "selected" : ""}>${cuisineLabel(slug)}</option>`).join("")}
                <option value="__new__" ${detailDraft.cuisineMode === "new" ? "selected" : ""}>${tr('detailHeaderHtml.add-new-cuisine')}</option>
              </select>
              <input id="dtlCuisineInput" value="${(detailDraft.cuisineCustom || "").replace(/"/g, "&quot;")}" placeholder="${tr('detailHeaderHtml.new-cuisine-name')}" style="width:110px;border:1px solid #eee;border-radius:8px;padding:4px 6px;font-size:13px;${detailDraft.cuisineMode === "new" ? "" : "display:none"}">
            </span>`
          : `⏱ ${d.t} ${tr('detailHeaderHtml.min')} &nbsp; ${d.d} &nbsp; ${cuisineDisplay(d.c)}${d.added_by_member_id ? ` &nbsp; · ${tr('detailHeaderHtml.by')} ${mem(d.added_by_member_id).em} ${mName(mem(d.added_by_member_id))}` : ""}`}
      </div>
      ${d.youtube_url ? `<div style="margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <a href="${d.youtube_url}" target="_blank" rel="noopener" style="font-size:13px;color:var(--amber);text-decoration:none;font-weight:700">▶️ ${tr('detailHeaderHtml.watch-video')}</a>
        ${d.creator_name ? `<span style="font-size:12px;color:#999">${tr('detailHeaderHtml.by')} ${d.source_url ? `<a href="${d.source_url}" target="_blank" rel="noopener" style="color:#999;text-decoration:underline">${d.creator_name}</a>` : d.creator_name}</span>` : ""}
      </div>` : ""}
    </div>
    <div style="padding:0 16px">
      ${d.card_state === "thin" ? `<div class="dtl-banner edit">📝 ${tr('detailHeaderHtml.thin-card-tap-to-add-ingredients')}</div>` : ""}
      ${d.forked_from_id ? `<div class="dtl-banner fork">🍴 ${tr('detailHeaderHtml.your-familys-copy-of-the-original-recipe')}</div>` : ""}
    </div>`;
}
// Author/source/video, as small buttons rather than a prominent block - the
// recipe itself is the point, these are just "where did this come from"
// breadcrumbs. Author is who added it to the family cookbook (member row);
// Source reuses photo_source_url (the external page the hero photo/recipe
// was scraped from at import time - the closest thing to a recipe-level
// source URL that's actually persisted today, see 20260809020000); Video is
// the same youtube_url already linked at the top of the header, repeated
// here since this is now the one place all of a recipe's metadata lives.
function linksHtml(d) {
  const author = d.added_by_member_id ? mem(d.added_by_member_id) : null;
  const parts = [];
  if (author) parts.push(`<span class="chip on">${author.em} ${tr('linksHtml.added-by')} ${mName(author)}</span>`);
  if (d.photo_source_url) parts.push(`<a href="${d.photo_source_url}" target="_blank" rel="noopener" class="mini-btn" style="text-decoration:none;display:inline-block">🔗 ${tr('linksHtml.source')}</a>`);
  if (d.youtube_url) parts.push(`<a href="${d.youtube_url}" target="_blank" rel="noopener" class="mini-btn" style="text-decoration:none;display:inline-block">▶️ ${tr('linksHtml.video')}</a>`);
  if (!parts.length) return "";
  return `<div class="sect" style="margin-top:18px">${tr('linksHtml.links')}</div><div class="chips-wrap">${parts.join("")}</div>`;
}
function detailView(d) {
  const roleVal = detailEditMode ? detailDraft.dish_role : d.dish_role;
  const courseVal = detailEditMode ? detailDraft.course_category : d.course_category;
  const mealsVal = detailEditMode ? detailDraft.meal_types : new Set(d.meals);
  const techVal = detailEditMode ? detailDraft.techniques : new Set(d.techniques);

  const chipRow = (label, opts, isOn, key) => `<div class="sect">${label}</div><div class="chips-wrap">${
    detailEditMode
      ? opts.map(([v, l]) => `<div class="chip ${isOn(v) ? "on" : ""}" data-editchip="${key}" data-val="${v}">${l}</div>`).join("")
      : (opts.filter(([v]) => isOn(v)).map(([, l]) => `<div class="chip on">${l}</div>`).join("") || `<span style="font-size:12px;color:#bbb">${tr('chipRow.not-set')}</span>`)
  }</div>`;

  // Former "About" tab content (2026-08-09: folded into the single detail
  // pane, right after Instructions - see comment on `detailEditMode` decl).
  // Every chip row keeps its original header; only the container changed.
  const aboutHtml = `
    ${chipRow(tr('detailView.meal-type'), MEALS.map(m => [m.k, m.ic + " " + mealN(m)]), v => mealsVal.has(v), "meal_types")}
    ${chipRow(tr('detailView.dish-role'), DISH_ROLES.map(r => [r, dishRoleLabel(r)]), v => roleVal === v, "dish_role")}
    ${chipRow(tr('detailView.course-category'), COURSE_CATEGORIES.map(c => [c, courseLabel(c)]), v => courseVal === v, "course_category")}
    ${chipRow(tr('detailView.techniques'), TECHNIQUES.map(t => [t, techLabel(t)]), v => techVal.has(v), "techniques")}
    ${d.diet_compatible_with.length ? `<div class="sect">${tr('detailView.diet-compatible')}</div><div class="chips-wrap">${d.diet_compatible_with.map(v => `<div class="chip on">${dietFilterLabel(v)}</div>`).join("")}</div>` : ""}
    ${d.allergens.length ? `<div class="sect">${tr('detailView.allergens')}</div><div class="chips-wrap">${d.allergens.map(a => `<div class="chip on" style="border-color:#ef4444;background:#fee2e2">⚠️ ${a}</div>`).join("")}</div>` : ""}
    ${linksHtml(d)}`;

  // Ingredients: read-only list, or a full add/remove/edit editor when
  // editing - mirrors openImportReview's ingredient editor (same
  // data-ingf/data-ingidx/data-ingdel wiring), reusing the shared
  // unitDisplay()/unitFromInput() helpers so units localize identically
  // to a freshly-imported draft.
  // Scaling (2026-08-09, revised same day): food.family_cookbook_recipes.servings
  // is nullable so a *stored* value only ever means "confirmed from the
  // source" (20260809050000 migration - never write a guess there). The
  // scaling stepper is a different, purely client-side, never-persisted
  // concern: it needs *some* baseline to scale from even when the
  // recipe's true servings was never confirmed, so it falls back to an
  // assumed 4 (baseServings) - shared by the ingredient math below and
  // servingsHtml's stepper - and that assumption never touches the DB or
  // survives closing the detail view / entering edit mode.
  const baseServings = d.servings || 4;
    let ingHtml;
    if (detailEditMode) {
      const ings = detailDraft.ingredients;
      ingHtml = `<div id="ingList">${ings.map((ing, i) => {
        const name = ingredientDisplayName(ing) || "";
        return `
        <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px" data-ingidx="${i}">
          <input data-ingf="qty" value="${ing.qty ?? ""}" placeholder="${tr('anonymous.qty')}" style="width:52px;border:1px solid #eee;border-radius:8px;padding:6px;font-size:13px">
          <input data-ingf="unit" value="${unitDisplay(ing.unit).replace(/"/g, "&quot;")}" placeholder="${tr('anonymous.unit')}" style="width:56px;border:1px solid #eee;border-radius:8px;padding:6px;font-size:13px">
          <input data-ingf="name" value="${name.replace(/"/g, "&quot;")}" placeholder="${tr('anonymous.ingredient')}" style="flex:1;border:1px solid #eee;border-radius:8px;padding:6px;font-size:13px">
          <button class="dtl-back" data-ingdel="${i}" style="width:28px;height:28px;font-size:12px;color:#ef4444">✕</button>
        </div>`;
      }).join("") || `<div style="font-size:12px;color:#aaa">${tr('detailView.no-ingredients-yet-add-them-below')}</div>`}</div>
        <button class="mini-btn" id="dtlIngAdd" style="margin-top:2px">+ ${tr('detailView.add-ingredient')}</button>`;
    } else {
      const scaleFactor = detailScaleTo ? detailScaleTo / baseServings : 1;
      const ingLocale = detailContentLocale(d);
      ingHtml = d.ingredients.length
        ? `<ul style="padding-left:18px;font-size:14px;line-height:2">${d.ingredients.map(i => `<li>${ingredientLine(i, scaleFactor, ingLocale)}</li>`).join("")}</ul>`
        : (d.ingredients_raw ? `<div style="font-size:14px;line-height:1.8;white-space:pre-wrap">${d.ingredients_raw}</div>` : `<div style="font-size:13px;color:#aaa">${tr('detailView.no-ingredients-recorded-for-this-recipe-yet')}</div>`);
    }

    // Serving size (food.family_cookbook_recipes.servings, nullable - a
    // stored number means "confirmed from the source", 2026-08-09). In
    // edit mode it's a plain input (sets the recipe's real base count and
    // is what actually gets saved/persisted). In read mode it's always a
    // scaling stepper - even when servings was never confirmed, using
    // baseServings' assumed-4 fallback (see above) so scaling is never
    // blocked on that; +/- changes detailScaleTo (view-only target, resets
    // whenever the detail view is reopened or edit mode is entered) and
    // recomputes every ingredient's displayed qty via scaleFactor - the
    // stored ingredients/servings are never touched by this. When servings
    // is unconfirmed, a muted "(?)" plus a nudge to set the real value via
    // ✏️ makes clear the base is only a guess, not a database fact.
    const shownServings = detailScaleTo || baseServings;
    const servingsHtml = detailEditMode
      ? `<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#888;font-weight:400">👥 <input id="dtlServingsInput" type="number" min="1" value="${detailDraft.servings ?? ""}" style="width:44px;border:1px solid #eee;border-radius:8px;padding:3px 5px;font-size:12px"> ${tr('detailView.servings')}</span>`
      : `<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#888;font-weight:400">👥 ${tr('detailView.serves')}
          <button class="dtl-back" id="dtlScaleDown" ${shownServings <= 1 ? "disabled" : ""} style="width:22px;height:22px;font-size:12px;padding:0">−</button>
          <b style="color:#333;min-width:14px;text-align:center">${shownServings}${d.servings ? "" : "<sup>?</sup>"}</b>
          <button class="dtl-back" id="dtlScaleUp" style="width:22px;height:22px;font-size:12px;padding:0">+</button>
          ${detailScaleTo && detailScaleTo !== baseServings ? `<button class="dtl-back" id="dtlScaleReset" style="font-size:10px;padding:2px 6px;height:auto">${tr('detailView.reset')}</button>` : ""}
          ${!d.servings ? `<span style="font-size:11px;color:#c99">${tr('detailView.guess-tap-to-confirm')}</span>` : ""}
        </span>`;

    // Step photo tiles: a step can now carry several photos (2026-08-11 -
    // was one photo_url, now a photo_urls array). Each existing photo is
    // its own tap-to-expand tile (openPhotoLightbox, same as the hero
    // photo); a dashed-outline "+" tile always trails the row so more can
    // be added - in edit mode it's queued into detailDraft and only
    // persists on "Save changes" (see saveDetailEdit); outside edit mode
    // (2026-08-11 follow-up) it uploads and saves immediately via
    // addStepPhotoLive, same one-tap-and-it's-live behavior as the hero
    // photo's "Add a photo" slide. The file input has no `capture`
    // attribute so mobile browsers show their native "Take Photo / Choose
    // from Library" chooser, same as every other photo-upload input here.
    const stepPhotoTiles = (photos, stepIdx, removable) => `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
      ${photos.map((url, pi) => `<div style="position:relative;display:inline-block">
          <img data-stepphotoview="${url.replace(/"/g, "&quot;")}" src="${url}" style="width:96px;height:96px;border-radius:10px;object-fit:cover;display:block;cursor:zoom-in">
          ${removable ? `<button class="dtl-back" data-stepphotodel="${stepIdx}" data-photoidx="${pi}" title="${tr('anonymous.remove-photo')}" style="position:absolute;top:-8px;right:-8px;width:20px;height:20px;font-size:10px;line-height:1;color:#ef4444;background:#fff;border-radius:50%;padding:0">✕</button>` : ""}
        </div>`).join("")}
      <label title="${tr('stepPhotoTiles.add-a-photo')}" style="width:96px;height:96px;border:2px dashed #ddd;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#bbb;cursor:pointer">+<input type="file" accept="image/*" data-stepphotoadd="${stepIdx}" style="display:none"></label>
    </div>`;
    let instrHtml;
    if (detailEditMode) {
      const steps = detailDraft.instructions;
      instrHtml = `<div id="stepList">${steps.map((s, i) => `
        <div class="step-row" style="margin-bottom:14px" data-stepidx="${i}">
          <div style="display:flex;gap:8px;align-items:flex-start">
            <div style="flex:0 0 26px;font-weight:800;color:#bbb;padding-top:10px;text-align:right">${i + 1}.</div>
            <textarea data-stepinput="${i}" rows="2" style="flex:1;font-size:14px;line-height:1.6;padding:8px 10px;border:1px solid #eee;border-radius:10px;font-family:inherit;resize:vertical">${s.text}</textarea>
            <div style="display:flex;flex-direction:column;gap:2px">
              <button class="dtl-back" data-stepup="${i}" ${i === 0 ? "disabled" : ""} style="width:30px;height:26px;font-size:12px">↑</button>
              <button class="dtl-back" data-stepdown="${i}" ${i === steps.length - 1 ? "disabled" : ""} style="width:30px;height:26px;font-size:12px">↓</button>
              <button class="dtl-back" data-stepdel="${i}" style="width:30px;height:26px;font-size:12px;color:#ef4444">✕</button>
            </div>
          </div>
          <div style="margin-left:34px">${stepPhotoTiles(stepPhotoUrls(s), i, true)}</div>
        </div>`).join("")}</div>
        <button class="mini-btn" id="dtlStepAdd" style="margin-top:4px">+ ${tr('detailView.add-step')}</button>`;
    } else {
      const steps = instructionSteps(d);
      instrHtml = steps.length
        ? `<ol style="padding-left:18px;font-size:14px;line-height:1.9">${steps.map((s, i) => `<li style="margin-bottom:14px"><div>${s.text}</div>${stepPhotoTiles(s.photo_urls, i, true)}</li>`).join("")}</ol>`
        : `<div style="font-size:13px;color:#aaa">${tr('detailView.no-instructions-recorded-for-this-recipe-yet')}</div>`;
    }

  // Delete (2026-08-10) - deliberately at the very bottom of the card and
  // only ever rendered in edit mode, per request: a destructive action
  // should never be one accidental tap away from the read view, and should
  // sit past everything else so reaching it is a deliberate scroll, not a
  // reflex. Soft-delete (recipe_deleted event, see
  // 20260810030000_food_recipe_soft_delete_v1.sql) - never a hard DB
  // delete, so this is always safe regardless of the recipe's history.
  const deleteHtml = detailEditMode
    ? `<div style="margin-top:28px;padding-top:16px;border-top:1px solid #f0f0f0">
        <button class="mini-btn reject" id="dtlDelete" style="width:100%">🗑 ${tr('detailView.delete-recipe')}</button>
      </div>`
    : "";

  const editToggleTitle = isRecipeOwner(d) ? tr('detailView.edit-recipe') : tr('detailView.make-my-version');
  const editToggleHtml = detailEditMode
    ? `<button type="button" class="dtl-back" id="dtlEditToggle" style="border-color:var(--amber)" title="${tr('detailView.cancel')}" aria-label="${tr('detailView.cancel')}">✕</button>`
    : `<button type="button" class="dtl-edit-toggle" id="dtlEditToggle" title="${editToggleTitle}" aria-label="${editToggleTitle}"><span class="dtl-edit-toggle-ico">✏️</span><span class="dtl-edit-toggle-label">${editToggleTitle}</span></button>`;

  const pane = `${detailHeaderHtml(d)}
      <div style="padding:6px 16px 20px">
      <div style="margin-bottom:6px">${servingsHtml}</div>
      <div class="sect">${tr('detailView.ingredients')}</div>
      ${ingHtml}
      <div class="sect" style="margin-top:18px">${tr('detailView.instructions')}</div>
      ${instrHtml}
      ${aboutHtml}
      ${deleteHtml}
    </div>`;
  return `
  <div class="dtl-hd"><button class="dtl-back" id="dtlBack">←</button>
    <div style="flex:1;min-width:0;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${detailTitleName(d)}</div>
    ${editToggleHtml}</div>
  ${pane}
  ${detailEditMode ? `<div class="dtl-editbar"><button class="btn btn-ghost" id="dtlCancel">${tr('detailView.cancel')}</button><button class="btn btn-primary" id="dtlSave" ${detailSaving ? "disabled" : ""}>${detailSaving ? tr('detailView.saving') : tr('detailView.save-changes')}</button></div>` : ""}`;
}

function wireDetailOverlay(wrap, d) {
  wrap.querySelector("#dtlBack")?.addEventListener("click", closeDetail);
  // Photo carousel on the hero - identical wiring to the Spin card's, just
  // re-rendering this overlay (not refreshDeck()) since photoIdx[d.id] is the
  // one piece of shared state between the two views.
  wrap.querySelectorAll(".dtl-hero .pnav").forEach(btn => btn.addEventListener("click", () => {
    photoIdx[d.id] = (photoIdx[d.id] || 0) + (btn.dataset.pnav === "next" ? 1 : -1);
    renderDetailOverlay();
  }));
  const dtlPhotoFile = wrap.querySelector(".dtl-hero [data-photofile]");
  if (dtlPhotoFile) dtlPhotoFile.addEventListener("change", async () => {
    // uploadRecipePhoto()/resolvePendingPhoto() already re-render this overlay
    // themselves (`if (detailOpen) renderDetailOverlay()`) once the write
    // lands, so nothing further to do here after awaiting them.
    // 2026-08-11: logged end-to-end (pick -> upload call) so a repeat of the
    // "picked a library photo, confirmed, nothing happened" report leaves a
    // trail even if it fails silently before any toast would show.
    logClientDiagnostic("hero_photo_pick", { recipe_id: d.id, edit_mode: detailEditMode, has_file: !!(dtlPhotoFile.files && dtlPhotoFile.files.length) });
    try {
      const file = dtlPhotoFile.files && dtlPhotoFile.files[0];
      dtlPhotoFile.value = "";
      if (file) await uploadRecipePhoto(d.id, file);
    } catch (e) {
      logClientDiagnostic("hero_photo_flow_exception", { recipe_id: d.id, message: e?.message || String(e), stack: e?.stack || null });
      toast(tr('anonymous.something-went-wrong-adding-that-photo-try-again'));
    }
  });
  const dtlPhotoRemove = wrap.querySelector(".dtl-hero [data-premove]");
  dtlPhotoRemove?.addEventListener("click", () => confirmRemovePhoto(() => removeRecipePhotoLive(dtlPhotoRemove.dataset.premove, dtlPhotoRemove.dataset.photourl)));
  // Tapping the photo itself (not any of the controls above it) opens it
  // full-screen, uncropped - the hero strip only ever shows it letterboxed.
  wrap.querySelector(".dtl-hero")?.addEventListener("click", e => {
    if (e.target.closest(".pnav, .add-photo-cta, .photo-approve-row, .photo-pending-badge, .photo-remove-btn, .enrich-fab, .qhide")) return;
    const photos = recipePhotoSlides(d).map((s) => s.url);
    const url = photos[photoIdx[d.id] || 0];
    if (url) openPhotoLightbox(url);
  });
  wrap.querySelector("#dtlEnrichBtn")?.addEventListener("click", () => { closeDetail(); openImportSheet(d.id); });
  wrap.querySelector("#dtlTranslateBtn")?.addEventListener("click", async () => {
    if (detailTranslationLoading) return;
    await requestRecipeTranslation(d);
  });
  wrap.querySelector("#dtlEditToggle")?.addEventListener("click", async () => {
    detailScaleTo = null; // editing always shows/edits the recipe's real base quantities
    if (detailEditMode) {
      detailEditMode = false;
      detailDraft = null;
      renderDetailOverlay();
      return;
    }
    if (!isRecipeOwner(d)) {
      const fresh = await makeMyVersionAndEdit(d);
      if (!fresh) return;
      startDetailDraft(fresh);
      renderDetailOverlay();
      return;
    }
    startDetailDraft(d);
    renderDetailOverlay();
  });
  wrap.querySelector("#dtlCancel")?.addEventListener("click", () => { detailEditMode = false; detailDraft = null; renderDetailOverlay(); });
  wrap.querySelectorAll("[data-editchip]").forEach(c => c.addEventListener("click", () => {
    if (!detailDraft) return;
    const key = c.dataset.editchip, v = c.dataset.val;
    if (key === "dish_role") {
      detailDraft.dish_role = detailDraft.dish_role === v ? null : v;
      // dish_role='component' <=> meal_types=['component'] is a DB invariant -
      // the two fields must always change together.
      if (detailDraft.dish_role === "component") detailDraft.meal_types = new Set(["component"]);
      else if (detailDraft.meal_types.has("component")) detailDraft.meal_types = new Set(["dinner"]);
    } else if (key === "course_category") {
      detailDraft.course_category = detailDraft.course_category === v ? null : v;
    } else if (key === "meal_types") {
      if (detailDraft.dish_role === "component") return; // locked while dish_role is component
      if (detailDraft.meal_types.has(v)) detailDraft.meal_types.delete(v); else detailDraft.meal_types.add(v);
    } else if (key === "techniques") {
      if (detailDraft.techniques.has(v)) detailDraft.techniques.delete(v); else detailDraft.techniques.add(v);
    }
    renderDetailOverlay();
  }));
  wrap.querySelector("#dtlTitleInput")?.addEventListener("input", (e) => {
    if (!detailDraft) return;
    if (lang === "ru") detailDraft.titleRu = e.target.value;
    else if (lang === "uk") detailDraft.titleUk = e.target.value;
    else if (lang === "nl") detailDraft.titleNl = e.target.value;
    else detailDraft.titleEn = e.target.value;
  });
  wrap.querySelector("#dtlTimeInput")?.addEventListener("input", (e) => {
    if (!detailDraft) return;
    detailDraft.cookTimeMinutes = e.target.value === "" ? null : Number(e.target.value);
  });
  wrap.querySelector("#dtlCuisineSelect")?.addEventListener("change", (e) => {
    if (!detailDraft) return;
    const v = e.target.value;
    if (v === "__new__") {
      detailDraft.cuisineMode = "new";
      detailDraft.cuisineCustom = "";
    } else {
      detailDraft.cuisineMode = "pick";
      detailDraft.cuisine = v;
      detailDraft.cuisineCustom = "";
    }
    renderDetailOverlay();
  });
  wrap.querySelector("#dtlCuisineInput")?.addEventListener("input", (e) => {
    if (!detailDraft) return;
    detailDraft.cuisineCustom = e.target.value;
  });
  wrap.querySelector("#dtlServingsInput")?.addEventListener("input", (e) => {
    if (!detailDraft) return;
    detailDraft.servings = e.target.value === "" ? null : Number(e.target.value);
  });
  wrap.querySelectorAll("#dtlDiffPicker [data-diffval]").forEach(s => s.addEventListener("click", () => {
    if (!detailDraft) return;
    detailDraft.difficulty = Number(s.dataset.diffval);
    renderDetailOverlay();
  }));
  wrap.querySelector("#dtlScaleUp")?.addEventListener("click", () => {
    detailScaleTo = (detailScaleTo || d.servings || 4) + 1;
    renderDetailOverlay();
  });
  wrap.querySelector("#dtlScaleDown")?.addEventListener("click", () => {
    const next = (detailScaleTo || d.servings || 4) - 1;
    if (next < 1) return;
    detailScaleTo = next;
    renderDetailOverlay();
  });
  wrap.querySelector("#dtlScaleReset")?.addEventListener("click", () => {
    detailScaleTo = null;
    renderDetailOverlay();
  });
  wrap.querySelector("#dtlSave")?.addEventListener("click", () => saveDetailEdit(d));
  wrap.querySelector("#dtlActiveEye")?.addEventListener("click", () => toggleRecipeActive(d));
  wrap.querySelector("#dtlDelete")?.addEventListener("click", () => confirmDeleteRecipe(d));

  // Step text edits update the draft in place without a full re-render, so
  // the textarea keeps focus/cursor position while typing. Only the
  // CURRENT UI language's side is edited here - text_en/text_ru for the
  // other language (already translated) is left untouched, so editing a
  // step in English doesn't wipe out its existing Russian translation
  // (SPEC_RECIPE_I18N.md - the pre-existing bug this replaces would have
  // silently dropped the other language on every edit).
  wrap.querySelectorAll("[data-stepinput]").forEach(ta => ta.addEventListener("input", (e) => {
    const idx = Number(ta.dataset.stepinput);
    const step = detailDraft?.instructions?.[idx];
    if (!step) return;
    step.text = e.target.value;
    step[lang === "ru" ? "text_ru" : "text_en"] = e.target.value;
  }));
  wrap.querySelector("#dtlStepAdd")?.addEventListener("click", () => {
    if (!detailDraft) return;
    // A brand-new step is authored in the current UI language only - the
    // other side stays null until the translate pipeline (or a manual
    // edit after switching language) fills it in.
    detailDraft.instructions.push({
      text: "",
      text_en: lang === "ru" ? null : "",
      text_ru: lang === "ru" ? "" : null,
      photo_urls: [],
    });
    renderDetailOverlay();
  });
  wrap.querySelectorAll("[data-stepup]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.stepup);
    if (!detailDraft || i < 1) return;
    const arr = detailDraft.instructions;
    [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
    renderDetailOverlay();
  }));
  wrap.querySelectorAll("[data-stepdown]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.stepdown);
    const arr = detailDraft?.instructions;
    if (!arr || i >= arr.length - 1) return;
    [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
    renderDetailOverlay();
  }));
  wrap.querySelectorAll("[data-stepdel]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.stepdel);
    if (!detailDraft) return;
    detailDraft.instructions.splice(i, 1);
    renderDetailOverlay();
  }));
  // Per-step photo add: in edit mode it uploads immediately (so the editor
  // shows the result right away) but only stashes the URL into the draft's
  // photo_urls array - it isn't persisted until "Save changes", exactly like
  // step text edits above. Outside edit mode (2026-08-11) the same tile is
  // always available too (per user request), but there's no draft/Save step
  // to ride along with, so it goes straight to addStepPhotoLive() which
  // applies the write immediately (subject to the same owner/pending-review
  // gate as any other recipe_edit_proposed).
  wrap.querySelectorAll("[data-stepphotoadd]").forEach(inp => inp.addEventListener("change", async () => {
    const idx = Number(inp.dataset.stepphotoadd);
    logClientDiagnostic("step_photo_pick", { recipe_id: d.id, step: idx, edit_mode: detailEditMode, has_file: !!(inp.files && inp.files.length) });
    try {
      const file = inp.files && inp.files[0];
      inp.value = "";
      if (!file) return;
      if (detailEditMode) {
        if (!detailDraft?.instructions?.[idx]) return;
        const url = await uploadStepPhoto(d.id, file);
        if (!url) return;
        const step = detailDraft.instructions[idx];
        step.photo_urls = [...stepPhotoUrls(step), url];
        renderDetailOverlay();
      } else {
        await addStepPhotoLive(d, idx, file);
      }
    } catch (e) {
      logClientDiagnostic("step_photo_flow_exception", { recipe_id: d.id, step: idx, message: e?.message || String(e), stack: e?.stack || null });
      toast(tr('anonymous.something-went-wrong-adding-that-photo-try-again'));
    }
  }));
  // Removing a step photo (2026-08-11: available in both edit and non-edit
  // mode, always behind the same confirmRemovePhoto() dialog the hero photo
  // uses) - in edit mode it only trims the draft's array (persists on "Save
  // changes", like every other edit-mode change); outside edit mode there's
  // no draft to trim, so it writes immediately via removeStepPhotoLive().
  wrap.querySelectorAll("[data-stepphotodel]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.stepphotodel);
    const pi = Number(b.dataset.photoidx);
    confirmRemovePhoto(async () => {
      if (detailEditMode) {
        const step = detailDraft?.instructions?.[i];
        if (!step) return;
        step.photo_urls = stepPhotoUrls(step).filter((_, idx) => idx !== pi);
        renderDetailOverlay();
      } else {
        const url = stepPhotoUrls(instructionSteps(d)[i])[pi];
        if (url) await removeStepPhotoLive(d, i, url);
      }
    });
  }));
  // Step photos (both the read-only Instructions list and the edit-mode
  // editor) open full-screen the same way the hero photo does.
  wrap.querySelectorAll("[data-stepphotoview]").forEach(img => img.addEventListener("click", () => openPhotoLightbox(img.dataset.stepphotoview)));

  // Ingredients: same add/remove/edit-qty/unit/name pattern as
  // openImportReview's editor. qty/unit/name edits update the draft in
  // place (no full re-render, keeps input focus); add/remove re-render
  // since the row count changes.
  wrap.querySelectorAll("[data-ingidx]").forEach(row => {
    const i = Number(row.dataset.ingidx);
    row.querySelectorAll("[data-ingf]").forEach(inp => inp.addEventListener("input", () => {
      const ing = detailDraft?.ingredients?.[i];
      if (!ing) return;
      const f = inp.dataset.ingf;
      if (f === "qty") { ing.qty = inp.value === "" ? null : Number(inp.value); return; }
      if (f === "name") { if (lang === "ru") ing.name_ru = inp.value; else ing.name_en = inp.value; return; }
      if (f === "unit") { ing.unit = unitFromInput(inp.value); return; }
    }));
  });
  wrap.querySelectorAll("[data-ingdel]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.ingdel);
    if (!detailDraft) return;
    detailDraft.ingredients.splice(i, 1);
    renderDetailOverlay();
  }));
  wrap.querySelector("#dtlIngAdd")?.addEventListener("click", () => {
    if (!detailDraft) return;
    detailDraft.ingredients.push({ name_en: lang === "ru" ? null : "", name_ru: lang === "ru" ? "" : null, qty: null, unit: null, note: null, section: null });
    renderDetailOverlay();
  });
}

function startDetailDraft(d) {
  detailEditMode = true;
  detailDraft = {
    dish_role: d.dish_role, course_category: d.course_category,
    meal_types: new Set(d.meals), techniques: new Set(d.techniques),
    instructions: instructionSteps(d).map(s => ({ ...s })),
    ingredients: d.ingredients.map(i => ({ ...i })),
    titleEn: d.en, titleRu: d.ru, titleUk: d.uk, titleNl: d.nl,
    cuisine: d.c === "family" ? "" : d.c,
    cuisineMode: (d.c && d.c !== "family" && !CUISINES_BY_SLUG[d.c]) ? "new" : "pick",
    cuisineCustom: (d.c && d.c !== "family" && !CUISINES_BY_SLUG[d.c]) ? cuisineLabel(d.c) : "",
    difficulty: d.difficulty,
    cookTimeMinutes: d.t,
    servings: d.servings ?? null,
  };
}

async function makeMyVersionAndEdit(d) {
  const { data, error } = await sb.rpc("spin_food_make_my_version", { p_recipe_id: d.id });
  if (error) {
    toast(tr('makeMyVersion.failed') + error.message);
    return null;
  }
  await loadCatalog();
  const newId = data.recipe_id;
  if (detailOpen === d.id) detailOpen = newId;
  if (data.forked) {
    promoteRecipeInDeck(newId);
    toast(tr('saveDetailEdit.saved-to-your-cookbook-this-is-now-your-own-copy'));
  }
  if (tab === "spin") refreshDeck();
  return dish(newId);
}

function confirmPhotoTarget() {
  return new Promise((resolve) => {
    const v = modal(`<h3 style="margin:0 0 8px">📷 ${tr('confirmPhotoTarget.title')}</h3>
      <div style="font-size:14px;color:#666;line-height:1.45;margin-bottom:14px">${tr('confirmPhotoTarget.prompt')}</div>
      <div class="mini-row" style="display:flex;flex-direction:column;gap:8px">
        <button class="btn btn-primary" id="photoTargetGlobal" style="width:100%">${tr('confirmPhotoTarget.global-cookbook')}</button>
        <button class="btn btn-ghost" id="photoTargetFamily" style="width:100%">${tr('confirmPhotoTarget.family-cookbook')}</button>
        <button class="btn btn-ghost" id="photoTargetCancel" style="width:100%">${tr('confirmPhotoTarget.cancel')}</button>

async function saveDetailEdit(d) {
  if (!detailDraft || detailSaving) return;
  const draftMeals = [...detailDraft.meal_types];
  if (!draftMeals.length) { toast(tr('saveDetailEdit.pick-at-least-one-meal-type')); return; }

  const proposed = {};
  if (detailDraft.dish_role !== d.dish_role) proposed.dish_role = detailDraft.dish_role;
  if (detailDraft.course_category !== d.course_category) proposed.course_category = detailDraft.course_category;
  if (draftMeals.slice().sort().join(",") !== d.meals.slice().sort().join(",")) proposed.meal_types = draftMeals;
  const draftTech = [...detailDraft.techniques].sort();
  if (draftTech.join(",") !== d.techniques.slice().sort().join(",")) proposed.techniques = draftTech;
  // dish_role changes must always carry meal_types alongside (server-enforced pairing).
  if ("dish_role" in proposed && !("meal_types" in proposed)) proposed.meal_types = draftMeals;

  // Name/difficulty/time/cuisine - only the current UI language's title side
  // is touched (same convention as instruction steps, SPEC_RECIPE_I18N.md),
  // the other side's existing translation is left untouched.
  const draftTitle = detailEditTitleForDisplay(d, detailDraft).trim();
  const currentTitle = detailCurrentTitleForCompare(d).trim();
  if (draftTitle && draftTitle !== currentTitle) {
    if (lang === "ru") proposed.title_ru = draftTitle;
    else if (lang === "en") proposed.title_en = draftTitle;
    else if (lang === "uk" || lang === "nl") {
      proposed.title_locale = lang;
      proposed.title_locale_value = draftTitle;
    }
  }
  if (detailDraft.difficulty !== d.difficulty) proposed.difficulty = detailDraft.difficulty;
  if (detailDraft.cookTimeMinutes && detailDraft.cookTimeMinutes !== d.t) proposed.cook_time_minutes = detailDraft.cookTimeMinutes;
  const draftCuisine = detailDraft.cuisineMode === "new"
    ? (detailDraft.cuisineCustom || "").trim()
    : (detailDraft.cuisine || "").trim().toLowerCase();
  const currentCuisine = d.c === "family" ? "" : d.c;
  if (detailDraft.cuisineMode === "new" && draftCuisine) {
    const slug = slugifyCuisine(draftCuisine);
    const labels = { en: draftCuisine };
    if (lang === "uk") labels.uk = draftCuisine;
    if (lang === "nl") labels.nl = draftCuisine;
    if (lang === "ru") labels.ru = draftCuisine;
    const { error: cuiErr } = await sb.rpc("spin_food_cuisine_add", {
      p_slug: slug,
      p_label_en: draftCuisine,
      p_labels_i18n: labels,
    });
    if (cuiErr) {
      toast(tr('saveDetailEdit.cuisine-add-failed') + cuiErr.message);
      detailSaving = false;
      renderDetailOverlay();
      return;
    }
    filterVocabLoaded = false;
    await loadFilterVocabulary();
    if (slug !== currentCuisine) proposed.cuisine = slug;
  } else if (draftCuisine && draftCuisine !== currentCuisine) {
    proposed.cuisine = draftCuisine;
  }
  if (detailDraft.servings && detailDraft.servings !== d.servings) proposed.servings = detailDraft.servings;

  // Bilingual step diffing (SPEC_RECIPE_I18N.md): both text_en and text_ru
  // travel together so an edit in one language never overwrites the
  // other's already-translated text. Built from d.instructions directly
  // (not the language-collapsed instructionSteps() view) so the diff -
  // and what actually gets sent - reflects both languages accurately.
  const draftSteps = detailDraft.instructions
    .filter(s => (s.text || "").trim())
    .map((s, i) => ({ step: i + 1, text_en: s.text_en ?? null, text_ru: s.text_ru ?? null, photo_urls: stepPhotoUrls(s) }));
  const currentSteps = (Array.isArray(d.instructions) ? d.instructions : []).map((s, i) => ({
    step: i + 1,
    text_en: (typeof s === "string" ? null : s?.text_en) ?? null,
    text_ru: (typeof s === "string" ? null : s?.text_ru) ?? null,
    photo_urls: stepPhotoUrls(s),
  }));
  if (JSON.stringify(draftSteps) !== JSON.stringify(currentSteps)) proposed.instructions = draftSteps;

  // Ingredient diffing: full-array replace, same shape spin-food-import
  // writes at import time (raw/name_en/name_ru/qty/unit/note/section/
  // ingredient_slug). ingredient_slug is recomputed client-side (same
  // slugify as the server) so it stays consistent with a hand-edited name -
  // note this does NOT retrigger AI classification (protein_groups/
  // diet_compatible_with/allergens/card_state can go stale until a future
  // re-classify pass, same accepted limitation instructions-editing has
  // for techniques).
  const draftIngredients = detailDraft.ingredients
    .filter(i => (i.name_en || "").trim() || (i.name_ru || "").trim())
    .map(i => ({
      raw: i.raw || "",
      name_en: i.name_en || null,
      name_ru: i.name_ru || null,
      qty: i.qty ?? null,
      unit: i.unit || null,
      note: i.note || null,
      section: i.section || null,
      ingredient_slug: slugifyIngredientName(i.name_en || i.name_ru || ""),
    }));
  const currentIngredients = (Array.isArray(d.ingredients) ? d.ingredients : []).map(i => ({
    raw: i.raw || "",
    name_en: i.name_en || null,
    name_ru: i.name_ru || null,
    qty: i.qty ?? null,
    unit: i.unit || null,
    note: i.note || null,
    section: i.section || null,
    ingredient_slug: i.ingredient_slug || slugifyIngredientName(i.name_en || i.name_ru || ""),
  }));
  if (JSON.stringify(draftIngredients) !== JSON.stringify(currentIngredients)) proposed.ingredients = draftIngredients;

  if (!Object.keys(proposed).length) { detailEditMode = false; detailDraft = null; renderDetailOverlay(); return; }

  detailSaving = true; renderDetailOverlay();
  const ok = await applyEvent("recipe_edit_proposed", { recipe_id: d.id, proposed });
  detailSaving = false;
  if (!ok) { renderDetailOverlay(); return; }
  const forked = lastForkInfo;
  await loadCatalog();
  const editedId = forked ? forked.to : d.id;
  const fresh = dish(editedId);
  detailEditMode = false; detailDraft = null;
  if (forked) {
    // "Make it mine": redirect the open detail view (and any active Spin
    // card) from the shared platform/chef recipe to the family's own fork.
    if (detailOpen === forked.from) detailOpen = forked.to;
    promoteRecipeInDeck(forked.to);
  }
  toast(forked
    ? tr('saveDetailEdit.saved-to-your-cookbook-this-is-now-your-own-copy')
    : tr('saveDetailEdit.recipe-updated'));
  if (tab === "spin") refreshDeck();
  const editedDish = dish(editedId);
  if (editedDish) {
    editedDish._resolvedLocale = null;
    await hydrateDishContent(editedDish, lang);
  }
  if (detailOpen) renderDetailOverlay();
}

// Instant, no-approval toggle - household preference, not recipe truth.
async function toggleRecipeActive(d) {
  if (detailSaving) return;
  const goingActive = !d.is_active;
  detailSaving = true; renderDetailOverlay();
  const ok = await applyEvent("recipe_active_set", { recipe_id: d.id, is_active: goingActive });
  detailSaving = false;
  if (!ok) { renderDetailOverlay(); return; }
  await loadCatalog();
  // Explains both halves of what just happened: (1) what changed for this one
  // recipe, and (2) that it's still showing up in Spin/Wish right now regardless -
  // inactive just means "opted out of the AI weekly fill" - and exactly where to
  // go if they actually want it out of sight (the filter icon by the search bar).
  stickyToast(goingActive
    ? tr('toggleRecipeActive.back-in-the-mix-eligible-for-the-ai-weekly-fill-')
    : tr('toggleRecipeActive.hidden-from-ai-weekly-planning-click-the-eye-ico'));
  if (tab === "spin") refreshDeck();
  if (detailOpen) renderDetailOverlay();
}

// Soft delete (2026-08-10, see 20260810030000_food_recipe_soft_delete_v1.sql) -
// requires an explicit confirm tap (not just the edit-mode button itself)
// since this removes the recipe from every family-facing surface (cookbook
// browse/search, Spin, Wish, Duel). Never a hard DB delete - meal_slots/
// wishes/duel_proposals reference this recipe with ON DELETE RESTRICT, so a
// real delete would fail for any recipe that's ever actually been used.
function confirmDeleteRecipe(d) {
  const v = modal(`<h3 style="margin:0 0 4px">🗑 ${tr('confirmDeleteRecipe.delete-this-recipe')}</h3>
    <div style="font-size:14px;color:#666;margin:10px 0 4px">${tr("confirmDeleteRecipe.will-disappear", { name: dName(d) })}</div>
    <div class="mini-row" style="margin-top:16px;display:flex;gap:8px">
      <button class="btn btn-ghost" id="delCancel" style="flex:1">${tr('confirmDeleteRecipe.cancel')}</button>
      <button class="btn" id="delConfirm" style="flex:1;background:#ef4444;color:#fff;border-color:#ef4444">🗑 ${tr('confirmDeleteRecipe.delete')}</button>
    </div>`);
  v.querySelector("#delCancel").onclick = () => closeModal();

// Uploads to recipe-photos Storage, then recipe_photo_added (live for family rows;
// platform rows prompt global vs family fork).
async function uploadRecipePhoto(dishId, file) {
  const familyId = membership?.family_id;
  if (!familyId) { toast(tr('uploadRecipePhoto.sign-in-first')); return; }
  if (!checkPhotoUploadSize(file)) return;
  const d = dish(dishId);
  let photoTarget = null;
  if (d && isPlatformRecipe(d)) {
    photoTarget = await confirmPhotoTarget();
    if (!photoTarget) return;
  }
  const upload = await compressImageForUpload(file, DISPLAY_PHOTO_COMPRESS);
  const ext = upload === file ? ((file.name || "").split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg" : "jpg";
  const path = `${familyId}/${dishId}/${crypto.randomUUID()}.${ext}`;
  toast(tr('uploadRecipePhoto.uploading-photo'));
  let upErr;
  try {
    ({ error: upErr } = await withTimeout(
      sb.storage.from("recipe-photos").upload(path, upload, { contentType: upload.type || "image/jpeg", upsert: false }),
      PHOTO_UPLOAD_TIMEOUT_MS,
      "Photo upload",
    ));
  } catch (e) {
    toast(tr('uploadRecipePhoto.upload-timed-out-check-your-connection-and-try-a'));
    return;
  }
  if (upErr) { toast(tr('uploadRecipePhoto.upload-failed') + upErr.message); return; }
  const { data: pub } = sb.storage.from("recipe-photos").getPublicUrl(path);
  const photoUrl = pub?.publicUrl;
  if (!photoUrl) { toast(tr('uploadRecipePhoto.upload-failed-no-url-returned')); return; }
  const payload = { recipe_id: dishId, photo_url: photoUrl };
  if (photoTarget) payload.photo_target = photoTarget;
  const ok = await applyEvent("recipe_photo_added", payload);
  if (!ok) return;
  const forked = lastForkInfo;
  await loadCatalog();
  const targetId = forked ? forked.to : dishId;
  if (forked) {
    if (detailOpen === forked.from) detailOpen = forked.to;
    promoteRecipeInDeck(forked.to);
  }
  const fresh = dish(targetId);
  const wentLive = Boolean(fresh && recipePhotoSlides(fresh).some((s) => s.url === photoUrl));
  photoIdx[targetId] = wentLive ? Math.max(0, recipePhotoSlides(fresh).length - 1) : 0;
  toast(forked
    ? tr('uploadRecipePhoto.photo-added-to-your-own-copy-of-this-recipe')
    : photoTarget === "global"
    ? tr('uploadRecipePhoto.photo-added-to-global-cookbook')
    : tr('uploadRecipePhoto.photo-added'));
  if (tab === "spin") refreshDeck();
  if (detailOpen) renderDetailOverlay();
}

// and it only actually persists when the user hits "Save changes", riding
// along in the same recipe_edit_proposed{instructions:[...]} write as any

async function uploadStepPhoto(dishId, file) {

  const ext = upload === file ? ((file.name || "").split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg" : "jpg";
  const path = `${familyId}/${dishId}/steps/${crypto.randomUUID()}.${ext}`;
  toast(tr('uploadStepPhoto.uploading-photo'));
  let upErr;
  try {
    ({ error: upErr } = await withTimeout(
      sb.storage.from("recipe-photos").upload(path, upload, { contentType: upload.type || "image/jpeg", upsert: false }),
      PHOTO_UPLOAD_TIMEOUT_MS,

// Adds a step photo outside edit mode (2026-08-11): uploads via
// uploadStepPhoto(), then reconstructs the full instructions array off
// instructionSteps(d) (same steps/indices the read view renders) with the
// new URL appended to the target step's photo_urls, and writes it through
// the same recipe_edit_proposed event saveDetailEdit() uses - so it lands
// live for the owning cook or waits for approval otherwise, identically.
async function addStepPhotoLive(d, stepIndex, file) {
  const url = await uploadStepPhoto(d.id, file);
  if (!url) return;
  const steps = instructionSteps(d).map((s, i) => ({
    step: i + 1,
    text_en: s.text_en,
    text_ru: s.text_ru,
    photo_urls: i === stepIndex ? [...s.photo_urls, url] : s.photo_urls,
  }));
  const ok = await applyEvent("recipe_edit_proposed", { recipe_id: d.id, proposed: { instructions: steps } });
  if (!ok) return;
  const forked = lastForkInfo;
  await loadCatalog();
  const editedId = forked ? forked.to : d.id;
  if (forked) {
    if (detailOpen === forked.from) detailOpen = forked.to;
    promoteRecipeInDeck(forked.to);
  }
  const fresh = dish(editedId);
  toast(forked
    ? tr('addStepPhotoLive.photo-added-to-your-own-copy-of-this-recipe')
    : tr('addStepPhotoLive.photo-added'));
  if (tab === "spin") refreshDeck();
  if (detailOpen) renderDetailOverlay();
}

// Family activity feed - server-backed (2026-08-12 fix). Merges the real
// event log (food.events, via spin_food_list_family_events) with recipe
// import job status (food.recipe_import_jobs, via the existing
// spin_food_list_import_jobs) into one timestamp-sorted list. Previously
// this tab read game.activity, a purely local/ephemeral array populated
// only by this device's own in-app actions in the current session - other
// family members' actions, anything from before the session started, and
// every import job (queued/processing/ready/failed, all source types) were
// invisible here. No separate "history" button/modal anymore - import
// events are just entries in this same list, like everything else.
let familyFeed = [];
const IMPORT_SOURCE_ICON = { url: "🔗", photo: "📷", youtube: "▶️", document: "📄" };

function describeEvent(ev) {
  const p = ev.payload || {};
  const actor = ev.actor_member_id ? mem(ev.actor_member_id) : null;
  const who = actor ? mName(actor) : "🤖 AI";
  const dishName = id => { const d = dish(id); return d ? dName(d) : tr('dishName.a-recipe'); };
  const meal = p.meal_type ? MEALS.find(m => m.k === p.meal_type) : null;
  const when = (p.day !== undefined && meal) ? `${dayN(p.day)} ${mealN(meal)}` : "";
  switch (ev.event_type) {
    case "dish_assigned": {
      const cookName = p.cook_member_id ? mName(mem(p.cook_member_id)) : "?";
      return { icon: "🍽️", text: `${who} ${tr('describeEvent.added')} ${dishName(p.recipe_id)} ${tr('describeEvent.for')} ${when} (${cookName})` };
    }
    case "dish_proposal_created":
      return { icon: "🔄", text: `${who} ${tr('describeEvent.proposed-swapping-in')} ${dishName((p.proposal||{}).recipe_id)} ${tr('describeEvent.for')} ${when}` };
    case "dish_proposal_accepted":
      return { icon: "✅", text: `${who} ${tr('describeEvent.accepted-a-swap-for')} ${when}` };
    case "dish_proposal_rejected":
      return { icon: "❌", text: `${who} ${tr('describeEvent.rejected-a-swap-for')} ${when}` };
    case "dish_cook_accepted":
      return { icon: "✅", text: `${who} ${tr('describeEvent.accepted-cooking')} ${when}` };
    case "dish_cook_declined":
      return { icon: "🙅", text: `${who} ${tr('describeEvent.declined-cooking')} ${when}` };
    case "dish_cook_reassigned":
      return { icon: "👉", text: `${who} ${tr('describeEvent.reassigned')} ${when} ${tr('describeEvent.to')} ${p.cook_member_id ? mName(mem(p.cook_member_id)) : "?"}` };
    case "wish_created":
      return { icon: "✨", text: `${who} ${tr('describeEvent.wished-for')} ${dishName(p.recipe_id)}` };
    case "wish_voted":
      return { icon: "👍", text: `${who} ${tr('describeEvent.voted-for-a-wish')}` };
    case "wish_granted":
      return { icon: "🎉", text: `${who} ${tr('describeEvent.granted-a-wish')}` };
    case "recipe_active_set":
      return { icon: p.is_active ? "📖" : "🙈", text: `${who} ${p.is_active ? tr('describeEvent.restored') : tr('describeEvent.hid')} ${dishName(p.recipe_id)} ${p.is_active ? tr('describeEvent.to') : tr('describeEvent.from')} ${tr('describeEvent.the-cookbook')}` };
    case "recipe_deleted":
      return { icon: "🗑️", text: `${who} ${tr('describeEvent.deleted-a-recipe')}` };
    case "recipe_edit_proposed":
      return { icon: "✏️", text: `${who} ${tr('describeEvent.edited')} ${dishName(p.recipe_id)}` };
    case "recipe_photo_added":
      return { icon: "📷", text: `${who} ${tr('describeEvent.added-a-photo-to')} ${dishName(p.recipe_id)}` };
    case "member_profile_updated":
      return { icon: "🙋", text: `${who} ${tr('describeEvent.updated-their-cooking-profile')}` };
    case "week_confirmed":
      return { icon: "🔒", text: `${who} ${tr('describeEvent.confirmed-the-week')}` };
    case "week_unconfirmed":
      return { icon: "🔓", text: `${who} ${tr('describeEvent.reopened-the-menu')}` };
    default:
      return { icon: "•", text: `${who} — ${ev.event_type}` };
  }
}

// Same 3 stages the standalone YouTube worker actually goes through
// (spin_the_food/video_worker/worker.py, migration 20260812150000) - a
// download can genuinely take a couple of minutes for a long video, so a
// flat "Processing..." label with no movement read as stuck. Same visual
// language as the existing save-progress bar (revSaveProgressTrack/Fill)
// elsewhere in this file - amber fill, 4px track - so it reads as the same
// kind of feedback the user already knows from there (and from the
// Telegram bot's own edit-in-place stage messages).
const IMPORT_PROGRESS_STAGES = ["downloading", "transcribing", "extracting"];
const IMPORT_STAGE_LABEL = {
  downloading: tr('global.downloading-video'),
  transcribing: tr('global.transcribing-captions-or-whisper'),
  extracting: tr('global.ai-is-extracting-the-recipe'),
};

function describeJob(j) {
  const icon = IMPORT_SOURCE_ICON[j.source_type] || "📥";
  const title = (lang === "ru" ? (j.draft?.title_ru || j.draft?.title_en) : (j.draft?.title_en || j.draft?.title_ru)) || j.draft?.title || j.source_type;
  if (j.status === "processing") {
    const stageIdx = IMPORT_PROGRESS_STAGES.indexOf(j.progress_stage);
    const step = stageIdx >= 0 ? stageIdx + 1 : 1;
    const progressPct = Math.round((step / IMPORT_PROGRESS_STAGES.length) * 100);
    const progressLabel = IMPORT_STAGE_LABEL[j.progress_stage] || tr('describeJob.starting');
    return { icon, text: tr('describeJob.importing') + title, progressPct, progressLabel, job: j };
  }
  let text;
  if (j.status === "failed") text = tr('describeJob.recipe-import-failed') + (j.error ? ": " + j.error : "");
  else if (j.status === "ready") text = tr('describeJob.recipe-import-ready-to-review') + title;
  else text = tr('describeJob.recipe-import-queued') + title;
  return { icon, text, job: j };
}

async function loadFamilyFeed() {
  const [{ data: events, error: ee }, { data: jobs, error: je }] = await Promise.all([
    sb.rpc("spin_food_list_family_events", { p_limit: 60 }),
    sb.rpc("spin_food_list_import_jobs", { p_limit: 30 }),
  ]);
  if (ee) console.error("[stf-data] family events:", ee);
  if (je) console.error("[stf-data] import jobs:", je);
  const evEntries = (events || []).map(ev => ({ ts: new Date(ev.created_at).getTime(), kind: "event", ...describeEvent(ev) }));
  const jobEntries = (jobs || []).map(j => ({ ts: new Date(j.updated_at || j.created_at).getTime(), kind: "job", ...describeJob(j) }));
  familyFeed = [...evEntries, ...jobEntries].sort((a, b) => b.ts - a.ts).slice(0, 80);
  if (tab === "feed" && !modalOpen) render();
}
