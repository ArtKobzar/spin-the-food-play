<!DOCTYPE html>
<!-- Spin the Food play harness. Game state: food.* (event-sourced). Family Cookbook from DB. -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- 2026-08-11: maximum-scale/user-scalable added - without them, iOS Safari's
     autozoom-on-input (triggered by any focused input/textarea/select with a
     computed font-size under 16px, which many of this app's compact fields
     use) or a fast double-tap being misread as a zoom gesture would leave the
     whole page zoomed in with no automatic reset, per user report ("often
     after interacting with the UI... the whole screen zooms in a few
     percent... I have to zoom out manually every time"). This app is used
     like a native app (standalone PWA manifest, bottom-sheet modals) so
     locking pinch-zoom out entirely is the standard fix rather than auditing
     every small font-size individually. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFD700">
<title>Spin the Food</title>
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Spin%20the%20Food%22%2C%22short_name%22%3A%22SpinFood%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23fafaf7%22%2C%22theme_color%22%3A%22%23f59e0b%22%2C%22start_url%22%3A%22.%22%2C%22icons%22%3A%5B%5D%7D">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --amber:#FFE34D; --amber-d:#B8923C; --amber-tint:#fff8e0; --amber-text:#6b5400; --green:#10b981; --teal:#0032FF; --teal-d:#0026bf; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #fafaf7; color: #1f2937; overscroll-behavior: none;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 88px; }

  /* identity gate */
  .gate { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 40px 28px; gap: 14px; text-align: center; }
  .gate h1 { font-size: 30px; }
  .gate p { color: #888; margin-bottom: 10px; }
  .who-btn {
    display: flex; align-items: center; gap: 14px; background: #fff; border: 2px solid #eee;
    border-radius: 18px; padding: 16px 20px; font-size: 18px; font-weight: 700; cursor: pointer; text-align: left;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; width: 100%;
  }
  .who-btn:active { background: var(--amber-tint); border-color: var(--amber); }
  .who-btn .em { font-size: 30px; }
  .who-btn small { display: block; font-weight: 400; color: #999; font-size: 13px; }

  /* onboarding */
  .ob { flex: 1; display: flex; flex-direction: column; padding: 22px 24px 30px; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .ob-nav { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .ob-back { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; padding: 0 4px; }
  .ob-prog { display: flex; gap: 5px; flex: 1; }
  .ob-prog i { height: 4px; flex: 1; border-radius: 2px; background: #eee; }
  .ob-prog i.done { background: var(--amber); }
  .ob-q { font-size: 24px; font-weight: 800; line-height: 1.25; margin: 18px 0 18px; }
  .ob-sect { color: #111; font-size: 15px; font-weight: 700; line-height: 1.35; margin: 16px 0 8px; }
  .ob-q + .ob-sect { margin-top: 0; }
  .ob-big { display: flex; flex-direction: column; gap: 12px; }
  .ob-big .btn { font-size: 17px; padding: 17px; }
  .ob-note { color: #999; font-size: 13px; padding-top: 12px; }
  .ob .ob-note { color: #555; font-size: 14px; line-height: 1.35; }
  .ob-text { width: 100%; min-height: 110px; border: 2px solid #e5e7eb; border-radius: 16px; padding: 12px; font-size: 15px; font-family: inherit; resize: none; background: #fff; }
  .ob-next { margin-top: 22px; flex-shrink: 0; }
  .mealgrid { display: grid; grid-template-columns: 52px repeat(3, 1fr); gap: 6px; font-size: 12px; }
  .mealgrid.two { grid-template-columns: 52px repeat(2, 1fr); }
  .mealgrid.one { grid-template-columns: 52px 1fr; }
  .mealgrid .hd { text-align: center; color: #888; font-weight: 600; padding: 2px 0; font-size: 22px; }
  .mealgrid .dy { color: #666; font-weight: 700; align-self: center; font-size: 15px; }
  .mealgrid .hd.bulk, .mealgrid .dy.bulk { cursor: pointer; border-radius: 8px; user-select: none; -webkit-tap-highlight-color: transparent; }
  .mealgrid .hd.bulk { padding: 6px 2px; }
  .mealgrid .dy.bulk { padding: 4px 6px; }
  .mealgrid .hd.bulk:active, .mealgrid .dy.bulk:active { background: #f3f4f6; }
  .mealgrid .hd.bulk.dim, .mealgrid .dy.bulk.dim { color: #ccc; }
  .mg-cell { height: 34px; border-radius: 9px; background: #ecfdf5; border: 1.5px solid var(--green); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; touch-action: none; user-select: none; }
  .mg-cell.off { background: #f5f5f4; border-color: #e5e7eb; color: #ccc; }
  .mealgrid.eat-grid .mg-cell:not(.off) { background: var(--amber-tint); border-color: var(--amber); color: var(--amber-text); font-weight: 700; }
  .mealgrid.cook-grid .mg-cell:not(.off) { background: #ecfdf5; border-color: var(--green); color: #047857; }
  .ob-kw-eat { color: var(--amber-d); font-weight: 800; }
  .ob-kw-cook { color: var(--green); font-weight: 800; }
  /* Meal x course-role matrix (meal-shape onboarding step) - row labels are
     full course names ("Первые / Супы"), much longer than the day-name grid's
     2-3 char abbreviations, so this variant gets a wider label column, a
     bigger header icon, and slightly smaller cells to compensate. */
  .mealgrid.roles { grid-template-columns: 94px repeat(3, 1fr); gap: 5px; }
  .mealgrid.roles .dy { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; line-height: 1.15; font-size: 11px; padding: 4px 2px; }
  .mealgrid.roles .dy .ms-row-ic { font-size: 22px; }
  .mealgrid.roles .mg-cell { height: 28px; }
  .ob-sum { background: #fff; border: 1.5px solid #eee; border-radius: 16px; padding: 14px; font-size: 14px; line-height: 1.7; }

  /* top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 8px; }
  .me-pill { display: flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid #eee; border-radius: 999px; padding: 5px 12px 5px 6px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .me-pill .em { font-size: 20px; }
  .presence { display: flex; gap: 3px; }
  .presence .p { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; background: #fff; border: 1.5px solid #eee; opacity: .35; }
  .presence .p.on { opacity: 1; border-color: var(--green); }
  .screen-title { padding: 2px 20px 8px; }
  .screen-title h2 { font-size: 22px; }
  .screen-title .sub { color: #888; font-size: 13px; }

  .btn { border: none; border-radius: 15px; padding: 13px 20px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn-primary { background: var(--amber); color: var(--amber-text); box-shadow: 0 4px 0 var(--amber-d); }
  .btn-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--amber-d); }
  .btn-ghost { background: #fff; color: #444; border: 2px solid #e5e7eb; }
  .btn-success { background: var(--green); color: #fff; box-shadow: 0 4px 0 #047857; }
  .btn-success:active { transform: translateY(3px); box-shadow: 0 1px 0 #047857; }
  .chip { background: #fff; border: 1.5px solid #e5e7eb; border-radius: 13px; padding: 8px 13px; font-size: 14px; cursor: pointer; user-select: none; }
  .ob .chips-wrap .chip { font-size: 13px; }
  .chip.on { border-color: var(--amber); background: var(--amber-tint); font-weight: 600; }
  .chips-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
  .chips-wrap.stack { flex-direction: column; }
  .chips-wrap.stack .chip { width: 100%; box-sizing: border-box; text-align: center; }
  /* Family-role onboarding chips: equal-width 2-col grid so long labels (e.g. UA
     «Особистий кухар») don't stretch one flex row out of alignment. */
  .chips-wrap.avatar-roles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .chips-wrap.avatar-roles .chip { display: flex; align-items: center; gap: 6px; line-height: 1.25; min-width: 0; padding: 10px 12px; }
  .chips-wrap.avatar-roles .chip .role-em { flex: 0 0 auto; font-size: 22px; line-height: 1; }
  .chips-wrap.avatar-roles .chip .role-label { flex: 1 1 auto; min-width: 0; font-size: 13px; }
  .banner { margin: 12px 18px; padding: 13px 15px; border-radius: 16px; background: linear-gradient(135deg,#10b981,#059669); color: #fff; font-weight: 700; font-size: 14px; text-align: center; }

  /* AI fill CTA - the big glaring button at the top of an empty menu */
  .ai-fill {
    margin: 4px 16px 12px; padding: 14px 18px; border: none; border-radius: 18px;
    background: var(--amber);
    color: var(--amber-text); font-weight: 800; font-size: 16px; cursor: pointer;
    width: calc(100% - 32px); box-shadow: 0 6px 0 var(--amber-d); text-align: left;
    display: flex; flex-direction: column; gap: 3px;
  }
  .ai-fill small { display: block; font-weight: 400; font-size: 12px; opacity: .9; }
  .ai-fill:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--amber-d); }

  /* menu (D) */
  .menu-ai-tip { margin: 0 16px 10px; padding: 10px 14px; background: var(--amber-tint); color: var(--amber-text); border-radius: 12px; font-size: 12.5px; line-height: 1.5; }
  .menu-confirm-row { margin: 4px 16px 16px; padding: 10px 14px; background: #1f2937; color: #fff; border-radius: 12px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .menu-list { padding: 0 14px; display: flex; flex-direction: column; gap: 8px; }
  .day-block { background: #fff; border: 2px solid #eee; border-radius: 16px; overflow: hidden; }
  .day-block.locked { border-color: var(--green); }
  .day-hd { padding: 6px 12px 4px; font-weight: 800; font-size: 13px; color: #555; background: #fafaf9; border-bottom: 1px solid #f0f0ee; }
  .slot { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid #f7f7f5; min-height: 42px; }
  .slot:last-child { border-bottom: none; }
  .slot.awaiting { background: #fffbeb; }
  .slot-ico { width: 20px; font-size: 14px; }
  .slot-main { flex: 1; }
  .slot-dish { font-size: 13px; font-weight: 600; }
  .slot-dish.empty { color: #bbb; font-weight: 400; }
  .slot-cook { font-size: 11px; color: #999; margin-top: 1px; }
  .slot-edit { background: none; border: none; font-size: 15px; cursor: pointer; color: #cbd5e1; }
  .ai-note-badge { background: none; border: none; font-size: 15px; cursor: pointer; padding: 0 2px; }
  .mini-row { display: flex; gap: 6px; margin-top: 4px; }
  .mini-btn { border: 1.5px solid #e5e7eb; background: #fff; border-radius: 10px; padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer; color: #555; }
  .mini-btn.accept { border-color: var(--green); color: #059669; }
  .mini-btn.reject { border-color: #ef4444; color: #ef4444; }
  .prop { margin: 4px 12px 8px; padding: 8px 10px; background: #fff; border: 1px dashed var(--amber); border-radius: 10px; font-size: 12px; }

  /* spin deck (A) */
  .filter-row { display: flex; gap: 6px; padding: 0 18px 8px; overflow-x: auto; }
  .filter-row .chip { font-size: 12px; padding: 6px 11px; white-space: nowrap; }
  /* filter icon button - width matches the search bar's height via normal flex
     cross-axis stretch (its row sibling, the search input, sets that height). */
  .filter-icon-btn { flex: 0 0 auto; width: 46px; border: 1.5px solid #e5e7eb; background: #fff; border-radius: 12px; cursor: pointer; color: #555; display: flex; align-items: center; justify-content: center; }
  .filter-icon-btn.on { border-color: var(--amber); background: var(--amber-tint); color: var(--amber-text); }
  /* inline SVG "sliders" icon (three lines with a knob on each, staggered) - the
     standard "Filters" glyph used by Airbnb/LinkedIn/Amazon etc. SVG renders
     identically everywhere, unlike an emoji (font-dependent) or a CSS border-triangle
     hack (inconsistent across browsers). Both stroke and fill use currentColor, so
     recoloring the icon on "on" state is just the button's `color` change above. */
  .filter-icon-btn svg { width: 18px; height: 18px; }
  .filter-dropdown { position: relative; display: inline-block; }
  .filter-dropdown-full { display: block; width: 100%; }
  .dropdown-btn { border: 1.5px solid #e5e7eb; background: #fff; border-radius: 13px; padding: 8px 13px; font-size: 14px; cursor: pointer; color: #333; display: flex; align-items: center; gap: 6px; }
  .dropdown-btn.on { border-color: var(--amber); background: var(--amber-tint); font-weight: 600; }
  .dropdown-btn .dd-arrow { font-size: 10px; color: #999; flex: 0 0 auto; }
  .dropdown-btn-full { width: 100%; box-sizing: border-box; justify-content: space-between; }
  .dropdown-btn-full .dropdown-summary { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .dropdown-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 200px; max-height: 260px; overflow-y: auto; background: #fff; border: 1.5px solid #e5e7eb; border-radius: 14px; box-shadow: 0 12px 28px rgba(0,0,0,.14); padding: 6px; }
  .dropdown-menu-full { width: 100%; box-sizing: border-box; min-width: 0; }
  .dropdown-item { padding: 9px 11px; font-size: 14px; border-radius: 9px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dropdown-item:hover { background: #f8fafc; }
  .dropdown-item.on { background: var(--amber-tint); font-weight: 600; }
  .dropdown-item .dd-check { color: var(--amber); opacity: 0; font-size: 13px; }
  /* edge-to-edge single-toggle chip (currently just hide-inactive) */
  .chip-full { flex: 0 0 100%; display: block; width: 100%; box-sizing: border-box; text-align: center; margin-bottom: 7px; }
  .dropdown-item.on .dd-check { opacity: 1; }
  /* search-bar typeahead suggestions - a floating list of matching recipe names under
     the input, so search isn't "type and hope the swipe deck updated somewhere below". */
  .search-suggest { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30; max-height: 240px; overflow-y: auto; background: #fff; border: 1.5px solid #e5e7eb; border-radius: 14px; box-shadow: 0 12px 28px rgba(0,0,0,.14); padding: 6px; }
  .search-suggest-item { padding: 9px 11px; font-size: 14px; border-radius: 9px; cursor: pointer; }
  .search-suggest-item:hover { background: #f8fafc; }
  .search-clear-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border: none; border-radius: 50%; background: #e5e7eb; color: #6b7280; font-size: 12px; line-height: 1; align-items: center; justify-content: center; cursor: pointer; padding: 0; z-index: 5; }
  .search-clear-btn:hover { background: #d1d5db; }
  /* 2026-08-11: was a fixed calc(100vh - 430px) tuned by eye for one device -
     left a growing dead gap between the caption row and the bottom nav on
     taller screens as the surrounding chrome (filter row, quick toggles)
     shrank over time. `.stack` is now a flex item that fills whatever's
     actually left over in #app's flex column (see `.spin-stack-outer`
     below) - no magic constant to re-tune per device/session ever again.
     Only takes effect where an ancestor is display:flex - `.wish-stack`'s
     wrapper (renderWishPicker's plain position:relative div) isn't, so this
     is a no-op there and its own fixed height (below) still wins. */
  .stack { position: relative; flex: 1 1 auto; min-height: 220px; margin: 0 22px; }
  /* margin-bottom mirrors the ~16px gap already above the card (filter-row's
     own 8px bottom padding + the (closed) adv-filter-panel wrapper's 8px
     margin, see renderSpin()) - without it, a max-height card leaves nothing
     but the fixed nav's own reserved padding between the swipe-tip labels
     and the nav pill, which reads as touching/overlapping it. */
  .spin-stack-outer { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; max-height: 440px; margin-bottom: 16px; }
  .wish-stack { height: 300px; margin: 0; }
  .scard { position: absolute; inset: 0; background: #fff; border-radius: 22px; border: 2px solid #eee; overflow: hidden; box-shadow: 0 10px 26px rgba(0,0,0,.08); touch-action: none; user-select: none; }
  .scard .ph { height: 60%; display: flex; align-items: center; justify-content: center; font-size: 82px; position: relative; background-size: cover; background-position: center; background-repeat: no-repeat; }
  .scard .ph small { position: absolute; bottom: 8px; left: 10px; font-size: 9px; color: rgba(255,255,255,.85); background: rgba(0,0,0,.25); padding: 2px 6px; border-radius: 6px; }
  /* Enrich action for Thin Cards - a ✨ "AI can do more with this" affordance,
     floating bottom-left of the photo (replaces the old static "Add
     ingredients" text badge that used to sit here - this button IS the "add
     ingredients" action now, not just a label pointing at one). Shared
     between the Spin card and the detail/about hero (`.dtl-hero`) so the
     action sits in the exact same corner wherever a Thin Card's photo is
     shown - opposite corner from `.qhide` (top-left), so it never collides. */
  .scard .enrich-fab, .dtl-hero .enrich-fab { position: absolute; bottom: 10px; left: 10px; z-index: 3; width: 34px; height: 34px; border: none; border-radius: 50%; background: rgba(217,119,6,.92); color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; box-shadow: 0 2px 8px rgba(0,0,0,.22); }
  /* Icon reflects CURRENT state, not the tap action: open eye = visible (light
     green circle), closed eye = hidden (orange circle) - an inline SVG for both
     (not the 🙈 monkey emoji) so "closed eye" reads as an actual shut eyelid,
     not an unrelated animal. */
  .scard .qhide, .dtl-hero .qhide { position: absolute; top: 12px; left: 12px; z-index: 3; width: 34px; height: 34px; border: none; border-radius: 50%; background: #dcfce7; color: #16a34a; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; box-shadow: 0 2px 8px rgba(0,0,0,.22); }
  .scard .qhide.off, .dtl-hero .qhide.off { background: #ffedd5; color: #c2410c; }
  /* On-demand recipe translation (SPEC_I18N.md §8) - compact translate/languages
     glyph beside the detail title; toggles authored ↔ UI-locale view. */
  .dtl-translate-btn { flex: 0 0 32px; width: 32px; height: 32px; border: none; border-radius: 50%; background: #f3f4f6; color: #4b5563; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; box-shadow: 0 1px 4px rgba(0,0,0,.1); margin-top: 2px; }
  .dtl-translate-btn.on { background: #dbeafe; color: #1d4ed8; }
  .dtl-translate-btn:disabled { opacity: .45; cursor: default; }
  /* Same photo-carousel chrome (nav arrows, dots, pending/approve UI, "add a
     photo" CTA) is reused verbatim on the recipe detail view's hero, via
     photoSlideHtml() - `.dtl-hero` just needs `position:relative` (it already
     has it) for these absolutely-positioned pieces to anchor correctly. */
  .scard .pnav, .dtl-hero .pnav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 34px; height: 34px; border: none; border-radius: 50%; background: rgba(0,0,0,.35); color: #fff; font-size: 20px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; }
  .scard .pnav.prev, .dtl-hero .pnav.prev { left: 10px; }
  .scard .pnav.next, .dtl-hero .pnav.next { right: 10px; }
  .scard .pdots, .dtl-hero .pdots { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 3; display: flex; gap: 5px; }
  .scard .pdots span, .dtl-hero .pdots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.5); }
  .scard .pdots span.on, .dtl-hero .pdots span.on { background: #fff; }
  .scard .photo-pending-badge, .dtl-hero .photo-pending-badge { position: absolute; top: 10px; right: 10px; z-index: 3; background: rgba(217,119,6,.92); color: #fff; font-size: 10.5px; font-weight: 800; padding: 4px 9px; border-radius: 20px; }
  .scard .photo-credit, .dtl-hero .photo-credit { position: absolute; bottom: 10px; left: 10px; z-index: 3; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 12px; max-width: 70%; line-height: 1.3; }
  /* Top-right "remove this photo" X, approved (non-pending) slides only -
     pending slides show .photo-pending-badge in the same corner instead,
     never both at once (see photoSlideHtml). */
  .scard .photo-remove-btn, .dtl-hero .photo-remove-btn { position: absolute; top: 10px; right: 10px; z-index: 3; width: 28px; height: 28px; border: none; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; }
  .scard .photo-approve-row, .dtl-hero .photo-approve-row { position: absolute; bottom: 12px; left: 12px; z-index: 3; display: flex; gap: 8px; }
  .scard .pbtn, .dtl-hero .pbtn { border: none; border-radius: 10px; padding: 7px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
  .scard .pbtn.approve, .dtl-hero .pbtn.approve { background: rgba(5,150,105,.92); color: #fff; }
  .scard .pbtn.decline, .dtl-hero .pbtn.decline { background: rgba(220,38,38,.92); color: #fff; }

  /* fixed line-height (not just font-size) on every tab's icon, so every icon

  .nav button .ic { font-size: 26px; line-height: 30px; }

  /* the Menu bubble - poking up above the bar like a FAB, so the weekly-plan tab

     it's gone). Text stays blue (`--teal-d`) - that's the only thing that marks it

     an explicit width/height/margin - transform is purely visual and never changes
     an element's contribution to the flex layout, so no matter how big or how far
     up this renders, "Menu"'s label stays locked to the exact same line-height box
     (and therefore the exact same distance below its icon) as every other tab.
     No disc/glow behind the glyph at all - a visible circle here was bleeding

     just the bigger icon floating with nothing behind it. */
  .nav button.big .ic {
    position: relative; display: inline-block; font-size: 34px;
    transform: translateY(-14px);
  }
  .nav button.big { color: var(--teal-d); font-weight: 700; }
  /* swipe-discovery "tip bubbles" over the card - tappable, and each does exactly
     what swiping that direction does (left = skip, right = onto the menu), so

     their own at all now - just the icon floating directly on a blurred,

     where the recipe title's text starts, and the right/bottom sides mirror it

  .swipe-tip {
    position: absolute; bottom: 16px; z-index: 20;
    border: none; cursor: pointer; background: none;

  .swipe-tip .tip-label {

  .dtl-hd { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: rgba(250,250,247,.94); backdrop-filter: blur(6px); border-bottom: 1px solid #eee; }
  .dtl-back { background: #fff; border: 1.5px solid #eee; border-radius: 50%; width: 38px; height: 38px; font-size: 17px; cursor: pointer; flex-shrink: 0; }

  /* `contain` (not `cover`) - a photo taken in whatever aspect ratio the

<body>
<div id="app"></div>
<script type="module">
// Pinned to an exact version (not the floating "@2" tag) - esm.sh's "latest 2.x"
// resolution briefly pointed at a build (2.112.1) whose own sub-module paths
// (auth-js/postgrest-js/realtime-js) 404'd straight from their CDN. An unpinned
// import means production is exposed to that recurring at any time, with no
// deploy on our side to explain it. Bump deliberately if a newer version is
// ever needed, not automatically.
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.50.0";
import { initI18n, refreshI18n } from "./i18n-runtime.mjs?v=ab7dd35";

const SUPABASE_URL = "https://jelvmygvviomdlrziskr.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplbHZteWd2dmlvbWRscnppc2tyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzNzE3MzksImV4cCI6MjA4OTk0NzczOX0.oRatIEeI84VrgrGksRWzROMn9JzppP0y0oaIUaSeJWQ";
// detectSessionInUrl handles the magic-link callback: Supabase Auth appends
// #access_token=... to the URL after email confirmation, and this option makes
// supabase-js parse it, persist the session to localStorage, and clean the URL.
const sb = createClient(SUPABASE_URL, SUPABASE_ANON, {
  realtime: { params: { eventsPerSecond: 5 } },
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "implicit" },
});

const LOCALE_EMOJI = { en: "🇬🇧", ru: "🇷🇺", uk: "🇺🇦", nl: "🇳🇱" };
// Product order for every language picker (sign-in, onboarding gate, settings).
const LOCALE_UI_ORDER = ["en", "nl", "uk", "ru"];
function sortUiLocales(rows) {
  return [...rows].sort((a, b) => {
    const ia = LOCALE_UI_ORDER.indexOf(a.code);
    const ib = LOCALE_UI_ORDER.indexOf(b.code);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });
}
let UI_LOCALES = sortUiLocales([
  { code: "en", label_native: "English", emoji: "🇬🇧" },
  { code: "nl", label_native: "Nederlands", emoji: "🇳🇱" },
  { code: "uk", label_native: "Українська", emoji: "🇺🇦" },
  { code: "ru", label_native: "Русский", emoji: "🇷🇺" },
]);

async function loadUiLocales() {
  try {
    const { data, error } = await sb.rpc("spin_food_locales_list", { p_ui_only: true });
    if (error || !Array.isArray(data) || !data.length) return;
    UI_LOCALES = sortUiLocales(data.map((row) => ({
      code: row.code,
      label_native: row.label_native || row.label_en || row.code,
      emoji: LOCALE_EMOJI[row.code] || "🌐",
    })));
  } catch (e) {
    console.warn("[stf-i18n] locales list failed:", e);
  }
}

function localeLangGateHtml() {
  return UI_LOCALES.map((l) =>
    `<button type="button" class="who-btn" onclick="stfPickLang('${l.code}')"><span class="em">${l.emoji}</span><span>${l.label_native}</span></button>`
  ).join("");
}

function localeSignInButtonsHtml() {
  return UI_LOCALES.map((l) =>
    `<button type="button" class="mini-btn" id="signinLang${l.code}" style="margin:2px">${l.emoji} ${l.label_native}</button>`
  ).join("");
}

function localeChipRowHtml(activeCode, dataAttr = "data-ol") {
  return UI_LOCALES.map((l) =>
    `<div class="chip ${activeCode === l.code ? "on" : ""}" ${dataAttr}="${l.code}">${l.emoji} ${l.label_native}</div>`
  ).join("");
}

function applyMembershipLocale() {
  const lc = membership?.locale;
  if (lc && UI_LOCALES.some((l) => l.code === lc)) {
    saveLangChoice(lc, { forOnboard: true });
    refreshI18n();
  }
}

// Safari Private Browsing can block localStorage — keep an in-memory mirror so gates
// (language picker, family key) still advance after a tap.
const stfMem = {};
function stfGet(key) {
  try {
    const v = localStorage.getItem(key);
    if (v != null) { stfMem[key] = v; return v; }
  } catch (e) { console.warn("[stf] storage read blocked:", e.message); }
  return stfMem[key] ?? null;
}
function stfSet(key, val) {
  stfMem[key] = val;
  try { localStorage.setItem(key, val); } catch (e) { console.warn("[stf] storage write blocked:", e.message); }
}
function stfDel(key) {
  delete stfMem[key];
  try { localStorage.removeItem(key); } catch (e) { /* noop */ }
}
function clearFoundingSessionKeys() {
  stfDel("stf_founding_lang");
}

// ── auth + membership ────────────────────────────────────────────
// Every family member signs in via Supabase Auth magic link. After sign-in,
// spin_food_my_membership() returns the caller's food.family_members row. A
// signed-in user with no membership either accepts an invitation (?invite=
// token in the URL) or founds a brand-new household - see
// renderInvitationOnboarding().
let authSession = null;   // Supabase Auth session (null before sign-in)
let membership = null;    // { member_id, family_id, family_name, avatar_role, other_label, display_name, is_owner, is_cook, ... } or null

// Shared by both the "join via invite" and "found a new household" onboarding
// screens - picking a family role is common to both.
const AVATAR_CHOICES = [
  { r: "mom", em: "👩", en: "Mom", ru: "Мама", uk: "Мама", nl: "Mama" },
  { r: "dad", em: "👨", en: "Dad", ru: "Папа", uk: "Тато", nl: "Papa" },
  { r: "grandma", em: "👵", en: "Grandma", ru: "Бабушка", uk: "Бабуся", nl: "Oma" },
  { r: "grandpa", em: "👴", en: "Grandpa", ru: "Дедушка", uk: "Дідусь", nl: "Opa" },
  { r: "kid", em: "👧", en: "Kid", ru: "Ребёнок", uk: "Дитина", nl: "Kind" },
  // Private-chef feature (2026-08-18, docs/DECISION_LOG.md): picked by the
  // invited chef themselves at accept-invitation time, not by the founder -
  // the founder only answers "do you have one" (has_private_chef) and sends
  // the invite; the person who accepts it chooses this role for themselves.
  { r: "chef", em: "🧑‍🍳", en: "Private chef", ru: "Личный повар", uk: "Особистий кухар", nl: "Privé-kok" },
  { r: "other", em: "🙂", en: "Someone else", ru: "Кто-то ещё", uk: "Хтось інший", nl: "Iemand anders" },
];

function avatarRoleChipHtml(c, selRole) {
  return `<div class="chip ${selRole === c.r ? "on" : ""}" data-r="${c.r}">
    <span class="role-em">${c.em}</span>
    <span class="role-label">${avatarRoleLabel(c.r)}</span>
  </div>`;
}

function avatarRoleLabel(role) {
  const c = AVATAR_CHOICES.find((x) => x.r === role);
  if (lang === "nl" && c?.nl) return c.nl;
  return tr(`avatarRole.${role}`);
}

function createFamilyErrorText(rawMsg) {
  const msg = (rawMsg || "").trim();
  if (/already taken/i.test(msg)) return tr('anonymous.that-household-name-is-taken-try-another');
  if (/already belongs/i.test(msg)) return tr('anonymous.this-account-already-has-a-family-reload-the-pag');
  if (/may only contain letters and numbers/i.test(msg)) return tr('createFamilyError.household-letters-numbers-only');
  if (/must be 3-20 characters/i.test(msg)) return tr('createFamilyError.household-length');
  if (/display_name is required/i.test(msg)) return tr('createFamilyError.display-name-required');
  if (/has_private_chef must be/i.test(msg)) return tr('createFamilyError.private-chef-required');
  if (/other_label is required/i.test(msg)) return tr('createFamilyError.other-label-required');
  return tr('anonymous.couldnt-create-the-family-kitchen') + msg;
}

// Household name rules (locked 2026-08-18, see
// supabase/migrations/20260818150000_food_household_name_v1.sql): 3-20
// characters, letters (any script) and digits only, unique across all
// families (case-insensitive). \p{L}/\p{N} are Unicode-aware in JS regex,
// unlike Postgres's locale-dependent [:alpha:] - so this precise charset
// check lives here; the server only re-checks length plus a defensive
// blocklist of whitespace/HTML-special characters.
const HOUSEHOLD_NAME_RE = /^[\p{L}\p{N}]{3,20}$/u;

// When a real membership arrives, override the hardcoded FAMILY slot's display
// name (and is_cook flag if we have it) so the topbar/pill/menu show real names
// instead of "Mom" / "Dad" / "Granny".
function applyMembershipToFamily(memberRow) {
  if (!membership) return;
  const slot = memberRow || FAMILY.find(m => m.id === membership.member_id);

  const nameOf = (ing, idx) => (nameForIng ? nameForIng(ing, idx) : ingredientDisplayName(ing)) || tr("dqIssues.unnamed-ingredient");
  const issues = [];
  for (let idx = 0; idx < (ingredients || []).length; idx++) {

    const unit = ing.unit;
    if (unit != null && String(unit).trim() !== "" && /^\d+$/.test(String(unit).trim())) {
      issues.push(tr("dqIssues.stray-numeric-unit", { name, unit: String(unit).trim() }));
    }
    if (ing.qty == null && !unit && !String(ing.note || "").trim()) {
      issues.push(tr("dqIssues.no-qty-unit-note", { name }));
    }
  }
  const seenNames = {};
  for (let idx = 0; idx < (ingredients || []).length; idx++) {
    const key = (nameOf(ingredients[idx], idx) || "").trim().toLowerCase();
    if (key) seenNames[key] = (seenNames[key] || 0) + 1;
  }
  for (const [nameKey, count] of Object.entries(seenNames)) {

  // Sprint 4 multi-dish UI lands. The `game.mealIds` parallel map remembers

  const mealIds = { 0:{}, 1:{}, 2:{}, 3:{}, 4:{}, 5:{}, 6:{} };

  for (const m of (snap.meals || [])) {

    dish: w.recipe_id,
    by: w.wished_by_member_id,

      dish: p.recipe_id,

    duel,

async function ensureActivePlan() {
  // Weekly-cycle refactor (2026-08-18): active_plan_id has been retired
  // server-side. spin_food_snapshot's JIT hook (food.fire_pending_milestones)
  // already ensures the current + next week plans exist before returning,
  // so we no longer have to conditionally create anything - the "current
  // plan" is always the plan matching snap.current_week_start_date, which
  // is snap.plan.id in the new shape. The legacy client keeps operating on
  // ONE plan at a time (the current-week plan); the next-week plan is
  // ignored here until Sprint 4 lands the two-mode Menu tab.
  let { data: snap, error } = await sb.rpc("spin_food_snapshot");
  if (error) throw error;
  const currentPlanId = snap?.plan?.id;
  if (!currentPlanId) {
    // Defensive: JIT hook should have created this. If it didn't, fall back
    // to explicit create_plan for the current-week Monday.
    const weekStart = snap?.current_week_start_date || nextMondayIso();
    const { data: created, error: ce } = await sb.rpc("spin_food_create_plan", {
      p_week_start_date: weekStart,
      p_set_active: true,
    });
    if (ce) throw ce;
    activePlanId = created?.plan_id;
    if (!activePlanId) throw new Error("create_plan returned no plan_id");
    ({ data: snap } = await sb.rpc("spin_food_snapshot"));
  } else {
    activePlanId = currentPlanId;
  }
  return snap;
}

function newAdvFilters() {
  return {
    meal: new Set(), proteins: new Set(), cuisines: new Set(), diets: new Set(),
    time: new Set(), diff: new Set(), hideInactive: false,
    soupOnly: false, grillOnly: false, vegOnly: false,
  };
}
// Every Set-backed group here is OR-within-group ("breakfast or lunch"), AND-across-
// groups (protein AND cuisine AND ...) - the one deliberate exception is `diets`,
// where AND-within-group is correct because diet_compatible_with really does mean
// "suitable for all of these at once" (vegan AND gluten-free), not either/or.
function matchesAdvFilters(d, f) {
  if (f.meal.size && !d.meals.some(m => f.meal.has(m))) return false;
  if (f.proteins.size && !dishProteinGroups(d).some(g => f.proteins.has(g))) return false;
  if (f.cuisines.size && !f.cuisines.has(d.c)) return false;
  if (f.time.size && !f.time.has(timeBucket(d))) return false;
  if (f.diff.size && !f.diff.has(diffKey(d))) return false;
  if (f.diets.size && ![...f.diets].every(k => d.diet_compatible_with.includes(k))) return false;
  if (f.hideInactive && !d.is_active) return false;
  if (f.soupOnly && !d.soup) return false;
  if (f.grillOnly && !dishIsGrilled(d)) return false;
  if (f.vegOnly && !dishIsVeg(d)) return false;
  return true;
}
// Filter icon button - a CSS-drawn funnel (no reliable universally-rendered funnel
// emoji exists across platforms/fonts, so it's drawn from a triangle + a stem rather
// than left to font support), sized to match the search bar's own height by ordinary
// flex-row cross-axis stretch (no explicit height rule needed).
function filterIconButtonHtml(idPrefix, open) {
  const svg = `<svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="3" y1="5" x2="17" y2="5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12.5" cy="5" r="2.2" fill="currentColor"/>
    <line x1="3" y1="10" x2="17" y2="10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="7" cy="10" r="2.2" fill="currentColor"/>
    <line x1="3" y1="15" x2="17" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="13.5" cy="15" r="2.2" fill="currentColor"/>
  </svg>`;
  return `<button class="filter-icon-btn${open?" on":""}" id="${idPrefix}Toggle" aria-label="${tr('filterIconButtonHtml.filters')}">${svg}</button>`;
}
// Every multi-select filter group (Meal, Protein, Cuisine, Time, Difficulty, Dietary
// needs) renders through this single component: a section title, then a full-width
// ("edge to edge", each starting its own line) dropdown button summarizing the
// current pick, opening a floating checklist with a leading short "Any" item (not
// "Any meal"/"Any time" - just "Any") that clears the whole group in one tap. Every
// group here is OR-within-group, so multiple non-"Any" picks combine together.
function dropdownGroupHtml(idPrefix, id, sectionKey, items, setKey, f) {
  const sel = items.filter(([k]) => f[setKey].has(k));
  const summary = sel.length ? sel.map(([,l]) => l).join(", ") : tr('dropdownGroupHtml.any');
  const any = `<div class="dropdown-item ${f[setKey].size?"":"on"}" data-k="__any__"><span>${tr('dropdownGroupHtml.any')}</span><span class="dd-check">✓</span></div>`;
  const rows = items.map(([k,label]) =>
    `<div class="dropdown-item ${f[setKey].has(k)?"on":""}" data-k="${k}"><span>${label}</span><span class="dd-check">✓</span></div>`).join("");
  return `
    <div class="sect">${tr(sectionKey)}</div>
    <div class="filter-dropdown filter-dropdown-full" id="${idPrefix}${id}">
      <button type="button" class="dropdown-btn dropdown-btn-full${f[setKey].size?" on":""}" id="${idPrefix}${id}Btn"><span class="dropdown-summary">${summary}</span><span class="dd-arrow">▾</span></button>
      <div class="dropdown-menu dropdown-menu-full" id="${idPrefix}${id}Menu" style="display:none">${any}${rows}</div>
    </div>`;
}
function wireDropdownGroup(root, idPrefix, id, setKey, f, items, onChange) {
  const wrap = root.querySelector("#"+idPrefix+id);
  const btn = wrap.querySelector("#"+idPrefix+id+"Btn");
  const summaryEl = btn.querySelector(".dropdown-summary");
  const menu = wrap.querySelector("#"+idPrefix+id+"Menu");
  const updateBtn = () => {
    const sel = items.filter(([k]) => f[setKey].has(k));
    summaryEl.textContent = sel.length ? sel.map(([,l]) => l).join(", ") : tr('updateBtn.any');
    btn.classList.toggle("on", f[setKey].size > 0);
  };
  btn.onclick = e => {
    e.stopPropagation();
    const willOpen = menu.style.display === "none";
    root.querySelectorAll(".dropdown-menu").forEach(m => m.style.display = "none");
    menu.style.display = willOpen ? "block" : "none";
  };
  menu.querySelectorAll(".dropdown-item").forEach(item => item.onclick = e => {
    e.stopPropagation();
    const k = item.dataset.k;
    if (k === "__any__") f[setKey].clear();
    else { f[setKey].has(k) ? f[setKey].delete(k) : f[setKey].add(k); }
    menu.querySelectorAll(".dropdown-item").forEach(x =>
      x.classList.toggle("on", x.dataset.k === "__any__" ? f[setKey].size === 0 : f[setKey].has(x.dataset.k)));
    updateBtn();
    onChange();
  });
  // Single document-level slot (overwritten, not accumulated, each re-render) so any
  // open dropdown or search-suggestions box on the page closes when the user taps
  // elsewhere. Shared with wireSearchSuggest() below - whichever wires last wins, but
  // both close the exact same two selectors, so it doesn't matter which one "wins".
  document.onclick = () => closeFloatingPanels(root);
}
function closeFloatingPanels(root) {
  root.querySelectorAll(".dropdown-menu").forEach(m => m.style.display = "none");
  root.querySelectorAll(".search-suggest").forEach(m => { m.style.display = "none"; m.innerHTML = ""; });
}
// Renders the collapsible filter panel. Library (hide-inactive) leads, edge-to-edge,
// since it's the one toggle that silently changes what's even in the candidate pool;
// then meal type, protein, cuisine, time, difficulty, then dietary needs. idPrefix
// keeps ids unique per surface.
function advFilterPanelHtml(idPrefix, f, open) {
  const { mealItems, proteinItems, cuisineItems, timeItems, diffItems, dietItems } = advFilterItems();
  return `
    <div id="${idPrefix}Panel" style="display:${open ? "block" : "none"}">
      <div class="chip chip-full ${f.hideInactive?"on":""}" id="${idPrefix}ActiveOnly">${f.hideInactive ? "🙈 " + tr('advFilterPanelHtml.hide-inactive-recipes') : "👁 " + tr('advFilterPanelHtml.showing-inactive-recipes-too')}</div>
      ${dropdownGroupHtml(idPrefix, "Meal", "filterSection.meal", mealItems, "meal", f)}
      ${dropdownGroupHtml(idPrefix, "Protein", "filterSection.protein", proteinItems, "proteins", f)}
      ${dropdownGroupHtml(idPrefix, "Cuisine", "filterSection.cuisine", cuisineItems, "cuisines", f)}
      ${dropdownGroupHtml(idPrefix, "Time", "filterSection.time", timeItems, "time", f)}
      ${dropdownGroupHtml(idPrefix, "Diff", "filterSection.difficulty", diffItems, "diff", f)}
      ${dropdownGroupHtml(idPrefix, "Diet", "filterSection.diet", dietItems, "diets", f)}
    </div>`;
}
// Wires the filter icon button built by filterIconButtonHtml. `panelState` is
// {open:bool}, mutated here so the open/closed state survives a full re-render.
function wireFilterToggle(root, idPrefix, panelState) {
  const toggle = root.querySelector("#"+idPrefix+"Toggle");
  const panel = root.querySelector("#"+idPrefix+"Panel");
  toggle.onclick = () => {
    panelState.open = !panelState.open;
    panel.style.display = panelState.open ? "block" : "none";
    toggle.classList.toggle("on", panelState.open);
  };
}
// A floating box under a search input, "id"Suggest, listing recipe-name matches as the
// user types - typing alone previously only silently re-filtered whatever's rendered
// below (the Spin swipe deck), giving no feedback that search was doing anything until
// you swiped. `getMatches(query)` returns dishes to list (already filter-scoped by the
// caller); `onPick(dish)` runs when a suggestion is tapped, then the box closes itself.
function searchSuggestHtml(idPrefix) {
  return `<div class="search-suggest" id="${idPrefix}Suggest" style="display:none"></div>`;
}
// A small "✕" clear button overlaid on the right edge of a search input, shown only
// once there's text to clear. `getValue`/`onClear` decouple this from any one screen's
// search-state variable (deckSearch, dishSearch, ...).
function searchClearBtnHtml(searchId) {
  return `<button type="button" class="search-clear-btn" id="${searchId}Clear" aria-label="${tr('searchClearBtnHtml.clear-search')}" style="display:none">✕</button>`;
}
function wireSearchClear(root, searchId, getValue, onClear) {
  const input = root.querySelector("#"+searchId);
  const btn = root.querySelector("#"+searchId+"Clear");
  if (!input || !btn) return;
  const sync = () => { btn.style.display = getValue().length ? "flex" : "none"; };
  sync();
  input.addEventListener("input", sync);
  btn.onclick = e => {
    e.stopPropagation();
    input.value = "";
    onClear();
    sync();
    input.focus();
  };
}
function wireSearchSuggest(root, searchId, idPrefix, getMatches, onPick) {
  const input = root.querySelector("#"+searchId);
  const box = root.querySelector("#"+idPrefix+"Suggest");
  if (!input || !box) return;
  const update = () => {
    const q = input.value.trim();
    const matches = q ? getMatches(q).slice(0, 6) : [];
    if (!matches.length) { box.style.display = "none"; box.innerHTML = ""; return; }
    // No leading emoji here (2026-08-09) - d.em is only ever a generic
    // picture-frame/plate placeholder (recipeToDish(): "🖼" if there's a
    // photo, "🍽" otherwise, never anything dish-specific), which read as a
    // stray broken-image icon in a plain text list rather than useful info.
    box.innerHTML = matches.map(d =>
      `<div class="search-suggest-item" data-i="${d.id}">${dName(d)}</div>`).join("");
    box.style.display = "block";
    box.querySelectorAll(".search-suggest-item").forEach(item => item.onclick = e => {
      e.stopPropagation();
      onPick(item.dataset.i);
      box.style.display = "none";
      box.innerHTML = "";
    });
  };
  input.addEventListener("input", update);
  input.addEventListener("focus", update);
  document.onclick = () => closeFloatingPanels(root);
}
// Wires every control inside the panel built by advFilterPanelHtml. onChange runs after any edit.
// `items` passed to each dropdown must match what advFilterPanelHtml built its summary text from.
function wireAdvFilterPanel(root, idPrefix, f, onChange) {
  const { mealItems, proteinItems, cuisineItems, timeItems, diffItems, dietItems } = advFilterItems();
  wireDropdownGroup(root, idPrefix, "Meal", "meal", f, mealItems, onChange);
  wireDropdownGroup(root, idPrefix, "Protein", "proteins", f, proteinItems, onChange);
  wireDropdownGroup(root, idPrefix, "Cuisine", "cuisines", f, cuisineItems, onChange);
  wireDropdownGroup(root, idPrefix, "Time", "time", f, timeItems, onChange);
  wireDropdownGroup(root, idPrefix, "Diff", "diff", f, diffItems, onChange);
  wireDropdownGroup(root, idPrefix, "Diet", "diets", f, dietItems, onChange);
  const activeOnly = root.querySelector("#"+idPrefix+"ActiveOnly");
  activeOnly.onclick = () => {
    f.hideInactive = !f.hideInactive;
    activeOnly.classList.toggle("on", f.hideInactive);
    // Unlike the other chips here, this one's label text (not just its "on" state)
    // changes with the toggle, so update it explicitly rather than relying on onChange
    // to re-render the panel.
    activeOnly.innerHTML = f.hideInactive
      ? "🙈 " + tr('anonymous.hide-inactive-recipes')
      : "👁 " + tr('anonymous.showing-inactive-recipes-too');
    onChange();
  };
}

// ── shared state ──
let game = null;      // { week, wishes, duel, activity, locked }
let me = localStorage.getItem("stf_me") || null;
let tab = "menu";
let modalOpen = false;
let pendingRemote = null;
let online = new Set();

function emptyWeek() { return DAYS.map(() => ({ breakfast: null, lunch: null, dinner: null })); }
function seedGame() {
  return {
    week: emptyWeek(),
    // Meal-grain refactor (2026-08-18): mealIds is the parallel meal_id +
    // primary dish_id lookup for event routing. Empty in seedGame (offline
    // demo state); populated by snapshotToGame once we have a real snapshot.
    mealIds: { 0:{}, 1:{}, 2:{}, 3:{}, 4:{}, 5:{}, 6:{} },
    locked: false, wishes: [], profiles: {}, dayRules: [],
    duel: { open: true, proposals: [
      { dish: "borscht", chef: "gran", pitch: "Real borscht takes love. And I have beets.", votes: ["mom"] },
      { dish: "ramen",   chef: "dad",  pitch: "Friday deserves broth that took 6 hours.", votes: [] },
      { dish: "plov",    chef: "mom",  pitch: "Plov. One pot. Nothing to wash. Think about it.", votes: [] },
    ]},
    activity: [{ id: rid(), who: "ai", text: "Family kitchen opened — empty week", ts: Date.now() }],
  };
}

// AI populate. Empty slots get accepted:false so the assigned cook must accept.
// A slot that currently holds AI's own earlier suggestion (viaAi) is fair game
// for AI to silently refresh - re-running "Generate with AI" over its own guess
// isn't a meaningful edit for anyone to review (user report, 2026-08-08: having
// to accept/reject a pile of proposals just to re-roll AI's own picks was pure
// friction). Only a slot a human deliberately chose (viaAi false - whether that
// human is the one clicking regenerate or someone else) becomes a proposal the
// family must approve, matching the existing swap flow. Mutates game.week for
// the instant render, and returns the food.events this needs to become durable -
// the caller must apply every one of them, or the fill is a local-only illusion
// that reverts on the next sync/reload/other-device view.
function aiPopulateWeek() {
  const cookIds = FAMILY.filter(m => m.cook).map(m => m.id);
  const cooks = cookIds.length ? cookIds : FAMILY.map(m => m.id);
  const events = [];
  if (!cooks.length) return { overwrittenCount: 0, events };
  // Session B: slot_filled is now grant-aware server-side (assert_recipe_accessible_to_family),
  // so platform/chef-granted recipes are safe to plan directly - no fork, no filter needed.
  const plannable = DISHES;
  const bf = plannable.filter(d => d.meals.includes("breakfast"));
  const soups = plannable.filter(d => d.soup);
  const mains = plannable.filter(d => d.meals.includes("dinner"));
  let si = 0;
  const overwritten = [];
  const fillOrPropose = (day, mealKey, dishId, cook, isLeftover = false) => {
    const cur = game.week[day][mealKey];
    if (cur && cur.dish && !cur.viaAi) {
      game.week[day][mealKey].proposal = { dish: dishId, cook, by: me, viaAi: true };
      overwritten.push(1);
      events.push(["dish_proposal_created", slotPayload(day, mealKey, { proposal: { recipe_id: dishId, cook_member_id: cook, assigned_by_member_id: me, assigned_via: "ai" } })]);
    } else {
      game.week[day][mealKey] = { dish: dishId, cook, by: me, viaAi: true, accepted: false, leftover: isLeftover };
      events.push(["dish_assigned", slotPayload(day, mealKey, { recipe_id: dishId, cook_member_id: cook, assigned_by_member_id: me, assigned_via: "ai", is_leftover: isLeftover })]);
    }
  };
  for (let i = 0; i < 7; i++) {
    // breakfast (skip weekends)
    if (i < 5 && bf.length) fillOrPropose(i, "breakfast", bf[i % bf.length].id, cooks[i % cooks.length]);
    // lunch (soup, day-2 leftover)
    if ((!game.week[i].lunch || !game.week[i].lunch?.leftover) && soups.length) {
      const s = soups[si++ % soups.length], ck = cooks[(i + 1) % cooks.length];
      fillOrPropose(i, "lunch", s.id, ck);
      if (i + 1 < 7 && !game.week[i + 1].lunch) fillOrPropose(i + 1, "lunch", s.id, ck, true);
    }
    // dinner (skip Sat)
    if (i !== 5 && mains.length) fillOrPropose(i, "dinner", mains[i % mains.length].id, cooks[(i + 2) % cooks.length]);
  }
  return { overwrittenCount: overwritten.length, events };
}
function rid() { return Math.random().toString(36).slice(2, 9); }

let lastSeenTs = 0;

async function load() {
  loadError = null;
  try {
    await withTimeout((async () => {
      await Promise.all([loadCatalog(), loadUnits(), loadFilterVocabulary(), loadFamilyFeed()]);
      const snap = await ensureActivePlan();
      game = snapshotToGame(snap);
      if (!game.profiles) game.profiles = {};
      if (me) {
        const cached = restoreProfile(me);
        if (cached) game.profiles[me] = cached;
      }
      if (!game.activity.length) {
        game.activity = [{ id: rid(), who: me, text: tr('anonymous.family-kitchen-opened-plan-next-week'), ts: Date.now() }];
      }
    })(), 25000, "Kitchen load");
  } catch (e) {
    console.error("[stf-data] load failed:", e);
    loadError = e?.message || String(e);
    if (!game) game = seedGame();
    if (me) {
      const cached = restoreProfile(me);
      if (cached) game.profiles[me] = cached;
    }
  }
}

async function kickLoad() {
  if (loadInFlight) return;
  loadInFlight = true;
  try {
    await load();
  } finally {
    loadInFlight = false;
    render();
  }
}

// Apply a fresher remote state. Deferred while a modal is open, mid-registration, or the
// user has a text field focused (typing a search query shouldn't get its input element
// yanked out from under it by a full re-render triggered by someone else's edit) so it
// never disrupts what the user is filling in.
function shouldDefer() {
  if (modalOpen) return true;
  // 2026-08-11: the recipe detail view isn't tracked in modalOpen (it's a
  // separate full-screen overlay, not a modal()), so a background sync tick
  // while it's open used to be let through unchecked. render() itself never
  // touches #detailOverlay, but there's no upside to letting remote state
  // land mid-interaction (e.g. while a photo upload or edit is in flight) -
  // treat an open detail view the same as a modal.
  if (detailOpen) return true;
  if (me && game && !game.profiles[me] && ob && ob.step > 0) return true;
  const ae = document.activeElement;
  if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) return true;
  return false;
}
// Companion to shouldDefer()'s text-field check: once the user leaves that field,
// apply whatever remote update was held back while they were typing.
document.addEventListener("focusout", e => {
  if (!pendingRemote) return;
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) {
    pendingRemote = false;
    render();
  }
});
function applyRemote(state, ts) {
  if (!state || !state.week) return;
  if (ts && ts <= lastSeenTs) return;   // ignore stale / our own echo
  lastSeenTs = ts || lastSeenTs;
  game = state; if (!game.profiles) game.profiles = {};
  if (shouldDefer()) { pendingRemote = true; return; }
  render();
}

// Belt-and-braces sync: realtime is the fast path, but mobile browsers silently
// kill the websocket when backgrounded. A refetch on focus + a light poll while
// visible guarantee everyone converges even if the socket dropped.
function applyRemoteFromSnapshot(snap) {
  if (!snap) return;
  game = snapshotToGame(snap);
  if (!game.profiles) game.profiles = {};
  if (shouldDefer()) { pendingRemote = true; return; }
  render();
}

// True if the snapshot names a recipe id our local DISHES cache has never
// heard of - e.g. someone else's device just forked a recipe (T6 "make it
// mine" edit) or finished a fresh YouTube import, and the fork/import landed
// in food.meal_slots/wishes/duel_proposals before our periodic poll's
// loadCatalog() caught up. Left unresolved, dishOr()'s UNKNOWN_DISH fallback
// renders a generic "a recipe"/"рецепт" placeholder in the menu forever
// instead of the real title, until something else happens to trigger a
// catalog refresh (2026-08-16, Kobzar smoke test: forked Tiramisu showed as
// a bare "рецепт" placeholder in the Friday dinner proposal).
function snapshotHasUnknownDish(snap) {
  const known = new Set(DISHES.map(d => d.id));
  // Meal-grain refactor (2026-08-18): walk meals[].dishes[] instead of slots.
  // Also scan next_meals so a recipe planned into next week (Sprint 4 preview)
  // still triggers a catalog refresh.
  const scanMeals = (meals) => {
    for (const m of (meals || [])) {
      for (const d of (m.dishes || [])) {
        if (d.recipe_id && !known.has(d.recipe_id)) return true;
        if (d.proposal?.recipe_id && !known.has(d.proposal.recipe_id)) return true;
      }
    }
    return false;
  };
  if (scanMeals(snap.meals)) return true;
  if (scanMeals(snap.next_meals)) return true;
  for (const w of (snap.wishes || [])) {
    if (w.recipe_id && !known.has(w.recipe_id)) return true;
  }
  for (const p of (snap.duel?.proposals || [])) {
    if (p.recipe_id && !known.has(p.recipe_id)) return true;
  }
  return false;
}

async function pullLatest() {
  const { data: snap, error } = await sb.rpc("spin_food_snapshot");
  if (!error && snap) {
    clearOfflineBanner();
    if (snapshotHasUnknownDish(snap)) await loadCatalog();
    applyRemoteFromSnapshot(snap);
  } else if (error && !navigator.onLine) {
    showOfflineBanner();
  }
}

}
window.addEventListener("online", clearOfflineBanner);

// Session B (T6 auto-fork): recipe_edit_proposed / recipe_photo_added /
// recipe_photo_removed can trigger a server-side auto-fork of a
// platform/chef-granted recipe into the family's own cookbook (the "make
// it mine" moment - see 20260816090000 migration). When that happens,
// food.apply_event echoes _forked_from_recipe_id/_forked_recipe_id back
// on the event payload. Stashed here rather than threaded through every
// applyEvent() call site's return value (13 call sites, most of which
// never care) - the handful of call sites that DO care read this right
// after their own applyEvent() call, before any other await can race it.
let lastForkInfo = null;
// 2026-08-16: several Kobzar smoke-test reports this session ("planned slots
// disappeared", "friday dinner still shows the wrong recipe") turned out to
// share one shape - the mutation left literally zero trace anywhere: no
// food.events row, no toast, nothing in food.client_diagnostics (that logger
// only ever covered photo uploads, a near-identical 2026-08-10 incident).
// Every server-side repro of the exact same RPC call succeeded in under a
// second, so this is a client/network-layer failure the server can never
// see on its own. Two changes close that gap: (1) withTimeout() so a
// promise that never settles can't leave an action in permanent silent
// limbo, always resolving to a definite success/failure within 20s; (2) a
// diagnostic breadcrumb on every attempt/outcome, so the *next* occurrence
// leaves a paper trail in food.client_diagnostics instead of requiring
// hours of DB archaeology to even confirm nothing happened.
async function applyEvent(eventType, payload) {
  logClientDiagnostic("apply_event_start", { event_type: eventType });
  let data, error;
  try {
    ({ data, error } = await withTimeout(
      sb.rpc("spin_food_apply_event", { p_event_type: eventType, p_payload: payload }),
      20000,
      "Sync"
    ));
  } catch (e) {
    logClientDiagnostic("apply_event_exception", { event_type: eventType, message: e?.message || String(e) });
    if (!navigator.onLine) {
      showOfflineBanner();
    } else {
      toast(tr('applyEvent.sync-error') + (e?.message || String(e)));
    }
    lastForkInfo = null;
    return false;
  }
  if (error) {
    logClientDiagnostic("apply_event_error", { event_type: eventType, message: error?.message || String(error) });
    // navigator.onLine is the only case that actually means "offline" - any
    // other RPC failure (validation, permissions, a real server error) is a
    // distinct problem and showing the same "you're offline" banner for it is
    // actively misleading. That banner also used to never get cleared, so a
    // single blip left it stuck on screen (and stacking duplicates) for the
    // rest of the session regardless of cause (user report, 2026-08-08).
    if (!navigator.onLine) {
      showOfflineBanner();
    } else {
      toast(tr('applyEvent.sync-error') + error.message);
    }
    lastForkInfo = null;
    return false;
  }
  clearOfflineBanner();
  logClientDiagnostic("apply_event_ok", { event_type: eventType, seq: data?.seq ?? null });
  const forkedId = data?.payload?._forked_recipe_id;
  lastForkInfo = forkedId ? { from: data.payload._forked_from_recipe_id, to: forkedId } : null;
  return true;
}

let saving = false;
async function persist() { /* legacy no-op; game state lives in food.* */ }

async function commitAndSync(text, eventType, payload) {
  if (text) act(text);
  render();
  // 2026-08-18 fix: this used to also gate on `!activePlanId`, silently
  // dropping every non-plan-scoped event (member_profile_updated,
  // recipe_added/edited, wish/duel events not tied to a slot) whenever
  // load()/ensureActivePlan() hadn't set activePlanId yet - e.g. every fresh
  // onboarding, since the wizard's own commitAndSync call is the very first
  // one after signup. No RPC ever fired, no toast, no client_diagnostics
  // breadcrumb (that logger lives inside applyEvent, never reached). The
  // wizard rendered success locally (game.profiles[me] set before this
  // call), so a user could "complete" onboarding every single reload and
  // never actually persist anything server-side. Plan-scoped events already
  // carry their own plan_id inside the payload via slotPayload() - the
  // server validates that independently, so this client-side gate was
  // redundant for them and actively harmful for everything else.
  if (!eventType) return;
  saving = true;
  const ok = await applyEvent(eventType, payload);
  saving = false;
  if (ok) await pullLatest();
  return ok;
}
function act(text) { game.activity.unshift({ id: rid(), who: me, text, ts: Date.now() }); game.activity = game.activity.slice(0, 30); }

let rtChan;
function subscribe() {
  if (!membership?.family_id) return;
  if (rtChan) sb.removeChannel(rtChan);
  rtChan = sb.channel("food-events-" + membership.family_id)
    .on("postgres_changes", {
      event: "INSERT",
      schema: "food",
      table: "events",
      filter: "family_id=eq." + membership.family_id,
    }, () => { pullLatest(); loadFamilyFeed(); })
    // Import job status nudge - a toast on top of the Family-tab feed entry
    // (added by loadFamilyFeed(), not the only place a result lives).
    // INSERT: dedup-at-extract inserts status=ready + result_recipe_id with no
    // draft (never queued for the worker) - was silent before 2026-08-16.
    .on("postgres_changes", {
      event: "INSERT",
      schema: "food",
      table: "recipe_import_jobs",
      filter: "family_id=eq." + membership.family_id,
    }, (payload) => {
      loadFamilyFeed();
      const job = payload.new;
      if (job.source_type === "youtube" && job.status === "ready" && job.result_recipe_id && !job.draft) {
        notifyDuplicateYoutubeImport(job.result_recipe_id);
      }
    })
    .on("postgres_changes", {
      event: "UPDATE",
      schema: "food",
      table: "recipe_import_jobs",
      filter: "family_id=eq." + membership.family_id,
    }, (payload) => {
      loadFamilyFeed();
      const job = payload.new;
      if (job.source_type === "youtube" && job.status === "ready") {
        if (job.result_recipe_id && !job.draft) {
          notifyDuplicateYoutubeImport(job.result_recipe_id);
        } else {
          stickyToast(tr('anonymous.your-youtube-recipe-is-ready-to-review-check-the'));
        }
      } else if (job.source_type === "youtube" && job.status === "failed") {
        stickyToast(tr('anonymous.couldnt-extract-a-recipe-from-that-video'));
      }
    })
    .subscribe();
}

function startSyncWatchers() {
  const wake = () => { if (!document.hidden) { pullLatest(); if (rtChan && rtChan.state !== "joined") subscribe(); } };
  document.addEventListener("visibilitychange", wake);
  window.addEventListener("focus", wake);
  window.addEventListener("online", wake);
  setInterval(() => { if (!document.hidden) pullLatest(); }, 4000);
}
let presenceChan;
function joinPresence() {
  // Keyed by family_id (a real UUID, always unique) rather than any
  // user-typed string - see docs/DECISION_LOG.md 2026-08-18 (retired the old
  // FAMILY_KEY/"kobzar-demo" default, which every un-invited new signup
  // silently shared, cross-contaminating presence between families).
  if (!membership?.family_id || !me) return;
  presenceChan = sb.channel("presence-" + membership.family_id, { config: { presence: { key: me } } });
  presenceChan.on("presence", { event: "sync" }, () => {
    online = new Set(Object.values(presenceChan.presenceState()).flat().map(p => p.who));
    if (!modalOpen) render();
  }).subscribe(async s => { if (s === "SUBSCRIBED") await presenceChan.track({ who: me }); });
}

function assignToSlot(day, mealKey, dishId, cook) {
  const cur = game.week[day][mealKey];
  const d = dishOr(dishId);
  // Session B: slot_filled's server-side assert is now grant-aware
  // (assert_recipe_accessible_to_family), so platform/chef-granted
  // recipes can be planned directly - no client-side guard needed.
  if (cur && cur.dish) {
    game.week[day][mealKey].proposal = { dish: dishId, cook, by: me };
    commitAndSync(
      `${mem(me).en} proposed ${d.em} ${d.en} for ${DAYS[day]} ${MEALS.find(m=>m.k===mealKey).n.toLowerCase()}`,
      "dish_proposal_created",
      slotPayload(day, mealKey, { proposal: { recipe_id: dishId, cook_member_id: cook, assigned_by_member_id: me } })
    );
    toast(tr('assignToSlot.sent-to-the-menu-family-votes'));
  } else {
    game.week[day][mealKey] = { dish: dishId, cook, by: me, accepted: cook === me };
    const who = cook === me ? "" : ` - ${mem(cook).en} must accept`;
    commitAndSync(
      `${mem(me).en} added ${d.em} ${d.en} to ${DAYS[day]}${who}`,
      "dish_assigned",
      slotPayload(day, mealKey, { recipe_id: dishId, cook_member_id: cook, assigned_by_member_id: me })
    );
    toast(cook === me ? tr('assignToSlot.added-and-youre-cooking-it') : tr('assignToSlot.added') + mName(mem(cook)) + tr('assignToSlot.pinged-to-accept'));
  }
}
function acceptCook(day, mealKey) {
  game.week[day][mealKey].accepted = true;
  commitAndSync(`${mem(me).en} accepted cooking ${dishOr(game.week[day][mealKey].dish).em} on ${DAYS[day]}`, "dish_cook_accepted", slotPayload(day, mealKey));
}
function declineCook(day, mealKey) {
  const d = dishOr(game.week[day][mealKey].dish);
  game.week[day][mealKey] = null;
  commitAndSync(`${mem(me).en} declined to cook ${d.em} ${d.en} on ${DAYS[day]}`, "dish_cook_declined", slotPayload(day, mealKey));
  toast(tr('declineCook.declined-the-meal-was-removed'));
}
function reassignCook(day, mealKey, newCook) {
  const s = game.week[day][mealKey];
  s.cook = newCook; s.accepted = false; s.by = me; s.viaAi = false;
  commitAndSync(
    `${mem(me).en} reassigned ${dishOr(s.dish).em} on ${DAYS[day]} to ${mem(newCook).en}`,
    "dish_cook_reassigned",
    slotPayload(day, mealKey, { cook_member_id: newCook, assigned_by_member_id: me })
  );
  toast(tr('reassignCook.sent') + mName(mem(newCook)) + tr('reassignCook.must-accept-decline-or-reassign'));
}
function acceptProposal(day, mealKey) {
  const s = game.week[day][mealKey]; const p = s.proposal;
  game.week[day][mealKey] = { dish: p.dish, cook: p.cook, by: p.by, viaAi: !!p.viaAi, accepted: p.cook === p.by };
  commitAndSync(`${mem(me).en} accepted the swap to ${dishOr(p.dish).em} on ${DAYS[day]}`, "dish_proposal_accepted", slotPayload(day, mealKey));
}
function rejectProposal(day, mealKey) {
  const s = game.week[day][mealKey]; const p = s.proposal; delete s.proposal;
  commitAndSync(`${mem(me).en} rejected the ${dishOr(p.dish).em} swap for ${DAYS[day]}`, "dish_proposal_rejected", slotPayload(day, mealKey));
}
function clearSlot(day, mealKey) {
  game.week[day][mealKey] = null;
  commitAndSync(`${mem(me).en} cleared ${DAYS[day]} ${MEALS.find(m=>m.k===mealKey).n.toLowerCase()}`, "dish_cleared", slotPayload(day, mealKey));
}

// ── render ──
const app = document.getElementById("app");
function render() {
  syncLangFromStorage();

  // 1. Language first (device-level, before sign-in).
  if (needsDeviceLangGate()) return renderLangGate();

  // 2. Auth gate.
  if (!authSession) return renderSignInGate();

  // 2.5. Timezone, right after auth succeeds (user feedback, 2026-08-18 - a
  // pre-auth placement can't reliably survive the magic-link round trip if
  // the link opens in a different browser/webview than the one that picked
  // the timezone; moved here instead of buried deep in the owner-only
  // wizard). Cached on-device only; applied server-side at family creation.
  if (needsDeviceTzGate()) return renderTzGate();

  // 3. Invitation / membership onboarding.
  if (!membership) return renderInvitationOnboarding();

  if (!me && membership) me = membership.member_id;

  if (!game) {
    if (authSession && membership) {
      if (loadError) {
        app.innerHTML = `<div class="gate"><h1>🍲</h1>
          <p>${tr('render.could-not-load-the-family-kitchen')}</p>
          <p style="font-size:12px;opacity:.75;max-width:320px">${loadError}</p>
          <button class="who-btn" id="loadRetry" style="margin-top:12px">${tr('render.try-again')}</button>
          <button class="mini-btn" id="loadSignOut" style="margin-top:8px">${tr('render.sign-out')}</button></div>`;
        document.getElementById("loadRetry").onclick = () => { loadError = null; game = null; kickLoad(); };
        document.getElementById("loadSignOut").onclick = async () => {
          await sb.auth.signOut();
          authSession = null;
          membership = null;
          me = null;
          game = null;
          loadError = null;
          render();
        };
        return;
      }
      app.innerHTML = `<div class="gate"><h1>🍲</h1><p>${tr('render.loading-the-family-kitchen')}</p></div>`;
      kickLoad();
      return;
    }
    app.innerHTML = `<div class="gate"><h1>🍲</h1><p>${tr('render.loading-the-family-kitchen')}</p></div>`;
    return;
  }
  if (!game.profiles[me]) return renderOnboard();
  // Q_G5: owner-only, once per family, before the first Menu open. Non-owner
  // members are never gated on this - they just ride the server-side
  // fallback (food.default_meal_shapes_for_family) until the owner sets it.
  // Gated on owner_setup_completed_at (an explicit flag set only once the
  // owner reaches and submits the *last* step of the sequence), not on
  // default_meal_shapes being non-empty - that column is written by step 1
  // of 2, so using it as the "done" signal let a returning owner who'd only
  // finished meal shape skip Day Rules forever (2026-08-19 bug).
  if (membership.is_owner && !game.ownerSetupCompletedAt) return renderOwnerSetup();
  app.innerHTML = topbar() + ({ menu: renderMenu, spin: renderSpin, wish: renderWish, duel: renderDuel, feed: renderFeed }[tab])() + nav();
  wire();
}

// Sign-in gate: email input -> Supabase Auth sends a magic link. On click,
// the invitee is redirected back to this page with the session established
// and the invite token still in the URL (if any).
function renderSignInGate() {
  // Driven by whatever language the device-level gate already picked
  // (render() runs that gate before this one) - only falls back to English
  // if somehow reached with no language chosen yet.
  const hasInvite = Boolean(inviteTokenInUrl);
  app.innerHTML = `<div class="gate">
    <h1>🍲 Spin the Food</h1>
    <p>${hasInvite
      ? tr('renderSignInGate.youve-been-invited-to-a-family-kitchen-br-sign-i')
      : tr('renderSignInGate.sign-in-to-your-family-kitchen')}</p>
    <input id="signinEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"
      style="width:100%;padding:14px;font-size:16px;border:2px solid #e5e7eb;border-radius:14px;background:#fff;text-align:center">
    <button class="btn btn-primary" id="signinGo" style="width:100%">${tr('renderSignInGate.send-magic-link')}</button>
    <div id="signinCodeBox" style="display:none;flex-direction:column;gap:14px;margin-top:4px">
      <input id="signinCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="${tr('renderSignInGate.code-from-email')}"
        style="width:100%;padding:14px;font-size:20px;letter-spacing:4px;border:2px solid #e5e7eb;border-radius:14px;background:#fff;text-align:center">
      <button class="btn btn-primary" id="signinVerify" style="width:100%">${tr('renderSignInGate.verify-code')}</button>
      <button class="btn btn-ghost" id="signinResend" style="width:100%">${tr('renderSignInGate.resend')}</button>
    </div>
    <div id="signinNote" style="color:#888;font-size:13px;line-height:1.5">
      ${tr('renderSignInGate.well-email-you-a-one-tap-link-no-password')}
    </div>
    <div style="margin-top:14px;text-align:center;font-size:13px;color:#888">
      ${localeSignInButtonsHtml()}
    </div>
  </div>`;
  const input = document.getElementById("signinEmail");
  const btn = document.getElementById("signinGo");
  const note = document.getElementById("signinNote");
  const codeBox = document.getElementById("signinCodeBox");
  const codeInput = document.getElementById("signinCode");
  const verifyBtn = document.getElementById("signinVerify");
  const resendBtn = document.getElementById("signinResend");
  let sentEmail = "";
  const send = async () => {
    const email = (input.value || "").trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      note.textContent = tr('send.that-doesnt-look-like-a-valid-email');
      note.style.color = "#ef4444";
      return false;
    }
    btn.disabled = true; btn.textContent = tr('send.sending');
    // The redirect URL preserves invite + family params so a fresh browser
    // that opens the emailed link lands in the same room as the owner.
    const redirectUrl = new URL(location.href);
    // Strip supabase-added auth fragments if any (belt & braces).
    redirectUrl.hash = "";
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: redirectUrl.toString() },
    });
    if (error) {
      note.textContent = tr('send.send-failed') + error.message;
      note.style.color = "#ef4444";
      btn.disabled = false; btn.textContent = tr('send.send-magic-link');
      return false;
    }
    sentEmail = email;
    // Some mail providers (Gmail, corporate link-scanners) prefetch links in
    // emails to check them for phishing, which silently burns the one-time
    // magic-link token before a human ever clicks it. The 6-digit code in the
    // same email is a reliable fallback since there's no link for a scanner
    // to consume.
    note.innerHTML = tr("sendMagicLink.check-email", { email });
    note.style.color = "#059669";
    btn.style.display = "none";
    input.disabled = true;
    codeBox.style.display = "flex";
    codeInput.focus();
    return true;
  };
  const verify = async () => {
    const code = (codeInput.value || "").trim();
    if (!/^\d{6,10}$/.test(code)) {
      note.textContent = tr('verify.enter-the-numeric-code-from-the-email');
      note.style.color = "#ef4444";
      return;
    }
    verifyBtn.disabled = true; verifyBtn.textContent = tr('verify.verifying');
    const { error } = await sb.auth.verifyOtp({ email: sentEmail, token: code, type: "email" });
    if (error) {
      note.textContent = tr('verify.verify-failed') + error.message;
      note.style.color = "#ef4444";
      verifyBtn.disabled = false; verifyBtn.textContent = tr('verify.verify-code');
      return;
    }
    // onAuthStateChange picks up the new session and re-renders.
  };
  btn.onclick = send;
  input.onkeydown = e => { if (e.key === "Enter") send(); };
  verifyBtn.onclick = verify;
  codeInput.onkeydown = e => { if (e.key === "Enter") verify(); };
  resendBtn.onclick = async () => {
    resendBtn.disabled = true;
    const ok = await send();
    resendBtn.disabled = false;
    if (ok) { codeInput.value = ""; codeInput.focus(); }
  };
  UI_LOCALES.forEach((l) => {
    const btn = document.getElementById(`signinLang${l.code}`);
    if (btn) btn.onclick = () => pickLanguage(l.code);
  });
  input.focus();
}

  acceptBtn.onclick = async () => {
