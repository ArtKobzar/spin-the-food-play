  let h = `<div class="screen-title"><h2>${tr('renderFeed.family-activity')}</h2><div class="sub">${tr('renderFeed.everything-the-family-does-live-including-recipe')}</div></div><div class="activity">`;

    const j = f.job;

    const bar = f.progressPct !== undefined ? `
      <div style="font-size:11px;color:#999;margin-top:3px">${f.progressLabel}</div>
      <div style="height:4px;background:#eee;border-radius:2px;overflow:hidden;margin-top:3px">

      </div>` : "";
    h += `<div class="a"${clickable ? ` data-feedjob="${i}" style="cursor:pointer"` : ""}><b>${f.icon}</b> ${f.text} · ${ago(f.ts)}${bar}</div>`;
  });
  return h + `</div>`;
}
function ago(ts) { const s = (Date.now()-ts)/1000; if (s<60) return tr('ago.just-now'); if (s<3600) return Math.floor(s/60)+tr('ago.m-ago'); return Math.floor(s/3600)+tr('ago.h-ago'); }

function nav() {
  // Order: Spin, Wish, Menu, Duel, Family. Menu sits dead center and gets the
  // raised "big" bubble treatment below - it's the weekly-plan home screen, the one
  // tab worth a second of extra visual weight versus the other four.
  const tabs = [["spin","🎰"],["wish","✨"],["menu","🗓"],["duel","⚔️"],["feed","📣"]];
  return `<div class="nav">${tabs.map(([k,ic]) => `<button class="${tab===k?"on":""}${k==="menu"?" big":""}" data-tab="${k}"><span class="ic">${ic}</span>${navTabLabel(k)}</button>`).join("")}</div>`;
}

// ── wiring ──
function wire() {
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
    tab = b.dataset.tab; render();
    // Lazy-refresh as a safety net (realtime already nudges this on every
    // real change) so the feed is never stale just because a socket drop
    // was missed - cheap, only fires on actually switching to the tab.
    if (tab === "feed") loadFamilyFeed();
  });
  const pill = document.getElementById("mePill");
  // The "me" pill now opens Settings (which is where sign-out + invite live).
  // The old member-switcher is gone: identity is bound to the auth session.
  if (pill) pill.onclick = openSettings;
  const settings = document.getElementById("settingsBtn");
  if (settings) settings.onclick = openSettings;
  document.querySelectorAll("[data-feedjob]").forEach(el => el.onclick = () => {
    const f = familyFeed[+el.dataset.feedjob];
    const j = f && f.job;
    if (!j) return;
    if (j.status === "ready" && !j.result_recipe_id) openImportReview(j.draft, j.id, j.target_recipe_id, j.source_type);
    else if (j.result_recipe_id) openDetail(j.result_recipe_id);
  });

  // menu
  document.getElementById("confirm") && (document.getElementById("confirm").onclick = () => {
    game.locked = true;
    game.week.forEach(d => MEALS.forEach(m => { if (d[m.k]) delete d[m.k].proposal; }));
    commitAndSync(`${mem(me).en} confirmed the week`, "week_confirmed", { plan_id: activePlanId });
  });
  document.getElementById("unlock") && (document.getElementById("unlock").onclick = () => {
    game.locked = false;
    commitAndSync(`${mem(me).en} reopened the menu`, "week_unconfirmed", { plan_id: activePlanId });
  });
  const aiBtn = document.getElementById("aiFill");
  if (aiBtn) aiBtn.onclick = openAiFill;
  document.querySelectorAll("[data-cookacc]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.cookacc.split("-"); acceptCook(+d,k); });
  document.querySelectorAll("[data-cookrej]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.cookrej.split("-"); declineCook(+d,k); });
  document.querySelectorAll("[data-cookreassign]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.cookreassign.split("-"); openReassignCook(+d,k); });
  document.querySelectorAll("[data-propacc]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.propacc.split("-"); acceptProposal(+d,k); });
  document.querySelectorAll("[data-proprej]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.proprej.split("-"); rejectProposal(+d,k); });
  document.querySelectorAll("[data-spin]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.spin.split("-"); tab="spin"; spinTarget={day:+d,meal:k}; render(); toast(tr('anonymous.swipe-right-to-fill') + dayN(+d) + " " + MEALS.find(m=>m.k===k).ic); });
  document.querySelectorAll("[data-wish]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.wish.split("-"); wishTarget = { day: +d, meal: k }; tab="wish"; render(); openWish(); });
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    const [d,k]=b.dataset.edit.split("-");
    spinTarget = { day: +d, meal: k };
    tab = "spin"; render();
    toast(tr('anonymous.swipe-right-to-replace') + dayN(+d) + " " + MEALS.find(m=>m.k===k).ic);
  });
  document.querySelectorAll("[data-clearslot]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.clearslot.split("-"); clearSlot(+d,k); });
  document.querySelectorAll("[data-ainote]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.ainote.split("-"); openAiNote(+d,k); });
  document.querySelectorAll("[data-openrecipe]").forEach(el => el.addEventListener("click", e => {
    if (e.target.closest("button")) return; // Accept/Decline/Reassign/Spin/Wish/etc. keep their own action
    openDetail(el.dataset.openrecipe);
  }));

  // spin
  const deckSearchEl = document.getElementById("deckSearch");
  if (deckSearchEl) deckSearchEl.addEventListener("input", e => { deckSearch = e.target.value; refreshDeck(); });
  if (document.getElementById("deckAdvQuick")) wireQuickFilterRow(app, "deckAdv", deckAdv, refreshDeck);
  if (document.getElementById("deckAdvToggle")) wireFilterToggle(app, "deckAdv", deckPanel);
  if (document.getElementById("deckAdvMeal")) wireAdvFilterPanel(app, "deckAdv", deckAdv, refreshDeck);
  wireSearchClear(app, "deckSearch", () => deckSearch, () => { deckSearch = ""; refreshDeck(); });
  wireSearchSuggest(app, "deckSearch", "deckAdv", q => recipesMatchingName(q), id => {
    focusRecipeInSpin(id);
  });
  wireStack();

  // wish
  document.getElementById("newWish") && (document.getElementById("newWish").onclick = () => { wishTarget = null; openWish(); });
  document.querySelectorAll("[data-wvote]").forEach(b => b.onclick = () => {
    const w = game.wishes[+b.dataset.wvote];
    w.votes.push(me);
    commitAndSync(`${mem(me).en} voted for a wish`, "wish_voted", { wish_id: w.id });
  });
  document.querySelectorAll("[data-wcommit]").forEach(b => b.onclick = async () => {
    const w = game.wishes[+b.dataset.wcommit];
    const d = w.kind === "dish" ? w.dish : (DISHES.find(x => w.kind !== "cuisine" || x.c === w.cuisine)?.id || DISHES[0]?.id);
    if (!d) return;
    w.committed = me;
    act(`${mem(me).en} granted ${mem(w.by).en}'s wish`);
    render();
    saving = true;
    const ok = await applyEvent("wish_granted", { wish_id: w.id });
    saving = false;
    if (ok) assignToSlot(w.day, w.meal || "dinner", d, me);
    toast(tr('anonymous.wish-granted-added-to-the-menu'));
  });

  // duel
  document.querySelectorAll("[data-duel]").forEach(c => c.onclick = () => {
    const p = game.duel.proposals[+c.dataset.duel];
    p.votes.push(me);
    if (game.duel.proposals.reduce((n, x) => n + x.votes.length, 0) >= 3) game.duel.open = false;
    commitAndSync(`${mem(me).en} voted in the duel`, "duel_voted", { proposal_id: p.id });
  });
}

// ── modals ──
let spinTarget = null;
// {day, meal} when the "Wish" button was tapped on a specific empty slot, so
// granting doesn't have to re-ask which day (and the resulting wish records
// the right meal type instead of always assuming dinner - see
// 20260808000000_food_wish_meal_type_v1.sql).
let wishTarget = null;
function modal(html, opts = {}) {
  closeModal();
  modalOpen = true;
  const v = document.createElement("div"); v.className = "veil";
  v.innerHTML = `<div class="modal">${html}</div>`;
  // preventBackdropClose: for dialogs holding not-yet-saved user input (e.g.
  // the import review sheet) - a stray tap outside shouldn't silently
  // discard it. Those dialogs must supply their own explicit Cancel control.
  if (!opts.preventBackdropClose) {
    v.onclick = e => { if (e.target === v) closeModal(); };
  }
  document.getElementById("app").appendChild(v);
  return v;
}
function closeModal() {
  document.querySelectorAll(".veil").forEach(v => v.remove());
  if (modalOpen) { modalOpen = false; if (pendingRemote) { pendingRemote = false; render(); } }
}
// SPEC_AI_PREFILL.md #19: translates food.meal_slots.ai_note's machine-readable
// reason codes into the tap-to-expand explanation shown on a slot's badge.
function aiNoteText(note) {
  if (!note) return "";
  if (note.reason === "day_rule_skipped") {
    const kindLabel = dayRuleKindNoteLabel(note.rule_kind);
    return tr("aiNoteText.day-rule-skipped", { kindLabel, ruleValue: note.rule_value });
  }
  if (note.reason === "no_safe_recipe") {
    return tr('aiNoteText.ai-couldnt-find-a-recipe-thats-safe-for-everyone');
  }
  if (note.reason === "no_qualified_cook") {
    return tr('aiNoteText.ai-found-a-safe-recipe-but-no-available-cook-who');
  }
  return tr('aiNoteText.ai-made-a-note-about-this-slot');
}
function openAiNote(day, mealKey) {
  const note = game.week[day][mealKey]?.aiNote;
  modal(`<h3>🤖 ${tr('openAiNote.ai-pre-fill-note')}</h3>
    <div style="font-size:13px;color:#666;margin-bottom:4px">${dayN(day)} · ${mealN(MEALS.find(m => m.k === mealKey))}</div>
    <div style="font-size:14px;line-height:1.6;margin-top:8px">${aiNoteText(note)}</div>
    <button class="btn btn-ghost" id="ainoteOk" style="width:100%;margin-top:16px">${tr('openAiNote.got-it')}</button>`);
  document.getElementById("ainoteOk").onclick = closeModal;
}

function openAssign(dishId) {
  // Spin launched from a specific empty day/meal slot already knows exactly where
  // the swiped-right card belongs - re-asking "which day? which meal?" here would
  // just be re-litigating a choice the user already made by tapping that slot's
  // Spin button in the first place (user report, 2026-08-08). Fill it directly and
  // skip the picker entirely; only fall back to the picker when Spin was opened
  // generically (bottom-nav tab, no slot context).
  if (spinTarget) {
    const { day, meal } = spinTarget;
    spinTarget = null;
    const cook = mem(me).cook ? me : (FAMILY.find(m => m.cook)?.id || me);
    assignToSlot(day, meal, dishId, cook);
    return;
  }
  let selDay = null, selMeal = "dinner", selCook = mem(me).cook ? me : (FAMILY.find(m => m.cook)?.id || me);
  const v = modal(`<h3>${dishOr(dishId).em} ${dName(dishOr(dishId))} → ${tr('openAssign.the-menu')}</h3>
    <div class="sect">${tr('openAssign.which-day')}</div><div class="chips-wrap" id="D">${DAYS.map((d,i)=>`<div class="chip ${i===selDay?"on":""}" data-d="${i}">${dayN(i)}</div>`).join("")}</div>
    <div class="sect">${tr('openAssign.which-meal')}</div><div class="chips-wrap" id="M">${MEALS.map(m=>`<div class="chip ${m.k===selMeal?"on":""}" data-m="${m.k}">${m.ic} ${mealN(m)}</div>`).join("")}</div>
    <div class="sect">${tr('openAssign.who-should-cook-it')}</div><div class="chips-wrap" id="C">${FAMILY.filter(m=>m.cook).map(m=>`<div class="chip ${m.id===selCook?"on":""}" data-c="${m.id}">${m.em} ${mName(m)}</div>`).join("")}</div>
    <button class="btn btn-primary" id="go" style="width:100%;margin-top:16px;opacity:${selDay!==null?1:.4}">${tr('openAssign.send-to-the-menu')}</button>
    <div style="font-size:11px;color:#999;margin-top:8px">${tr('openAssign.the-cook-gets-pinged-and-must-accept')}</div>`);
  const upd = () => { v.querySelectorAll("#D .chip").forEach(c=>c.classList.toggle("on",+c.dataset.d===selDay));
    v.querySelectorAll("#M .chip").forEach(c=>c.classList.toggle("on",c.dataset.m===selMeal));
    v.querySelectorAll("#C .chip").forEach(c=>c.classList.toggle("on",c.dataset.c===selCook));
    v.querySelector("#go").style.opacity = selDay!==null?1:.4; };
  v.querySelectorAll("#D .chip").forEach(c=>c.onclick=()=>{selDay=+c.dataset.d;upd();});
  v.querySelectorAll("#M .chip").forEach(c=>c.onclick=()=>{selMeal=c.dataset.m;upd();});
  v.querySelectorAll("#C .chip").forEach(c=>c.onclick=()=>{selCook=c.dataset.c;upd();});
  v.querySelector("#go").onclick = () => { if(selDay===null)return; closeModal(); assignToSlot(selDay,selMeal,dishId,selCook); };
}
function openReassignCook(day, mealKey) {
  const s = game.week[day][mealKey];
  const others = FAMILY.filter(m => m.cook && m.id !== me);
  const v = modal(`<h3>👉 ${tr('openReassignCook.assign-someone-else')}</h3>
    <div class="sect">${tr('openReassignCook.who-should-cook-it-instead')}</div>
    <div class="chips-wrap">${others.map(m => `<div class="chip" data-c="${m.id}">${m.em} ${mName(m)}</div>`).join("")}</div>`);
  v.querySelectorAll("[data-c]").forEach(c => c.onclick = () => { closeModal(); reassignCook(day, mealKey, c.dataset.c); });
}
function openAiFill() {
  const anyMeals = game.week.some(d => d.breakfast || d.lunch || d.dinner);
  const v = modal(`<h3>🤖 ${tr('openAiFill.generate-a-full-ai-menu')}</h3>
    <div style="font-size:14px;color:#555;line-height:1.6">
      ${anyMeals
        ? tr('openAiFill.this-will-touch-every-day-of-the-week-meals-ai-s')
        : tr('openAiFill.every-empty-slot-gets-a-suggested-dish-and-cook-')}
    </div>
    <button class="btn btn-primary" id="aiGo" style="width:100%;margin-top:16px">🤖 ${tr('openAiFill.yes-generate-it')}</button>
    <button class="btn btn-ghost" id="aiCancel" style="width:100%;margin-top:8px">${tr('openAiFill.cancel')}</button>`);
  v.querySelector("#aiGo").onclick = async () => {
    closeModal();
    const { overwrittenCount, events } = aiPopulateWeek();
    act(`${mem(me).en} triggered an AI menu ${anyMeals ? "refresh" : "fill"}`);
    render();
    let failed = 0;
    for (const [eventType, payload] of events) {
      const ok = await applyEvent(eventType, payload);
      if (!ok) failed++;
    }
    await pullLatest();
    toast(failed
      ? tr('anonymous.ai-menu-partially-synced') + failed + tr('anonymous.slot-s-failed-try-again')
      : overwrittenCount
        ? tr('anonymous.ai-menu-sent') + overwrittenCount + tr('anonymous.swap-s-need-family-approval')
        : tr('anonymous.ai-menu-ready-cooks-need-to-accept-their-meals'));
  };
  v.querySelector("#aiCancel").onclick = closeModal;
}
function openWish() {
  const v = modal(`<h3>✨ ${tr('openWish.what-kind-of-wish')}</h3>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-ghost" data-k="dish" style="text-align:left">🍛 ${tr('openWish.a-specific-dish')}</button>
      <button class="btn btn-ghost" data-k="cuisine" style="text-align:left">🌍 ${tr('openWish.a-cuisine-night-chef-picks')}</button>
      <button class="btn btn-ghost" data-k="choice" style="text-align:left">🎁 ${tr('openWish.cooks-choice-surprise-me')}</button>
    </div>`);
  v.querySelectorAll("[data-k]").forEach(b => b.onclick = () => wishStep2(b.dataset.k));
}
function wishStep2(kind) {
  // Wish launched from a specific empty slot's button already knows exactly
  // which day and meal it's for - showing the "which day?" chips again would
  // just be re-litigating a choice already made by tapping that slot (matches
  // the same fix applied to Spin's openAssign()). Only ask when Wish was
  // opened generically (bottom-nav "+ new wish", no slot context).
  const target = wishTarget;
  let selDish=null, selCui=null, selCook="any", selDay = target ? target.day : null;
  let dishSearch="";
  const dishAdv = newAdvFilters();
  const dishPanel = { open: false };
  const v = modal(`<h3>${kind==="dish"?"🍛 "+tr('wishStep2.which-dish'):kind==="cuisine"?"🌍 "+tr('wishStep2.which-cuisine'):"🎁 "+tr('wishStep2.cooks-choice')}</h3>
    ${kind==="dish"?`
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <div style="position:relative;flex:1 1 auto;min-width:0">
          <input id="dishSearch" style="width:100%;box-sizing:border-box;border:2px solid #e5e7eb;border-radius:12px;padding:9px 30px 9px 12px;font-size:14px" placeholder="${tr('wishStep2.search-recipes')}">
          ${searchClearBtnHtml("dishSearch")}
        </div>
        ${filterIconButtonHtml("dishAdv", dishPanel.open)}
      </div>
      ${quickFilterRowHtml("dishAdv", dishAdv)}
      <div style="margin-bottom:8px">${advFilterPanelHtml("dishAdv", dishAdv, dishPanel.open)}</div>
      <div id="wishPick" style="margin-bottom:8px"></div>` : ""}
    ${kind==="cuisine"?`<div class="chips-wrap" id="WC">${availableCuisines().map(c=>`<div class="chip" data-c="${c}">${cuisineLabel(c)}</div>`).join("")}</div>`:""}
    <div class="sect">${tr('wishStep2.who-should-cook-it')}</div>
    <div class="chips-wrap" id="WK"><div class="chip on" data-c="any">🎲 ${tr('wishStep2.anyone')}</div>${FAMILY.filter(m=>m.cook).map(m=>`<div class="chip" data-c="${m.id}">${m.em} ${mName(m)}</div>`).join("")}</div>
    ${target ? "" : `<div class="sect">${tr('wishStep2.which-day')}</div><div class="chips-wrap" id="WY">${DAYS.map((d,i)=>`<div class="chip ${i===selDay?"on":""}" data-d="${i}">${dayN(i)}</div>`).join("")}</div>`}
    <button class="btn btn-primary" id="wgo" style="width:100%;margin-top:16px;opacity:.4">✨ ${tr('wishStep2.wish-it')}</button>`);
  const ok = () => selDay!==null && (kind==="choice" || (kind==="dish"?selDish:selCui));
  // Wish's dish step mimics the Spin deck (user report, 2026-08-08): the same
  // swipeable card stack, search bar, and filter row instead of a flat chip
  // list - browsing for a wish should feel like browsing for the menu itself,
  // not a different, lesser picker. Own local deck order (wishOrder) so
  // skipping a card here never disturbs the real Spin screen's deckOrder.
  let wishOrder = DISHES.filter(d => d.dish_role !== "component").map(d => d.id);
  function wishDeckList() {
    const q = dishSearch.trim().toLowerCase();
    return wishOrder.map(dish).filter(d => {
      if (d.dish_role === "component") return false;
      if (q && !d.en.toLowerCase().includes(q) && !d.ru.toLowerCase().includes(q)) return false;
      return matchesAdvFilters(d, dishAdv);
    });
  }
  function wishStackHtml(list) {
    let s = "";
    list.slice(0, 3).reverse().forEach((d, i, arr) => {
      const top = i === arr.length - 1, dep = arr.length - 1 - i;
      const photo = photoSlideHtml(d);
      s += `<div class="scard ${top ? "top" : ""}" data-dish="${d.id}" style="transform:translateY(${dep*-6}px) scale(${1-dep*.04});z-index:${10-dep}">
        <div class="ph" style="${photo.bgStyle}"></div>
        <div class="bd"><div class="ti">${dName(d)}</div><div class="mt"><span>⏱ ${d.t} ${tr('anonymous.min')}</span><span>${d.d}</span><span>${cuisineDisplay(d.c)}</span></div></div>
        <div class="stamp yes">${tr('anonymous.pick')}</div><div class="stamp no">${tr('anonymous.skip')}</div></div>`;
    });
    return s;
  }
  function wireWishStack() {
    const topCard = v.querySelector("#wishStack .scard.top");
    const flyWish = dir => {
      if (!topCard) return;
      const id = topCard.dataset.dish;
      topCard.style.transition = "transform .3s, opacity .3s";
      topCard.style.transform = `translateX(${dir*500}px) rotate(${dir*22}deg)`; topCard.style.opacity = "0";
      setTimeout(() => {
        wishOrder = [...wishOrder.filter(x => x !== id), id];
        if (dir > 0) selDish = id;
        renderWishPicker(); upd();
      }, 260);
    };
    const tipNope = v.querySelector("#wishTipNope"), tipLike = v.querySelector("#wishTipLike");
    if (tipNope) tipNope.onclick = () => flyWish(-1);
    if (tipLike) tipLike.onclick = () => flyWish(1);
    if (topCard) {
      let sx=0,dx=0,drag=false;
      topCard.addEventListener("pointerdown", e => { drag=true; sx=e.clientX; topCard.setPointerCapture(e.pointerId); });
      topCard.addEventListener("pointermove", e => { if(!drag)return; dx=e.clientX-sx; topCard.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
        topCard.querySelector(".stamp.yes").style.opacity = dx>40?Math.min(1,dx/120):0; topCard.querySelector(".stamp.no").style.opacity = dx<-40?Math.min(1,-dx/120):0; });
      topCard.addEventListener("pointerup", () => { drag=false; if(dx>90)flyWish(1); else if(dx<-90)flyWish(-1);
        else { topCard.style.transition="transform .2s"; topCard.style.transform=""; topCard.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0); } dx=0; });
    }
  }
  function renderWishPicker() {
    const box = v.querySelector("#wishPick");
    if (!box) return;
    if (selDish) {
      const d = dish(selDish);
      const photo = photoSlideHtml(d);
      box.innerHTML = `<div class="scard" style="position:relative;height:auto">
          <div class="ph" style="${photo.bgStyle};height:120px"></div>
          <div class="bd"><div class="ti">${dName(d)}</div><div class="mt"><span>⏱ ${d.t} ${tr('renderWishPicker.min')}</span><span>${d.d}</span><span>${cuisineDisplay(d.c)}</span></div></div>
        </div>
        <button class="mini-btn" id="wishChange" style="margin-top:8px">🔄 ${tr('renderWishPicker.change-dish')}</button>`;
      const chg = box.querySelector("#wishChange");
      if (chg) chg.onclick = () => { selDish = null; renderWishPicker(); upd(); };
      return;
    }
    const list = wishDeckList();
    box.innerHTML = list.length
      ? `<div style="position:relative">
          <div class="stack wish-stack" id="wishStack">${wishStackHtml(list)}</div>
          <button class="swipe-tip left" id="wishTipNope" title="${tr('renderWishPicker.skip-this-recipe')}" aria-label="${tr('renderWishPicker.skip-this-recipe')}"><span class="tip-arrow">←</span></button>
          <button class="swipe-tip right" id="wishTipLike" title="${tr('renderWishPicker.pick-this-dish')}" aria-label="${tr('renderWishPicker.pick-this-dish')}"><span class="tip-arrow">→</span></button>
        </div>`
      : `<div style="text-align:center;color:#aaa;padding:24px 0">${tr('renderWishPicker.no-recipes-match')}</div>`;
    wireWishStack();

// Bug found 2026-08-09 (part 3): sb.functions.invoke() internally calls the
// SDK's getSession(), which in this supabase-js version serializes through a
// cross-tab navigator.locks mutex before it will even build the request and
// call fetch(). Confirmed via DevTools that submitting a link produced zero
// network activity at all (not even a pending request) in both a normal
// window and a fresh Incognito window with extensions disabled - the hang is
// inside the SDK, before any fetch is issued, consistent with a stuck lock.
// Fix: bypass sb.functions.invoke() entirely and call fetch() directly with
// the already-cached authSession.access_token, exactly like the existing
// (working) spin-food-invite call above - no getSession(), no lock, no hang.
const CLIENT_INVOKE_TIMEOUT_MS = 45_000;

// Bug found 2026-08-09 (follow-up): the same navigator.locks lock also
// wedges the SDK's silent token refresh path, so autoRefreshToken can go
// dormant while the local `authSession` still looks valid. Symptom: a review
// screen open for a while sends its Save request with an expired JWT and
// the server returns 401 "invalid session" (spin-food-import:478).
//
// We fix this the same way we fixed part 3: bypass the SDK entirely, refresh
// via a raw fetch to /auth/v1/token, and update `authSession` in place. Two
// entry points below: preemptive (if the local token is within 60s of
// expiry) and reactive (retry once after a 401 that looks auth-shaped).
async function refreshAccessTokenRaw() {
  const rt = authSession?.refresh_token;
  if (!rt) return false;
  try {
    const resp = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON,
        "Authorization": "Bearer " + SUPABASE_ANON,
      },
      body: JSON.stringify({ refresh_token: rt }),
    });
    if (!resp.ok) return false;
    const body = await resp.json().catch(() => null);
    if (!body?.access_token) return false;
    // Mirror the shape supabase-js's onAuthStateChange normally sets so
    // every other read of authSession.* stays oblivious to the source.
    authSession = {
      ...(authSession || {}),
      access_token: body.access_token,
      refresh_token: body.refresh_token ?? rt,
      expires_in: body.expires_in,
      expires_at: body.expires_at ?? (Math.floor(Date.now() / 1000) + (body.expires_in || 3600)),
      token_type: body.token_type || "bearer",
      user: body.user ?? authSession?.user,
    };
    return true;
  } catch {
    return false;
  }
}
const REFRESH_TIMEOUT_MS = 5_000;
async function refreshAccessTokenWithTimeout() {
  return await Promise.race([
    refreshAccessTokenRaw(),
    new Promise((resolve) => setTimeout(() => resolve(false), REFRESH_TIMEOUT_MS)),
  ]);
}
async function ensureFreshAccessToken() {
  const expAt = authSession?.expires_at;
  if (!expAt) return;
  const nowSec = Math.floor(Date.now() / 1000);
  if (nowSec >= expAt - 60) await refreshAccessTokenWithTimeout();
}
const AUTH_ERROR_HINT_RE = /invalid session|invalid token|jwt|unauthorized|missing bearer/i;

// PostgREST RPC via raw fetch - bypasses supabase-js navigator.locks wedge that
// left spin_food_create_family / my_membership / accept_invitation hanging with
// zero server trace (2026-08-18 through 2026-08-21). Same pattern as
// invokeWithTimeout() for Edge Functions.
async function rpcRaw(fnName, params = {}) {
  await ensureFreshAccessToken();
  const send = async () => {
    const accessToken = authSession?.access_token;
    if (!accessToken) return { data: null, error: { message: "not signed in" } };
    try {
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON,
          "Authorization": "Bearer " + accessToken,
        },
        body: JSON.stringify(params ?? {}),
      });
      const text = await resp.text();
      let body = null;
      if (text) {
        try { body = JSON.parse(text); } catch { body = text; }
      }
      if (!resp.ok) {
        const msg = (body && typeof body === "object" && body.message)
          ? body.message
          : `Request failed (${resp.status})`;
        return { data: null, error: { message: msg } };
      }
      return { data: body, error: null };
    } catch (e) {
      return { data: null, error: { message: e?.message || String(e) } };
    }
  };
  let res = await send();
  if (res.error?.message && AUTH_ERROR_HINT_RE.test(res.error.message)) {
    const refreshed = await refreshAccessTokenWithTimeout();
    if (refreshed) res = await send();
  }
  return res;
}

async function rpcWithTimeout(fnName, params, ms, label) {
  try {
    return await withTimeout(rpcRaw(fnName, params), ms, label || fnName);
  } catch (e) {
    return { data: null, error: { message: e?.message || String(e) } };
  }
}

function invokeWithTimeout(fnName, opts, timeoutMs = CLIENT_INVOKE_TIMEOUT_MS) {
  console.log(`[invoke] -> ${fnName}`, opts?.body);
  const doFetch = (async () => {
    // Preemptive refresh: cheap local expiry check, then a bounded raw-fetch
    // refresh if we're close to expiry. Falls through unchanged if the token
    // is comfortably in the future.
    await ensureFreshAccessToken();
    const send = async () => {
      const accessToken = authSession?.access_token;
      if (!accessToken) {
        return { status: 401, body: { error: tr('send.session-expired-please-sign-in-again') } };
      }
      try {
        const resp = await fetch(`${SUPABASE_URL}/functions/v1/${fnName}`, {
          method: "POST",
          headers: { "Authorization": "Bearer " + accessToken, "Content-Type": "application/json" },
          body: JSON.stringify(opts?.body ?? {}),
        });
        const body = await resp.json().catch(() => null);
        return { status: resp.status, body };
      } catch (e) {
        return { status: 0, body: null, networkError: e?.message || String(e) };
      }
    };
    let res = await send();
    // Reactive retry: one refresh + resend on an auth-shaped 401. Covers the
    // corner where the preemptive check said the token was fine but it
    // expired mid-flight, or where a server-side session invalidation
    // happened between the extract and the confirm.
    if (res.status === 401 && (!res.body?.error || AUTH_ERROR_HINT_RE.test(String(res.body?.error || "")))) {
      const refreshed = await refreshAccessTokenWithTimeout();
      if (refreshed) res = await send();
    }
    if (res.networkError) return { data: null, error: { message: res.networkError } };
    if (res.status !== 0 && res.status >= 400) {
      return { data: null, error: { message: res.body?.error || `Request failed (${res.status})` } };
    }
    return { data: res.body, error: null };
  })();
  const timeoutPromise = new Promise((resolve) => {
    setTimeout(() => resolve({ data: null, error: { message: tr('anonymous.request-timed-out-please-check-your-connection-a') } }), timeoutMs);
  });
  return Promise.race([doFetch, timeoutPromise]).then((res) => {
    console.log(`[invoke] <- ${fnName}`, res);
    return res;
  });
}

// ── Recipe Ingestion Pipeline (SPEC_RECIPE_INGESTION.md) ──

    <div id="impStatus" style="font-size:13px;color:#888;margin-top:8px;min-height:18px"></div>
    <div id="impProgressTrack" style="height:4px;background:#eee;border-radius:2px;margin-top:2px;overflow:hidden;display:none"><div id="impProgressFill" style="height:100%;width:0%;background:var(--amber,#f59e0b);transition:width .25s ease"></div></div>`,
    { preventBackdropClose: true });
  v.querySelector("#impCancel").onclick = () => closeModal();

  const urlInput = v.querySelector("#impUrl");
  const goBtn = v.querySelector("#impGo");
  const statusEl = v.querySelector("#impStatus");
  const progressTrack = v.querySelector("#impProgressTrack");
  const progressFill = v.querySelector("#impProgressFill");
  // 2026-08-10: a bare "Uploading photo..." with no further feedback reads
  // as a hang on a slow connection - especially now that upload runs after
  // an invisible client-side compression pass. setBusy() takes an optional
  // (step, totalSteps) pair so every phase of the photo pipeline (prepare ->
  // upload -> analyze) gets its own message and visible progress movement,
  // not just one static "processing" string for the whole duration.
  const setBusy = (busy, msg = "", step = 0, totalSteps = 0) => {
    goBtn.disabled = busy || !urlInput.value.trim();
    goBtn.style.opacity = goBtn.disabled ? .4 : 1;
    statusEl.textContent = msg;
    urlInput.disabled = busy;
    v.querySelector("#impCamBtn").disabled = busy;
    v.querySelector("#impSearchBtn").disabled = busy;
    if (busy && totalSteps > 0) {

      progressFill.style.width = `${Math.min(100, Math.round((step / totalSteps) * 100))}%`;
    } else {
      progressTrack.style.display = "none";
      progressFill.style.width = "0%";
    }
  };
  urlInput.addEventListener("input", () => setBusy(false));

  v.querySelector("#impSearchBtn").addEventListener("click", () => {
    const defaultQuery = isEnrich ? dName(dishOr(targetRecipeId)) : urlInput.value.trim();
    openRecipeWebsiteSearch(defaultQuery);
  });

  v.querySelector("#impPlusBtn")?.addEventListener("click", (e) => {
    e.stopPropagation();

  const photoInput = v.querySelector("#impPhoto");
  v.querySelector("#impCamBtn").addEventListener("click", () => photoInput.click());
  photoInput.addEventListener("change", async () => {
    const files = Array.from(photoInput.files || []);

    if (!files.length) return;
    // 2026-08-10: a photo pick vanished near-instantly with no error shown
    // and, unlike every prior investigation tonight, not even the very
    // first import_photo_compress breadcrumb landed - meaning whatever
    // failed did so before uploadImportPhoto() got a chance to log
    // anything itself. Two additions to close that blind spot: (1) log the
    // instant the picker hands back files, before any processing, so we
    // can at least confirm the handler started; (2) wrap the whole body so
    // an uncaught exception anywhere in this pipeline is never silent -
    // it's logged with a stack trace AND surfaced as a toast instead of
    // just leaving the sheet in whatever state it happened to be in.
    logClientDiagnostic("import_photo_pick_start", {
      fileCount: files.length,
      files: files.map(f => ({ size: f.size, type: f.type })),
    });
    try {
      // Pipeline is "prepare -> upload" per photo, then one "analyze" step for
      // the whole batch - each photo gets its own 2 steps in the tracker so
      // multi-photo picks still visibly progress rather than sitting on one
      // unchanging message for the whole batch.
      const totalSteps = files.length * 2 + 1;
      const photoUrls = [];
      for (let i = 0; i < files.length; i++) {
        const label = files.length > 1 ? ` (${i + 1}/${files.length})` : "";
        const onStep = (phase) => {
          const step = i * 2 + (phase === "compress" ? 1 : 2);
          const msg = phase === "compress"
            ? tr('onStep.preparing-photo')
            : tr('onStep.uploading-photo');
          setBusy(true, msg + label, step, totalSteps);
        };
        onStep("compress");
        const url = await uploadImportPhoto(files[i], onStep);
        if (url) photoUrls.push(url);
      }
      if (!photoUrls.length) { setBusy(false); return; }
      setBusy(true, tr('anonymous.analyzing-your-photo'), totalSteps - 1, totalSteps);
      await runImportExtract("photo", { photo_urls: photoUrls }, targetRecipeId, setBusy);
    } catch (e) {
      logClientDiagnostic("import_photo_flow_exception", { message: e?.message || String(e), stack: e?.stack || null });
      setBusy(false, "");
      toast(tr('anonymous.something-went-wrong-preparing-that-photo-try-ag'));
    }
  });

  goBtn.onclick = async () => {
    const url = urlInput.value.trim();
    if (!url) return;
    // YouTube auto-detect (map #20/#21) - no separate tab, the URL field
    // itself routes here. Async per #33: queue and close, no spinner wait.
    //
    // Session A (T6 dedup): the server now runs an upfront lookup by
    // source_video_id against the platform cookbook. On a cache hit the
    // response comes back with dedup:true + recipe_id pointing at the
    // existing platform recipe, and we short-circuit the whole "wait for
    // the worker" flow - the recipe is already in the family's binder
    // via their standing platform grant, so we just refresh loadCatalog
    // and open the detail.
    if (/(?:youtube\.com|youtu\.be)/i.test(url)) {
      syncLangFromStorage();
      setBusy(true, tr('anonymous.queuing-your-video'));
      const { data, error } = await invokeWithTimeout("spin-food-import", {
        body: { source_type: "youtube", action: "extract", payload: { url, target_recipe_id: targetRecipeId, viewer_locale: lang } },
      });
      if (error || !data?.ok) {
        setBusy(false, "");
        toast((error && error.message) || data?.error || tr('anonymous.couldnt-queue-that-video'));
        return;
      }
      closeModal();
      if (data.dedup && data.recipe_id) {
        lastDedupToastAt = Date.now();
        stickyToast(tr('anonymous.already-in-your-library-duplicate-skipped'));
        await loadCatalog();
        focusRecipeInSpin(data.recipe_id, { showDetail: true });
      } else {
        toast(tr('anonymous.got-it-well-notify-you-when-your-recipe-is-ready'));
      }
      return;
    }
    setBusy(true, tr('anonymous.reading-the-recipe'));
    await runImportExtract("url", { url }, targetRecipeId, setBusy);
  };
}

// 2026-08-10: a phone-library photo upload would sometimes just hang on
// "Uploading photo..." forever with no error and no way out - the
// storage-js upload() call had no timeout of its own, so a stalled mobile
// connection (or an oversized file quietly failing to finish) never
// resolved either way. Two guards added to all three photo-upload helpers
// below: a client-side size pre-check (fails fast instead of pointlessly
// attempting an upload the 10 MiB bucket limit will reject anyway) and a
// hard timeout via the existing withTimeout() so a stalled request always
// surfaces an error the user can retry from, instead of hanging silently.
const MAX_PHOTO_UPLOAD_BYTES = 10 * 1024 * 1024;
const PHOTO_UPLOAD_TIMEOUT_MS = 45_000;

function checkPhotoUploadSize(file) {
  if (file.size <= MAX_PHOTO_UPLOAD_BYTES) return true;
  logClientDiagnostic("import_photo_too_large", { size: file.size, type: file.type, max: MAX_PHOTO_UPLOAD_BYTES });
  toast(tr('checkPhotoUploadSize.that-photo-is-too-large-max-10mb-try-a-smaller-o'));
  return false;
}

// 2026-08-10 (SPEC_RECIPE_INGESTION.md §10.1): downscale+re-encode a picked
// photo client-side before it ever hits Storage. Two call sites use two
// different aggressiveness levels - import photos are OCR input only and
// never shown to anyone, so they can be compressed hard; recipe/step photos
// are display images and get a lighter touch. Always falls back to the
// original File unchanged on any decode failure (chiefly: HEIC/HEIF library
// photos, which most non-Safari browsers can't decode into a canvas) -
// compression is a bandwidth optimization, never a hard requirement.
async function compressImageForUpload(file, { maxDim, quality }) {
  if (!file.type || !file.type.startsWith("image/")) return file;
  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
    const w = Math.max(1, Math.round(bitmap.width * scale));
    const h = Math.max(1, Math.round(bitmap.height * scale));
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(bitmap, 0, 0, w, h);
    bitmap.close?.();
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
    if (!blob || blob.size === 0) return file;
    // Re-encoding rarely helps a file that's already small/simple (e.g. a
    // screenshot) - keep the original in that case rather than risk a
    // (slightly) larger re-encode.
    return blob.size < file.size ? blob : file;
  } catch (e) {
    console.warn("[stf-upload] compression skipped, using original file:", e);
    return file;
  }
}
const IMPORT_PHOTO_COMPRESS = { maxDim: 1600, quality: 0.78 };
const DISPLAY_PHOTO_COMPRESS = { maxDim: 2000, quality: 0.85 };

// Uploads directly to the recipe-import-photos Storage bucket at
// <family_id>/<uuid>.<ext> - no recipe_id exists yet at this point, unlike
// uploadRecipePhoto() which uploads into an already-saved recipe's folder.
//
// One retry on timeout (2026-08-10, user report: "load failed dur timeout",
// no import job or Storage object was ever created for that attempt -
// confirmed via direct DB query, so the request itself stalled somewhere on
// the way to Storage, not a server-side bug this time). Same reasoning as
// EXTRACT_DEADLINE_MS's OpenAI retry: a single stalled mobile-network
// request is common enough that failing the whole flow on the first miss is
// needlessly harsh, and withTimeout() only abandons waiting on the original
// upload promise - it doesn't cancel the underlying request - so a retry
// safely uses a fresh random path each attempt rather than colliding with
// whatever the first attempt might still be doing in the background.
async function uploadImportPhotoOnce(file, upload, familyId, ext) {
  const path = `${familyId}/${crypto.randomUUID()}.${ext}`;
  const t0 = performance.now();
  try {
    const { error } = await withTimeout(
      sb.storage.from("recipe-import-photos").upload(path, upload, { contentType: upload.type || "image/jpeg", upsert: false }),
      PHOTO_UPLOAD_TIMEOUT_MS,
      "Photo upload",
    );
    if (error) throw error;
    logClientDiagnostic("import_photo_upload_ok", { elapsedMs: Math.round(performance.now() - t0), uploadBytes: upload.size });
    return path;
  } catch (e) {
    logClientDiagnostic("import_photo_upload_fail", {
      elapsedMs: Math.round(performance.now() - t0),
      uploadBytes: upload.size,
      errorMessage: e?.message || String(e),
    });
    throw e;
  }
}
async function uploadImportPhoto(file, onStep = null) {
  const familyId = membership?.family_id;
  if (!familyId) { toast(tr('uploadImportPhoto.sign-in-first')); return null; }
  if (!checkPhotoUploadSize(file)) return null;
  const compressT0 = performance.now();
  const upload = await compressImageForUpload(file, IMPORT_PHOTO_COMPRESS);
  logClientDiagnostic("import_photo_compress", {
    elapsedMs: Math.round(performance.now() - compressT0),
    originalBytes: file.size,
    originalType: file.type,
    resultBytes: upload.size,
    fellBackToOriginal: upload === file,
  });
  onStep?.("upload");
  const ext = upload === file ? ((file.name || "").split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg" : "jpg";
  const ATTEMPTS = 2;
  let path = null;
  for (let attempt = 1; attempt <= ATTEMPTS; attempt++) {
    try {
      path = await uploadImportPhotoOnce(file, upload, familyId, ext);
      break;
    } catch (e) {
      if (attempt < ATTEMPTS) { onStep?.("upload"); continue; }
      const isTimeout = /timed out/i.test(e?.message || "");
      toast(isTimeout
        ? tr('uploadImportPhoto.upload-timed-out-twice-check-your-connection-and')
        : tr('uploadImportPhoto.upload-failed') + (e?.message || ""));
      return null;
    }
  }
  const { data: pub } = sb.storage.from("recipe-import-photos").getPublicUrl(path);
  return pub?.publicUrl || null;
}

// 2026-08-10: spin-food-import's own EXTRACT_DEADLINE_MS is 65s (one OpenAI
// call plus one timeout-triggered retry, see that function's comment) - the
// generic CLIENT_INVOKE_TIMEOUT_MS (45s) used to apply here too, so a
// legitimately-slow-but-successful extract (common for photo/vision calls)
// would time out client-side while the server kept working and wrote a
// "ready" job the user never saw pop up (recoverable only via 📥 Imports).
// Give extract its own timeout comfortably above the server deadline.
const EXTRACT_CLIENT_TIMEOUT_MS = 75_000;

async function runImportExtract(sourceType, payload, targetRecipeId, setBusy) {
  syncLangFromStorage();
  const { data, error } = await invokeWithTimeout("spin-food-import", {
    body: { source_type: sourceType, action: "extract", payload: { ...payload, target_recipe_id: targetRecipeId, viewer_locale: lang } },
  }, EXTRACT_CLIENT_TIMEOUT_MS);
  if (error) { setBusy(false, ""); toast(error.message || tr('runImportExtract.something-went-wrong')); return; }
  if (!data?.ok) { setBusy(false, ""); toast(data?.error || tr('runImportExtract.couldnt-read-that-recipe')); return; }
  closeModal();
  // Defensive: openImportReview renders straight off the server draft with no
  // further validation - if it ever throws (malformed draft edge case), the
  // sheet is already closed above, so the whole add/enrich flow would
  // silently vanish with zero feedback. Never let that happen unnoticed: the
  // job is already durably saved as "ready" server-side either way, so on
  // any render failure just point the user at 📥 Imports to review it there.
  try {
    openImportReview(data.draft, data.job_id, targetRecipeId, sourceType);
  } catch (e) {
    console.error("[openImportReview] render failed", e, data.draft);
    toast(tr('runImportExtract.something-went-wrong-showing-the-review-screen-o'));
  }
}

// Review-before-save screen, per map decision #18 (allergy-safety driven -
// every extracted draft must be reviewed/editable before it becomes a real
// recipe row). Deliberately its own lightweight editor rather than reusing
// detailView()'s edit mode, which is built around an already-saved dish id.
// Bilingual review (SPEC_RECIPE_I18N.md shape, extended to the pre-save
// draft too - see 2026-08-09 CHANGELOG entry): the extraction call always
// fills both name_en/name_ru, title_en/title_ru, and text_en/text_ru, so
// the reviewer sees their own current UI language regardless of source
// language, while both languages travel together untouched into the
// eventual recipe row (no separate on-the-fly-translation step needed at
// display time, matching the "translated once, persisted" storage model).
// Editing writes back only into the language-matched field for whatever
// the reviewer is currently looking at - the untouched language's
// extracted translation is preserved, same convention as saveDetailEdit().
function openImportReview(draftRaw, jobId, targetRecipeId, sourceType) {
  syncLangFromStorage();
  const draft = normalizeImportDraftClient(draftRaw);
  let sourceLang = draft.source_lang || lang;
  let title = draft.title || "";
  let translations = draft.translations ? JSON.parse(JSON.stringify(draft.translations)) : {};
  let ingredients = (draft.ingredients || []).map(i => ({ ...i }));
  let instructions = (draft.instructions || []).map(s =>
    typeof s === "string"
      ? { text: s, photo_urls: [] }
      : { text: s.text ?? "", photo_urls: stepPhotoUrls(s) }
  );
  const youtubeUrl = draft.youtube_url || null;
  let heroPhotoUrl = draft.photo_url || null;
  let servings = draft.servings ?? null;
  // Data-quality warnings: detect client-side in UI locale (worker draft
  // dq_issues are English-only strings - never shown raw).
  // Taxonomy proposal (2026-08-09 follow-up) - server only attaches this when
  // the draft has ingredients/instructions to classify from (see
  // buildTaxonomyProposal in spin-food-import). Null means "nothing to show",
  // not "loading" - there's no separate async fetch here, it rode along with
  // the extraction response.
  let taxonomy = draft.taxonomy ? {
    cuisine: "",
    cuisineMode: "pick",
    cuisineCustom: "",
    dish_role: draft.taxonomy.dish_role || "main",
    course_category: draft.taxonomy.course_category || null,
    meal_types: new Set(draft.taxonomy.meal_types || []),
    techniques: new Set(draft.taxonomy.techniques || []),
    required_appliances: new Set(draft.taxonomy.required_appliances || []),
    reasoning: draft.taxonomy.reasoning || null,
  } : null;
  if (taxonomy) {
    const rawCuisine = (draft.taxonomy.cuisine || "").trim().toLowerCase();
    if (!rawCuisine) {
      taxonomy.cuisine = "";
      taxonomy.cuisineMode = "pick";
      taxonomy.cuisineCustom = "";
    } else if (CUISINES_BY_SLUG[rawCuisine]) {
      taxonomy.cuisine = rawCuisine;
      taxonomy.cuisineMode = "pick";
      taxonomy.cuisineCustom = "";
    } else {
      taxonomy.cuisine = rawCuisine;
      taxonomy.cuisineMode = "new";

  }

  const reviewLocale = lang;
  const ingName = (ing, idx) => importDraftIngName({ source_lang: sourceLang, title, translations, ingredients }, reviewLocale, idx, ing) || "";
  const stepText = (s, idx) => importDraftStepText({ source_lang: sourceLang, title, translations, instructions }, reviewLocale, idx, s) || "";
  const reviewTitle = () => importDraftTitle({ source_lang: sourceLang, title, translations }, reviewLocale);
  // unitDisplay()/unitFromInput() are shared top-level helpers (see convertQty
  // above) - the draft stores the canonical slug (e.g. "kg"), same as saved
  // recipes, so this reuses the exact same localization ingredientLine() does.

  const render = () => {
    v.querySelector("#revIng").innerHTML = ingredients.map((ing, i) => `
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px" data-ingidx="${i}">

        <input data-ingf="unit" value="${unitDisplay(ing.unit).replace(/"/g, "&quot;")}" placeholder="${tr('anonymous.unit')}" style="width:56px;border:1px solid #eee;border-radius:8px;padding:6px;font-size:13px">
        <input data-ingf="name" value="${ingName(ing, i).replace(/"/g, "&quot;")}" placeholder="${tr('anonymous.ingredient')}" style="flex:1;border:1px solid #eee;border-radius:8px;padding:6px;font-size:13px">
        <button class="dtl-back" data-ingdel="${i}" style="width:28px;height:28px;font-size:12px;color:#ef4444">✕</button>
      </div>`).join("") || `<div style="font-size:12px;color:#aaa">${tr('render.no-ingredients-found-add-them-manually-or-edit-t')}</div>`;
    v.querySelector("#revInstr").innerHTML = instructions.map((s, i) => `
      <div style="display:flex;gap:6px;align-items:flex-start;margin-bottom:6px" data-instridx="${i}">
        <div style="flex:0 0 20px;font-weight:800;color:#bbb;padding-top:8px;text-align:right">${i + 1}.</div>
        ${s.photo_urls[0] ? `<img src="${s.photo_urls[0]}" style="flex:0 0 44px;width:44px;height:44px;border-radius:8px;object-fit:cover;margin-top:2px">` : ""}
        <textarea data-instrinput="${i}" rows="2" style="flex:1;border:1px solid #eee;border-radius:8px;padding:6px 8px;font-size:13px;font-family:inherit">${stepText(s, i)}</textarea>
        <button class="dtl-back" data-instrdel="${i}" style="width:28px;height:28px;font-size:12px;color:#ef4444">✕</button>
      </div>`).join("") || `<div style="font-size:12px;color:#aaa">${tr('render.no-instructions-found-add-them-manually')}</div>`;
    wireRows();
  };

  const dqIssuesHtml = () => {
    const dqIssues = detectImportDqIssues(ingredients, (ing, idx) => ingName(ing, idx));
    if (!dqIssues.length) return "";
    return `
      <div style="margin-top:10px;padding:10px 12px;background:#fef3c7;border:1px solid #fbbf24;border-radius:10px">
        <div style="font-size:13px;font-weight:700;color:#92400e;margin-bottom:4px">⚠️ ${tr('dqIssuesHtml.possible-data-issues-found-please-double-check')}</div>
        <ul style="margin:0;padding-left:18px;font-size:12px;color:#92400e">

        </ul>
      </div>`;
  };

  // Recipe-details chip section - same vocab/labels/chip look as the About
  // tab's edit mode (MEALS/DISH_ROLES/COURSE_CATEGORIES/TECHNIQUES/APPLIANCES,
  // chipRow pattern) so a value picked here reads identically once saved.
  // Rendered into its own container + re-wired standalone (rather than
  // routed through the outer render()/wireRows() pair) since it has its own
  // dish_role<->course_category/meal_types locking logic to re-run on every
  // click, same invariant enforced server-side by
  // spin_food_upsert_recipe_classification.
  const taxChip = (opts, isOn, key) => opts.map(([optVal, l]) =>
    `<div class="chip ${isOn(optVal) ? "on" : ""}" data-revchip="${key}" data-val="${optVal}">${l}</div>`).join("");
  const taxHtml = () => {
    if (!taxonomy) return "";
    const isComponent = taxonomy.dish_role === "component";
    return `
      <div class="sect" style="margin-top:12px">${tr('taxHtml.recipe-details')}</div>
      ${taxonomy.reasoning ? `<div style="font-size:11px;color:#aaa;margin-bottom:4px">🤖 ${taxonomy.reasoning}</div>` : ""}

      <div class="chips-wrap">${taxChip(DISH_ROLES.map(r => [r, dishRoleLabel(r)]), v => taxonomy.dish_role === v, "dish_role")}</div>
      ${!isComponent ? `
        <div style="font-size:12px;color:#666;margin:8px 0 4px">${tr('taxHtml.meal-type')}</div>
        <div class="chips-wrap">${taxChip(MEALS.map(m => [m.k, m.ic + " " + mealN(m)]), v => taxonomy.meal_types.has(v), "meal_types")}</div>
        <div style="font-size:12px;color:#666;margin:8px 0 4px">${tr('taxHtml.course-category')}</div>
        <div class="chips-wrap">${taxChip(COURSE_CATEGORIES.map(c => [c, courseLabel(c)]), v => taxonomy.course_category === v, "course_category")}</div>` : ""}
      <div style="font-size:12px;color:#666;margin:8px 0 4px">${tr('taxHtml.techniques')}</div>
      <div class="chips-wrap">${taxChip(TECHNIQUES.map(t => [t, techLabel(t)]), v => taxonomy.techniques.has(v), "techniques")}</div>
      <div style="font-size:12px;color:#666;margin:8px 0 4px">${tr('taxHtml.appliances-needed')}</div>
      <div class="chips-wrap">${taxChip(APPLIANCES.map(a => [a, applianceLabel(a)]), v => taxonomy.required_appliances.has(v), "required_appliances")}</div>
      <div style="font-size:12px;color:#666;margin:8px 0 4px">${tr('taxHtml.cuisine')}</div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <select id="revCuisineSelect" style="min-width:140px;border:1px solid #eee;border-radius:8px;padding:6px 8px;font-size:13px">
          <option value="">${tr('detailHeaderHtml.cuisine')}</option>
          ${cuisineOptionsList().map(slug => `<option value="${slug}" ${taxonomy.cuisineMode === "pick" && taxonomy.cuisine === slug ? "selected" : ""}>${cuisineLabel(slug)}</option>`).join("")}
          <option value="__new__" ${taxonomy.cuisineMode === "new" ? "selected" : ""}>${tr('detailHeaderHtml.add-new-cuisine')}</option>

      </div>`;
  };
  const wireTax = () => {
    if (!taxonomy) return;

      } else if (key === "course_category") {

      } else if (key === "required_appliances") {
        if (taxonomy.required_appliances.has(val)) taxonomy.required_appliances.delete(val); else taxonomy.required_appliances.add(val);
      }
      v.querySelector("#revTax").innerHTML = taxHtml();
      wireTax();

  };

  const heroHtml = () => heroPhotoUrl ? `
    <div id="revHeroWrap" style="position:relative;margin-bottom:10px">
      <img src="${heroPhotoUrl}" style="width:100%;max-height:180px;object-fit:cover;border-radius:12px;display:block">
      <button class="dtl-back" id="revHeroDel" style="position:absolute;top:6px;right:6px;width:28px;height:28px;font-size:12px;color:#ef4444;background:#fff;border-radius:50%">✕</button>
    </div>` : "";

  const v = modal(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <h3 style="margin:0">👀 ${tr('openImportReview.review-before-saving')}</h3>
      <button class="mini-btn" id="revCancel">✕ ${tr('openImportReview.cancel')}</button>
    </div>
    <div id="revHero">${heroHtml()}</div>
    <div class="sect">${tr('openImportReview.title')}</div>
    <input id="revTitle" value="${(reviewTitle() || "").replace(/"/g, "&quot;")}" style="width:100%;border:2px solid #e5e7eb;border-radius:12px;padding:10px;font-size:15px">
    ${youtubeUrl ? `<div style="font-size:12px;margin-top:6px"><a href="${youtubeUrl}" target="_blank" rel="noopener" style="color:var(--amber,#d97706);text-decoration:none">▶️ ${tr('openImportReview.video-found-will-be-linked-on-the-recipe')}</a>${draft.creator_name ? ` <span style="color:#999">· ${tr('openImportReview.by')} ${draft.creator_name}</span>` : ""}</div>` : ""}
    <div style="margin-top:8px;display:flex;align-items:center;gap:6px;font-size:13px;color:#666">👥 ${tr('openImportReview.serves')} <input id="revServings" type="number" min="1" value="${servings ?? ""}" placeholder="4" style="width:56px;border:1px solid #eee;border-radius:8px;padding:5px 6px;font-size:13px"></div>
    ${dqIssuesHtml()}
    <div class="sect">${tr('openImportReview.ingredients')}</div>
    <div id="revIng"><div style="font-size:12px;color:#aaa;padding:4px 0">${tr('anonymous.ai-is-translating')}</div></div>
    <button class="mini-btn" id="revIngAdd" style="margin-top:2px">+ ${tr('openImportReview.add-ingredient')}</button>
    <div class="sect" style="margin-top:12px">${tr('openImportReview.instructions')}</div>
    <div id="revInstr"><div style="font-size:12px;color:#aaa;padding:4px 0">${tr('anonymous.ai-is-translating')}</div></div>
    <button class="mini-btn" id="revInstrAdd" style="margin-top:2px">+ ${tr('openImportReview.add-step')}</button>
    <div id="revTax">${taxHtml()}</div>
    <button class="btn btn-primary" id="revSave" style="width:100%;margin-top:18px">💾 ${tr('openImportReview.save')}</button>
    <div id="revSaveStatus" style="font-size:13px;color:#888;margin-top:8px;min-height:18px;text-align:center"></div>
    <div id="revSaveProgressTrack" style="height:4px;background:#eee;border-radius:2px;overflow:hidden;display:none"><div id="revSaveProgressFill" style="height:100%;width:0%;background:var(--amber,#f59e0b);transition:width .25s ease"></div></div>`,
    { preventBackdropClose: true });
  wireTax();

  v.querySelector("#revCancel").onclick = () => closeModal();
  const wireHero = () => {
    const delBtn = v.querySelector("#revHeroDel");
    if (delBtn) delBtn.onclick = () => { heroPhotoUrl = null; v.querySelector("#revHero").innerHTML = heroHtml(); wireHero(); };
  };
  wireHero();

  v.querySelector("#revTitle").addEventListener("input", (e) => {
    if (reviewLocale === sourceLang) title = e.target.value;
    else { ensureImportTranslationBlock({ translations }, reviewLocale); translations[reviewLocale].title = e.target.value; }
  });
  v.querySelector("#revServings").addEventListener("input", (e) => {
    servings = e.target.value === "" ? null : Number(e.target.value);
  });

  function wireRows() {
    v.querySelectorAll("[data-ingidx]").forEach(row => {
      const i = Number(row.dataset.ingidx);
      row.querySelectorAll("[data-ingf]").forEach(inp => inp.addEventListener("input", () => {
        const f = inp.dataset.ingf;
        if (f === "qty") { ingredients[i].qty = inp.value === "" ? null : Number(inp.value); return; }
        if (f === "name") {
          if (reviewLocale === sourceLang) ingredients[i].name = inp.value;
          else {
            ensureImportTranslationBlock({ translations, ingredients, instructions }, reviewLocale);
            if (!translations[reviewLocale].ingredients[i]) translations[reviewLocale].ingredients[i] = { name: "" };
            translations[reviewLocale].ingredients[i].name = inp.value;
          }
          return;
        }
        if (f === "unit") { ingredients[i].unit = unitFromInput(inp.value); return; }
        ingredients[i][f] = inp.value;
      }));
    });
    v.querySelectorAll("[data-ingdel]").forEach(btn => btn.addEventListener("click", () => {
      ingredients.splice(Number(btn.dataset.ingdel), 1); render();
    }));
    v.querySelectorAll("[data-instrinput]").forEach(ta => ta.addEventListener("input", () => {
      const i = Number(ta.dataset.instrinput);
      if (reviewLocale === sourceLang) instructions[i].text = ta.value;
      else {
        ensureImportTranslationBlock({ translations, ingredients, instructions }, reviewLocale);
        if (!translations[reviewLocale].instructions[i]) translations[reviewLocale].instructions[i] = { text: "" };
        translations[reviewLocale].instructions[i].text = ta.value;
      }
    }));
    v.querySelectorAll("[data-instrdel]").forEach(btn => btn.addEventListener("click", () => {
      instructions.splice(Number(btn.dataset.instrdel), 1); render();
    }));
  }
  const bootReviewLocale = async () => {
    const draftSnap = { source_lang: sourceLang, title, translations, ingredients, instructions };
    const needsHydrate = reviewLocale !== sourceLang
      && !importDraftLocaleComplete(draftSnap, reviewLocale);
    if (!needsHydrate) {
      render();
      return;
    }
    try {
      const block = await hydrateImportDraftReviewLocale({ source_lang: sourceLang, title, translations, ingredients, instructions }, reviewLocale);
      if (block?.title) {
        translations[reviewLocale] = block;
        const titleEl = v.querySelector("#revTitle");
        if (titleEl) titleEl.value = reviewTitle();
      }
    } catch (e) {
      console.error("[openImportReview] locale hydrate failed", e);
      toast(tr('detailHeaderHtml.translation-failed'));
    }
    render();
  };
  bootReviewLocale();

  v.querySelector("#revIngAdd").onclick = () => { ingredients.push({ name: "", qty: null, unit: null, note: null, section: null }); render(); };
  v.querySelector("#revInstrAdd").onclick = () => { instructions.push({ text: "", photo_urls: [] }); render(); };

  // 2026-08-10: save used to be one giant confirm call that also ran
  // ingredient classification + translation synchronously server-side -
  // slow enough (sequential per-ingredient LLM calls for a recipe with
  // several never-seen ingredients) to blow past any client timeout even
  // though it kept working and saved fine in the background (see
  // CHANGELOG "fixed the confirm save silently timing out"). Now split
  // into 3 real, separately-timed steps so the user sees true progress and
  // never gets a false "failed" while the save actually succeeded:
  //   1. confirm  - insert/update the recipe row + taxonomy (fast).
  //   2. ingest classify  - per-ingredient + recipe-level classification.
  //   3. ingest translate - fills in any still-missing translated side.
  // Steps 2-3 are best-effort: any failure/timeout there is shown as a
  // soft warning, never as "save failed" - the recipe from step 1 is real
  // and already in the cookbook either way.
  const INGEST_CLIENT_TIMEOUT_MS = 100_000; // server's own deadline per stage is 90s
  const saveBtn = v.querySelector("#revSave");
  const saveStatusEl = v.querySelector("#revSaveStatus");
  const saveProgressTrack = v.querySelector("#revSaveProgressTrack");
  const saveProgressFill = v.querySelector("#revSaveProgressFill");
  const cancelBtn = v.querySelector("#revCancel");
  const SAVE_STEPS = 3;
  const setSaveProgress = (step, msg) => {
    saveStatusEl.textContent = msg;
    saveProgressTrack.style.display = "block";
    saveProgressFill.style.width = `${Math.round((step / SAVE_STEPS) * 100)}%`;
  };
  v.querySelector("#revSave").onclick = async () => {
    saveBtn.disabled = true;
    cancelBtn.disabled = true; cancelBtn.style.opacity = .4;
    saveBtn.textContent = "💾 " + tr('anonymous.saving');
    setSaveProgress(0, tr('anonymous.saving-recipe'));
    let confirmCuisine = null;
    if (taxonomy) {
      const draftCuisine = taxonomy.cuisineMode === "new"
        ? (taxonomy.cuisineCustom || "").trim()
        : (taxonomy.cuisine || "").trim().toLowerCase();
      if (taxonomy.cuisineMode === "new" && draftCuisine) {
        const slug = slugifyCuisine(draftCuisine);
        const labels = { en: draftCuisine };
        if (lang === "uk") labels.uk = draftCuisine;
        if (lang === "nl") labels.nl = draftCuisine;
        if (lang === "ru") labels.ru = draftCuisine;
        const { error: cuiErr } = await sb.rpc("spin_food_cuisine_add", {
          p_slug: slug,
          p_label_en: draftCuisine,
          p_labels_i18n: labels,
        });
        if (cuiErr) {
          toast(tr('saveDetailEdit.cuisine-add-failed') + cuiErr.message);
          saveBtn.disabled = false; saveBtn.textContent = "💾 " + tr('openImportReview.save');
          cancelBtn.disabled = false; cancelBtn.style.opacity = 1;
          saveStatusEl.textContent = ""; saveProgressTrack.style.display = "none";
          return;
        }
        filterVocabLoaded = false;
        await loadFilterVocabulary();
        confirmCuisine = slug;
      } else if (draftCuisine) {
        confirmCuisine = draftCuisine;
      }
    }
    const sourceTitle = importDraftTitle({ source_lang: sourceLang, title, translations }, sourceLang);
    const finalDraft = {
      source_lang: sourceLang,
      title: sourceTitle,
      translations,
      title_en: (translations.en?.title || sourceTitle || "").trim(),
      title_ru: (translations.ru?.title || "").trim() || null,
      ingredients: ingredients.filter(i => (i.name || "").trim()),
      instructions: instructions
        .map(s => ({ text: (s.text || "").trim(), photo_urls: s.photo_urls || [] }))
        .filter(s => s.text),
      photo_url: heroPhotoUrl,
      youtube_url: youtubeUrl,
      servings: servings || null,
      // 2026-08-14: draft.prep_time_minutes/cook_time_minutes/total_time_minutes
      // (T2, map #45) were being extracted correctly server-side but silently
      // dropped here - finalDraft never carried them, so the server's own
      // acceptance of these fields was unreachable from a real save. Caught
      // live: a real Dutch import extracted cook_time_minutes=25 but saved
      // with it null.
      prep_time_minutes: draft.prep_time_minutes ?? null,
      cook_time_minutes: draft.cook_time_minutes ?? null,
      total_time_minutes: draft.total_time_minutes ?? null,
      // T6 (wayfinder map #45): creator attribution - only ever populated
      // by the YouTube worker (oEmbed), but forwarded unconditionally like
      // every other draft field so it isn't silently dropped the way T2's
      // timing/difficulty fields were before that gap was caught live.
      creator_name: draft.creator_name ?? null,
      creator_handle: draft.creator_handle ?? null,
      source_url: draft.source_url ?? null,
      source_video_id: draft.source_video_id ?? null,
      taxonomy: taxonomy ? {
        cuisine: confirmCuisine,
        dish_role: taxonomy.dish_role || "main",
        course_category: taxonomy.course_category,
        meal_types: [...taxonomy.meal_types],
        techniques: [...taxonomy.techniques],
        required_appliances: [...taxonomy.required_appliances],
        difficulty: taxonomy.difficulty ?? null,
        reasoning: taxonomy.reasoning,
      } : null,
    };
    const { data, error } = await invokeWithTimeout("spin-food-import", {
      body: { source_type: sourceType, action: "confirm", payload: { job_id: jobId, draft: finalDraft, target_recipe_id: targetRecipeId } },
    });
    if (error || !data?.ok) {
      // Safe to retry from here even after a client-side timeout:
      // spin-food-import's confirm is idempotent on job_id now - a retry
      // either re-attempts cleanly or recognizes the job as already
      // confirmed and hands back the same recipe, never a duplicate.
      toast((error && error.message) || data?.error || tr('anonymous.save-failed'));
      saveBtn.disabled = false; saveBtn.textContent = "💾 " + tr('anonymous.save');
      cancelBtn.disabled = false; cancelBtn.style.opacity = 1;
      saveStatusEl.textContent = ""; saveProgressTrack.style.display = "none";
      return;
    }
    const recipeId = data.recipe?.id;
    const warnings = [];
    if (recipeId) {
      setSaveProgress(1, tr('anonymous.ai-is-classifying-ingredients'));
      const classifyRes = await invokeWithTimeout("spin-food-import", {
        body: { source_type: sourceType, action: "ingest", payload: { recipe_id: recipeId, stage: "classify" } },
      }, INGEST_CLIENT_TIMEOUT_MS);
      if (classifyRes.error || classifyRes.data?.warning) warnings.push("classify");

      setSaveProgress(2, tr('anonymous.ai-is-translating'));
      const translateRes = await invokeWithTimeout("spin-food-import", {
        body: { source_type: sourceType, action: "ingest", payload: { recipe_id: recipeId, stage: "translate" } },
      }, INGEST_CLIENT_TIMEOUT_MS);
      if (translateRes.error || translateRes.data?.warning) warnings.push("translate");
    }
    setSaveProgress(3, tr('anonymous.done'));
    saveProgressTrack.style.display = "none";
    saveStatusEl.textContent = warnings.length
      ? tr('anonymous.saved-some-ai-enrichment-didnt-finish-you-can-re')
      : "";
    // 2026-08-10 fix: this used to call render_() here, immediately after
    // loadCatalog() - but the review modal is a DOM child of #app (see
    // modal()), and render_()/render() does a hard `app.innerHTML = ...`
    // rewrite. That wiped the still-open modal (and this very Save button)
    // straight off the page before any of the "turn into a green Done!
    // button" code below ever got a chance to be seen - user report:
    // "the addition screen disappeared just like it crashed - no green
    // done button, no card in spinner." The card *was* saved fine
    // server-side (loadCatalog() below already refreshes the in-memory
    // catalog) - only the visible confirmation was destroyed. Only
    // loadCatalog() (data-only, no DOM touch) happens here now; the actual
    // re-render is deferred to the Done button's own click, after
    // closeModal() has cleanly removed the veil first.
    //
    // 2026-08-14: loadCatalog() calls sb.rpc() directly - the raw
    // supabase-js client method, not the invokeWithTimeout() raw-fetch
    // bypass every other call in this handler already uses specifically
    // because sb.*'s own session/token handling can wedge on a stuck
    // cross-tab navigator.locks mutex (see invokeWithTimeout's own header
    // comment). Caught live: a real save hung forever right here, with the
    // recipe already fully saved server-side (confirm + classify + translate
    // all completed) but the button stuck on "Saving..." because this one
    // unguarded await never resolved. Bounded with the same race-a-timeout
    // pattern as invokeWithTimeout - a stale catalog for one refresh cycle
    // is a much smaller cost than a permanently stuck save button.
    await Promise.race([
      loadCatalog(),
      new Promise((resolve) => setTimeout(resolve, 15_000)),
    ]);
    // Save button becomes a pleasant green "Done!" landing spot rather than
    // auto-navigating away - same "no surprise exits" principle as the
    // preventBackdropClose guard on this whole modal.
    saveBtn.disabled = false;
    saveBtn.style.background = "#22c55e";
    saveBtn.style.borderColor = "#22c55e";
    saveBtn.textContent = "✅ " + tr('anonymous.done');
    cancelBtn.style.display = "none";
    saveBtn.onclick = () => {
      closeModal();
      promoteRecipeInDeck(recipeId);
      render_();
      const savedPlatform = data.recipe && data.recipe.family_id == null;
      toast(targetRecipeId
        ? tr('anonymous.recipe-enriched')
        : savedPlatform
          ? tr('anonymous.saved-to-stf-global-find-it-in-spin-anytime')
          : tr('anonymous.saved-to-the-family-cookbook'));
      if (recipeId) openDetail(recipeId);
    };
  };
}
// Alias avoids shadowing the local render() closure above with the app's
// top-level render() while keeping the call obviously "re-render the app".
function render_() { render(); }

function toast(msg) {
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}
// Same look as toast(), but for messages worth actually reading (e.g. what the
// quick-hide eye icon just did, and where to go to change the default) - stays
// up to 15s, or dismisses immediately on tap, instead of the standard 2.2s blip.
function stickyToast(msg) {
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  t.style.cursor = "pointer";
  document.body.appendChild(t);
  const timer = setTimeout(() => t.remove(), 15000);
  t.addEventListener("click", () => { clearTimeout(timer); t.remove(); });
}

// A synchronous exception thrown inside a click handler (e.g. building an
// activity-log string off a stale/missing dish() lookup) used to fail
// completely silently: no toast, no visible sign anything happened, and -
// critically - whatever mutation the user just triggered never even reached
// the RPC call, so nothing landed in food.events or food.meal_slots either
// (Kobzar smoke test, 2026-08-16: "planned slots disappeared", zero server
// writes, no error shown). Individual crash sites are hardened via dishOr(),
// but this net catches the *next* one - anything uncaught surfaces as a
// visible toast instead of vanishing invisibly.
window.addEventListener("error", (e) => {
  console.error("[stf-uncaught]", e.error || e.message);
  // 2026-08-18: this net was toast-only with zero server-side trace, so every
  // report of a bare "something went wrong" (e.g. 2026-08-18 onboarding
  // report) meant blind code-reading with no stack trace to confirm the fix.
  logClientDiagnostic("uncaught_error", { message: e.error?.message || String(e.message || e), stack: e.error?.stack || null, filename: e.filename || null, lineno: e.lineno || null });
  toast(tr('anonymous.something-went-wrong-please-try-that-again'));
});
window.addEventListener("unhandledrejection", (e) => {
  console.error("[stf-uncaught-promise]", e.reason);
  logClientDiagnostic("uncaught_rejection", { message: e.reason?.message || String(e.reason), stack: e.reason?.stack || null });
  toast(tr('anonymous.something-went-wrong-please-try-that-again'));
});

// ── boot ──
// Auth-first: check for an existing session (or a magic-link callback in the
// URL fragment, handled by detectSessionInUrl). Only start realtime + load
// spin_play_state once we have both a session and a membership row.
(async function () {
  await loadUiLocales();
  const { data: sessData } = await sb.auth.getSession();
  authSession = sessData.session;

  // React to future auth events (magic-link login, sign-out, tab sync).
  sb.auth.onAuthStateChange(async (event, session) => {
    authSession = session;
    // Don't re-render over the language gate — Safari loses dynamic tap handlers.
    if (needsDeviceLangGate()) return;
    if (event === "SIGNED_IN") {
      await refreshMembership();
      if (membership && !rtChan) {
        if (!me) me = membership.member_id;
        joinPresence();
        await kickLoad();
        if (game) {
          subscribe();
          startSyncWatchers();
        }
      }
    } else if (event === "SIGNED_OUT") {
      membership = null; me = null; game = null; loadError = null;
    }
    render();
  });

  if (authSession) await refreshMembership();
  applyMembershipLocale();

  // Housekeeping: if the caller lands with ?invite=<token> in the URL but is
  // already a member (e.g. they clicked their own old invite link), strip the
  // token so a refresh doesn't try to accept it again.
  if (authSession && membership && inviteTokenInUrl) {
    const u = new URL(location.href);
    u.searchParams.delete("invite");
    history.replaceState({}, "", u.toString());
  }

  render(); // sign-in gate / invitation onboarding / lang gate / app

  // If we already have auth + membership on cold boot, start the game plumbing.
  // Skip while the language gate is showing — let the user pick first.
  if (authSession && membership && !needsDeviceLangGate()) {
    if (!me && membership) me = membership.member_id;
    joinPresence();
    if (!game) await kickLoad();
    if (game) {
      subscribe();
      startSyncWatchers();
    }
    render();
  }
})();
</script>
</body>
</html>
