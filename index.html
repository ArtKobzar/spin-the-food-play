// visible guarantee everyone converges even if the socket dropped.
function applyRemoteFromSnapshot(snap) {
  if (!snap) return;
  game = snapshotToGame(snap);
  if (!game.profiles) game.profiles = {};
  if (shouldDefer()) { pendingRemote = true; return; }
  render();
}

// True if the snapshot names a recipe id our local DISHES cache has never
// heard of - e.g. someone else's device just forked a recipe (T6 "make it
// mine" edit) or finished a fresh YouTube import, and the fork/import landed
// in food.meal_slots/wishes/duel_proposals before our periodic poll's
// loadCatalog() caught up. Left unresolved, dishOr()'s UNKNOWN_DISH fallback
// renders a generic "a recipe"/"рецепт" placeholder in the menu forever
// instead of the real title, until something else happens to trigger a
// catalog refresh (2026-08-16, Kobzar smoke test: forked Tiramisu showed as
// a bare "рецепт" placeholder in the Friday dinner proposal).
function snapshotHasUnknownDish(snap) {
  const known = new Set(DISHES.map(d => d.id));
  // Meal-grain refactor (2026-08-18): walk meals[].dishes[] instead of slots.
  // Also scan next_meals so a recipe planned into next week (Sprint 4 preview)
  // still triggers a catalog refresh.
  const scanMeals = (meals) => {
    for (const m of (meals || [])) {
      for (const d of (m.dishes || [])) {
        if (d.recipe_id && !known.has(d.recipe_id)) return true;
        if (d.proposal?.recipe_id && !known.has(d.proposal.recipe_id)) return true;
      }
    }
    return false;
  };
  if (scanMeals(snap.meals)) return true;
  if (scanMeals(snap.next_meals)) return true;
  for (const w of (snap.wishes || [])) {
    if (w.recipe_id && !known.has(w.recipe_id)) return true;
  }
  for (const p of (snap.duel?.proposals || [])) {
    if (p.recipe_id && !known.has(p.recipe_id)) return true;
  }
  return false;
}

async function pullLatest() {
  const { data: snap, error } = await sb.rpc("spin_food_snapshot");
  if (!error && snap) {
    clearOfflineBanner();
    if (snapshotHasUnknownDish(snap)) await loadCatalog();
    applyRemoteFromSnapshot(snap);
  } else if (error && !navigator.onLine) {
    showOfflineBanner();
  }
}

function showOfflineBanner() {
  if (document.querySelector(".offline")) return; // already shown, don't stack
  document.body.insertAdjacentHTML("afterbegin",
    `<div class="offline">${T("offline - changes will sync once you're back online", "нет сети - изменения синхронизируются, когда сеть появится")}</div>`);
}
function clearOfflineBanner() {
  document.querySelectorAll(".offline").forEach(el => el.remove());
}
window.addEventListener("online", clearOfflineBanner);

// Session B (T6 auto-fork): recipe_edit_proposed / recipe_photo_added /
// recipe_photo_removed can trigger a server-side auto-fork of a
// platform/chef-granted recipe into the family's own cookbook (the "make
// it mine" moment - see 20260816090000 migration). When that happens,
// food.apply_event echoes _forked_from_recipe_id/_forked_recipe_id back
// on the event payload. Stashed here rather than threaded through every
// applyEvent() call site's return value (13 call sites, most of which
// never care) - the handful of call sites that DO care read this right
// after their own applyEvent() call, before any other await can race it.
let lastForkInfo = null;
// 2026-08-16: several Kobzar smoke-test reports this session ("planned slots
// disappeared", "friday dinner still shows the wrong recipe") turned out to
// share one shape - the mutation left literally zero trace anywhere: no
// food.events row, no toast, nothing in food.client_diagnostics (that logger
// only ever covered photo uploads, a near-identical 2026-08-10 incident).
// Every server-side repro of the exact same RPC call succeeded in under a
// second, so this is a client/network-layer failure the server can never
// see on its own. Two changes close that gap: (1) withTimeout() so a
// promise that never settles can't leave an action in permanent silent
// limbo, always resolving to a definite success/failure within 20s; (2) a
// diagnostic breadcrumb on every attempt/outcome, so the *next* occurrence
// leaves a paper trail in food.client_diagnostics instead of requiring
// hours of DB archaeology to even confirm nothing happened.
async function applyEvent(eventType, payload) {
  logClientDiagnostic("apply_event_start", { event_type: eventType });
  let data, error;
  try {
    ({ data, error } = await withTimeout(
      sb.rpc("spin_food_apply_event", { p_event_type: eventType, p_payload: payload }),
      20000,
      "Sync"
    ));
  } catch (e) {
    logClientDiagnostic("apply_event_exception", { event_type: eventType, message: e?.message || String(e) });
    if (!navigator.onLine) {
      showOfflineBanner();
    } else {
      toast(T("Sync error: ", "Ошибка синхронизации: ") + (e?.message || String(e)));
    }
    lastForkInfo = null;
    return false;
  }
  if (error) {
    logClientDiagnostic("apply_event_error", { event_type: eventType, message: error?.message || String(error) });
    // navigator.onLine is the only case that actually means "offline" - any
    // other RPC failure (validation, permissions, a real server error) is a
    // distinct problem and showing the same "you're offline" banner for it is
    // actively misleading. That banner also used to never get cleared, so a
    // single blip left it stuck on screen (and stacking duplicates) for the
    // rest of the session regardless of cause (user report, 2026-08-08).
    if (!navigator.onLine) {
      showOfflineBanner();
    } else {
      toast(T("Sync error: ", "Ошибка синхронизации: ") + error.message);
    }
    lastForkInfo = null;
    return false;
  }
  clearOfflineBanner();
  logClientDiagnostic("apply_event_ok", { event_type: eventType, seq: data?.seq ?? null });
  const forkedId = data?.payload?._forked_recipe_id;
  lastForkInfo = forkedId ? { from: data.payload._forked_from_recipe_id, to: forkedId } : null;
  return true;
}

let saving = false;
async function persist() { /* legacy no-op; game state lives in food.* */ }

async function commitAndSync(text, eventType, payload) {
  if (text) act(text);
  render();
  // 2026-08-18 fix: this used to also gate on `!activePlanId`, silently
  // dropping every non-plan-scoped event (member_profile_updated,
  // recipe_added/edited, wish/duel events not tied to a slot) whenever
  // load()/ensureActivePlan() hadn't set activePlanId yet - e.g. every fresh
  // onboarding, since the wizard's own commitAndSync call is the very first
  // one after signup. No RPC ever fired, no toast, no client_diagnostics
  // breadcrumb (that logger lives inside applyEvent, never reached). The
  // wizard rendered success locally (game.profiles[me] set before this
  // call), so a user could "complete" onboarding every single reload and
  // never actually persist anything server-side. Plan-scoped events already
  // carry their own plan_id inside the payload via slotPayload() - the
  // server validates that independently, so this client-side gate was
  // redundant for them and actively harmful for everything else.
  if (!eventType) return;
  saving = true;
  const ok = await applyEvent(eventType, payload);
  saving = false;
  if (ok) await pullLatest();
  return ok;
}
function act(text) { game.activity.unshift({ id: rid(), who: me, text, ts: Date.now() }); game.activity = game.activity.slice(0, 30); }

let rtChan;
function subscribe() {
  if (!membership?.family_id) return;
  if (rtChan) sb.removeChannel(rtChan);
  rtChan = sb.channel("food-events-" + membership.family_id)
    .on("postgres_changes", {
      event: "INSERT",
      schema: "food",
      table: "events",
      filter: "family_id=eq." + membership.family_id,
    }, () => { pullLatest(); loadFamilyFeed(); })
    // Import job status nudge - a toast on top of the Family-tab feed entry
    // (added by loadFamilyFeed(), not the only place a result lives).
    // INSERT: dedup-at-extract inserts status=ready + result_recipe_id with no
    // draft (never queued for the worker) - was silent before 2026-08-16.
    .on("postgres_changes", {
      event: "INSERT",
      schema: "food",
      table: "recipe_import_jobs",
      filter: "family_id=eq." + membership.family_id,
    }, (payload) => {
      loadFamilyFeed();
      const job = payload.new;
      if (job.source_type === "youtube" && job.status === "ready" && job.result_recipe_id && !job.draft) {
        notifyDuplicateYoutubeImport(job.result_recipe_id);
      }
    })
    .on("postgres_changes", {
      event: "UPDATE",
      schema: "food",
      table: "recipe_import_jobs",
      filter: "family_id=eq." + membership.family_id,
    }, (payload) => {
      loadFamilyFeed();
      const job = payload.new;
      if (job.source_type === "youtube" && job.status === "ready") {
        if (job.result_recipe_id && !job.draft) {
          notifyDuplicateYoutubeImport(job.result_recipe_id);
        } else {
          stickyToast(T("Your YouTube recipe is ready to review! Check the Family tab.", "Рецепт из YouTube готов к проверке! Смотри вкладку «Семья»."));
        }
      } else if (job.source_type === "youtube" && job.status === "failed") {
        stickyToast(T("Couldn't extract a recipe from that video.", "Не удалось получить рецепт из этого видео."));
      }
    })
    .subscribe();
}

function startSyncWatchers() {
  const wake = () => { if (!document.hidden) { pullLatest(); if (rtChan && rtChan.state !== "joined") subscribe(); } };
  document.addEventListener("visibilitychange", wake);
  window.addEventListener("focus", wake);
  window.addEventListener("online", wake);
  setInterval(() => { if (!document.hidden) pullLatest(); }, 4000);
}
let presenceChan;
function joinPresence() {
  presenceChan = sb.channel("presence-" + FAMILY_KEY, { config: { presence: { key: me } } });
  presenceChan.on("presence", { event: "sync" }, () => {
    online = new Set(Object.values(presenceChan.presenceState()).flat().map(p => p.who));
    if (!modalOpen) render();
  }).subscribe(async s => { if (s === "SUBSCRIBED") await presenceChan.track({ who: me }); });
}

// ── mutations (event-sourced via spin_food_apply_event) ──

function assignToSlot(day, mealKey, dishId, cook) {
  const cur = game.week[day][mealKey];
  const d = dishOr(dishId);
  // Session B: slot_filled's server-side assert is now grant-aware
  // (assert_recipe_accessible_to_family), so platform/chef-granted
  // recipes can be planned directly - no client-side guard needed.
  if (cur && cur.dish) {
    game.week[day][mealKey].proposal = { dish: dishId, cook, by: me };
    commitAndSync(
      `${mem(me).en} proposed ${d.em} ${d.en} for ${DAYS[day]} ${MEALS.find(m=>m.k===mealKey).n.toLowerCase()}`,
      "dish_proposal_created",
      slotPayload(day, mealKey, { proposal: { recipe_id: dishId, cook_member_id: cook, assigned_by_member_id: me } })
    );
    toast(T("Sent to the menu - family votes 🔔", "Отправлено в меню - семья решает 🔔"));
  } else {
    game.week[day][mealKey] = { dish: dishId, cook, by: me, accepted: cook === me };
    const who = cook === me ? "" : ` - ${mem(cook).en} must accept`;
    commitAndSync(
      `${mem(me).en} added ${d.em} ${d.en} to ${DAYS[day]}${who}`,
      "dish_assigned",
      slotPayload(day, mealKey, { recipe_id: dishId, cook_member_id: cook, assigned_by_member_id: me })
    );
    toast(cook === me ? T("Added and you're cooking it ✅", "Добавлено - и готовишь ты ✅") : T("Added - ", "Добавлено - ") + mName(mem(cook)) + T(" pinged to accept 🔔", " получил(а) пинг 🔔"));
  }
}
function acceptCook(day, mealKey) {
  game.week[day][mealKey].accepted = true;
  commitAndSync(`${mem(me).en} accepted cooking ${dishOr(game.week[day][mealKey].dish).em} on ${DAYS[day]}`, "dish_cook_accepted", slotPayload(day, mealKey));
}
function declineCook(day, mealKey) {
  const d = dishOr(game.week[day][mealKey].dish);
  game.week[day][mealKey] = null;
  commitAndSync(`${mem(me).en} declined to cook ${d.em} ${d.en} on ${DAYS[day]}`, "dish_cook_declined", slotPayload(day, mealKey));
  toast(T("Declined - the meal was removed", "Отклонено - блюдо убрано из меню"));
}
function reassignCook(day, mealKey, newCook) {
  const s = game.week[day][mealKey];
  s.cook = newCook; s.accepted = false; s.by = me; s.viaAi = false;
  commitAndSync(
    `${mem(me).en} reassigned ${dishOr(s.dish).em} on ${DAYS[day]} to ${mem(newCook).en}`,
    "dish_cook_reassigned",
    slotPayload(day, mealKey, { cook_member_id: newCook, assigned_by_member_id: me })
  );
  toast(T("Sent - ", "Отправлено - ") + mName(mem(newCook)) + T(" must accept, decline, or reassign", " должен принять, отклонить или передать дальше"));
}
function acceptProposal(day, mealKey) {
  const s = game.week[day][mealKey]; const p = s.proposal;
  game.week[day][mealKey] = { dish: p.dish, cook: p.cook, by: p.by, viaAi: !!p.viaAi, accepted: p.cook === p.by };
  commitAndSync(`${mem(me).en} accepted the swap to ${dishOr(p.dish).em} on ${DAYS[day]}`, "dish_proposal_accepted", slotPayload(day, mealKey));
}
function rejectProposal(day, mealKey) {
  const s = game.week[day][mealKey]; const p = s.proposal; delete s.proposal;
  commitAndSync(`${mem(me).en} rejected the ${dishOr(p.dish).em} swap for ${DAYS[day]}`, "dish_proposal_rejected", slotPayload(day, mealKey));
}
function clearSlot(day, mealKey) {
  game.week[day][mealKey] = null;
  commitAndSync(`${mem(me).en} cleared ${DAYS[day]} ${MEALS.find(m=>m.k===mealKey).n.toLowerCase()}`, "dish_cleared", slotPayload(day, mealKey));
}

// ── render ──
const app = document.getElementById("app");
function render() {
  syncLangFromStorage();

  // 1. Language first (device-level, before sign-in).
  if (needsDeviceLangGate()) return renderLangGate();

  // 2. Auth gate.
  if (!authSession) return renderSignInGate();

  // 3. Invitation / membership onboarding.
  if (!membership) return renderInvitationOnboarding();

  if (!me && membership) me = membership.member_id;

  if (!game) {
    if (authSession && membership) {
      if (loadError) {
        app.innerHTML = `<div class="gate"><h1>🍲</h1>
          <p>${T("Could not load the family kitchen.", "Не удалось загрузить семейную кухню.")}</p>
          <p style="font-size:12px;opacity:.75;max-width:320px">${loadError}</p>
          <button class="who-btn" id="loadRetry" style="margin-top:12px">${T("Try again", "Повторить")}</button>
          <button class="mini-btn" id="loadSignOut" style="margin-top:8px">${T("Sign out", "Выйти")}</button></div>`;
        document.getElementById("loadRetry").onclick = () => { loadError = null; game = null; kickLoad(); };
        document.getElementById("loadSignOut").onclick = async () => {
          await sb.auth.signOut();
          authSession = null;
          membership = null;
          me = null;
          game = null;
          loadError = null;
          render();
        };
        return;
      }
      app.innerHTML = `<div class="gate"><h1>🍲</h1><p>${T("Loading the family kitchen...", "Загружаем семейную кухню...")}</p></div>`;
      kickLoad();
      return;
    }
    app.innerHTML = `<div class="gate"><h1>🍲</h1><p>${T("Loading the family kitchen...", "Загружаем семейную кухню...")}</p></div>`;
    return;
  }
  if (!game.profiles[me]) return renderOnboard();
  app.innerHTML = topbar() + ({ menu: renderMenu, spin: renderSpin, wish: renderWish, duel: renderDuel, feed: renderFeed }[tab])() + nav();
  wire();
}

// ── auth screens (Week 1) ─────────────────────────────────────────
// Sign-in gate: email input -> Supabase Auth sends a magic link. On click,
// the invitee is redirected back to this page with the session established
// and the invite token still in the URL (if any).
function renderSignInGate() {
  // Driven by whatever language the device-level gate already picked
  // (render() runs that gate before this one) - only falls back to English
  // if somehow reached with no language chosen yet.
  const hasInvite = Boolean(inviteTokenInUrl);
  app.innerHTML = `<div class="gate">
    <h1>🍲 Spin the Food</h1>
    <p>${hasInvite
      ? T("You've been invited to a family kitchen.<br>Sign in with your email to join.", "Тебя пригласили в семейную кухню.<br>Войди по email, чтобы присоединиться.")
      : T("Sign in to your family kitchen", "Войди в семейную кухню")}</p>
    <input id="signinEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"
      style="width:100%;padding:14px;font-size:16px;border:2px solid #e5e7eb;border-radius:14px;background:#fff;text-align:center">
    <button class="btn btn-primary" id="signinGo" style="width:100%">${T("Send magic link ✉️", "Отправить ссылку ✉️")}</button>
    <div id="signinCodeBox" style="display:none;flex-direction:column;gap:14px;margin-top:4px">
      <input id="signinCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="${T("code from email", "код из письма")}"
        style="width:100%;padding:14px;font-size:20px;letter-spacing:4px;border:2px solid #e5e7eb;border-radius:14px;background:#fff;text-align:center">
      <button class="btn btn-primary" id="signinVerify" style="width:100%">${T("Verify code", "Подтвердить код")}</button>
      <button class="btn btn-ghost" id="signinResend" style="width:100%">${T("Resend", "Отправить снова")}</button>
    </div>
    <div id="signinNote" style="color:#888;font-size:13px;line-height:1.5">
      ${T("We'll email you a one-tap link. No password.", "Пришлём ссылку на email. Пароль не нужен.")}
    </div>
  </div>`;
  const input = document.getElementById("signinEmail");
  const btn = document.getElementById("signinGo");
  const note = document.getElementById("signinNote");
  const codeBox = document.getElementById("signinCodeBox");
  const codeInput = document.getElementById("signinCode");
  const verifyBtn = document.getElementById("signinVerify");
  const resendBtn = document.getElementById("signinResend");
  let sentEmail = "";
  const send = async () => {
    const email = (input.value || "").trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      note.textContent = T("That doesn't look like a valid email.", "Похоже, это не корректный email.");
      note.style.color = "#ef4444";
      return false;
    }
    btn.disabled = true; btn.textContent = T("Sending...", "Отправляю...");
    // The redirect URL preserves invite + family params so a fresh browser
    // that opens the emailed link lands in the same room as the owner.
    const redirectUrl = new URL(location.href);
    // Strip supabase-added auth fragments if any (belt & braces).
    redirectUrl.hash = "";
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: redirectUrl.toString() },
    });
    if (error) {
      note.textContent = T("Send failed: ", "Не удалось отправить: ") + error.message;
      note.style.color = "#ef4444";
      btn.disabled = false; btn.textContent = T("Send magic link ✉️", "Отправить ссылку ✉️");
      return false;
    }
    sentEmail = email;
    // Some mail providers (Gmail, corporate link-scanners) prefetch links in
    // emails to check them for phishing, which silently burns the one-time
    // magic-link token before a human ever clicks it. The 6-digit code in the
    // same email is a reliable fallback since there's no link for a scanner
    // to consume.
    note.innerHTML = T(
      `📬 Check <b>${email}</b><br>Tap the link, or type the code from the same email below.<br>Expires in 1 hour.`,
      `📬 Проверь <b>${email}</b><br>Нажми на ссылку или введи код из того же письма ниже.<br>Действует 1 час.`
    );
    note.style.color = "#059669";
    btn.style.display = "none";
    input.disabled = true;
    codeBox.style.display = "flex";
    codeInput.focus();
    return true;
  };
  const verify = async () => {
    const code = (codeInput.value || "").trim();
    if (!/^\d{6,10}$/.test(code)) {
      note.textContent = T("Enter the numeric code from the email.", "Введи числовой код из письма.");
      note.style.color = "#ef4444";
      return;
    }
    verifyBtn.disabled = true; verifyBtn.textContent = T("Verifying...", "Проверяю...");
    const { error } = await sb.auth.verifyOtp({ email: sentEmail, token: code, type: "email" });
    if (error) {
      note.textContent = T("Verify failed: ", "Не удалось подтвердить: ") + error.message;
      note.style.color = "#ef4444";
      verifyBtn.disabled = false; verifyBtn.textContent = T("Verify code", "Подтвердить код");
      return;
    }
    // onAuthStateChange picks up the new session and re-renders.
  };
  btn.onclick = send;
  input.onkeydown = e => { if (e.key === "Enter") send(); };
  verifyBtn.onclick = verify;
  codeInput.onkeydown = e => { if (e.key === "Enter") verify(); };
  resendBtn.onclick = async () => {
    resendBtn.disabled = true;
    const ok = await send();
    resendBtn.disabled = false;
    if (ok) { codeInput.value = ""; codeInput.focus(); }
  };
  input.focus();
}

    // the invitee always has *something*, but they can freely edit it.
    if (!nameInput.value && email) nameInput.value = email.split("@")[0];
    validate();
  });
  otherInput.oninput = validate;
  nameInput.oninput = validate;
  validate();

  document.getElementById("signoutBtn2").onclick = async () => {
    await sb.auth.signOut(); authSession = null; membership = null; me = null; render();
  };

  acceptBtn.onclick = async () => {
    if (acceptBtn.disabled) return;
    acceptBtn.disabled = true; acceptBtn.textContent = T("Joining...", "Присоединяемся...");
    note.textContent = ""; note.style.color = "#888";

      p_avatar_role: selRole,
      p_display_name: nameInput.value.trim(),
      p_other_label: selRole === "other" ? otherInput.value.trim() : null,
    });
    if (error) {
      note.textContent = T("Couldn't join: ", "Не удалось присоединиться: ") + error.message;
      note.style.color = "#ef4444";
      acceptBtn.disabled = false;
      acceptBtn.textContent = T("Try again →", "Попробовать снова →");
      return;
    }
    // Success. Strip ?invite= from the URL so a refresh doesn't retry the flow.
    const url = new URL(location.href);
    url.searchParams.delete("invite");
    history.replaceState({}, "", url.toString());
    await refreshMembership();
    // Load game state + start realtime now that we know the family.
    if (me === null) me = membership.member_id;
    // If they already picked a device language before sign-in, stamp it for this member.
    if (lang && needsOnboardLangGate(me)) saveLangChoice(lang, { forOnboard: true });
    joinPresence();
    await load();
    subscribe();
    startSyncWatchers();
    render();
    toast("Welcome to the family kitchen 🍲");
  };
}

// Owner-only. Prompts for an email, calls the spin-food-invite Edge Function,
// which creates the food.family_invitations row and sends the magic-link email.
function openInviteFlow() {
  const v = modal(`<h3>👥 ${T("Invite family member", "Пригласить члена семьи")}</h3>
    <div style="font-size:13px;color:#666;margin-bottom:10px">
      ${T("They'll get a one-tap magic link. On first sign-in they pick their role and name.", "Они получат ссылку-магию. При входе выберут роль и имя.")}
    </div>
    <div class="sect">${T("Email address", "Email")}</div>
    <input id="inviteEmail" type="email" inputmode="email" placeholder="them@example.com"
      style="width:100%;padding:12px;font-size:15px;border:2px solid #e5e7eb;border-radius:12px">
    <button class="btn btn-primary" id="inviteGo" style="width:100%;margin-top:14px">
      ✉️ ${T("Send invitation", "Отправить приглашение")}
    </button>
    <div id="inviteNote" style="color:#888;font-size:13px;margin-top:10px;line-height:1.5"></div>`);

  const input = v.querySelector("#inviteEmail");
  const go = v.querySelector("#inviteGo");
  const note = v.querySelector("#inviteNote");
  input.focus();
  const submit = async () => {
    const email = (input.value || "").trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      note.textContent = T("That doesn't look like a valid email.", "Похоже, это не валидный email.");
      note.style.color = "#ef4444";
      return;
    }
    go.disabled = true; go.textContent = T("Sending...", "Отправляю...");
    const accessToken = authSession?.access_token;
    if (!accessToken) { note.textContent = "Session expired, please sign in again."; note.style.color = "#ef4444"; return; }
    let resp, result;
    try {
      resp = await fetch(SUPABASE_URL + "/functions/v1/spin-food-invite", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ email, family_key: FAMILY_KEY }),
      });
      result = await resp.json();
    } catch (e) {
      note.textContent = "Network error: " + (e?.message || e);
      note.style.color = "#ef4444";
      go.disabled = false; go.textContent = "✉️ " + T("Send invitation", "Отправить приглашение");
      return;
    }
    if (!result?.ok) {
      note.textContent = T("Failed: ", "Ошибка: ") + (result?.error || "unknown");
      note.style.color = "#ef4444";
      go.disabled = false; go.textContent = "✉️ " + T("Send invitation", "Отправить приглашение");
      return;
    }
    note.innerHTML = `📬 ${T("Sent to", "Отправлено на")} <b>${email}</b>.<br>${T("They have 14 days to accept.", "У них 14 дней, чтобы принять.")}`;
    note.style.color = "#059669";
    go.textContent = "✓ " + T("Sent", "Отправлено");
    setTimeout(() => closeModal(), 2500);
  };
  go.onclick = submit;
  input.onkeydown = e => { if (e.key === "Enter") submit(); };
}

// Owner-only (SPEC_AI_PREFILL.md #14, matching food.day_rules' existing owner-only
// RLS - no new permission model, just a client surface for it). One rule per
// weekday, consumed by the Thursday scheduled AI pre-fill (§5.3/§9/§10) - never
// affects manual assignment, Spin, Wish, or Duel.
const DAY_RULE_KINDS = [
  ["none", "No rule", "Без правила"],
  ["protein_type", "Protein day", "День белка"],
  ["diet_suitability", "Diet day", "День диеты"],
  ["cuisine", "Cuisine day", "День кухни"],
  ["dish_style", "Style day", "День стиля"],
];
const DAY_RULE_PROTEIN_VALUES = ["meat", "fish", "seafood", "egg", "dairy"];
const DAY_RULE_DIET_VALUES = ["vegan", "vegetarian", "pescatarian", "gluten-free", "dairy-free"];
function openDayRules() {
  const rulesByDay = {};
  (game.dayRules || []).forEach(r => { rulesByDay[r.day_of_week] = r; });
  const rowHtml = di => {
    const r = rulesByDay[di] || { rule_kind: "none", rule_value: null };
    const needsFreeText = r.rule_kind === "cuisine" || r.rule_kind === "dish_style";
    const fixedValues = r.rule_kind === "protein_type" ? DAY_RULE_PROTEIN_VALUES
      : r.rule_kind === "diet_suitability" ? DAY_RULE_DIET_VALUES : null;
    return `<div class="day-block" style="margin-bottom:10px" data-drday="${di}">
      <div class="day-hd">${dayN(di)}</div>
      <div style="padding:10px 12px">
        <div class="chips-wrap" data-drkind="${di}">${DAY_RULE_KINDS.map(([k, l, lru]) =>
          `<div class="chip ${r.rule_kind === k ? "on" : ""}" data-k="${k}">${T(l, lru)}</div>`).join("")}</div>
        ${fixedValues ? `<div class="chips-wrap" data-drval="${di}" style="margin-top:6px">${fixedValues.map(v =>
          `<div class="chip ${r.rule_value === v ? "on" : ""}" data-v="${v}">${v}</div>`).join("")}</div>` : ""}
        ${needsFreeText ? `<input data-drtext="${di}" value="${r.rule_value || ""}" placeholder="${T("e.g. italian", "например, italian")}"
          style="width:100%;margin-top:6px;padding:8px 10px;font-size:13px;border:1.5px solid #e5e7eb;border-radius:10px">` : ""}
      </div>
    </div>`;
  };
  const v = modal(`<h3>🗓 ${T("Day Rules", "Правила дня")}</h3>
    <div style="font-size:13px;color:#666;margin-bottom:10px">${T("Owner-only. The Thursday AI pre-fill tries to follow these, but never at the cost of anyone's allergy safety.", "Только для владельца. ИИ старается следовать этим правилам, но безопасность важнее.")}</div>
    <div id="drRows">${DAYS.map((_, di) => rowHtml(di)).join("")}</div>
    <div id="drNote" style="font-size:12px;color:#999;margin-top:4px;min-height:16px"></div>`);
  const note = v.querySelector("#drNote");
  const save = async (di, kind, value) => {
    note.textContent = T("Saving...", "Сохранение...");
    const { error } = await sb.rpc("spin_food_day_rules_set", { p_day_of_week: di, p_rule_kind: kind, p_rule_value: value || "" });
    if (error) { note.textContent = T("Failed: ", "Ошибка: ") + error.message; note.style.color = "#ef4444"; return; }
    rulesByDay[di] = { day_of_week: di, rule_kind: kind, rule_value: value || null };
    game.dayRules = Object.values(rulesByDay);
    note.textContent = "✓ " + T("Saved", "Сохранено");
    note.style.color = "#059669";
  };
  const rerenderRow = di => {
    const row = v.querySelector(`[data-drday="${di}"]`);
    row.outerHTML = rowHtml(di);
    wireRow(di);
  };
  const wireRow = di => {
    v.querySelectorAll(`[data-drkind="${di}"] .chip`).forEach(c => c.onclick = () => {
      const kind = c.dataset.k;
      const r = rulesByDay[di] || {};
      // Switching kind clears the old value - a leftover 'meat' value under a
      // freshly-picked 'cuisine' kind would violate the value_contract check.
      const value = kind === "none" ? null : (kind === r.rule_kind ? r.rule_value : null);
      rulesByDay[di] = { day_of_week: di, rule_kind: kind, rule_value: value };
      rerenderRow(di);
      save(di, kind, value);
    });
    v.querySelectorAll(`[data-drval="${di}"] .chip`).forEach(c => c.onclick = () => {
      const kind = rulesByDay[di]?.rule_kind || "none";
      const value = c.dataset.v;
      rulesByDay[di] = { day_of_week: di, rule_kind: kind, rule_value: value };
      rerenderRow(di);
      save(di, kind, value);
    });
    const text = v.querySelector(`[data-drtext="${di}"]`);
    if (text) {
      const commit = () => {
        const kind = rulesByDay[di]?.rule_kind || "none";
        const value = text.value.trim().toLowerCase();
        rulesByDay[di] = { day_of_week: di, rule_kind: kind, rule_value: value || null };
        save(di, kind, value);
      };
      text.addEventListener("blur", commit);
      text.addEventListener("keydown", e => { if (e.key === "Enter") { text.blur(); } });
    }
  };
  DAYS.forEach((_, di) => wireRow(di));
}

// ── onboarding (registration gate - every member passes it once) ──
let ob = null;
function obReset() { ob = { step: 0, isCook: null, avail: [], cookGrid: {}, techniques: [], appliances: [], top3: "", allergies: [], eatGrid: {} }; }
// Matches food.allergen_classes exactly (EU FIC Annex II, 14 classes) so a member's
// declared allergies compare 1:1 against a recipe's allergen_flags — no vocab drift.
const OB_ALG = [
  ["gluten","Gluten","Глютен"],
  ["crustaceans","Crustaceans","Ракообразные"],
  ["eggs","Eggs","Яйца"],
  ["fish","Fish","Рыба"],
  ["peanuts","Peanuts","Арахис"],
  ["soybeans","Soy","Соя"],
  ["milk","Milk","Молоко"],
  ["tree_nuts","Tree nuts","Орехи"],
  ["celery","Celery","Сельдерей"],
  ["mustard","Mustard","Горчица"],
  ["sesame","Sesame","Кунжут"],
  ["sulphites","Sulphites","Сульфиты"],
  ["lupin","Lupin","Люпин"],
  ["molluscs","Molluscs","Моллюски"],
  ["none","None","Нет"],
];
function obCookSlotsOn() { return MEALS.filter(m => ob.avail.includes(m.k)); }
function obCookCellOn(dayIdx, mealKey) { return ob.cookGrid[dayIdx + "-" + mealKey] !== false; }
function obSetCookCell(dayIdx, mealKey, on) {
  const k = dayIdx + "-" + mealKey;
  if (on) delete ob.cookGrid[k];
  else ob.cookGrid[k] = false;
}
function obToggleCookRow(dayIdx) {
  const meals = obCookSlotsOn();
  const allOn = meals.every(m => obCookCellOn(dayIdx, m.k));
  meals.forEach(m => obSetCookCell(dayIdx, m.k, !allOn));
}
function obToggleCookCol(mealKey) {
  const allOn = DAYS.every((_, di) => obCookCellOn(di, mealKey));
  DAYS.forEach((_, di) => obSetCookCell(di, mealKey, !allOn));
}
function obEatCellOn(dayIdx, mealIdx) { return ob.eatGrid[dayIdx + "-" + mealIdx] !== false; }
function obSetEatCell(dayIdx, mealIdx, on) {
  const k = dayIdx + "-" + mealIdx;
  if (on) delete ob.eatGrid[k];
  else ob.eatGrid[k] = false;
}
function obToggleEatRow(dayIdx) {
  const allOn = MEALS.every((_, mi) => obEatCellOn(dayIdx, mi));
  MEALS.forEach((_, mi) => obSetEatCell(dayIdx, mi, !allOn));
}
function obToggleEatCol(mealIdx) {
  const allOn = DAYS.every((_, di) => obEatCellOn(di, mealIdx));
  DAYS.forEach((_, di) => obSetEatCell(di, mealIdx, !allOn));
}
function refreshCookBulkDims(root) {
  root.querySelectorAll("[data-cw-col]").forEach(h => {
    const allOn = DAYS.every((_, di) => obCookCellOn(di, h.dataset.cwCol));
    h.classList.toggle("dim", !allOn);
  });
  root.querySelectorAll("[data-cw-row]").forEach(h => {
    const di = +h.dataset.cwRow;
    const allOn = obCookSlotsOn().every(m => obCookCellOn(di, m.k));
    h.classList.toggle("dim", !allOn);
  });
}
function refreshEatBulkDims(root) {
  root.querySelectorAll("[data-eat-col]").forEach(h => {
    const mi = +h.dataset.eatCol;
    const allOn = DAYS.every((_, di) => obEatCellOn(di, mi));
    h.classList.toggle("dim", !allOn);
  });
  root.querySelectorAll("[data-eat-row]").forEach(h => {
    const di = +h.dataset.eatRow;
    const allOn = MEALS.every((_, mi) => obEatCellOn(di, mi));
    h.classList.toggle("dim", !allOn);
  });
}
// Drag (or click) across mg-cell tiles to paint on/off without lifting finger or mouse button.
function wireObGridPaint(root, { cellSelector, getKey, isOn, setOn, refreshCell, onEnd }) {
  let painting = false;
  let modeOn = true;
  const visited = new Set();
  const paint = cell => {
    const key = getKey(cell);
    if (visited.has(key)) return;
    visited.add(key);
    if (isOn(key) === modeOn) return;
    setOn(key, modeOn);
    refreshCell(cell, modeOn);
  };
  const end = () => {
    if (!painting) return;
    painting = false;
    visited.clear();
    onEnd?.();
  };
  root.querySelectorAll(cellSelector).forEach(cell => {
    cell.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      e.preventDefault();
      painting = true;
      modeOn = !isOn(getKey(cell));
      visited.clear();
      paint(cell);
      cell.setPointerCapture(e.pointerId);
    });
    cell.addEventListener("pointermove", e => {
      if (!painting) return;
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const target = hit?.closest?.(cellSelector);
      if (target && root.contains(target)) paint(target);
    });
    cell.addEventListener("pointerup", end);
    cell.addEventListener("pointercancel", end);
    cell.addEventListener("lostpointercapture", end);
  });

// Formats a plain number for display, stripping trailing zeros (matches
// the previous raw-qty formatting convention).
function fmtQty(n) {
  // 1 decimal max (2026-08-09) - scaling/unit conversion can otherwise
  // produce noisy values like 1.13333...; trailing ".0" is still stripped
  // so whole numbers print clean.
  return String(Math.round(n * 10) / 10).replace(/\.0$/, "");
}
function ingredientLine(ing, scaleFactor = 1) {
  if (typeof ing === "string") return ing;
  if (!ing || typeof ing !== "object") return "";
  const name = (lang === "ru" && ing.name_ru) ? ing.name_ru : (ing.name_en || ing.raw || "");
  const note = ing.note ? ` (${ing.note})` : "";
  // Scaling (2026-08-09): scaleFactor = target servings / recipe.servings,
  // computed by the caller only when a real (non-null) servings baseline is
  // known - a purely display-time multiply, same non-destructive pattern as
  // unit conversion below. Never written back to the stored qty.
  const scaledQty = Number.isFinite(Number(ing.qty)) ? Number(ing.qty) * scaleFactor : ing.qty;
  // Recipe Unit Conversion (SPEC_RECIPE_I18N.md decision #9/#11/#13):
  // show the viewer's preferred system when a conversion is available;
  // otherwise fall back to the recipe's original qty/unit unconverted.
  const converted = convertQty(scaledQty, ing.unit);
  const qty = converted ? fmtQty(converted.qty) : (scaledQty ? fmtQty(scaledQty) : "");
  const unit = converted ? unitLabel(converted.unit) : unitDisplay(ing.unit);
  const line = [qty, unit, name].filter(Boolean).join(" ");

}
// Language-matched instruction step text (SPEC_RECIPE_I18N.md) - reads
// text_en/text_ru, falling back to the legacy single `text` key for any
// recipe that predates the translation migration and hasn't been
// re-translated yet.
function stepLangText(s, l) {
  if (typeof s === "string") return s;
  if (!s) return "";
  const key = l === "ru" ? "text_ru" : "text_en";
  return s[key] || s.text || "";
}
function instructionsText(d) {

// photo_urls (an array), so several photos can hang off one step. Every
// read site funnels through this so legacy single-photo_url data (still
// sitting in already-saved recipes) keeps rendering unchanged.
function stepPhotoUrls(s) {
  if (!s) return [];
  if (Array.isArray(s.photo_urls)) return s.photo_urls.filter(Boolean);
  return s.photo_url ? [s.photo_url] : [];
}
// Normalizes any instructions shape (old single-blob [{text}], legacy
// step-array [{step,text,photo_url}], or the current bilingual
// [{step,text_en,text_ru,photo_urls}]) into ordered step objects for
// display/editing. `text` is the current-UI-language display copy;
// text_en/text_ru are both preserved so an edit to one language doesn't
// clobber the other's translation (see saveDetailEdit). Renumbering
// happens at save time, not here.
function instructionSteps(d) {
  if (!Array.isArray(d.instructions) || !d.instructions.length) return [];
  return d.instructions.map(s => typeof s === "string"
    ? { text: s, text_en: s, text_ru: null, photo_urls: [] }

        text_ru: (s && s.text_ru) ?? null,
        photo_urls: stepPhotoUrls(s),
      }
  ).filter(s => s.text);
}

  // sit past everything else so reaching it is a deliberate scroll, not a
  // reflex. Soft-delete (recipe_deleted event, see
  // 20260810030000_food_recipe_soft_delete_v1.sql) - never a hard DB
  // delete, so this is always safe regardless of the recipe's history.
  const deleteHtml = detailEditMode
    ? `<div style="margin-top:28px;padding-top:16px;border-top:1px solid #f0f0f0">
        <button class="mini-btn reject" id="dtlDelete" style="width:100%">🗑 ${T("Delete recipe", "Удалить рецепт")}</button>
      </div>`
    : "";

  const pane = `${detailHeaderHtml(d)}
      <div style="padding:6px 16px 20px">
      <div style="margin-bottom:6px">${servingsHtml}</div>
      <div class="sect">${T("Ingredients", "Ингредиенты")}</div>
      ${ingHtml}
      <div class="sect" style="margin-top:18px">${T("Instructions", "Приготовление")}</div>
      ${instrHtml}
      ${aboutHtml}
      ${deleteHtml}
    </div>`;
  return `
  <div class="dtl-hd"><button class="dtl-back" id="dtlBack">←</button>
    <div style="flex:1;font-weight:800;font-size:15px">${dName(d)}</div>
    <button class="dtl-back" id="dtlEditToggle" style="border-color:${detailEditMode ? "var(--amber)" : "#eee"}">${detailEditMode ? "✕" : "✏️"}</button></div>
  ${pane}
  ${detailEditMode ? `<div class="dtl-editbar"><button class="btn btn-ghost" id="dtlCancel">${T("Cancel", "Отмена")}</button><button class="btn btn-primary" id="dtlSave" ${detailSaving ? "disabled" : ""}>${detailSaving ? T("Saving...", "Сохранение...") : T("Save changes", "Сохранить")}</button></div>` : ""}`;
}

function wireDetailOverlay(wrap, d) {
  wrap.querySelector("#dtlBack")?.addEventListener("click", closeDetail);
  // Photo carousel on the hero - identical wiring to the Spin card's, just
  // re-rendering this overlay (not refreshDeck()) since photoIdx[d.id] is the
  // one piece of shared state between the two views.
  wrap.querySelectorAll(".dtl-hero .pnav").forEach(btn => btn.addEventListener("click", () => {
    photoIdx[d.id] = (photoIdx[d.id] || 0) + (btn.dataset.pnav === "next" ? 1 : -1);
    renderDetailOverlay();
  }));
  const dtlPhotoFile = wrap.querySelector(".dtl-hero [data-photofile]");
  if (dtlPhotoFile) dtlPhotoFile.addEventListener("change", async () => {
    // uploadRecipePhoto()/resolvePendingPhoto() already re-render this overlay
    // themselves (`if (detailOpen) renderDetailOverlay()`) once the write
    // lands, so nothing further to do here after awaiting them.
    // 2026-08-11: logged end-to-end (pick -> upload call) so a repeat of the
    // "picked a library photo, confirmed, nothing happened" report leaves a
    // trail even if it fails silently before any toast would show.
    logClientDiagnostic("hero_photo_pick", { recipe_id: d.id, edit_mode: detailEditMode, has_file: !!(dtlPhotoFile.files && dtlPhotoFile.files.length) });
    try {
      const file = dtlPhotoFile.files && dtlPhotoFile.files[0];
      dtlPhotoFile.value = "";
      if (file) await uploadRecipePhoto(d.id, file);
    } catch (e) {
      logClientDiagnostic("hero_photo_flow_exception", { recipe_id: d.id, message: e?.message || String(e), stack: e?.stack || null });
      toast(T("Something went wrong adding that photo - try again.", "Что-то пошло не так при добавлении фото - попробуйте снова."));
    }
  });
  wrap.querySelector(".dtl-hero [data-papprove]")?.addEventListener("click", () => resolvePendingPhoto(d.id, true));
  wrap.querySelector(".dtl-hero [data-pdecline]")?.addEventListener("click", () => resolvePendingPhoto(d.id, false));
  const dtlPhotoRemove = wrap.querySelector(".dtl-hero [data-premove]");
  dtlPhotoRemove?.addEventListener("click", () => confirmRemovePhoto(() => removeRecipePhotoLive(dtlPhotoRemove.dataset.premove, dtlPhotoRemove.dataset.photourl)));
  // Tapping the photo itself (not any of the controls above it) opens it
  // full-screen, uncropped - the hero strip only ever shows it letterboxed.
  wrap.querySelector(".dtl-hero")?.addEventListener("click", e => {
    if (e.target.closest(".pnav, .add-photo-cta, .photo-approve-row, .photo-pending-badge, .photo-remove-btn, .enrich-fab, .qhide")) return;
    const photos = (d.photo_urls && d.photo_urls.length) ? d.photo_urls : (d.photo_url ? [d.photo_url] : []);
    const url = photos[photoIdx[d.id] || 0];
    if (url) openPhotoLightbox(url);
  });
  wrap.querySelector("#dtlEnrichBtn")?.addEventListener("click", () => { closeDetail(); openImportSheet(d.id); });
  wrap.querySelector("#dtlEditToggle")?.addEventListener("click", () => {
    detailScaleTo = null; // editing always shows/edits the recipe's real base quantities
    if (detailEditMode) { detailEditMode = false; detailDraft = null; }
    else {
      detailEditMode = true;
      detailDraft = {
        dish_role: d.dish_role, course_category: d.course_category,
        meal_types: new Set(d.meals), techniques: new Set(d.techniques),
        instructions: instructionSteps(d).map(s => ({ ...s })),
        ingredients: d.ingredients.map(i => ({ ...i })),
        titleEn: d.en, titleRu: d.ru,
        cuisine: d.c === "family" ? "" : d.c,
        difficulty: d.difficulty,
        cookTimeMinutes: d.t,
        servings: d.servings ?? null,
      };
    }
    renderDetailOverlay();
  });
  wrap.querySelector("#dtlCancel")?.addEventListener("click", () => { detailEditMode = false; detailDraft = null; renderDetailOverlay(); });
  wrap.querySelectorAll("[data-editchip]").forEach(c => c.addEventListener("click", () => {
    if (!detailDraft) return;
    const key = c.dataset.editchip, v = c.dataset.val;
    if (key === "dish_role") {
      detailDraft.dish_role = detailDraft.dish_role === v ? null : v;
      // dish_role='component' <=> meal_types=['component'] is a DB invariant -
      // the two fields must always change together.
      if (detailDraft.dish_role === "component") detailDraft.meal_types = new Set(["component"]);
      else if (detailDraft.meal_types.has("component")) detailDraft.meal_types = new Set(["dinner"]);
    } else if (key === "course_category") {
      detailDraft.course_category = detailDraft.course_category === v ? null : v;
    } else if (key === "meal_types") {
      if (detailDraft.dish_role === "component") return; // locked while dish_role is component
      if (detailDraft.meal_types.has(v)) detailDraft.meal_types.delete(v); else detailDraft.meal_types.add(v);
    } else if (key === "techniques") {
      if (detailDraft.techniques.has(v)) detailDraft.techniques.delete(v); else detailDraft.techniques.add(v);
    }
    renderDetailOverlay();
  }));
  wrap.querySelector("#dtlTitleInput")?.addEventListener("input", (e) => {
    if (!detailDraft) return;
    if (lang === "ru") detailDraft.titleRu = e.target.value; else detailDraft.titleEn = e.target.value;
  });
  wrap.querySelector("#dtlTimeInput")?.addEventListener("input", (e) => {
    if (!detailDraft) return;
    detailDraft.cookTimeMinutes = e.target.value === "" ? null : Number(e.target.value);
  });
  wrap.querySelector("#dtlCuisineInput")?.addEventListener("input", (e) => {
    if (!detailDraft) return;
    detailDraft.cuisine = e.target.value;
  });
  wrap.querySelector("#dtlServingsInput")?.addEventListener("input", (e) => {
    if (!detailDraft) return;
    detailDraft.servings = e.target.value === "" ? null : Number(e.target.value);
  });
  wrap.querySelectorAll("#dtlDiffPicker [data-diffval]").forEach(s => s.addEventListener("click", () => {
    if (!detailDraft) return;
    detailDraft.difficulty = Number(s.dataset.diffval);
    renderDetailOverlay();
  }));
  wrap.querySelector("#dtlScaleUp")?.addEventListener("click", () => {
    detailScaleTo = (detailScaleTo || d.servings || 4) + 1;
    renderDetailOverlay();
  });
  wrap.querySelector("#dtlScaleDown")?.addEventListener("click", () => {
    const next = (detailScaleTo || d.servings || 4) - 1;
    if (next < 1) return;
    detailScaleTo = next;
    renderDetailOverlay();
  });
  wrap.querySelector("#dtlScaleReset")?.addEventListener("click", () => {
    detailScaleTo = null;
    renderDetailOverlay();
  });
  wrap.querySelector("#dtlSave")?.addEventListener("click", () => saveDetailEdit(d));
  wrap.querySelector("#dtlApprove")?.addEventListener("click", () => resolvePendingEdit(d, true));
  wrap.querySelector("#dtlDecline")?.addEventListener("click", () => resolvePendingEdit(d, false));
  wrap.querySelector("#dtlActiveEye")?.addEventListener("click", () => toggleRecipeActive(d));
  wrap.querySelector("#dtlDelete")?.addEventListener("click", () => confirmDeleteRecipe(d));

  // Step text edits update the draft in place without a full re-render, so
  // the textarea keeps focus/cursor position while typing. Only the
  // CURRENT UI language's side is edited here - text_en/text_ru for the
  // other language (already translated) is left untouched, so editing a
  // step in English doesn't wipe out its existing Russian translation
  // (SPEC_RECIPE_I18N.md - the pre-existing bug this replaces would have
  // silently dropped the other language on every edit).
  wrap.querySelectorAll("[data-stepinput]").forEach(ta => ta.addEventListener("input", (e) => {
    const idx = Number(ta.dataset.stepinput);
    const step = detailDraft?.instructions?.[idx];
    if (!step) return;
    step.text = e.target.value;
    step[lang === "ru" ? "text_ru" : "text_en"] = e.target.value;
  }));
  wrap.querySelector("#dtlStepAdd")?.addEventListener("click", () => {
    if (!detailDraft) return;
    // A brand-new step is authored in the current UI language only - the
    // other side stays null until the translate pipeline (or a manual
    // edit after switching language) fills it in.
    detailDraft.instructions.push({
      text: "",
      text_en: lang === "ru" ? null : "",
      text_ru: lang === "ru" ? "" : null,
      photo_urls: [],
    });
    renderDetailOverlay();
  });
  wrap.querySelectorAll("[data-stepup]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.stepup);
    if (!detailDraft || i < 1) return;
    const arr = detailDraft.instructions;
    [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
    renderDetailOverlay();
  }));
  wrap.querySelectorAll("[data-stepdown]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.stepdown);
    const arr = detailDraft?.instructions;
    if (!arr || i >= arr.length - 1) return;
    [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
    renderDetailOverlay();
  }));
  wrap.querySelectorAll("[data-stepdel]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.stepdel);
    if (!detailDraft) return;
    detailDraft.instructions.splice(i, 1);
    renderDetailOverlay();
  }));
  // Per-step photo add: in edit mode it uploads immediately (so the editor
  // shows the result right away) but only stashes the URL into the draft's
  // photo_urls array - it isn't persisted until "Save changes", exactly like
  // step text edits above. Outside edit mode (2026-08-11) the same tile is
  // always available too (per user request), but there's no draft/Save step
  // to ride along with, so it goes straight to addStepPhotoLive() which
  // applies the write immediately (subject to the same owner/pending-review
  // gate as any other recipe_edit_proposed).
  wrap.querySelectorAll("[data-stepphotoadd]").forEach(inp => inp.addEventListener("change", async () => {
    const idx = Number(inp.dataset.stepphotoadd);
    logClientDiagnostic("step_photo_pick", { recipe_id: d.id, step: idx, edit_mode: detailEditMode, has_file: !!(inp.files && inp.files.length) });
    try {
      const file = inp.files && inp.files[0];
      inp.value = "";
      if (!file) return;
      if (detailEditMode) {
        if (!detailDraft?.instructions?.[idx]) return;
        const url = await uploadStepPhoto(d.id, file);
        if (!url) return;
        const step = detailDraft.instructions[idx];
        step.photo_urls = [...stepPhotoUrls(step), url];
        renderDetailOverlay();
      } else {
        await addStepPhotoLive(d, idx, file);
      }
    } catch (e) {
      logClientDiagnostic("step_photo_flow_exception", { recipe_id: d.id, step: idx, message: e?.message || String(e), stack: e?.stack || null });
      toast(T("Something went wrong adding that photo - try again.", "Что-то пошло не так при добавлении фото - попробуйте снова."));
    }
  }));
  // Removing a step photo (2026-08-11: available in both edit and non-edit
  // mode, always behind the same confirmRemovePhoto() dialog the hero photo
  // uses) - in edit mode it only trims the draft's array (persists on "Save
  // changes", like every other edit-mode change); outside edit mode there's
  // no draft to trim, so it writes immediately via removeStepPhotoLive().
  wrap.querySelectorAll("[data-stepphotodel]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.stepphotodel);
    const pi = Number(b.dataset.photoidx);
    confirmRemovePhoto(async () => {
      if (detailEditMode) {
        const step = detailDraft?.instructions?.[i];
        if (!step) return;
        step.photo_urls = stepPhotoUrls(step).filter((_, idx) => idx !== pi);
        renderDetailOverlay();
      } else {
        const url = stepPhotoUrls(instructionSteps(d)[i])[pi];
        if (url) await removeStepPhotoLive(d, i, url);
      }
    });
  }));
  // Step photos (both the read-only Instructions list and the edit-mode
  // editor) open full-screen the same way the hero photo does.
  wrap.querySelectorAll("[data-stepphotoview]").forEach(img => img.addEventListener("click", () => openPhotoLightbox(img.dataset.stepphotoview)));

  // Ingredients: same add/remove/edit-qty/unit/name pattern as
  // openImportReview's editor. qty/unit/name edits update the draft in
  // place (no full re-render, keeps input focus); add/remove re-render
  // since the row count changes.
  wrap.querySelectorAll("[data-ingidx]").forEach(row => {
    const i = Number(row.dataset.ingidx);
    row.querySelectorAll("[data-ingf]").forEach(inp => inp.addEventListener("input", () => {
      const ing = detailDraft?.ingredients?.[i];
      if (!ing) return;
      const f = inp.dataset.ingf;
      if (f === "qty") { ing.qty = inp.value === "" ? null : Number(inp.value); return; }
      if (f === "name") { if (lang === "ru") ing.name_ru = inp.value; else ing.name_en = inp.value; return; }
      if (f === "unit") { ing.unit = unitFromInput(inp.value); return; }
    }));
  });
  wrap.querySelectorAll("[data-ingdel]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.ingdel);
    if (!detailDraft) return;
    detailDraft.ingredients.splice(i, 1);
    renderDetailOverlay();
  }));
  wrap.querySelector("#dtlIngAdd")?.addEventListener("click", () => {
    if (!detailDraft) return;
    detailDraft.ingredients.push({ name_en: lang === "ru" ? null : "", name_ru: lang === "ru" ? "" : null, qty: null, unit: null, note: null, section: null });
    renderDetailOverlay();
  });
}

async function saveDetailEdit(d) {
  if (!detailDraft || detailSaving) return;
  const draftMeals = [...detailDraft.meal_types];
  if (!draftMeals.length) { toast(T("Pick at least one meal type.", "Выберите хотя бы один тип приёма пищи.")); return; }

  const proposed = {};
  if (detailDraft.dish_role !== d.dish_role) proposed.dish_role = detailDraft.dish_role;
  if (detailDraft.course_category !== d.course_category) proposed.course_category = detailDraft.course_category;
  if (draftMeals.slice().sort().join(",") !== d.meals.slice().sort().join(",")) proposed.meal_types = draftMeals;
  const draftTech = [...detailDraft.techniques].sort();
  if (draftTech.join(",") !== d.techniques.slice().sort().join(",")) proposed.techniques = draftTech;
  // dish_role changes must always carry meal_types alongside (server-enforced pairing).
  if ("dish_role" in proposed && !("meal_types" in proposed)) proposed.meal_types = draftMeals;

  // Name/difficulty/time/cuisine - only the current UI language's title side
  // is touched (same convention as instruction steps, SPEC_RECIPE_I18N.md),
  // the other side's existing translation is left untouched.
  const draftTitle = (lang === "ru" ? detailDraft.titleRu : detailDraft.titleEn) || "";
  const currentTitle = (lang === "ru" ? d.ru : d.en) || "";
  if (draftTitle.trim() && draftTitle.trim() !== currentTitle.trim()) {
    if (lang === "ru") proposed.title_ru = draftTitle.trim(); else proposed.title_en = draftTitle.trim();
  }
  if (detailDraft.difficulty !== d.difficulty) proposed.difficulty = detailDraft.difficulty;
  if (detailDraft.cookTimeMinutes && detailDraft.cookTimeMinutes !== d.t) proposed.cook_time_minutes = detailDraft.cookTimeMinutes;
  const draftCuisine = (detailDraft.cuisine || "").trim().toLowerCase();
  const currentCuisine = d.c === "family" ? "" : d.c;
  if (draftCuisine && draftCuisine !== currentCuisine) proposed.cuisine = draftCuisine;
  if (detailDraft.servings && detailDraft.servings !== d.servings) proposed.servings = detailDraft.servings;

  // Bilingual step diffing (SPEC_RECIPE_I18N.md): both text_en and text_ru
  // travel together so an edit in one language never overwrites the
  // other's already-translated text. Built from d.instructions directly
  // (not the language-collapsed instructionSteps() view) so the diff -
  // and what actually gets sent - reflects both languages accurately.
  const draftSteps = detailDraft.instructions
    .filter(s => (s.text || "").trim())
    .map((s, i) => ({ step: i + 1, text_en: s.text_en ?? null, text_ru: s.text_ru ?? null, photo_urls: stepPhotoUrls(s) }));
  const currentSteps = (Array.isArray(d.instructions) ? d.instructions : []).map((s, i) => ({
    step: i + 1,
    text_en: (typeof s === "string" ? null : s?.text_en) ?? null,
    text_ru: (typeof s === "string" ? null : s?.text_ru) ?? null,
    photo_urls: stepPhotoUrls(s),
  }));
  if (JSON.stringify(draftSteps) !== JSON.stringify(currentSteps)) proposed.instructions = draftSteps;

  // Ingredient diffing: full-array replace, same shape spin-food-import
  // writes at import time (raw/name_en/name_ru/qty/unit/note/section/
  // ingredient_slug). ingredient_slug is recomputed client-side (same
  // slugify as the server) so it stays consistent with a hand-edited name -
  // note this does NOT retrigger AI classification (protein_groups/
  // diet_compatible_with/allergens/card_state can go stale until a future
  // re-classify pass, same accepted limitation instructions-editing has
  // for techniques).
  const draftIngredients = detailDraft.ingredients
    .filter(i => (i.name_en || "").trim() || (i.name_ru || "").trim())
    .map(i => ({
      raw: i.raw || "",
      name_en: i.name_en || null,
      name_ru: i.name_ru || null,
      qty: i.qty ?? null,
      unit: i.unit || null,
      note: i.note || null,
      section: i.section || null,
      ingredient_slug: slugifyIngredientName(i.name_en || i.name_ru || ""),
    }));
  const currentIngredients = (Array.isArray(d.ingredients) ? d.ingredients : []).map(i => ({
    raw: i.raw || "",
    name_en: i.name_en || null,
    name_ru: i.name_ru || null,
    qty: i.qty ?? null,
    unit: i.unit || null,
    note: i.note || null,
    section: i.section || null,
    ingredient_slug: i.ingredient_slug || slugifyIngredientName(i.name_en || i.name_ru || ""),
  }));
  if (JSON.stringify(draftIngredients) !== JSON.stringify(currentIngredients)) proposed.ingredients = draftIngredients;

  if (!Object.keys(proposed).length) { detailEditMode = false; detailDraft = null; renderDetailOverlay(); return; }

  detailSaving = true; renderDetailOverlay();
  const ok = await applyEvent("recipe_edit_proposed", { recipe_id: d.id, proposed });
  detailSaving = false;
  if (!ok) { renderDetailOverlay(); return; }
  const forked = lastForkInfo;
  await loadCatalog();
  const editedId = forked ? forked.to : d.id;
  const fresh = dish(editedId);
  const wentPending = !!(fresh && fresh.pending_edit && fresh.added_by_member_id && fresh.added_by_member_id !== me);
  detailEditMode = false; detailDraft = null;
  if (forked) {
    // "Make it mine": redirect the open detail view (and any active Spin
    // card) from the shared platform/chef recipe to the family's own fork.
    if (detailOpen === forked.from) detailOpen = forked.to;
    promoteRecipeInDeck(forked.to);
  }
  toast(forked
    ? T("Saved to your cookbook - this is now your own copy.", "Сохранено в вашей книге рецептов - теперь это ваша собственная копия.")
    : wentPending
    ? T("Edit sent - waiting for the owning cook to approve.", "Изменение отправлено - ждём подтверждения от повара.")
    : T("Recipe updated.", "Рецепт обновлён."));
  if (tab === "spin") refreshDeck();
  if (detailOpen) renderDetailOverlay();
}

async function resolvePendingEdit(d, approve) {
  const ok = await applyEvent(approve ? "recipe_edit_accepted" : "recipe_edit_declined", { recipe_id: d.id });
  if (!ok) return;
  await loadCatalog();
  toast(approve ? T("Edit approved.", "Изменение принято.") : T("Edit declined - a new recipe was created.", "Изменение отклонено - создан новый рецепт."));
  if (tab === "spin") refreshDeck();
  if (detailOpen) renderDetailOverlay();
}

// Instant, no-approval toggle (unlike recipe_edit_*/pending_edit above) - this is a
// household preference, not a fact about the recipe, so any family member can flip
// it and see it take effect immediately. See 20260804_food_recipe_active_toggle.sql.
async function toggleRecipeActive(d) {
  if (detailSaving) return;
  const goingActive = !d.is_active;
  detailSaving = true; renderDetailOverlay();
  const ok = await applyEvent("recipe_active_set", { recipe_id: d.id, is_active: goingActive });
  detailSaving = false;
  if (!ok) { renderDetailOverlay(); return; }
  await loadCatalog();
  // Explains both halves of what just happened: (1) what changed for this one
  // recipe, and (2) that it's still showing up in Spin/Wish right now regardless -
  // inactive just means "opted out of the AI weekly fill" - and exactly where to
  // go if they actually want it out of sight (the filter icon by the search bar).
  stickyToast(goingActive
    ? T("Back in the mix - eligible for the AI weekly fill again.", "Снова участвует в автозаполнении ИИ.")
    : T("Hidden from AI weekly planning. Click the eye icon again to unhide. Stays visible in the Spinner - can be hidden completely in \"Filter\" settings above.", "Скрыто из недельного планирования ИИ. Нажмите на значок глаза ещё раз, чтобы вернуть. Всё ещё видно в Крутке - можно скрыть полностью в настройках «Фильтр» выше."));
  if (tab === "spin") refreshDeck();
  if (detailOpen) renderDetailOverlay();
}

// Soft delete (2026-08-10, see 20260810030000_food_recipe_soft_delete_v1.sql) -
// requires an explicit confirm tap (not just the edit-mode button itself)
// since this removes the recipe from every family-facing surface (cookbook
// browse/search, Spin, Wish, Duel). Never a hard DB delete - meal_slots/
// wishes/duel_proposals reference this recipe with ON DELETE RESTRICT, so a
// real delete would fail for any recipe that's ever actually been used.
function confirmDeleteRecipe(d) {
  const v = modal(`<h3 style="margin:0 0 4px">🗑 ${T("Delete this recipe?", "Удалить этот рецепт?")}</h3>
    <div style="font-size:14px;color:#666;margin:10px 0 4px">${T(
      `"${dName(d)}" will disappear from the cookbook, Spin, Wish, and Duel for your whole family. This can't be undone from here.`,
      `«${dName(d)}» пропадёт из книги рецептов, Крутки, Желаний и Дуэлей для всей семьи. Отменить это отсюда нельзя.`
    )}</div>
    <div class="mini-row" style="margin-top:16px;display:flex;gap:8px">
      <button class="btn btn-ghost" id="delCancel" style="flex:1">${T("Cancel", "Отмена")}</button>

// Uploads to the recipe-photos Storage bucket at <family_id>/<recipe_id>/<uuid>.<ext>
// (RLS on storage.objects checks the first path segment against the caller's
// family - 20260804020000 migration), then fires recipe_photo_added so
// food.apply_event decides whether it lands live or waits for the family
// admin (see the migration header for the exact rule).
async function uploadRecipePhoto(dishId, file) {
  const familyId = membership?.family_id;
  if (!familyId) { toast(T("Sign in first.", "Сначала войдите.")); return; }
  if (!checkPhotoUploadSize(file)) return;
  const upload = await compressImageForUpload(file, DISPLAY_PHOTO_COMPRESS);
  const ext = upload === file ? ((file.name || "").split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg" : "jpg";
  const path = `${familyId}/${dishId}/${crypto.randomUUID()}.${ext}`;
  toast(T("Uploading photo...", "Загружаем фото..."));
  let upErr;
  try {
    ({ error: upErr } = await withTimeout(
      sb.storage.from("recipe-photos").upload(path, upload, { contentType: upload.type || "image/jpeg", upsert: false }),
      PHOTO_UPLOAD_TIMEOUT_MS,
      "Photo upload",
    ));
  } catch (e) {
    toast(T("Upload timed out - check your connection and try again.", "Загрузка не удалась по времени - проверьте соединение и попробуйте снова."));
    return;
  }
  if (upErr) { toast(T("Upload failed: ", "Ошибка загрузки: ") + upErr.message); return; }
  const { data: pub } = sb.storage.from("recipe-photos").getPublicUrl(path);
  const photoUrl = pub?.publicUrl;
  if (!photoUrl) { toast(T("Upload failed - no URL returned.", "Ошибка загрузки - URL не получен.")); return; }
  const ok = await applyEvent("recipe_photo_added", { recipe_id: dishId, photo_url: photoUrl });
  if (!ok) return;
  const forked = lastForkInfo;
  await loadCatalog();
  const targetId = forked ? forked.to : dishId;
  if (forked) {
    if (detailOpen === forked.from) detailOpen = forked.to;
    promoteRecipeInDeck(forked.to);
  }
  const d = dish(targetId);
  const wentLive = Boolean(d && d.photo_urls.includes(photoUrl));
  photoIdx[targetId] = wentLive ? Math.max(0, d.photo_urls.length - 1) : 0;
  toast(forked
    ? T("Photo added to your own copy of this recipe.", "Фото добавлено в вашу собственную копию рецепта.")
    : wentLive
    ? T("Photo added!", "Фото добавлено!")
    : T("Photo sent to the family admin for approval.", "Фото отправлено администратору на одобрение."));
  if (tab === "spin") refreshDeck();
  if (detailOpen) renderDetailOverlay();
}

// Adds a step photo outside edit mode (2026-08-11): uploads via

    step: i + 1,
    text_en: s.text_en,

    photo_urls: i === stepIndex ? [...s.photo_urls, url] : s.photo_urls,
  }));
  const ok = await applyEvent("recipe_edit_proposed", { recipe_id: d.id, proposed: { instructions: steps } });

// Same 3 stages the standalone YouTube worker actually goes through
// (spin_the_food/video_worker/worker.py, migration 20260812150000) - a
// download can genuinely take a couple of minutes for a long video, so a
// flat "Processing..." label with no movement read as stuck. Same visual
// language as the existing save-progress bar (revSaveProgressTrack/Fill)
// elsewhere in this file - amber fill, 4px track - so it reads as the same
// kind of feedback the user already knows from there (and from the
// Telegram bot's own edit-in-place stage messages).
const IMPORT_PROGRESS_STAGES = ["downloading", "transcribing", "extracting"];
const IMPORT_STAGE_LABEL = {
  downloading: T("Downloading video...", "Скачивание видео..."),
  transcribing: T("Transcribing (captions or Whisper)...", "Расшифровка (субтитры или Whisper)..."),
  extracting: T("AI is extracting the recipe...", "ИИ извлекает рецепт..."),
};

function describeJob(j) {
  const icon = IMPORT_SOURCE_ICON[j.source_type] || "📥";
  const title = (lang === "ru" ? (j.draft?.title_ru || j.draft?.title_en) : (j.draft?.title_en || j.draft?.title_ru)) || j.draft?.title || j.source_type;
  if (j.status === "processing") {
    const stageIdx = IMPORT_PROGRESS_STAGES.indexOf(j.progress_stage);
    const step = stageIdx >= 0 ? stageIdx + 1 : 1;
    const progressPct = Math.round((step / IMPORT_PROGRESS_STAGES.length) * 100);
    const progressLabel = IMPORT_STAGE_LABEL[j.progress_stage] || T("Starting...", "Запуск...");
    return { icon, text: T("Importing: ", "Импорт: ") + title, progressPct, progressLabel, job: j };
  }
  let text;
  if (j.status === "failed") text = T("Recipe import failed", "Импорт рецепта не удался") + (j.error ? ": " + j.error : "");
  else if (j.status === "ready") text = T("Recipe import ready to review: ", "Импорт рецепта готов к проверке: ") + title;
  else text = T("Recipe import queued: ", "Импорт рецепта в очереди: ") + title;
  return { icon, text, job: j };
}

async function loadFamilyFeed() {
  const [{ data: events, error: ee }, { data: jobs, error: je }] = await Promise.all([
    sb.rpc("spin_food_list_family_events", { p_limit: 60 }),
    sb.rpc("spin_food_list_import_jobs", { p_limit: 30 }),
  ]);
  if (ee) console.error("[stf-data] family events:", ee);
  if (je) console.error("[stf-data] import jobs:", je);
  const evEntries = (events || []).map(ev => ({ ts: new Date(ev.created_at).getTime(), kind: "event", ...describeEvent(ev) }));
  const jobEntries = (jobs || []).map(j => ({ ts: new Date(j.updated_at || j.created_at).getTime(), kind: "job", ...describeJob(j) }));
  familyFeed = [...evEntries, ...jobEntries].sort((a, b) => b.ts - a.ts).slice(0, 80);
  if (tab === "feed" && !modalOpen) render();
}

function renderFeed() {
  let h = `<div class="screen-title"><h2>${T("Family activity", "Семейная лента")}</h2><div class="sub">${T("Everything the family does, live - including recipe imports.", "Всё, что делает семья, вживую - включая импорт рецептов.")}</div></div><div class="activity">`;
  if (!familyFeed.length) h += `<div class="hint">${T("Nothing yet.", "Пока пусто.")}</div>`;
  familyFeed.forEach((f, i) => {
    // Only ready-to-review or completed import rows actually do anything on
    // tap - a still-processing row (below) shows a live progress bar
    // instead, nothing to click yet.
    const j = f.job;
    const clickable = f.kind === "job" && j && ((j.status === "ready" && !j.result_recipe_id) || j.result_recipe_id);
    const bar = f.progressPct !== undefined ? `
      <div style="font-size:11px;color:#999;margin-top:3px">${f.progressLabel}</div>
      <div style="height:4px;background:#eee;border-radius:2px;overflow:hidden;margin-top:3px">
        <div style="height:100%;width:${f.progressPct}%;background:var(--amber,#f59e0b);transition:width .3s ease"></div>
      </div>` : "";
    h += `<div class="a"${clickable ? ` data-feedjob="${i}" style="cursor:pointer"` : ""}><b>${f.icon}</b> ${f.text} · ${ago(f.ts)}${bar}</div>`;
  });
  return h + `</div>`;
}
function ago(ts) { const s = (Date.now()-ts)/1000; if (s<60) return T("just now", "только что"); if (s<3600) return Math.floor(s/60)+T("m ago", " мин назад"); return Math.floor(s/3600)+T("h ago", " ч назад"); }

function wire() {
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
    tab = b.dataset.tab; render();
    // Lazy-refresh as a safety net (realtime already nudges this on every
    // real change) so the feed is never stale just because a socket drop
    // was missed - cheap, only fires on actually switching to the tab.
    if (tab === "feed") loadFamilyFeed();
  });
  const pill = document.getElementById("mePill");
  // The "me" pill now opens Settings (which is where sign-out + invite live).
  // The old member-switcher is gone: identity is bound to the auth session.
  if (pill) pill.onclick = openSettings;
  const settings = document.getElementById("settingsBtn");
  if (settings) settings.onclick = openSettings;
  document.querySelectorAll("[data-feedjob]").forEach(el => el.onclick = () => {
    const f = familyFeed[+el.dataset.feedjob];
    const j = f && f.job;

    commitAndSync(`${mem(me).en} confirmed the week`, "week_confirmed", { plan_id: activePlanId });
  });
  document.getElementById("unlock") && (document.getElementById("unlock").onclick = () => {
    game.locked = false;
    commitAndSync(`${mem(me).en} reopened the menu`, "week_unconfirmed", { plan_id: activePlanId });

  const aiBtn = document.getElementById("aiFill");
  if (aiBtn) aiBtn.onclick = openAiFill;
  document.querySelectorAll("[data-cookacc]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.cookacc.split("-"); acceptCook(+d,k); });
  document.querySelectorAll("[data-cookrej]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.cookrej.split("-"); declineCook(+d,k); });

  document.querySelectorAll("[data-proprej]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.proprej.split("-"); rejectProposal(+d,k); });
  document.querySelectorAll("[data-spin]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.spin.split("-"); tab="spin"; spinTarget={day:+d,meal:k}; render(); toast(T("Swipe right to fill ", "Свайпни вправо, чтобы заполнить ") + dayN(+d) + " " + MEALS.find(m=>m.k===k).ic); });
  document.querySelectorAll("[data-wish]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.wish.split("-"); wishTarget = { day: +d, meal: k }; tab="wish"; render(); openWish(); });
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    const [d,k]=b.dataset.edit.split("-");
    spinTarget = { day: +d, meal: k };
    tab = "spin"; render();
    toast(T("Swipe right to replace ", "Свайпни вправо, чтобы заменить ") + dayN(+d) + " " + MEALS.find(m=>m.k===k).ic);
  });
  document.querySelectorAll("[data-clearslot]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.clearslot.split("-"); clearSlot(+d,k); });
  document.querySelectorAll("[data-ainote]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.ainote.split("-"); openAiNote(+d,k); });
  document.querySelectorAll("[data-openrecipe]").forEach(el => el.addEventListener("click", e => {
    if (e.target.closest("button")) return; // Accept/Decline/Reassign/Spin/Wish/etc. keep their own action
    openDetail(el.dataset.openrecipe);
  }));

  // spin
  const deckSearchEl = document.getElementById("deckSearch");
  if (deckSearchEl) deckSearchEl.addEventListener("input", e => { deckSearch = e.target.value; refreshDeck(); });
  if (document.getElementById("deckAdvQuick")) wireQuickFilterRow(app, "deckAdv", deckAdv, refreshDeck);
  if (document.getElementById("deckAdvToggle")) wireFilterToggle(app, "deckAdv", deckPanel);
  if (document.getElementById("deckAdvMeal")) wireAdvFilterPanel(app, "deckAdv", deckAdv, refreshDeck);
  wireSearchClear(app, "deckSearch", () => deckSearch, () => { deckSearch = ""; refreshDeck(); });
  wireSearchSuggest(app, "deckSearch", "deckAdv", q => recipesMatchingName(q), id => {

  document.querySelectorAll("[data-wvote]").forEach(b => b.onclick = () => {
    const w = game.wishes[+b.dataset.wvote];
    w.votes.push(me);

  document.querySelectorAll("[data-wcommit]").forEach(b => b.onclick = async () => {
    const w = game.wishes[+b.dataset.wcommit];
    const d = w.kind === "dish" ? w.dish : (DISHES.find(x => w.kind !== "cuisine" || x.c === w.cuisine)?.id || DISHES[0]?.id);
    if (!d) return;

  });

  // duel
  document.querySelectorAll("[data-duel]").forEach(c => c.onclick = () => {

    p.votes.push(me);
    if (game.duel.proposals.reduce((n, x) => n + x.votes.length, 0) >= 3) game.duel.open = false;
    commitAndSync(`${mem(me).en} voted in the duel`, "duel_voted", { proposal_id: p.id });
  });
}

const DAY_RULE_KIND_LABEL = {
  protein_type: ["protein day", "день белка"],

  diet_suitability: ["diet day", "день диеты"],
  dish_style: ["style day", "день стиля"],

function aiNoteText(note) {
  if (!note) return "";
  if (note.reason === "day_rule_skipped") {
    const kindPair = DAY_RULE_KIND_LABEL[note.rule_kind];
    const kindLabel = kindPair ? T(kindPair[0], kindPair[1]) : note.rule_kind;
    return T(
      `AI skipped this day's ${kindLabel} rule ("${note.rule_value}") to keep the meal safe for everyone attending.`,
      `ИИ пропустил правило "${kindLabel}" ("${note.rule_value}") на этот день, чтобы блюдо оставалось безопасным для всех.`
    );
  }
  if (note.reason === "no_safe_recipe") {
    return T(
      "AI couldn't find a recipe that's safe for everyone attending this meal (or that hasn't already been used this week) — left it empty rather than guess wrong.",
      "ИИ не нашёл рецепт, безопасный для всех участников этого приёма пищи (или ещё не использованный на этой неделе) — оставил слот пустым."
