}
function refreshDeck() {
  const stackEl = document.getElementById("stack");
  if (!stackEl) return;
  stackEl.innerHTML = stackHtml(deck());
  wireStack();
}
function wireStack() {
  const topCard = document.querySelector(".scard.top");
  const fly = dir => {
    if (!topCard) return;
    const id = topCard.dataset.dish;
    topCard.style.transition = "transform .35s, opacity .35s";
    topCard.style.transform = `translateX(${dir*500}px) rotate(${dir*22}deg)`; topCard.style.opacity = "0";
    setTimeout(() => { deckOrder = [...deckOrder.filter(x=>x!==id), id]; if (dir>0) openAssign(id); refreshDeck(); }, 300);
  };
  // Tappable "tip bubbles" over the card, teaching the swipe gesture by mirroring
  // it exactly: left = same as swiping left (skip), right = same as swiping right
  // (onto the menu) - not a separate action, just a discoverable equivalent.
  const tipNope = document.getElementById("tipNope"), tipLike = document.getElementById("tipLike"), add = document.getElementById("add");
  if (tipNope) tipNope.onclick = () => fly(-1);
  if (tipLike) tipLike.onclick = () => fly(1);
  if (add) add.onclick = openAdd;
  const qhideBtn = topCard?.querySelector(".qhide");
  if (qhideBtn) {
    // Stop the tap/drag from reaching the swipe listeners below - this is a
    // discrete action (hide/unhide), not a swipe or a "open detail" tap.
    ["pointerdown", "pointerup", "pointermove", "click"].forEach(evt =>
      qhideBtn.addEventListener(evt, e => e.stopPropagation()));
    qhideBtn.addEventListener("click", async () => {
      const id = qhideBtn.dataset.qhide;
      const d = dish(id);
      if (d) await toggleRecipeActive(d);
    });
  }
  // Photo carousel nav, upload CTA, and admin approve/decline - all discrete
  // taps on the top card's photo area, none of which should trigger the
  // swipe/tap-to-open-detail gesture handlers below.
  const stopBubble = el => ["pointerdown", "pointerup", "pointermove", "click"].forEach(evt =>
    el.addEventListener(evt, e => e.stopPropagation()));
  topCard?.querySelectorAll(".pnav").forEach(btn => {
    stopBubble(btn);
    btn.addEventListener("click", () => {
      const id = btn.dataset.dish;
      photoIdx[id] = (photoIdx[id] || 0) + (btn.dataset.pnav === "next" ? 1 : -1);
      refreshDeck();
    });
  });
  const addPhotoLabel = topCard?.querySelector("[data-addphoto]");
  if (addPhotoLabel) stopBubble(addPhotoLabel);
  const photoFile = topCard?.querySelector("[data-photofile]");
  if (photoFile) {
    photoFile.addEventListener("click", e => e.stopPropagation());
    photoFile.addEventListener("change", async () => {
      const id = photoFile.dataset.photofile;
      const file = photoFile.files && photoFile.files[0];
      photoFile.value = "";
      if (file) await uploadRecipePhoto(id, file);
    });
  }
  const approveBtn = topCard?.querySelector("[data-papprove]");
  if (approveBtn) { stopBubble(approveBtn); approveBtn.addEventListener("click", () => resolvePendingPhoto(approveBtn.dataset.papprove, true)); }
  const declineBtn = topCard?.querySelector("[data-pdecline]");
  if (declineBtn) { stopBubble(declineBtn); declineBtn.addEventListener("click", () => resolvePendingPhoto(declineBtn.dataset.pdecline, false)); }
  if (topCard) {
    let sx=0,dx=0,drag=false;
    topCard.addEventListener("pointerdown", e => { drag=true; sx=e.clientX; topCard.setPointerCapture(e.pointerId); });
    topCard.addEventListener("pointermove", e => { if(!drag)return; dx=e.clientX-sx; topCard.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
      topCard.querySelector(".stamp.yes").style.opacity = dx>40?Math.min(1,dx/120):0; topCard.querySelector(".stamp.no").style.opacity = dx<-40?Math.min(1,-dx/120):0; });
    topCard.addEventListener("pointerup", () => { const tapDx = dx; drag=false; if(dx>90)fly(1); else if(dx<-90)fly(-1);
      else { topCard.style.transition="transform .2s"; topCard.style.transform=""; topCard.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0); } dx=0;
      if (Math.abs(tapDx) < 6) openDetail(topCard.dataset.dish); });
  }
}

// ── recipe detail view - full-screen literal flip, tap any Spin card
// (ONTOLOGY.md section 9, wayfinder map issue #9, prototyped on issue #16).
// About tab carries the full taxonomy as editable chips; edits go through
// food.apply_event's recipe_edit_proposed / _accepted / _declined so an
// owned recipe's edits queue for the owning cook instead of landing live.
// Ingredients/instructions are read-only for now (out of scope for this
// pass - see the migration header for the full deferred list).
let detailOpen = null;      // dish id currently shown full-screen, or null

const DISH_ROLES = ["main", "side", "component"];
const COURSE_CATEGORIES = ["appetizer", "cold_starter", "soup", "main_course", "side_dish", "salad", "dessert"];
// Must match food.techniques (20260801120000_food_ontology_v1.sql) exactly - this is a
// vocabulary-validation trigger on the server, not a client-side convenience list.
const TECHNIQUES = [
  "baked_roasted", "broiled_grilled", "griddled", "air_fried", "toasted", "cooked_by_microwave",
  "boiled", "simmered", "steamed", "braised_stewed", "sauteed", "pan_fried", "deep_fried",

];

function dishRoleLabel(v) {

function techLabel(v) {

    baked_roasted: T("Baked / roasted", "Запечённое"), broiled_grilled: T("Broiled / grilled", "Жареное на гриле"),
    griddled: T("Griddled", "Обжаренное на плите"), air_fried: T("Air fried", "Аэрогриль"),
    toasted: T("Toasted", "Тостированное"), cooked_by_microwave: T("Microwaved", "Готовка в микроволновке"),
    boiled: T("Boiled", "Варёное"), simmered: T("Simmered", "Тушённое на слабом огне"),
    steamed: T("Steamed", "На пару"), braised_stewed: T("Braised / stewed", "Тушёное"),
    sauteed: T("Sauteed", "Обжаренное с помешиванием"), pan_fried: T("Pan-fried", "Жареное на сковороде"),
    deep_fried: T("Deep-fried", "Во фритюре"), sous_vide_cooked: T("Sous vide", "Су-вид"),
    raw: T("Raw / no cook", "Сырое"),
  })[v] || v;
}
// Formats a plain number for display, stripping trailing zeros (matches
// the previous raw-qty formatting convention).
function fmtQty(n) {
  return String(Math.round(n * 100) / 100).replace(/\.0+$/, "");
}
function ingredientLine(ing) {
  if (typeof ing === "string") return ing;
  if (!ing || typeof ing !== "object") return "";
  const name = (lang === "ru" && ing.name_ru) ? ing.name_ru : (ing.name_en || ing.raw || "");
  const note = ing.note ? ` (${ing.note})` : "";
  // Recipe Unit Conversion (SPEC_RECIPE_I18N.md decision #9/#11/#13):
  // show the viewer's preferred system when a conversion is available;
  // otherwise fall back to the recipe's original qty/unit unconverted.
  const converted = convertQty(ing.qty, ing.unit_slug);
  const qty = converted ? fmtQty(converted.qty) : (ing.qty ? String(ing.qty).replace(/\.0+$/, "") : "");
  const unit = converted ? (lang === "ru" ? converted.unit.name_ru : converted.unit.name_en) : (ing.unit || "");
  const line = [qty, unit, name].filter(Boolean).join(" ");
  return (line || ing.raw || "") + note;
}
// Language-matched instruction step text (SPEC_RECIPE_I18N.md) - reads
// text_en/text_ru, falling back to the legacy single `text` key for any
// recipe that predates the translation migration and hasn't been
// re-translated yet.
function stepLangText(s, l) {
  if (typeof s === "string") return s;
  if (!s) return "";
  const key = l === "ru" ? "text_ru" : "text_en";
  return s[key] || s.text || "";
}
function instructionsText(d) {
  if (!d.instructions.length) return "";
  return d.instructions.map(s => stepLangText(s, lang)).filter(Boolean).join("\n\n");
}
// Normalizes any instructions shape (old single-blob [{text}], legacy
// step-array [{step,text,photo_url}], or the current bilingual
// [{step,text_en,text_ru,photo_url}]) into ordered step objects for
// display/editing. `text` is the current-UI-language display copy;
// text_en/text_ru are both preserved so an edit to one language doesn't
// clobber the other's translation (see saveDetailEdit). Renumbering
// happens at save time, not here.
function instructionSteps(d) {
  if (!Array.isArray(d.instructions) || !d.instructions.length) return [];
  return d.instructions.map(s => typeof s === "string"
    ? { text: s, text_en: s, text_ru: null, photo_url: null }
    : {
        text: stepLangText(s, lang),
        text_en: (s && s.text_en) ?? null,
        text_ru: (s && s.text_ru) ?? null,
        photo_url: (s && s.photo_url) || null,
      }
  ).filter(s => s.text);
}

function openDetail(id) {
  if (!dish(id)) return;
  detailOpen = id; detailTab = "about"; detailEditMode = false; detailDraft = null; detailSaving = false;

  el.classList.remove("open"); el.classList.add("closing");
  setTimeout(() => { el.remove(); detailOpen = null; }, 260);

function renderDetailOverlay() {

  wrap.className = "detail-overlay";

  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add("open")));
  wireDetailOverlay(wrap, d);

}

function wireDetailOverlay(wrap, d) {
  wrap.querySelector("#dtlBack")?.addEventListener("click", closeDetail);
  wrap.querySelectorAll("[data-dtltab]").forEach(t => t.addEventListener("click", () => { detailTab = t.dataset.dtltab; renderDetailOverlay(); }));
  // Photo carousel on the hero - identical wiring to the Spin card's, just
  // re-rendering this overlay (not refreshDeck()) since photoIdx[d.id] is the
  // one piece of shared state between the two views.
  wrap.querySelectorAll(".dtl-hero .pnav").forEach(btn => btn.addEventListener("click", () => {
    photoIdx[d.id] = (photoIdx[d.id] || 0) + (btn.dataset.pnav === "next" ? 1 : -1);
    renderDetailOverlay();
  }));
  const dtlPhotoFile = wrap.querySelector(".dtl-hero [data-photofile]");
  if (dtlPhotoFile) dtlPhotoFile.addEventListener("change", async () => {
    // uploadRecipePhoto()/resolvePendingPhoto() already re-render this overlay
    // themselves (`if (detailOpen) renderDetailOverlay()`) once the write
    // lands, so nothing further to do here after awaiting them.
    const file = dtlPhotoFile.files && dtlPhotoFile.files[0];
    dtlPhotoFile.value = "";
    if (file) await uploadRecipePhoto(d.id, file);
  });
  wrap.querySelector(".dtl-hero [data-papprove]")?.addEventListener("click", () => resolvePendingPhoto(d.id, true));
  wrap.querySelector(".dtl-hero [data-pdecline]")?.addEventListener("click", () => resolvePendingPhoto(d.id, false));
  // Tapping the photo itself (not any of the controls above it) opens it
  // full-screen, uncropped - the hero strip only ever shows it letterboxed.
  wrap.querySelector(".dtl-hero")?.addEventListener("click", e => {
    if (e.target.closest(".pnav, .add-photo-cta, .photo-approve-row, .photo-pending-badge")) return;
    const photos = (d.photo_urls && d.photo_urls.length) ? d.photo_urls : (d.photo_url ? [d.photo_url] : []);
    const url = photos[photoIdx[d.id] || 0];
    if (url) openPhotoLightbox(url);
  });
  wrap.querySelector("#dtlEditToggle")?.addEventListener("click", () => {
    if (detailEditMode) { detailEditMode = false; detailDraft = null; }
    else {
      detailEditMode = true;
      detailDraft = {
        dish_role: d.dish_role, course_category: d.course_category,
        meal_types: new Set(d.meals), techniques: new Set(d.techniques),
        instructions: instructionSteps(d).map(s => ({ ...s })),
      };
    }
    renderDetailOverlay();
  });
  wrap.querySelector("#dtlCancel")?.addEventListener("click", () => { detailEditMode = false; detailDraft = null; renderDetailOverlay(); });
  wrap.querySelectorAll("[data-editchip]").forEach(c => c.addEventListener("click", () => {
    if (!detailDraft) return;
    const key = c.dataset.editchip, v = c.dataset.val;
    if (key === "dish_role") {
      detailDraft.dish_role = detailDraft.dish_role === v ? null : v;
      // dish_role='component' <=> meal_types=['component'] is a DB invariant -
      // the two fields must always change together.
      if (detailDraft.dish_role === "component") detailDraft.meal_types = new Set(["component"]);
      else if (detailDraft.meal_types.has("component")) detailDraft.meal_types = new Set(["dinner"]);
    } else if (key === "course_category") {
      detailDraft.course_category = detailDraft.course_category === v ? null : v;
    } else if (key === "meal_types") {
      if (detailDraft.dish_role === "component") return; // locked while dish_role is component
      if (detailDraft.meal_types.has(v)) detailDraft.meal_types.delete(v); else detailDraft.meal_types.add(v);
    } else if (key === "techniques") {
      if (detailDraft.techniques.has(v)) detailDraft.techniques.delete(v); else detailDraft.techniques.add(v);
    }
    renderDetailOverlay();
  }));
  wrap.querySelector("#dtlSave")?.addEventListener("click", () => saveDetailEdit(d));
  wrap.querySelector("#dtlApprove")?.addEventListener("click", () => resolvePendingEdit(d, true));
  wrap.querySelector("#dtlDecline")?.addEventListener("click", () => resolvePendingEdit(d, false));
  wrap.querySelector("#dtlActiveToggle")?.addEventListener("click", () => toggleRecipeActive(d));

  // Step text edits update the draft in place without a full re-render, so
  // the textarea keeps focus/cursor position while typing. Only the
  // CURRENT UI language's side is edited here - text_en/text_ru for the
  // other language (already translated) is left untouched, so editing a
  // step in English doesn't wipe out its existing Russian translation
  // (SPEC_RECIPE_I18N.md - the pre-existing bug this replaces would have
  // silently dropped the other language on every edit).
  wrap.querySelectorAll("[data-stepinput]").forEach(ta => ta.addEventListener("input", (e) => {
    const idx = Number(ta.dataset.stepinput);
    const step = detailDraft?.instructions?.[idx];
    if (!step) return;
    step.text = e.target.value;
    step[lang === "ru" ? "text_ru" : "text_en"] = e.target.value;
  }));
  wrap.querySelector("#dtlStepAdd")?.addEventListener("click", () => {
    if (!detailDraft) return;
    // A brand-new step is authored in the current UI language only - the
    // other side stays null until the translate pipeline (or a manual
    // edit after switching language) fills it in.
    detailDraft.instructions.push({
      text: "",
      text_en: lang === "ru" ? null : "",
      text_ru: lang === "ru" ? "" : null,
      photo_url: null,
    });
    renderDetailOverlay();
  });
  wrap.querySelectorAll("[data-stepup]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.stepup);
    if (!detailDraft || i < 1) return;
    const arr = detailDraft.instructions;
    [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
    renderDetailOverlay();
  }));
  wrap.querySelectorAll("[data-stepdown]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.stepdown);
    const arr = detailDraft?.instructions;
    if (!arr || i >= arr.length - 1) return;
    [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
    renderDetailOverlay();
  }));
  wrap.querySelectorAll("[data-stepdel]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.stepdel);
    if (!detailDraft) return;
    detailDraft.instructions.splice(i, 1);
    renderDetailOverlay();
  }));
}

async function saveDetailEdit(d) {
  if (!detailDraft || detailSaving) return;
  const draftMeals = [...detailDraft.meal_types];
  if (!draftMeals.length) { toast(T("Pick at least one meal type.", "Выберите хотя бы один тип приёма пищи.")); return; }

  const proposed = {};
  if (detailDraft.dish_role !== d.dish_role) proposed.dish_role = detailDraft.dish_role;
  if (detailDraft.course_category !== d.course_category) proposed.course_category = detailDraft.course_category;
  if (draftMeals.slice().sort().join(",") !== d.meals.slice().sort().join(",")) proposed.meal_types = draftMeals;
  const draftTech = [...detailDraft.techniques].sort();
  if (draftTech.join(",") !== d.techniques.slice().sort().join(",")) proposed.techniques = draftTech;
  // dish_role changes must always carry meal_types alongside (server-enforced pairing).
  if ("dish_role" in proposed && !("meal_types" in proposed)) proposed.meal_types = draftMeals;

  // Bilingual step diffing (SPEC_RECIPE_I18N.md): both text_en and text_ru
  // travel together so an edit in one language never overwrites the
  // other's already-translated text. Built from d.instructions directly
  // (not the language-collapsed instructionSteps() view) so the diff -
  // and what actually gets sent - reflects both languages accurately.
  const draftSteps = detailDraft.instructions
    .filter(s => (s.text || "").trim())
    .map((s, i) => ({ step: i + 1, text_en: s.text_en ?? null, text_ru: s.text_ru ?? null, photo_url: s.photo_url || null }));
  const currentSteps = (Array.isArray(d.instructions) ? d.instructions : []).map((s, i) => ({
    step: i + 1,
    text_en: (typeof s === "string" ? null : s?.text_en) ?? null,
    text_ru: (typeof s === "string" ? null : s?.text_ru) ?? null,
    photo_url: (typeof s === "string" ? null : s?.photo_url) || null,
  }));
  if (JSON.stringify(draftSteps) !== JSON.stringify(currentSteps)) proposed.instructions = draftSteps;

  if (!Object.keys(proposed).length) { detailEditMode = false; detailDraft = null; renderDetailOverlay(); return; }

  detailSaving = true; renderDetailOverlay();
  const ok = await applyEvent("recipe_edit_proposed", { recipe_id: d.id, proposed });
  detailSaving = false;
  if (!ok) { renderDetailOverlay(); return; }
  await loadCatalog();
  const fresh = dish(d.id);
  const wentPending = !!(fresh && fresh.pending_edit && fresh.added_by_member_id && fresh.added_by_member_id !== me);
  detailEditMode = false; detailDraft = null;
  toast(wentPending
    ? T("Edit sent - waiting for the owning cook to approve.", "Изменение отправлено - ждём подтверждения от повара.")
    : T("Recipe updated.", "Рецепт обновлён."));
  if (tab === "spin") refreshDeck();
  if (detailOpen) renderDetailOverlay();
}

async function resolvePendingEdit(d, approve) {
  const ok = await applyEvent(approve ? "recipe_edit_accepted" : "recipe_edit_declined", { recipe_id: d.id });
  if (!ok) return;
  await loadCatalog();
  toast(approve ? T("Edit approved.", "Изменение принято.") : T("Edit declined - a new recipe was created.", "Изменение отклонено - создан новый рецепт."));
  if (tab === "spin") refreshDeck();
  if (detailOpen) renderDetailOverlay();
}

// Instant, no-approval toggle (unlike recipe_edit_*/pending_edit above) - this is a
// household preference, not a fact about the recipe, so any family member can flip
// it and see it take effect immediately. See 20260804_food_recipe_active_toggle.sql.
async function toggleRecipeActive(d) {
  if (detailSaving) return;
  const goingActive = !d.is_active;
  detailSaving = true; renderDetailOverlay();
  const ok = await applyEvent("recipe_active_set", { recipe_id: d.id, is_active: goingActive });
  detailSaving = false;
  if (!ok) { renderDetailOverlay(); return; }
  await loadCatalog();
  // Explains both halves of what just happened: (1) what changed for this one
  // recipe, and (2) that it's still showing up in Spin/Wish right now regardless -
  // inactive just means "opted out of the AI weekly fill" - and exactly where to
  // go if they actually want it out of sight (the filter icon by the search bar).
  stickyToast(goingActive
    ? T("Back in the mix - eligible for the AI weekly fill again.", "Снова участвует в автозаполнении ИИ.")
    : T("Hidden from AI weekly planning. Click the eye icon again to unhide. Stays visible in the Spinner - can be hidden completely in \"Filter\" settings above.", "Скрыто из недельного планирования ИИ. Нажмите на значок глаза ещё раз, чтобы вернуть. Всё ещё видно в Крутке - можно скрыть полностью в настройках «Фильтр» выше."));
  if (tab === "spin") refreshDeck();
  if (detailOpen) renderDetailOverlay();
}

// Uploads to the recipe-photos Storage bucket at <family_id>/<recipe_id>/<uuid>.<ext>
// (RLS on storage.objects checks the first path segment against the caller's
// family - 20260804020000 migration), then fires recipe_photo_added so
// food.apply_event decides whether it lands live or waits for the family
// admin (see the migration header for the exact rule).
async function uploadRecipePhoto(dishId, file) {
  const familyId = membership?.family_id;
  if (!familyId) { toast(T("Sign in first.", "Сначала войдите.")); return; }
  const ext = ((file.name || "").split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
  const path = `${familyId}/${dishId}/${crypto.randomUUID()}.${ext}`;
  toast(T("Uploading photo...", "Загружаем фото..."));
  const { error: upErr } = await sb.storage.from("recipe-photos").upload(path, file, {
    contentType: file.type || "image/jpeg",
    upsert: false,
  });
  if (upErr) { toast(T("Upload failed: ", "Ошибка загрузки: ") + upErr.message); return; }
  const { data: pub } = sb.storage.from("recipe-photos").getPublicUrl(path);
  const photoUrl = pub?.publicUrl;
  if (!photoUrl) { toast(T("Upload failed - no URL returned.", "Ошибка загрузки - URL не получен.")); return; }
  const ok = await applyEvent("recipe_photo_added", { recipe_id: dishId, photo_url: photoUrl });
  if (!ok) return;
  await loadCatalog();
  const d = dish(dishId);
  const wentLive = Boolean(d && d.photo_urls.includes(photoUrl));
  photoIdx[dishId] = wentLive ? Math.max(0, d.photo_urls.length - 1) : 0;
  toast(wentLive
    ? T("Photo added!", "Фото добавлено!")
    : T("Photo sent to the family admin for approval.", "Фото отправлено администратору на одобрение."));
  if (tab === "spin") refreshDeck();
  if (detailOpen) renderDetailOverlay();
}
async function resolvePendingPhoto(dishId, approve) {
  const ok = await applyEvent(approve ? "recipe_photo_approved" : "recipe_photo_declined", { recipe_id: dishId });
  if (!ok) return;
  await loadCatalog();
  photoIdx[dishId] = 0;
  toast(approve ? T("Photo approved.", "Фото одобрено.") : T("Photo declined.", "Фото отклонено."));
  if (tab === "spin") refreshDeck();
  if (detailOpen) renderDetailOverlay();
}

function ago(ts) { const s = (Date.now()-ts)/1000; if (s<60) return T("just now", "только что"); if (s<3600) return Math.floor(s/60)+T("m ago", " мин назад"); return Math.floor(s/3600)+T("h ago", " ч назад"); }

function nav() {

  const tabs = [["spin","🎰","Spin","Крутить"],["wish","✨","Wish","Желание"],["menu","🗓","Menu","Меню"],["duel","⚔️","Duel","Дуэль"],["feed","📣","Family","Семья"]];

}

// ── wiring ──
function wire() {
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  const pill = document.getElementById("mePill");
  // The "me" pill now opens Settings (which is where sign-out + invite live).
  // The old member-switcher is gone: identity is bound to the auth session.
  if (pill) pill.onclick = openSettings;
  const settings = document.getElementById("settingsBtn");
  if (settings) settings.onclick = openSettings;

  // menu
  document.getElementById("confirm") && (document.getElementById("confirm").onclick = () => {
    game.locked = true;
    game.week.forEach(d => MEALS.forEach(m => { if (d[m.k]) delete d[m.k].proposal; }));
    commitAndSync(`${mem(me).en} confirmed the week`, "week_confirmed", { plan_id: activePlanId });
  });
  document.getElementById("unlock") && (document.getElementById("unlock").onclick = () => {
    game.locked = false;
    commitAndSync(`${mem(me).en} reopened the menu`, "week_unlocked", { plan_id: activePlanId });
  });
  const aiBtn = document.getElementById("aiFill");
  if (aiBtn) aiBtn.onclick = openAiFill;
  document.querySelectorAll("[data-cookacc]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.cookacc.split("-"); acceptCook(+d,k); });
  document.querySelectorAll("[data-cookrej]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.cookrej.split("-"); declineCook(+d,k); });
  document.querySelectorAll("[data-cookreassign]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.cookreassign.split("-"); openReassignCook(+d,k); });
  document.querySelectorAll("[data-propacc]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.propacc.split("-"); acceptProposal(+d,k); });
  document.querySelectorAll("[data-proprej]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.proprej.split("-"); rejectProposal(+d,k); });
  document.querySelectorAll("[data-spin]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.spin.split("-"); tab="spin"; spinTarget={day:+d,meal:k}; render(); toast(T("Swipe right to fill ", "Свайпни вправо, чтобы заполнить ") + dayN(+d) + " " + MEALS.find(m=>m.k===k).ic); });
  document.querySelectorAll("[data-wish]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.wish.split("-"); tab="wish"; render(); openWish(+d); });
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.edit.split("-"); openEdit(+d,k); });
  document.querySelectorAll("[data-ainote]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.ainote.split("-"); openAiNote(+d,k); });

  // spin
  const deckSearchEl = document.getElementById("deckSearch");
  if (deckSearchEl) deckSearchEl.addEventListener("input", e => { deckSearch = e.target.value; refreshDeck(); });
  if (document.getElementById("deckAdvQuick")) wireQuickFilterRow(app, "deckAdv", deckAdv, refreshDeck);
  if (document.getElementById("deckAdvToggle")) wireFilterToggle(app, "deckAdv", deckPanel);
  if (document.getElementById("deckAdvMeal")) wireAdvFilterPanel(app, "deckAdv", deckAdv, refreshDeck);
  wireSearchOpensFilters(app, "deckSearch", "deckAdv", deckPanel);
  wireSearchSuggest(app, "deckSearch", "deckAdv", q => deck(q), id => {
    const idx = deckOrder.indexOf(id);
    if (idx > 0) { deckOrder.splice(idx, 1); deckOrder.unshift(id); }
    deckSearch = "";
    if (deckSearchEl) deckSearchEl.value = "";
    refreshDeck();
  });
  wireStack();

  // wish
  document.getElementById("newWish") && (document.getElementById("newWish").onclick = () => openWish(null));
  document.querySelectorAll("[data-wvote]").forEach(b => b.onclick = () => {
    const w = game.wishes[+b.dataset.wvote];
    w.votes.push(me);
    commitAndSync(`${mem(me).en} voted for a wish`, "wish_voted", { wish_id: w.id });
  });
  document.querySelectorAll("[data-wcommit]").forEach(b => b.onclick = async () => {
    const w = game.wishes[+b.dataset.wcommit];
    const d = w.kind === "dish" ? w.dish : (DISHES.find(x => w.kind !== "cuisine" || x.c === w.cuisine)?.id || DISHES[0]?.id);
    if (!d) return;
    w.committed = me;
    act(`${mem(me).en} granted ${mem(w.by).en}'s wish`);
    render();
    saving = true;
    const ok = await applyEvent("wish_granted", { wish_id: w.id });
    saving = false;
    if (ok) assignToSlot(w.day, "dinner", d, me);
    toast(T("Wish granted - added to the menu 🎉", "Желание исполнено - добавлено в меню 🎉"));
  });

  // duel
  document.querySelectorAll("[data-duel]").forEach(c => c.onclick = () => {
    const p = game.duel.proposals[+c.dataset.duel];
    p.votes.push(me);
    if (game.duel.proposals.reduce((n, x) => n + x.votes.length, 0) >= 3) game.duel.open = false;
    commitAndSync(`${mem(me).en} voted in the duel`, "duel_voted", { proposal_id: p.id });
  });
}

// SPEC_AI_PREFILL.md #19: translates food.meal_slots.ai_note's machine-readable
// reason codes into the tap-to-expand explanation shown on a slot's badge.
const DAY_RULE_KIND_LABEL = {
  protein_type: ["protein day", "день белка"],
  cuisine: ["cuisine day", "день кухни"],
  diet_suitability: ["diet day", "день диеты"],
  dish_style: ["style day", "день стиля"],
};
function aiNoteText(note) {
  if (!note) return "";
  if (note.reason === "day_rule_skipped") {
    const kindPair = DAY_RULE_KIND_LABEL[note.rule_kind];
    const kindLabel = kindPair ? T(kindPair[0], kindPair[1]) : note.rule_kind;
    return T(
      `AI skipped this day's ${kindLabel} rule ("${note.rule_value}") to keep the meal safe for everyone attending.`,
      `ИИ пропустил правило "${kindLabel}" ("${note.rule_value}") на этот день, чтобы блюдо оставалось безопасным для всех.`
    );
  }
  if (note.reason === "no_safe_recipe") {
    return T(
      "AI couldn't find a recipe that's safe for everyone attending this meal (or that hasn't already been used this week) — left it empty rather than guess wrong.",
      "ИИ не нашёл рецепт, безопасный для всех участников этого приёма пищи (или ещё не использованный на этой неделе) — оставил слот пустым."
    );
  }
  if (note.reason === "no_qualified_cook") {
    return T(
      "AI found a safe recipe but no available cook whose skill level and Cook Grid match it — left it empty rather than assign the wrong person.",
      "ИИ нашёл безопасный рецепт, но не нашёл доступного повара подходящего уровня — оставил слот пустым."
    );
  }
  return T("AI made a note about this slot.", "ИИ оставил заметку об этом слоте.");
}

function openAiFill() {
  const anyMeals = game.week.some(d => d.breakfast || d.lunch || d.dinner);
  const v = modal(`<h3>🤖 ${T("Generate a full AI menu?", "Собрать меню с ИИ?")}</h3>
    <div style="font-size:14px;color:#555;line-height:1.6">
      ${anyMeals
        ? T("This will touch every day of the week. Meals already on the menu become swap proposals - the family (and anyone whose spin or wish is on that slot) must approve before they change. Newly filled empty slots still need their assigned cook to accept.",
            "Это затронет каждый день недели. Уже стоящие блюда станут предложениями замены - семья (и те, чей спин или желание там стоит) должны одобрить, прежде чем что-то изменится. Новые пустые слоты всё равно ждут подтверждения от назначенного повара.")
        : T("Every empty slot gets a suggested dish and cook. Each assigned cook must accept before it's final.",
            "Каждый пустой слот получит блюдо и повара. Каждый назначенный повар должен подтвердить, прежде чем это станет окончательным.")}
    </div>
    <button class="btn btn-primary" id="aiGo" style="width:100%;margin-top:16px">🤖 ${T("Yes, generate it", "Да, собрать")}</button>
    <button class="btn btn-ghost" id="aiCancel" style="width:100%;margin-top:8px">${T("Cancel", "Отмена")}</button>`);
  v.querySelector("#aiGo").onclick = async () => {
    closeModal();
    const { overwrittenCount, events } = aiPopulateWeek();
    act(`${mem(me).en} triggered an AI menu ${anyMeals ? "refresh" : "fill"}`);
    render();
    let failed = 0;
    for (const [eventType, payload] of events) {
      const ok = await applyEvent(eventType, payload);
      if (!ok) failed++;
    }
    await pullLatest();
    toast(failed
      ? T("AI menu partially synced - ", "Меню от ИИ синхронизировано частично - ") + failed + T(" slot(s) failed, try again", " слот(а/ов) не удалось, попробуйте снова")
      : overwrittenCount
        ? T("AI menu sent - ", "Меню от ИИ отправлено - ") + overwrittenCount + T(" swap(s) need family approval", " замен(а/ы) требуют одобрения семьи")
        : T("AI menu ready - cooks need to accept their meals", "Меню от ИИ готово - поварам нужно подтвердить блюда"));
  };
  v.querySelector("#aiCancel").onclick = closeModal;
}

function wishStep2(kind, presetDay) {
  let selDish=null, selCui=null, selCook="any", selDay=presetDay??null;
  let dishSearch="";
  const dishAdv = newAdvFilters();
  const dishPanel = { open: false };
  const v = modal(`<h3>${kind==="dish"?"🍛 "+T("Which dish?","Какое блюдо?"):kind==="cuisine"?"🌍 "+T("Which cuisine?","Какая кухня?"):"🎁 "+T("Cook's choice","Выбор повара")}</h3>
    ${kind==="dish"?`
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <input id="dishSearch" style="flex:1 1 auto;min-width:0;border:2px solid #e5e7eb;border-radius:12px;padding:9px 12px;font-size:14px" placeholder="${T("Search recipes...", "Поиск рецептов...")}">
        ${filterIconButtonHtml("dishAdv", dishPanel.open)}
      </div>
      ${quickFilterRowHtml("dishAdv", dishAdv)}
      <div style="margin-bottom:8px">${advFilterPanelHtml("dishAdv", dishAdv, dishPanel.open)}</div>
      <div class="chips-wrap" id="WD"></div>` : ""}
    ${kind==="cuisine"?`<div class="chips-wrap" id="WC">${availableCuisines().map(c=>`<div class="chip" data-c="${c}">${cuisineLabel(c)}</div>`).join("")}</div>`:""}
    <div class="sect">${T("Who should cook it?", "Кто должен готовить?")}</div>
    <div class="chips-wrap" id="WK"><div class="chip on" data-c="any">🎲 ${T("Anyone", "Кто угодно")}</div>${FAMILY.filter(m=>m.cook).map(m=>`<div class="chip" data-c="${m.id}">${m.em} ${mName(m)}</div>`).join("")}</div>
    <div class="sect">${T("Which day?", "Какой день?")}</div><div class="chips-wrap" id="WY">${DAYS.map((d,i)=>`<div class="chip ${i===selDay?"on":""}" data-d="${i}">${dayN(i)}</div>`).join("")}</div>
    <button class="btn btn-primary" id="wgo" style="width:100%;margin-top:16px;opacity:.4">✨ ${T("Wish it", "Загадать")}</button>`);
  const ok = () => selDay!==null && (kind==="choice" || (kind==="dish"?selDish:selCui));
  function renderDishList() {
    const q = dishSearch.trim().toLowerCase();
    const list = DISHES.filter(d => {
      if (q && !d.en.toLowerCase().includes(q) && !d.ru.toLowerCase().includes(q)) return false;
      return matchesAdvFilters(d, dishAdv);
    });
    const wd = v.querySelector("#WD");
    wd.innerHTML = list.length
      ? list.map(d => `<div class="chip ${selDish===d.id?"on":""}" data-i="${d.id}">${d.em} ${dName(d)}</div>`).join("")
      : `<div style="color:#aaa;font-size:13px;padding:6px 0">${T("No recipes match", "Нет подходящих рецептов")}</div>`;
    wd.querySelectorAll("[data-i]").forEach(c => c.onclick = () => { selDish = c.dataset.i; renderDishList(); upd(); });
  }
  const upd = () => { v.querySelectorAll("#WD .chip").forEach(c=>c.classList.toggle("on",c.dataset.i===selDish));
    v.querySelectorAll("#WC .chip").forEach(c=>c.classList.toggle("on",c.dataset.c===selCui));
    v.querySelectorAll("#WK .chip").forEach(c=>c.classList.toggle("on",c.dataset.c===selCook));
    v.querySelectorAll("#WY .chip").forEach(c=>c.classList.toggle("on",+c.dataset.d===selDay));
    v.querySelector("#wgo").style.opacity = ok()?1:.4; };
  if (kind === "dish") {
    renderDishList();
    v.querySelector("#dishSearch").addEventListener("input", e => { dishSearch = e.target.value; renderDishList(); });
    wireQuickFilterRow(v, "dishAdv", dishAdv, renderDishList);
    wireFilterToggle(v, "dishAdv", dishPanel);
    wireAdvFilterPanel(v, "dishAdv", dishAdv, renderDishList);
    wireSearchOpensFilters(v, "dishSearch", "dishAdv", dishPanel);
  }
  v.querySelectorAll("#WC .chip").forEach(c=>c.onclick=()=>{selCui=c.dataset.c;upd();});
  v.querySelectorAll("#WK .chip").forEach(c=>c.onclick=()=>{selCook=c.dataset.c;upd();});
  v.querySelectorAll("#WY .chip").forEach(c=>c.onclick=()=>{selDay=+c.dataset.d;upd();});
  v.querySelector("#wgo").onclick = () => { if(!ok())return; closeModal();
    const wishId = crypto.randomUUID();
    let recipeId = selDish;
    if (kind === "cuisine") recipeId = DISHES.find(d => d.c === selCui)?.id;
    else if (kind === "choice") recipeId = DISHES[Math.floor(Math.random() * DISHES.length)]?.id;
    if (!recipeId) { toast(T("Pick a recipe first", "Сначала выбери рецепт")); return; }
    game.wishes.unshift({ id: wishId, kind, dish: recipeId, cuisine: selCui, by: me, wishCook: selCook, votes: [], committed: null, day: selDay });
    commitAndSync(`${mem(me).en} made a wish`, "wish_created", {
      wish_id: wishId, plan_id: activePlanId, target_day: selDay, recipe_id: recipeId,
      wished_by_member_id: me,
    });
    tab="wish"; render(); toast(T("Wish sent to the family ✨", "Желание отправлено семье ✨")); };
}

  const emojis = ["🍝","🥘","🍤","🥧","🍱","🌮"]; let em = "🍝";
  const v = modal(`<h3>➕ ${T("Add a dish", "Добавить блюдо")}</h3>

function toast(msg) {
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}
// Same look as toast(), but for messages worth actually reading (e.g. what the
// quick-hide eye icon just did, and where to go to change the default) - stays
// up to 15s, or dismisses immediately on tap, instead of the standard 2.2s blip.
function stickyToast(msg) {
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  t.style.cursor = "pointer";
  document.body.appendChild(t);
  const timer = setTimeout(() => t.remove(), 15000);
  t.addEventListener("click", () => { clearTimeout(timer); t.remove(); });
}

// ── boot ──
// Auth-first: check for an existing session (or a magic-link callback in the
// URL fragment, handled by detectSessionInUrl). Only start realtime + load
// spin_play_state once we have both a session and a membership row.
(async function () {
  const { data: sessData } = await sb.auth.getSession();
  authSession = sessData.session;

  // React to future auth events (magic-link login, sign-out, tab sync).
  sb.auth.onAuthStateChange(async (event, session) => {
    authSession = session;
    // Don't re-render over the language gate — Safari loses dynamic tap handlers.
    if (needsDeviceLangGate()) return;
    if (event === "SIGNED_IN") {
      await refreshMembership();
      if (membership && !rtChan) {
        if (!me) me = membership.member_id;
        joinPresence();
        await kickLoad();
        if (game) {
          subscribe();
          startSyncWatchers();
        }
      }
    } else if (event === "SIGNED_OUT") {
      membership = null; me = null; game = null; loadError = null;
    }
    render();
  });

  if (authSession) await refreshMembership();

  // Housekeeping: if the caller lands with ?invite=<token> in the URL but is
  // already a member (e.g. they clicked their own old invite link), strip the
  // token so a refresh doesn't try to accept it again.
  if (authSession && membership && inviteTokenInUrl) {
    const u = new URL(location.href);
    u.searchParams.delete("invite");
    history.replaceState({}, "", u.toString());
  }

  render(); // sign-in gate / invitation onboarding / lang gate / app

  // If we already have auth + membership on cold boot, start the game plumbing.
  // Skip while the language gate is showing — let the user pick first.
  if (authSession && membership && !needsDeviceLangGate()) {
    if (!me && membership) me = membership.member_id;
    joinPresence();
    if (!game) await kickLoad();
    if (game) {
      subscribe();
      startSyncWatchers();
    }
    render();
  }
})();
