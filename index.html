        <button class="filter-icon-btn" id="impPlusBtn" aria-label="${T("More ways to add", "Другие способы добавить")}" style="font-size:20px;font-weight:800">+</button>
        <div class="dropdown-menu" id="impPlusMenu" style="display:none;right:0;left:auto">
          <div class="dropdown-item" id="impBlankItem">📝 ${T("Start blank", "Начать с пустого")}</div>
        </div>
      </div>`}
    </div>
    <button class="btn btn-primary" id="impGo" style="width:100%;margin-top:16px;opacity:.4" disabled>${T("Continue", "Продолжить")}</button>
    <div id="impStatus" style="font-size:13px;color:#888;margin-top:8px;min-height:18px"></div>`);

  const urlInput = v.querySelector("#impUrl");
  const goBtn = v.querySelector("#impGo");
  const statusEl = v.querySelector("#impStatus");
  const setBusy = (busy, msg = "") => {
    goBtn.disabled = busy || !urlInput.value.trim();
    goBtn.style.opacity = goBtn.disabled ? .4 : 1;
    statusEl.textContent = msg;
    urlInput.disabled = busy;
    v.querySelector("#impCamBtn").disabled = busy;
    v.querySelector("#impSearchBtn").disabled = busy;
  };
  urlInput.addEventListener("input", () => setBusy(false));

  v.querySelector("#impSearchBtn").addEventListener("click", () => {
    const defaultQuery = isEnrich ? dName(dish(targetRecipeId)) : urlInput.value.trim();
    openRecipeWebsiteSearch(defaultQuery);
  });

  v.querySelector("#impPlusBtn")?.addEventListener("click", (e) => {
    e.stopPropagation();
    const menu = v.querySelector("#impPlusMenu");
    menu.style.display = menu.style.display === "none" ? "block" : "none";
  });
  v.querySelector("#impBlankItem")?.addEventListener("click", () => { closeModal(); openBlankAdd(); });

  const photoInput = v.querySelector("#impPhoto");
  v.querySelector("#impCamBtn").addEventListener("click", () => photoInput.click());
  photoInput.addEventListener("change", async () => {
    const files = Array.from(photoInput.files || []);
    photoInput.value = "";
    if (!files.length) return;
    setBusy(true, T("Uploading photo...", "Загружаем фото..."));
    const photoUrls = [];
    for (const f of files) {
      const url = await uploadImportPhoto(f);
      if (url) photoUrls.push(url);
    }
    if (!photoUrls.length) { setBusy(false); return; }
    setBusy(true, T("Reading the recipe...", "Читаем рецепт..."));
    await runImportExtract("photo", { photo_urls: photoUrls }, targetRecipeId, setBusy);
  });

  goBtn.onclick = async () => {
    const url = urlInput.value.trim();
    if (!url) return;
    // YouTube auto-detect (map #20/#21) - no separate tab, the URL field
    // itself routes here. Async per #33: queue and close, no spinner wait.
    if (/(?:youtube\.com|youtu\.be)/i.test(url)) {
      setBusy(true, T("Queuing your video...", "Ставим видео в очередь..."));
      const { data, error } = await invokeWithTimeout("spin-food-import", {
        body: { source_type: "youtube", action: "extract", payload: { url, target_recipe_id: targetRecipeId } },
      });
      if (error || !data?.ok) {
        setBusy(false, "");
        toast((error && error.message) || data?.error || T("Couldn't queue that video.", "Не удалось поставить видео в очередь."));
        return;
      }
      closeModal();
      toast(T("Got it! We'll notify you when your recipe is ready to review.", "Принято! Уведомим, когда рецепт будет готов к проверке."));
      return;
    }
    setBusy(true, T("Reading the recipe...", "Читаем рецепт..."));
    await runImportExtract("url", { url }, targetRecipeId, setBusy);
  };
}

// Uploads directly to the recipe-import-photos Storage bucket at
// <family_id>/<uuid>.<ext> - no recipe_id exists yet at this point, unlike
// uploadRecipePhoto() which uploads into an already-saved recipe's folder.
async function uploadImportPhoto(file) {
  const familyId = membership?.family_id;
  if (!familyId) { toast(T("Sign in first.", "Сначала войдите.")); return null; }
  const ext = ((file.name || "").split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
  const path = `${familyId}/${crypto.randomUUID()}.${ext}`;
  const { error: upErr } = await sb.storage.from("recipe-import-photos").upload(path, file, {
    contentType: file.type || "image/jpeg",
    upsert: false,
  });
  if (upErr) { toast(T("Upload failed: ", "Ошибка загрузки: ") + upErr.message); return null; }
  const { data: pub } = sb.storage.from("recipe-import-photos").getPublicUrl(path);
  return pub?.publicUrl || null;
}

async function runImportExtract(sourceType, payload, targetRecipeId, setBusy) {
  const { data, error } = await invokeWithTimeout("spin-food-import", {
    body: { source_type: sourceType, action: "extract", payload: { ...payload, target_recipe_id: targetRecipeId } },
  });
  if (error) { setBusy(false, ""); toast(error.message || T("Something went wrong.", "Что-то пошло не так.")); return; }
  if (!data?.ok) { setBusy(false, ""); toast(data?.error || T("Couldn't read that recipe.", "Не удалось прочитать рецепт.")); return; }
  closeModal();
  openImportReview(data.draft, data.job_id, targetRecipeId, sourceType);
}

// Review-before-save screen, per map decision #18 (allergy-safety driven -
// every extracted draft must be reviewed/editable before it becomes a real
// recipe row). Deliberately its own lightweight editor rather than reusing
// detailView()'s edit mode, which is built around an already-saved dish id.
// Bilingual review (SPEC_RECIPE_I18N.md shape, extended to the pre-save
// draft too - see 2026-08-09 CHANGELOG entry): the extraction call always
// fills both name_en/name_ru, title_en/title_ru, and text_en/text_ru, so
// the reviewer sees their own current UI language regardless of source
// language, while both languages travel together untouched into the
// eventual recipe row (no separate on-the-fly-translation step needed at
// display time, matching the "translated once, persisted" storage model).
// Editing writes back only into the language-matched field for whatever
// the reviewer is currently looking at - the untouched language's
// extracted translation is preserved, same convention as saveDetailEdit().
function openImportReview(draft, jobId, targetRecipeId, sourceType) {
  let titleEn = draft.title_en ?? draft.title ?? "";
  let titleRu = draft.title_ru ?? null;
  let ingredients = (draft.ingredients || []).map(i => ({ ...i }));
  let instructions = (draft.instructions || []).map(s =>
    typeof s === "string"
      ? { text_en: s, text_ru: null, photo_url: null }
      : { text_en: s.text_en ?? "", text_ru: s.text_ru ?? null, photo_url: s.photo_url ?? null }
  );
  const youtubeUrl = draft.youtube_url || null;
  let heroPhotoUrl = draft.photo_url || null;
  let servings = draft.servings ?? null;

  const ingName = (ing) => (lang === "ru" ? (ing.name_ru || ing.name_en) : (ing.name_en || ing.name_ru)) || "";
  const stepText = (s) => (lang === "ru" ? (s.text_ru || s.text_en) : (s.text_en || s.text_ru)) || "";
  // unitDisplay()/unitFromInput() are shared top-level helpers (see convertQty
  // above) - the draft stores the canonical slug (e.g. "kg"), same as saved
  // recipes, so this reuses the exact same localization ingredientLine() does.

  const render = () => {
    v.querySelector("#revIng").innerHTML = ingredients.map((ing, i) => `
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px" data-ingidx="${i}">
        <input data-ingf="qty" value="${ing.qty ?? ""}" placeholder="${T("qty", "кол-во")}" style="width:52px;border:1px solid #eee;border-radius:8px;padding:6px;font-size:13px">
        <input data-ingf="unit" value="${unitDisplay(ing.unit).replace(/"/g, "&quot;")}" placeholder="${T("unit", "ед.")}" style="width:56px;border:1px solid #eee;border-radius:8px;padding:6px;font-size:13px">
        <input data-ingf="name" value="${ingName(ing).replace(/"/g, "&quot;")}" placeholder="${T("ingredient", "ингредиент")}" style="flex:1;border:1px solid #eee;border-radius:8px;padding:6px;font-size:13px">
        <button class="dtl-back" data-ingdel="${i}" style="width:28px;height:28px;font-size:12px;color:#ef4444">✕</button>
      </div>`).join("") || `<div style="font-size:12px;color:#aaa">${T("No ingredients found - add them manually or edit the photo/link.", "Ингредиенты не найдены - добавьте вручную.")}</div>`;
    v.querySelector("#revInstr").innerHTML = instructions.map((s, i) => `
      <div style="display:flex;gap:6px;align-items:flex-start;margin-bottom:6px" data-instridx="${i}">
        <div style="flex:0 0 20px;font-weight:800;color:#bbb;padding-top:8px;text-align:right">${i + 1}.</div>
        ${s.photo_url ? `<img src="${s.photo_url}" style="flex:0 0 44px;width:44px;height:44px;border-radius:8px;object-fit:cover;margin-top:2px">` : ""}
        <textarea data-instrinput="${i}" rows="2" style="flex:1;border:1px solid #eee;border-radius:8px;padding:6px 8px;font-size:13px;font-family:inherit">${stepText(s)}</textarea>
        <button class="dtl-back" data-instrdel="${i}" style="width:28px;height:28px;font-size:12px;color:#ef4444">✕</button>
      </div>`).join("") || `<div style="font-size:12px;color:#aaa">${T("No instructions found - add them manually.", "Инструкции не найдены - добавьте вручную.")}</div>`;
    wireRows();
  };

  const heroHtml = () => heroPhotoUrl ? `
    <div id="revHeroWrap" style="position:relative;margin-bottom:10px">
      <img src="${heroPhotoUrl}" style="width:100%;max-height:180px;object-fit:cover;border-radius:12px;display:block">
      <button class="dtl-back" id="revHeroDel" style="position:absolute;top:6px;right:6px;width:28px;height:28px;font-size:12px;color:#ef4444;background:#fff;border-radius:50%">✕</button>
    </div>` : "";

  const v = modal(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <h3 style="margin:0">👀 ${T("Review before saving", "Проверьте перед сохранением")}</h3>
      <button class="mini-btn" id="revCancel">✕ ${T("Cancel", "Отмена")}</button>
    </div>
    <div id="revHero">${heroHtml()}</div>
    <div class="sect">${T("Title", "Название")}</div>
    <input id="revTitle" value="${((lang === "ru" ? (titleRu || titleEn) : (titleEn || titleRu)) || "").replace(/"/g, "&quot;")}" style="width:100%;border:2px solid #e5e7eb;border-radius:12px;padding:10px;font-size:15px">
    ${youtubeUrl ? `<div style="font-size:12px;margin-top:6px"><a href="${youtubeUrl}" target="_blank" rel="noopener" style="color:var(--amber,#d97706);text-decoration:none">▶️ ${T("Video found - will be linked on the recipe", "Найдено видео - будет привязано к рецепту")}</a></div>` : ""}
    <div style="margin-top:8px;display:flex;align-items:center;gap:6px;font-size:13px;color:#666">👥 ${T("Serves", "Порций")} <input id="revServings" type="number" min="1" value="${servings ?? ""}" placeholder="4" style="width:56px;border:1px solid #eee;border-radius:8px;padding:5px 6px;font-size:13px"></div>
    <div class="sect">${T("Ingredients", "Ингредиенты")}</div>
    <div id="revIng"></div>
    <button class="mini-btn" id="revIngAdd" style="margin-top:2px">+ ${T("Add ingredient", "Добавить ингредиент")}</button>
    <div class="sect" style="margin-top:12px">${T("Instructions", "Инструкции")}</div>
    <div id="revInstr"></div>
    <button class="mini-btn" id="revInstrAdd" style="margin-top:2px">+ ${T("Add step", "Добавить шаг")}</button>
    <button class="btn btn-primary" id="revSave" style="width:100%;margin-top:18px">💾 ${T("Save", "Сохранить")}</button>`,
    { preventBackdropClose: true });

  v.querySelector("#revCancel").onclick = () => closeModal();
  const wireHero = () => {
    const delBtn = v.querySelector("#revHeroDel");
    if (delBtn) delBtn.onclick = () => { heroPhotoUrl = null; v.querySelector("#revHero").innerHTML = heroHtml(); wireHero(); };
  };
  wireHero();

  v.querySelector("#revTitle").addEventListener("input", (e) => {
    if (lang === "ru") titleRu = e.target.value; else titleEn = e.target.value;
  });
  v.querySelector("#revServings").addEventListener("input", (e) => {
    servings = e.target.value === "" ? null : Number(e.target.value);
  });

  function wireRows() {
    v.querySelectorAll("[data-ingidx]").forEach(row => {
      const i = Number(row.dataset.ingidx);
      row.querySelectorAll("[data-ingf]").forEach(inp => inp.addEventListener("input", () => {
        const f = inp.dataset.ingf;
        if (f === "qty") { ingredients[i].qty = inp.value === "" ? null : Number(inp.value); return; }
        if (f === "name") { if (lang === "ru") ingredients[i].name_ru = inp.value; else ingredients[i].name_en = inp.value; return; }
        if (f === "unit") { ingredients[i].unit = unitFromInput(inp.value); return; }
        ingredients[i][f] = inp.value;
      }));
    });
    v.querySelectorAll("[data-ingdel]").forEach(btn => btn.addEventListener("click", () => {
      ingredients.splice(Number(btn.dataset.ingdel), 1); render();
    }));
    v.querySelectorAll("[data-instrinput]").forEach(ta => ta.addEventListener("input", () => {
      const i = Number(ta.dataset.instrinput);
      if (lang === "ru") instructions[i].text_ru = ta.value; else instructions[i].text_en = ta.value;
    }));
    v.querySelectorAll("[data-instrdel]").forEach(btn => btn.addEventListener("click", () => {
      instructions.splice(Number(btn.dataset.instrdel), 1); render();
    }));
  }
  render();

  v.querySelector("#revIngAdd").onclick = () => { ingredients.push({ name_en: "", name_ru: null, qty: null, unit: null, note: null, section: null }); render(); };
  v.querySelector("#revInstrAdd").onclick = () => { instructions.push({ text_en: "", text_ru: null, photo_url: null }); render(); };

  v.querySelector("#revSave").onclick = async () => {
    const saveBtn = v.querySelector("#revSave");
    saveBtn.disabled = true; saveBtn.textContent = T("Saving...", "Сохраняем...");
    const finalDraft = {
      title_en: (titleEn || "").trim(),
      title_ru: (titleRu || "").trim() || null,
      ingredients: ingredients.filter(i => (i.name_en || "").trim() || (i.name_ru || "").trim()),
      instructions: instructions
        .map(s => ({ text_en: (s.text_en || "").trim(), text_ru: (s.text_ru || "").trim() || null, photo_url: s.photo_url || null }))
        .filter(s => s.text_en || s.text_ru),
      photo_url: heroPhotoUrl,
      youtube_url: youtubeUrl,
      servings: servings || null,
    };
    const { data, error } = await invokeWithTimeout("spin-food-import", {
      body: { source_type: sourceType, action: "confirm", payload: { job_id: jobId, draft: finalDraft, target_recipe_id: targetRecipeId } },
    });
    if (error || !data?.ok) {
      toast((error && error.message) || data?.error || T("Save failed.", "Не удалось сохранить."));
      saveBtn.disabled = false; saveBtn.textContent = "💾 " + T("Save", "Сохранить");
      return;
    }
    closeModal();
    await loadCatalog();
    toast(targetRecipeId ? T("Recipe enriched! 🎉", "Рецепт обогащён! 🎉") : T("Saved to the Family Cookbook 📖", "Сохранено в семейную книгу рецептов 📖"));
    render_();
    if (data.recipe?.id) openDetail(data.recipe.id);
  };
}
// Alias avoids shadowing the local render() closure above with the app's
// top-level render() while keeping the call obviously "re-render the app".
function render_() { render(); }

// Family-section ingestion-events list (SPEC_RECIPE_INGESTION.md #33/§3.1) -
// every source's attempts, not just YouTube's. The durable, authoritative
// place to find and review an import even if a completion toast is missed.
async function openImportHistory() {
  const v = modal(`<h3>📥 ${T("Recipe imports", "Импортированные рецепты")}</h3><div id="impHistList" style="font-size:13px;color:#999">${T("Loading...", "Загрузка...")}</div>`);
  const { data, error } = await sb.rpc("spin_food_list_import_jobs", { p_limit: 30 });
  const listEl = v.querySelector("#impHistList");
  if (error) { listEl.textContent = error.message; return; }
  const jobs = data || [];
  if (!jobs.length) { listEl.textContent = T("No imports yet - tap ➕ or Enrich on a Thin Card to start one.", "Импортов пока нет - нажмите ➕ или «Обогатить» на тонкой карточке."); return; }
  const sourceIcon = { url: "🔗", photo: "📷", youtube: "▶️", document: "📄" };
  const statusLabel = {
    queued: T("Queued", "В очереди"), processing: T("Processing...", "Обрабатывается..."),
    ready: T("Ready to review", "Готово к проверке"), failed: T("Failed", "Не удалось"),
  };
  listEl.innerHTML = jobs.map(j => `
    <div class="card" style="padding:10px 12px;margin-bottom:8px" data-jobid="${j.id}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div>${sourceIcon[j.source_type] || "📥"} ${(lang === "ru" ? (j.draft?.title_ru || j.draft?.title_en) : (j.draft?.title_en || j.draft?.title_ru)) || j.draft?.title || j.error || j.source_type}</div>
        <div style="font-size:11px;color:${j.status === "failed" ? "#ef4444" : "#888"}">${statusLabel[j.status] || j.status}</div>
      </div>
      ${(j.status === "ready" && !j.result_recipe_id) ? `<button class="mini-btn" data-jobreview="${j.id}" style="margin-top:6px">👀 ${T("Review", "Проверить")}</button>` : ""}
      ${j.result_recipe_id ? `<button class="mini-btn" data-jobopen="${j.result_recipe_id}" style="margin-top:6px">📖 ${T("Open recipe", "Открыть рецепт")}</button>` : ""}
    </div>`).join("");
  v.querySelectorAll("[data-jobreview]").forEach(btn => btn.addEventListener("click", () => {
    const job = jobs.find(j => j.id === btn.dataset.jobreview);
    if (!job) return;
    closeModal();
    openImportReview(job.draft, job.id, job.target_recipe_id, job.source_type);
  }));
  v.querySelectorAll("[data-jobopen]").forEach(btn => btn.addEventListener("click", () => { closeModal(); openDetail(btn.dataset.jobopen); }));
}

function toast(msg) {
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}
// Same look as toast(), but for messages worth actually reading (e.g. what the
// quick-hide eye icon just did, and where to go to change the default) - stays
// up to 15s, or dismisses immediately on tap, instead of the standard 2.2s blip.
function stickyToast(msg) {
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  t.style.cursor = "pointer";
  document.body.appendChild(t);
  const timer = setTimeout(() => t.remove(), 15000);
  t.addEventListener("click", () => { clearTimeout(timer); t.remove(); });
}

// ── boot ──
// Auth-first: check for an existing session (or a magic-link callback in the
// URL fragment, handled by detectSessionInUrl). Only start realtime + load
// spin_play_state once we have both a session and a membership row.
(async function () {
  const { data: sessData } = await sb.auth.getSession();
  authSession = sessData.session;

  // React to future auth events (magic-link login, sign-out, tab sync).
  sb.auth.onAuthStateChange(async (event, session) => {
    authSession = session;
    // Don't re-render over the language gate — Safari loses dynamic tap handlers.
    if (needsDeviceLangGate()) return;
    if (event === "SIGNED_IN") {
      await refreshMembership();
      if (membership && !rtChan) {
        if (!me) me = membership.member_id;
        joinPresence();
        await kickLoad();
        if (game) {
          subscribe();
          startSyncWatchers();
        }
      }
    } else if (event === "SIGNED_OUT") {
      membership = null; me = null; game = null; loadError = null;
    }
    render();
  });

  if (authSession) await refreshMembership();

  // Housekeeping: if the caller lands with ?invite=<token> in the URL but is
  // already a member (e.g. they clicked their own old invite link), strip the
  // token so a refresh doesn't try to accept it again.
  if (authSession && membership && inviteTokenInUrl) {
    const u = new URL(location.href);
    u.searchParams.delete("invite");
    history.replaceState({}, "", u.toString());
  }

  render(); // sign-in gate / invitation onboarding / lang gate / app

  // If we already have auth + membership on cold boot, start the game plumbing.
  // Skip while the language gate is showing — let the user pick first.
  if (authSession && membership && !needsDeviceLangGate()) {
    if (!me && membership) me = membership.member_id;
    joinPresence();
    if (!game) await kickLoad();
    if (game) {
      subscribe();
      startSyncWatchers();
    }
    render();
  }
})();
</script>
