// Drag (or click) across mg-cell tiles to paint on/off without lifting finger or mouse button.
function wireObGridPaint(root, { cellSelector, getKey, isOn, setOn, refreshCell, onEnd }) {
  let painting = false;
  let modeOn = true;
  const visited = new Set();
  const paint = cell => {
    const key = getKey(cell);
    if (visited.has(key)) return;
    visited.add(key);
    if (isOn(key) === modeOn) return;
    setOn(key, modeOn);
    refreshCell(cell, modeOn);
  };
  const end = () => {
    if (!painting) return;
    painting = false;
    visited.clear();
    onEnd?.();
  };
  root.querySelectorAll(cellSelector).forEach(cell => {
    cell.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      e.preventDefault();
      painting = true;
      modeOn = !isOn(getKey(cell));
      visited.clear();
      paint(cell);
      cell.setPointerCapture(e.pointerId);
    });
    cell.addEventListener("pointermove", e => {
      if (!painting) return;
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const target = hit?.closest?.(cellSelector);
      if (target && root.contains(target)) paint(target);
    });
    cell.addEventListener("pointerup", end);
    cell.addEventListener("pointercancel", end);
    cell.addEventListener("lostpointercapture", end);
  });
}

function deck(queryOverride) {

    if (d.dish_role === "component") return false;

const photoIdx = {};
// Builds the slide list for a card's photo area: approved photos first (or
// the legacy single photo_url for recipes never re-photographed), then the
// pending photo (if any, visible to everyone as a "pending" slide so the
// family knows something is waiting), then one virtual "add a photo" slide
// at the very end.
function photoSlideHtml(d) {
  const approved = (d.photo_urls && d.photo_urls.length) ? d.photo_urls : (d.photo_url ? [d.photo_url] : []);
  const slides = approved.map(url => ({ url, pending: false }));
  if (d.pending_photo && d.pending_photo.url) slides.push({ url: d.pending_photo.url, pending: true });
  const total = slides.length + 1; // +1 for the trailing "add a photo" slide
  let idx = photoIdx[d.id] || 0;
  idx = Math.max(0, Math.min(idx, total - 1));
  photoIdx[d.id] = idx;
  const isAddSlide = idx === slides.length;
  const slide = isAddSlide ? null : slides[idx];

  const bgStyle = slide ? `background-image:url('${slide.url.replace(/'/g, "%27")}')` : `background:${d.g && d.g.startsWith("linear") ? d.g : "linear-gradient(135deg,#e5e7eb,#9ca3af)"}`;
  const prevBtn = idx > 0 ? `<button class="pnav prev" data-pnav="prev" data-dish="${d.id}" aria-label="${T("Previous photo", "Предыдущее фото")}">‹</button>` : "";
  const nextBtn = idx < total - 1 ? `<button class="pnav next" data-pnav="next" data-dish="${d.id}" aria-label="${T("Next photo", "Следующее фото")}">›</button>` : "";
  const dots = total > 1 ? `<div class="pdots">${Array.from({ length: total }).map((_, i) => `<span class="${i === idx ? "on" : ""}"></span>`).join("")}</div>` : "";
  const pendingBadge = slide?.pending
    ? `<div class="photo-pending-badge">⏳ ${T("Pending approval", "Ждёт подтверждения")}</div>` : "";
  const canModerate = slide?.pending && membership?.is_owner;
  const adminActions = canModerate ? `<div class="photo-approve-row">
      <button class="pbtn approve" data-papprove="${d.id}">✓ ${T("Approve", "Одобрить")}</button>
      <button class="pbtn decline" data-pdecline="${d.id}">✗ ${T("Decline", "Отклонить")}</button>
    </div>` : "";
  const addSlideHtml = isAddSlide ? `<label class="add-photo-cta" data-addphoto="${d.id}">
      <span class="ic">📷</span><span>${T("Add a photo", "Добавить фото")}</span>
      <input type="file" accept="image/*" data-photofile="${d.id}" style="display:none">
    </label>` : "";
  return { bgStyle, inner: `${prevBtn}${nextBtn}${dots}${pendingBadge}${adminActions}${addSlideHtml}` };
}
// Reliable cross-platform icons for the quick-hide button (see .scard .qhide) -

function refreshDeck() {
  const stackEl = document.getElementById("stack");

function wireStack() {
  const topCard = document.querySelector(".scard.top");
  const fly = dir => {
    if (!topCard) return;
    const id = topCard.dataset.dish;
    topCard.style.transition = "transform .35s, opacity .35s";
    topCard.style.transform = `translateX(${dir*500}px) rotate(${dir*22}deg)`; topCard.style.opacity = "0";
    setTimeout(() => { deckOrder = [...deckOrder.filter(x=>x!==id), id]; if (dir>0) openAssign(id); refreshDeck(); }, 300);
  };
  // Tappable "tip bubbles" over the card, teaching the swipe gesture by mirroring
  // it exactly: left = same as swiping left (skip), right = same as swiping right
  // (onto the menu) - not a separate action, just a discoverable equivalent.
  const tipNope = document.getElementById("tipNope"), tipLike = document.getElementById("tipLike"), add = document.getElementById("add");
  if (tipNope) tipNope.onclick = () => fly(-1);
  if (tipLike) tipLike.onclick = () => fly(1);
  if (add) add.onclick = () => openImportSheet();
  const qhideBtn = topCard?.querySelector(".qhide");
  if (qhideBtn) {
    // Stop the tap/drag from reaching the swipe listeners below - this is a
    // discrete action (hide/unhide), not a swipe or a "open detail" tap.
    ["pointerdown", "pointerup", "pointermove", "click"].forEach(evt =>
      qhideBtn.addEventListener(evt, e => e.stopPropagation()));
    qhideBtn.addEventListener("click", async () => {
      const id = qhideBtn.dataset.qhide;
      const d = dish(id);
      if (d) await toggleRecipeActive(d);
    });
  }
  const enrichBtn = topCard?.querySelector(".enrich-fab");
  if (enrichBtn) {
    ["pointerdown", "pointerup", "pointermove", "click"].forEach(evt =>
      enrichBtn.addEventListener(evt, e => e.stopPropagation()));
    enrichBtn.addEventListener("click", () => openImportSheet(enrichBtn.dataset.enrich));
  }
  // Photo carousel nav, upload CTA, and admin approve/decline - all discrete
  // taps on the top card's photo area, none of which should trigger the
  // swipe/tap-to-open-detail gesture handlers below.
  const stopBubble = el => ["pointerdown", "pointerup", "pointermove", "click"].forEach(evt =>
    el.addEventListener(evt, e => e.stopPropagation()));
  topCard?.querySelectorAll(".pnav").forEach(btn => {
    stopBubble(btn);
    btn.addEventListener("click", () => {
      const id = btn.dataset.dish;
      photoIdx[id] = (photoIdx[id] || 0) + (btn.dataset.pnav === "next" ? 1 : -1);
      refreshDeck();
    });
  });
  const addPhotoLabel = topCard?.querySelector("[data-addphoto]");
  if (addPhotoLabel) stopBubble(addPhotoLabel);
  const photoFile = topCard?.querySelector("[data-photofile]");
  if (photoFile) {
    photoFile.addEventListener("click", e => e.stopPropagation());
    photoFile.addEventListener("change", async () => {
      const id = photoFile.dataset.photofile;
      const file = photoFile.files && photoFile.files[0];
      photoFile.value = "";
      if (file) await uploadRecipePhoto(id, file);
    });
  }
  const approveBtn = topCard?.querySelector("[data-papprove]");
  if (approveBtn) { stopBubble(approveBtn); approveBtn.addEventListener("click", () => resolvePendingPhoto(approveBtn.dataset.papprove, true)); }
  const declineBtn = topCard?.querySelector("[data-pdecline]");
  if (declineBtn) { stopBubble(declineBtn); declineBtn.addEventListener("click", () => resolvePendingPhoto(declineBtn.dataset.pdecline, false)); }
  if (topCard) {
    let sx=0,dx=0,drag=false;
    topCard.addEventListener("pointerdown", e => { drag=true; sx=e.clientX; topCard.setPointerCapture(e.pointerId); });
    topCard.addEventListener("pointermove", e => { if(!drag)return; dx=e.clientX-sx; topCard.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
      topCard.querySelector(".stamp.yes").style.opacity = dx>40?Math.min(1,dx/120):0; topCard.querySelector(".stamp.no").style.opacity = dx<-40?Math.min(1,-dx/120):0; });
    topCard.addEventListener("pointerup", () => { const tapDx = dx; drag=false; if(dx>90)fly(1); else if(dx<-90)fly(-1);
      else { topCard.style.transition="transform .2s"; topCard.style.transform=""; topCard.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0); } dx=0;
      if (Math.abs(tapDx) < 6) openDetail(topCard.dataset.dish); });
  }
}

// Ingredients/instructions are read-only for now (out of scope for this
// pass - see the migration header for the full deferred list).
let detailOpen = null;      // dish id currently shown full-screen, or null
let detailTab = "cook";     // "about" | "cook" - cook (ingredients/instructions) opens first (2026-08-09), matching what users actually want to see when tapping into a recipe
let detailEditMode = false; // About tab taxonomy edit toggle
let detailDraft = null;     // { dish_role, course_category, meal_types:Set, techniques:Set } while editing
let detailSaving = false;
let detailScaleTo = null;   // target serving count for the scaling stepper, or null = unscaled (view-only, never persisted)

const DISH_ROLES = ["main", "side", "component"];
const COURSE_CATEGORIES = ["appetizer", "cold_starter", "soup", "main_course", "side_dish", "salad", "dessert"];
// Must match food.techniques (20260801120000_food_ontology_v1.sql) exactly - this is a
// vocabulary-validation trigger on the server, not a client-side convenience list.
const TECHNIQUES = [
  "baked_roasted", "broiled_grilled", "griddled", "air_fried", "toasted", "cooked_by_microwave",
  "boiled", "simmered", "steamed", "braised_stewed", "sauteed", "pan_fried", "deep_fried",
  "sous_vide_cooked", "raw",
];
// Must match food.appliances (20260801120000_food_ontology_v1.sql) exactly, minus
// the "raw" row - that one means "no appliance needed" on a recipe, which isn't a
// meaningful answer to "which appliances do you own/use" on a member's profile.
const APPLIANCES = [
  "stovetop_pan", "wok", "oven", "air_fryer", "deep_fryer", "grill_bbq",
  "slow_cooker", "pressure_cooker", "sous_vide", "microwave", "bread_maker",
  "blender_food_processor",
];

function dishRoleLabel(v) {
  return ({ main: T("Main dish", "Основное блюдо"), side: T("Side dish", "Гарнир"), component: T("Component", "Компонент") })[v] || v;
}
function courseLabel(v) {
  return ({
    appetizer: T("Appetizer", "Закуска"), cold_starter: T("Cold starter", "Холодная закуска"),
    soup: T("Soup", "Первое"), main_course: T("Main course", "Основное блюдо"),
    side_dish: T("Side dish", "Гарнир"), salad: T("Salad", "Салат"), dessert: T("Dessert", "Десерт"),
  })[v] || v;
}
function techLabel(v) {
  return ({
    baked_roasted: T("Baked / roasted", "Запечённое"), broiled_grilled: T("Broiled / grilled", "Жареное на гриле"),
    griddled: T("Griddled", "Обжаренное на плите"), air_fried: T("Air fried", "Аэрогриль"),
    toasted: T("Toasted", "Тостированное"), cooked_by_microwave: T("Microwaved", "Готовка в микроволновке"),
    boiled: T("Boiled", "Варёное"), simmered: T("Simmered", "Тушённое на слабом огне"),
    steamed: T("Steamed", "На пару"), braised_stewed: T("Braised / stewed", "Тушёное"),
    sauteed: T("Sauteed", "Обжаренное с помешиванием"), pan_fried: T("Pan-fried", "Жареное на сковороде"),
    deep_fried: T("Deep-fried", "Во фритюре"), sous_vide_cooked: T("Sous vide", "Су-вид"),
    raw: T("Raw / no cook", "Сырое"),
  })[v] || v;
}
function applianceLabel(v) {
  return ({
    stovetop_pan: T("Stovetop pan", "Сковорода на плите"), wok: T("Wok", "Вок"),
    oven: T("Oven", "Духовка"), air_fryer: T("Air fryer", "Аэрогриль"),
    deep_fryer: T("Deep fryer", "Фритюрница"), grill_bbq: T("Grill / BBQ", "Гриль / BBQ"),
    slow_cooker: T("Slow cooker", "Мультиварка"), pressure_cooker: T("Pressure cooker", "Скороварка"),
    sous_vide: T("Sous vide", "Су-вид"), microwave: T("Microwave", "Микроволновка"),
    bread_maker: T("Bread maker", "Хлебопечка"), blender_food_processor: T("Blender / food processor", "Блендер / кухонный комбайн"),
  })[v] || v;
}
// Formats a plain number for display, stripping trailing zeros (matches
// the previous raw-qty formatting convention).
function fmtQty(n) {
  // 1 decimal max (2026-08-09) - scaling/unit conversion can otherwise
  // produce noisy values like 1.13333...; trailing ".0" is still stripped
  // so whole numbers print clean.
  return String(Math.round(n * 10) / 10).replace(/\.0$/, "");
}
function ingredientLine(ing, scaleFactor = 1) {
  if (typeof ing === "string") return ing;
  if (!ing || typeof ing !== "object") return "";
  const name = (lang === "ru" && ing.name_ru) ? ing.name_ru : (ing.name_en || ing.raw || "");
  const note = ing.note ? ` (${ing.note})` : "";
  // Scaling (2026-08-09): scaleFactor = target servings / recipe.servings,
  // computed by the caller only when a real (non-null) servings baseline is
  // known - a purely display-time multiply, same non-destructive pattern as
  // unit conversion below. Never written back to the stored qty.
  const scaledQty = Number.isFinite(Number(ing.qty)) ? Number(ing.qty) * scaleFactor : ing.qty;
  // Recipe Unit Conversion (SPEC_RECIPE_I18N.md decision #9/#11/#13):
  // show the viewer's preferred system when a conversion is available;
  // otherwise fall back to the recipe's original qty/unit unconverted.
  const converted = convertQty(scaledQty, ing.unit);
  const qty = converted ? fmtQty(converted.qty) : (scaledQty ? fmtQty(scaledQty) : "");
  const unit = converted ? unitLabel(converted.unit) : unitDisplay(ing.unit);
  const line = [qty, unit, name].filter(Boolean).join(" ");
  return (line || ing.raw || "") + note;
}
// Language-matched instruction step text (SPEC_RECIPE_I18N.md) - reads
// text_en/text_ru, falling back to the legacy single `text` key for any
// recipe that predates the translation migration and hasn't been
// re-translated yet.
function stepLangText(s, l) {
  if (typeof s === "string") return s;
  if (!s) return "";
  const key = l === "ru" ? "text_ru" : "text_en";
  return s[key] || s.text || "";
}
function instructionsText(d) {
  if (!d.instructions.length) return "";
  return d.instructions.map(s => stepLangText(s, lang)).filter(Boolean).join("\n\n");
}
// Normalizes any instructions shape (old single-blob [{text}], legacy
// step-array [{step,text,photo_url}], or the current bilingual
// [{step,text_en,text_ru,photo_url}]) into ordered step objects for
// display/editing. `text` is the current-UI-language display copy;
// text_en/text_ru are both preserved so an edit to one language doesn't
// clobber the other's translation (see saveDetailEdit). Renumbering
// happens at save time, not here.
function instructionSteps(d) {
  if (!Array.isArray(d.instructions) || !d.instructions.length) return [];
  return d.instructions.map(s => typeof s === "string"
    ? { text: s, text_en: s, text_ru: null, photo_url: null }
    : {
        text: stepLangText(s, lang),
        text_en: (s && s.text_en) ?? null,
        text_ru: (s && s.text_ru) ?? null,
        photo_url: (s && s.photo_url) || null,
      }
  ).filter(s => s.text);
}

function openDetail(id) {
  if (!dish(id)) return;
  detailOpen = id; detailTab = "cook"; detailEditMode = false; detailDraft = null; detailSaving = false; detailScaleTo = null;
  renderDetailOverlay();
}
function closeDetail() {
  const el = document.getElementById("detailOverlay");
  detailEditMode = false; detailDraft = null;
  if (!el) { detailOpen = null; return; }
  el.classList.remove("open"); el.classList.add("closing");
  setTimeout(() => { el.remove(); detailOpen = null; }, 260);
}
function renderDetailOverlay() {
  document.getElementById("detailOverlay")?.remove();
  const d = dish(detailOpen);
  if (!d) { detailOpen = null; return; }
  const wrap = document.createElement("div");
  wrap.id = "detailOverlay";
  wrap.className = "detail-overlay";
  wrap.innerHTML = detailView(d);
  document.body.appendChild(wrap);
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add("open")));
  wireDetailOverlay(wrap, d);
}

// Shared top block for both detail tabs (2026-08-09) - hero photo carousel
// through the pending-edit/thin-card/fork banners, identical on "cook" and
// "about" so switching tabs doesn't lose the photo/title/video context.
// Only the chip rows below it (meal type onward) stay About-tab-only.
// The old "Include in weekly menu planning" switch+description block is gone -
// replaced by the same 👁/🙈 quick-hide button, same toggleRecipeActive()
// logic and same Hide/Show tooltips, as the Spin card (see stackHtml()) -
// just anchored to this hero's top-left corner instead of the card's.
function detailHeaderHtml(d) {
  const isOwner = !!(d.added_by_member_id && d.added_by_member_id === me);
  const canApprove = !!(d.pending_edit && isOwner);
  const photo = photoSlideHtml(d);
  const enrichBtn = `<button class="enrich-fab" id="dtlEnrichBtn" title="${T("Enrich this recipe", "Обогатить рецепт")}" aria-label="${T("Enrich this recipe", "Обогатить рецепт")}">✨</button>`;
  const eyeBtn = d.is_active
    ? `<button class="qhide" id="dtlActiveEye" ${detailSaving ? "disabled" : ""} title="${T("Hide", "Скрыть")}" aria-label="${T("Hide", "Скрыть")}">${EYE_OPEN_SVG}</button>`
    : `<button class="qhide off" id="dtlActiveEye" ${detailSaving ? "disabled" : ""} title="${T("Show", "Показать")}" aria-label="${T("Show", "Показать")}">${EYE_CLOSED_SVG}</button>`;
  return `<div class="dtl-hero" style="${photo.bgStyle}">${photo.inner}${enrichBtn}${eyeBtn}</div>
    <div style="padding:14px 16px">
      ${detailEditMode
        ? `<input id="dtlTitleInput" value="${((lang === "ru" ? (detailDraft.titleRu || detailDraft.titleEn) : (detailDraft.titleEn || detailDraft.titleRu)) || "").replace(/"/g, "&quot;")}" placeholder="${T("Recipe name", "Название рецепта")}" style="width:100%;font-weight:800;font-size:18px;border:2px solid #e5e7eb;border-radius:10px;padding:8px 10px;font-family:inherit">`
        : `<div style="font-weight:800;font-size:24px">${dName(d)}</div>`}
      <div class="mt" style="margin-top:8px">
        ${detailEditMode
          ? `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px">⏱ <input id="dtlTimeInput" type="number" min="1" value="${detailDraft.cookTimeMinutes ?? ""}" style="width:56px;border:1px solid #eee;border-radius:8px;padding:4px 6px;font-size:13px"> ${T("min", "мин")}</span>
            <span id="dtlDiffPicker" style="display:inline-flex;gap:3px;cursor:pointer;margin-right:10px;vertical-align:middle">${[1, 2, 3].map(n => `<span data-diffval="${n}" style="opacity:${n <= detailDraft.difficulty ? "1" : "0.25"};font-size:15px">●</span>`).join("")}</span>
            <input id="dtlCuisineInput" value="${(detailDraft.cuisine || "").replace(/"/g, "&quot;")}" placeholder="${T("cuisine", "кухня")}" style="width:110px;border:1px solid #eee;border-radius:8px;padding:4px 6px;font-size:13px">`
          : `⏱ ${d.t} ${T("min", "мин")} &nbsp; ${d.d} &nbsp; ${d.c}${d.added_by_member_id ? ` &nbsp; · ${T("by", "от")} ${mem(d.added_by_member_id).em} ${mName(mem(d.added_by_member_id))}` : ""}`}
      </div>
      ${d.youtube_url ? `<div style="margin-top:6px"><a href="${d.youtube_url}" target="_blank" rel="noopener" style="font-size:13px;color:var(--amber);text-decoration:none;font-weight:700">▶️ ${T("Watch video", "Смотреть видео")}</a></div>` : ""}
    </div>
    <div style="padding:0 16px">
      ${d.card_state === "thin" ? `<div class="dtl-banner edit">📝 ${T("Thin Card - tap ✨ to add ingredients.", "Тонкая карточка - нажмите ✨, чтобы добавить ингредиенты.")}</div>` : ""}
      ${d.pending_edit && !canApprove ? `<div class="dtl-banner edit">✏️ ${T("An edit is pending the owning cook's approval.", "Изменение ожидает подтверждения от повара-владельца.")}</div>` : ""}
      ${canApprove ? `<div class="dtl-banner edit">✏️ ${T("Someone proposed an edit to this recipe.", "Кто-то предложил изменение этого рецепта.")}
        <div class="mini-row" style="margin-top:8px"><button class="mini-btn accept" id="dtlApprove">✅ ${T("Approve", "Принять")}</button>
        <button class="mini-btn reject" id="dtlDecline">🍴 ${T("Decline (fork instead)", "Отклонить (создать копию)")}</button></div></div>` : ""}
      ${d.forked_from_id ? `<div class="dtl-banner fork">🍴 ${T("This recipe is a fork of another one.", "Этот рецепт - копия другого рецепта.")}</div>` : ""}
    </div>`;
}
function detailView(d) {
  const tabs = [["cook", T("Ingredients & Instructions", "Ингредиенты и приготовление")], ["about", T("About", "О рецепте")]];
  const roleVal = detailEditMode ? detailDraft.dish_role : d.dish_role;
  const courseVal = detailEditMode ? detailDraft.course_category : d.course_category;
  const mealsVal = detailEditMode ? detailDraft.meal_types : new Set(d.meals);
  const techVal = detailEditMode ? detailDraft.techniques : new Set(d.techniques);

  const chipRow = (label, opts, isOn, key) => `<div class="sect">${label}</div><div class="chips-wrap">${
    detailEditMode
      ? opts.map(([v, l]) => `<div class="chip ${isOn(v) ? "on" : ""}" data-editchip="${key}" data-val="${v}">${l}</div>`).join("")
      : (opts.filter(([v]) => isOn(v)).map(([, l]) => `<div class="chip on">${l}</div>`).join("") || `<span style="font-size:12px;color:#bbb">${T("not set", "не задано")}</span>`)
  }</div>`;

  let pane;
  if (detailTab === "about") {
    pane = `${detailHeaderHtml(d)}
      <div style="padding:0 16px 16px">
        ${chipRow(T("Meal type", "Тип приёма"), MEALS.map(m => [m.k, m.ic + " " + mealN(m)]), v => mealsVal.has(v), "meal_types")}
        ${chipRow(T("Dish role", "Роль блюда"), DISH_ROLES.map(r => [r, dishRoleLabel(r)]), v => roleVal === v, "dish_role")}
        ${chipRow(T("Course category", "Категория подачи"), COURSE_CATEGORIES.map(c => [c, courseLabel(c)]), v => courseVal === v, "course_category")}
        ${chipRow(T("Techniques", "Техники"), TECHNIQUES.map(t => [t, techLabel(t)]), v => techVal.has(v), "techniques")}
        ${d.diet_compatible_with.length ? `<div class="sect">${T("Diet compatible", "Подходит для диеты")}</div><div class="chips-wrap">${d.diet_compatible_with.map(v => `<div class="chip on">${DIET_META[v] ? T(DIET_META[v].en, DIET_META[v].ru) : v}</div>`).join("")}</div>` : ""}
        ${d.allergens.length ? `<div class="sect">${T("Allergens", "Аллергены")}</div><div class="chips-wrap">${d.allergens.map(a => `<div class="chip on" style="border-color:#ef4444;background:#fee2e2">⚠️ ${a}</div>`).join("")}</div>` : ""}
      </div>`;
  } else {
    // Ingredients: read-only list, or a full add/remove/edit editor when
    // editing - mirrors openImportReview's ingredient editor (same
    // data-ingf/data-ingidx/data-ingdel wiring), reusing the shared
    // unitDisplay()/unitFromInput() helpers so units localize identically
    // to a freshly-imported draft.
    // Scaling (2026-08-09, revised same day): food.family_cookbook_recipes.servings
    // is nullable so a *stored* value only ever means "confirmed from the
    // source" (20260809050000 migration - never write a guess there). The
    // scaling stepper is a different, purely client-side, never-persisted
    // concern: it needs *some* baseline to scale from even when the
    // recipe's true servings was never confirmed, so it falls back to an
    // assumed 4 (baseServings) - shared by the ingredient math below and
    // servingsHtml's stepper - and that assumption never touches the DB or
    // survives closing the detail view / entering edit mode.
    const baseServings = d.servings || 4;
    let ingHtml;
    if (detailEditMode) {
      const ings = detailDraft.ingredients;
      ingHtml = `<div id="ingList">${ings.map((ing, i) => {
        const name = (lang === "ru" ? (ing.name_ru || ing.name_en) : (ing.name_en || ing.name_ru)) || "";
        return `
        <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px" data-ingidx="${i}">
          <input data-ingf="qty" value="${ing.qty ?? ""}" placeholder="${T("qty", "кол-во")}" style="width:52px;border:1px solid #eee;border-radius:8px;padding:6px;font-size:13px">
          <input data-ingf="unit" value="${unitDisplay(ing.unit).replace(/"/g, "&quot;")}" placeholder="${T("unit", "ед.")}" style="width:56px;border:1px solid #eee;border-radius:8px;padding:6px;font-size:13px">
          <input data-ingf="name" value="${name.replace(/"/g, "&quot;")}" placeholder="${T("ingredient", "ингредиент")}" style="flex:1;border:1px solid #eee;border-radius:8px;padding:6px;font-size:13px">
          <button class="dtl-back" data-ingdel="${i}" style="width:28px;height:28px;font-size:12px;color:#ef4444">✕</button>
        </div>`;
      }).join("") || `<div style="font-size:12px;color:#aaa">${T("No ingredients yet - add them below.", "Ингредиентов пока нет - добавьте ниже.")}</div>`}</div>
        <button class="mini-btn" id="dtlIngAdd" style="margin-top:2px">+ ${T("Add ingredient", "Добавить ингредиент")}</button>`;
    } else {
      const scaleFactor = detailScaleTo ? detailScaleTo / baseServings : 1;
      ingHtml = d.ingredients.length
        ? `<ul style="padding-left:18px;font-size:14px;line-height:2">${d.ingredients.map(i => `<li>${ingredientLine(i, scaleFactor)}</li>`).join("")}</ul>`
        : (d.ingredients_raw ? `<div style="font-size:14px;line-height:1.8;white-space:pre-wrap">${d.ingredients_raw}</div>` : `<div style="font-size:13px;color:#aaa">${T("No ingredients recorded for this recipe yet.", "Ингредиенты для этого рецепта пока не записаны.")}</div>`);
    }

    // Serving size (food.family_cookbook_recipes.servings, nullable - a
    // stored number means "confirmed from the source", 2026-08-09). In
    // edit mode it's a plain input (sets the recipe's real base count and
    // is what actually gets saved/persisted). In read mode it's always a
    // scaling stepper - even when servings was never confirmed, using
    // baseServings' assumed-4 fallback (see above) so scaling is never
    // blocked on that; +/- changes detailScaleTo (view-only target, resets
    // whenever the detail view is reopened or edit mode is entered) and
    // recomputes every ingredient's displayed qty via scaleFactor - the
    // stored ingredients/servings are never touched by this. When servings
    // is unconfirmed, a muted "(?)" plus a nudge to set the real value via
    // ✏️ makes clear the base is only a guess, not a database fact.
    const shownServings = detailScaleTo || baseServings;
    const servingsHtml = detailEditMode
      ? `<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#888;font-weight:400">👥 <input id="dtlServingsInput" type="number" min="1" value="${detailDraft.servings ?? ""}" style="width:44px;border:1px solid #eee;border-radius:8px;padding:3px 5px;font-size:12px"> ${T("servings", "порций")}</span>`
      : `<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#888;font-weight:400">👥 ${T("Serves", "Порций")}
          <button class="dtl-back" id="dtlScaleDown" ${shownServings <= 1 ? "disabled" : ""} style="width:22px;height:22px;font-size:12px;padding:0">−</button>
          <b style="color:#333;min-width:14px;text-align:center">${shownServings}${d.servings ? "" : "<sup>?</sup>"}</b>
          <button class="dtl-back" id="dtlScaleUp" style="width:22px;height:22px;font-size:12px;padding:0">+</button>
          ${detailScaleTo && detailScaleTo !== baseServings ? `<button class="dtl-back" id="dtlScaleReset" style="font-size:10px;padding:2px 6px;height:auto">${T("Reset", "Сброс")}</button>` : ""}
          ${!d.servings ? `<span style="font-size:11px;color:#c99">${T("(guess - tap ✏️ to confirm)", "(предположительно - нажмите ✏️, чтобы указать)")}</span>` : ""}
        </span>`;

    let instrHtml;
    if (detailEditMode) {
      const steps = detailDraft.instructions;
      // Photo lives below the step text (not beside it), same tap-to-expand
      // as the hero photo (openPhotoLightbox), and - when there isn't one
      // yet - a dashed-outline "+" tile rather than a small camera icon,
      // per 2026-08-09 layout request. The file input has no `capture`
      // attribute (unlike the old version) so mobile browsers show their
      // native "Take Photo / Choose from Library" chooser, same as every
      // other photo-upload input in this app (hero photo, import review).
      instrHtml = `<div id="stepList">${steps.map((s, i) => `
        <div class="step-row" style="margin-bottom:14px" data-stepidx="${i}">
          <div style="display:flex;gap:8px;align-items:flex-start">
            <div style="flex:0 0 26px;font-weight:800;color:#bbb;padding-top:10px;text-align:right">${i + 1}.</div>
            <textarea data-stepinput="${i}" rows="2" style="flex:1;font-size:14px;line-height:1.6;padding:8px 10px;border:1px solid #eee;border-radius:10px;font-family:inherit;resize:vertical">${s.text}</textarea>
            <div style="display:flex;flex-direction:column;gap:2px">
              <button class="dtl-back" data-stepup="${i}" ${i === 0 ? "disabled" : ""} style="width:30px;height:26px;font-size:12px">↑</button>
              <button class="dtl-back" data-stepdown="${i}" ${i === steps.length - 1 ? "disabled" : ""} style="width:30px;height:26px;font-size:12px">↓</button>
              <button class="dtl-back" data-stepdel="${i}" style="width:30px;height:26px;font-size:12px;color:#ef4444">✕</button>
            </div>
          </div>
          <div style="margin-left:34px;margin-top:8px">
            ${s.photo_url
              ? `<div style="position:relative;display:inline-block"><img data-stepphotoview="${s.photo_url.replace(/"/g, "&quot;")}" src="${s.photo_url}" style="width:96px;height:96px;border-radius:10px;object-fit:cover;display:block;cursor:zoom-in">
                  <button class="dtl-back" data-stepphotodel="${i}" title="${T("Remove photo", "Удалить фото")}" style="position:absolute;top:-8px;right:-8px;width:20px;height:20px;font-size:10px;line-height:1;color:#ef4444;background:#fff;border-radius:50%;padding:0">✕</button></div>`
              : `<label title="${T("Add a photo", "Добавить фото")}" style="width:96px;height:96px;border:2px dashed #ddd;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#bbb;cursor:pointer">+<input type="file" accept="image/*" data-stepphotoadd="${i}" style="display:none"></label>`}
          </div>
        </div>`).join("")}</div>
        <button class="mini-btn" id="dtlStepAdd" style="margin-top:4px">+ ${T("Add step", "Добавить шаг")}</button>`;
    } else {
      const steps = instructionSteps(d);
      instrHtml = steps.length
        ? `<ol style="padding-left:18px;font-size:14px;line-height:1.9">${steps.map(s => `<li style="margin-bottom:14px"><div>${s.text}</div>${s.photo_url ? `<img data-stepphotoview="${s.photo_url.replace(/"/g, "&quot;")}" src="${s.photo_url}" style="margin-top:8px;width:120px;height:120px;border-radius:10px;object-fit:cover;display:block;cursor:zoom-in">` : ""}</li>`).join("")}</ol>`
        : `<div style="font-size:13px;color:#aaa">${T("No instructions recorded for this recipe yet.", "Инструкции для этого рецепта пока не записаны.")}</div>`;
    }

    pane = `${detailHeaderHtml(d)}
      <div style="padding:6px 16px 20px">
      <div style="margin-bottom:6px">${servingsHtml}</div>
      <div class="sect">${T("Ingredients", "Ингредиенты")}</div>
      ${ingHtml}
      <div class="sect" style="margin-top:18px">${T("Instructions", "Приготовление")}</div>
      ${instrHtml}
    </div>`;
  }
  return `
  <div class="dtl-hd"><button class="dtl-back" id="dtlBack">←</button>
    <div style="flex:1;font-weight:800;font-size:15px">${dName(d)}</div>
    <button class="dtl-back" id="dtlEditToggle" style="border-color:${detailEditMode ? "var(--amber)" : "#eee"}">${detailEditMode ? "✕" : "✏️"}</button></div>
  <div class="dtl-tabs">${tabs.map(([k, l]) => `<div class="dtl-tab ${detailTab === k ? "on" : ""}" data-dtltab="${k}">${l}</div>`).join("")}</div>
  ${pane}
  ${detailEditMode ? `<div class="dtl-editbar"><button class="btn btn-ghost" id="dtlCancel">${T("Cancel", "Отмена")}</button><button class="btn btn-primary" id="dtlSave" ${detailSaving ? "disabled" : ""}>${detailSaving ? T("Saving...", "Сохранение...") : T("Save changes", "Сохранить")}</button></div>` : ""}`;
}

function wireDetailOverlay(wrap, d) {
  wrap.querySelector("#dtlBack")?.addEventListener("click", closeDetail);
  wrap.querySelectorAll("[data-dtltab]").forEach(t => t.addEventListener("click", () => { detailTab = t.dataset.dtltab; renderDetailOverlay(); }));
  // Photo carousel on the hero - identical wiring to the Spin card's, just
  // re-rendering this overlay (not refreshDeck()) since photoIdx[d.id] is the
  // one piece of shared state between the two views.
  wrap.querySelectorAll(".dtl-hero .pnav").forEach(btn => btn.addEventListener("click", () => {
    photoIdx[d.id] = (photoIdx[d.id] || 0) + (btn.dataset.pnav === "next" ? 1 : -1);
    renderDetailOverlay();
  }));
  const dtlPhotoFile = wrap.querySelector(".dtl-hero [data-photofile]");
  if (dtlPhotoFile) dtlPhotoFile.addEventListener("change", async () => {
    // uploadRecipePhoto()/resolvePendingPhoto() already re-render this overlay
    // themselves (`if (detailOpen) renderDetailOverlay()`) once the write
    // lands, so nothing further to do here after awaiting them.
    const file = dtlPhotoFile.files && dtlPhotoFile.files[0];
    dtlPhotoFile.value = "";
    if (file) await uploadRecipePhoto(d.id, file);
  });
  wrap.querySelector(".dtl-hero [data-papprove]")?.addEventListener("click", () => resolvePendingPhoto(d.id, true));
  wrap.querySelector(".dtl-hero [data-pdecline]")?.addEventListener("click", () => resolvePendingPhoto(d.id, false));
  // Tapping the photo itself (not any of the controls above it) opens it
  // full-screen, uncropped - the hero strip only ever shows it letterboxed.
  wrap.querySelector(".dtl-hero")?.addEventListener("click", e => {
    if (e.target.closest(".pnav, .add-photo-cta, .photo-approve-row, .photo-pending-badge, .enrich-fab, .qhide")) return;
    const photos = (d.photo_urls && d.photo_urls.length) ? d.photo_urls : (d.photo_url ? [d.photo_url] : []);
    const url = photos[photoIdx[d.id] || 0];
    if (url) openPhotoLightbox(url);
  });
  wrap.querySelector("#dtlEnrichBtn")?.addEventListener("click", () => { closeDetail(); openImportSheet(d.id); });
  wrap.querySelector("#dtlEditToggle")?.addEventListener("click", () => {
    detailScaleTo = null; // editing always shows/edits the recipe's real base quantities
    if (detailEditMode) { detailEditMode = false; detailDraft = null; }
    else {
      detailEditMode = true;
      detailDraft = {
        dish_role: d.dish_role, course_category: d.course_category,
        meal_types: new Set(d.meals), techniques: new Set(d.techniques),
        instructions: instructionSteps(d).map(s => ({ ...s })),
        ingredients: d.ingredients.map(i => ({ ...i })),
        titleEn: d.en, titleRu: d.ru,
        cuisine: d.c === "family" ? "" : d.c,
        difficulty: d.difficulty,
        cookTimeMinutes: d.t,
        servings: d.servings ?? null,
      };
    }
    renderDetailOverlay();
  });
  wrap.querySelector("#dtlCancel")?.addEventListener("click", () => { detailEditMode = false; detailDraft = null; renderDetailOverlay(); });
  wrap.querySelectorAll("[data-editchip]").forEach(c => c.addEventListener("click", () => {
    if (!detailDraft) return;
    const key = c.dataset.editchip, v = c.dataset.val;
    if (key === "dish_role") {
      detailDraft.dish_role = detailDraft.dish_role === v ? null : v;
      // dish_role='component' <=> meal_types=['component'] is a DB invariant -
      // the two fields must always change together.
      if (detailDraft.dish_role === "component") detailDraft.meal_types = new Set(["component"]);
      else if (detailDraft.meal_types.has("component")) detailDraft.meal_types = new Set(["dinner"]);
    } else if (key === "course_category") {
      detailDraft.course_category = detailDraft.course_category === v ? null : v;
    } else if (key === "meal_types") {
      if (detailDraft.dish_role === "component") return; // locked while dish_role is component
      if (detailDraft.meal_types.has(v)) detailDraft.meal_types.delete(v); else detailDraft.meal_types.add(v);
    } else if (key === "techniques") {
      if (detailDraft.techniques.has(v)) detailDraft.techniques.delete(v); else detailDraft.techniques.add(v);
    }
    renderDetailOverlay();
  }));
  wrap.querySelector("#dtlTitleInput")?.addEventListener("input", (e) => {
    if (!detailDraft) return;
    if (lang === "ru") detailDraft.titleRu = e.target.value; else detailDraft.titleEn = e.target.value;
  });
  wrap.querySelector("#dtlTimeInput")?.addEventListener("input", (e) => {
    if (!detailDraft) return;
    detailDraft.cookTimeMinutes = e.target.value === "" ? null : Number(e.target.value);
  });
  wrap.querySelector("#dtlCuisineInput")?.addEventListener("input", (e) => {
    if (!detailDraft) return;
    detailDraft.cuisine = e.target.value;
  });
  wrap.querySelector("#dtlServingsInput")?.addEventListener("input", (e) => {
    if (!detailDraft) return;
    detailDraft.servings = e.target.value === "" ? null : Number(e.target.value);
  });
  wrap.querySelectorAll("#dtlDiffPicker [data-diffval]").forEach(s => s.addEventListener("click", () => {
    if (!detailDraft) return;
    detailDraft.difficulty = Number(s.dataset.diffval);
    renderDetailOverlay();
  }));
  wrap.querySelector("#dtlScaleUp")?.addEventListener("click", () => {
    detailScaleTo = (detailScaleTo || d.servings || 4) + 1;
    renderDetailOverlay();
  });
  wrap.querySelector("#dtlScaleDown")?.addEventListener("click", () => {
    const next = (detailScaleTo || d.servings || 4) - 1;
    if (next < 1) return;
    detailScaleTo = next;
    renderDetailOverlay();
  });
  wrap.querySelector("#dtlScaleReset")?.addEventListener("click", () => {
    detailScaleTo = null;
    renderDetailOverlay();
  });
  wrap.querySelector("#dtlSave")?.addEventListener("click", () => saveDetailEdit(d));
  wrap.querySelector("#dtlApprove")?.addEventListener("click", () => resolvePendingEdit(d, true));
  wrap.querySelector("#dtlDecline")?.addEventListener("click", () => resolvePendingEdit(d, false));
  wrap.querySelector("#dtlActiveEye")?.addEventListener("click", () => toggleRecipeActive(d));

  // Step text edits update the draft in place without a full re-render, so
  // the textarea keeps focus/cursor position while typing. Only the
  // CURRENT UI language's side is edited here - text_en/text_ru for the
  // other language (already translated) is left untouched, so editing a
  // step in English doesn't wipe out its existing Russian translation
  // (SPEC_RECIPE_I18N.md - the pre-existing bug this replaces would have
  // silently dropped the other language on every edit).
  wrap.querySelectorAll("[data-stepinput]").forEach(ta => ta.addEventListener("input", (e) => {
    const idx = Number(ta.dataset.stepinput);
    const step = detailDraft?.instructions?.[idx];
    if (!step) return;
    step.text = e.target.value;
    step[lang === "ru" ? "text_ru" : "text_en"] = e.target.value;
  }));
  wrap.querySelector("#dtlStepAdd")?.addEventListener("click", () => {
    if (!detailDraft) return;
    // A brand-new step is authored in the current UI language only - the
    // other side stays null until the translate pipeline (or a manual
    // edit after switching language) fills it in.
    detailDraft.instructions.push({
      text: "",
      text_en: lang === "ru" ? null : "",
      text_ru: lang === "ru" ? "" : null,
      photo_url: null,
    });
    renderDetailOverlay();
  });
  wrap.querySelectorAll("[data-stepup]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.stepup);
    if (!detailDraft || i < 1) return;
    const arr = detailDraft.instructions;
    [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
    renderDetailOverlay();
  }));
  wrap.querySelectorAll("[data-stepdown]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.stepdown);
    const arr = detailDraft?.instructions;
    if (!arr || i >= arr.length - 1) return;
    [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
    renderDetailOverlay();
  }));
  wrap.querySelectorAll("[data-stepdel]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.stepdel);
    if (!detailDraft) return;
    detailDraft.instructions.splice(i, 1);
    renderDetailOverlay();
  }));
  // Per-step photo: uploads immediately (so the review can show the result
  // right away) but only stashes the resulting URL into the draft - it isn't
  // persisted until "Save changes", exactly like step text edits above. No
  // new event type needed: it rides along in the same `instructions` array
  // recipe_edit_proposed already fully replaces.
  wrap.querySelectorAll("[data-stepphotoadd]").forEach(inp => inp.addEventListener("change", async () => {
    const idx = Number(inp.dataset.stepphotoadd);
    const file = inp.files && inp.files[0];
    inp.value = "";
    if (!file || !detailDraft?.instructions?.[idx]) return;
    const url = await uploadStepPhoto(d.id, file);
    if (!url) return;
    detailDraft.instructions[idx].photo_url = url;
    renderDetailOverlay();
  }));
  wrap.querySelectorAll("[data-stepphotodel]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.stepphotodel);
    const step = detailDraft?.instructions?.[i];
    if (!step) return;
    step.photo_url = null;
    renderDetailOverlay();
  }));
  // Step photos (both the read-only Instructions list and the edit-mode
  // editor) open full-screen the same way the hero photo does.
  wrap.querySelectorAll("[data-stepphotoview]").forEach(img => img.addEventListener("click", () => openPhotoLightbox(img.dataset.stepphotoview)));

  // Ingredients: same add/remove/edit-qty/unit/name pattern as
  // openImportReview's editor. qty/unit/name edits update the draft in
  // place (no full re-render, keeps input focus); add/remove re-render
  // since the row count changes.
  wrap.querySelectorAll("[data-ingidx]").forEach(row => {
    const i = Number(row.dataset.ingidx);
    row.querySelectorAll("[data-ingf]").forEach(inp => inp.addEventListener("input", () => {
      const ing = detailDraft?.ingredients?.[i];
      if (!ing) return;
      const f = inp.dataset.ingf;
      if (f === "qty") { ing.qty = inp.value === "" ? null : Number(inp.value); return; }
      if (f === "name") { if (lang === "ru") ing.name_ru = inp.value; else ing.name_en = inp.value; return; }
      if (f === "unit") { ing.unit = unitFromInput(inp.value); return; }
    }));
  });
  wrap.querySelectorAll("[data-ingdel]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.ingdel);
    if (!detailDraft) return;
    detailDraft.ingredients.splice(i, 1);
    renderDetailOverlay();
  }));
  wrap.querySelector("#dtlIngAdd")?.addEventListener("click", () => {
    if (!detailDraft) return;
    detailDraft.ingredients.push({ name_en: lang === "ru" ? null : "", name_ru: lang === "ru" ? "" : null, qty: null, unit: null, note: null, section: null });
    renderDetailOverlay();
  });
}

async function saveDetailEdit(d) {
  if (!detailDraft || detailSaving) return;
  const draftMeals = [...detailDraft.meal_types];
  if (!draftMeals.length) { toast(T("Pick at least one meal type.", "Выберите хотя бы один тип приёма пищи.")); return; }

  const proposed = {};
  if (detailDraft.dish_role !== d.dish_role) proposed.dish_role = detailDraft.dish_role;
  if (detailDraft.course_category !== d.course_category) proposed.course_category = detailDraft.course_category;
  if (draftMeals.slice().sort().join(",") !== d.meals.slice().sort().join(",")) proposed.meal_types = draftMeals;
  const draftTech = [...detailDraft.techniques].sort();
  if (draftTech.join(",") !== d.techniques.slice().sort().join(",")) proposed.techniques = draftTech;
  // dish_role changes must always carry meal_types alongside (server-enforced pairing).
  if ("dish_role" in proposed && !("meal_types" in proposed)) proposed.meal_types = draftMeals;

  // Name/difficulty/time/cuisine - only the current UI language's title side
  // is touched (same convention as instruction steps, SPEC_RECIPE_I18N.md),
  // the other side's existing translation is left untouched.
  const draftTitle = (lang === "ru" ? detailDraft.titleRu : detailDraft.titleEn) || "";
  const currentTitle = (lang === "ru" ? d.ru : d.en) || "";
  if (draftTitle.trim() && draftTitle.trim() !== currentTitle.trim()) {
    if (lang === "ru") proposed.title_ru = draftTitle.trim(); else proposed.title_en = draftTitle.trim();
  }
  if (detailDraft.difficulty !== d.difficulty) proposed.difficulty = detailDraft.difficulty;
  if (detailDraft.cookTimeMinutes && detailDraft.cookTimeMinutes !== d.t) proposed.cook_time_minutes = detailDraft.cookTimeMinutes;
  const draftCuisine = (detailDraft.cuisine || "").trim().toLowerCase();
  const currentCuisine = d.c === "family" ? "" : d.c;
  if (draftCuisine && draftCuisine !== currentCuisine) proposed.cuisine = draftCuisine;
  if (detailDraft.servings && detailDraft.servings !== d.servings) proposed.servings = detailDraft.servings;

  // Bilingual step diffing (SPEC_RECIPE_I18N.md): both text_en and text_ru
  // travel together so an edit in one language never overwrites the
  // other's already-translated text. Built from d.instructions directly
  // (not the language-collapsed instructionSteps() view) so the diff -
  // and what actually gets sent - reflects both languages accurately.
  const draftSteps = detailDraft.instructions
    .filter(s => (s.text || "").trim())
    .map((s, i) => ({ step: i + 1, text_en: s.text_en ?? null, text_ru: s.text_ru ?? null, photo_url: s.photo_url || null }));
  const currentSteps = (Array.isArray(d.instructions) ? d.instructions : []).map((s, i) => ({
    step: i + 1,
    text_en: (typeof s === "string" ? null : s?.text_en) ?? null,
    text_ru: (typeof s === "string" ? null : s?.text_ru) ?? null,
    photo_url: (typeof s === "string" ? null : s?.photo_url) || null,
  }));
  if (JSON.stringify(draftSteps) !== JSON.stringify(currentSteps)) proposed.instructions = draftSteps;

  // Ingredient diffing: full-array replace, same shape spin-food-import
  // writes at import time (raw/name_en/name_ru/qty/unit/note/section/
  // ingredient_slug). ingredient_slug is recomputed client-side (same
  // slugify as the server) so it stays consistent with a hand-edited name -
  // note this does NOT retrigger AI classification (protein_groups/
  // diet_compatible_with/allergens/card_state can go stale until a future
  // re-classify pass, same accepted limitation instructions-editing has
  // for techniques).
  const draftIngredients = detailDraft.ingredients
    .filter(i => (i.name_en || "").trim() || (i.name_ru || "").trim())
    .map(i => ({
      raw: i.raw || "",
      name_en: i.name_en || null,
      name_ru: i.name_ru || null,
      qty: i.qty ?? null,
      unit: i.unit || null,
      note: i.note || null,
      section: i.section || null,
      ingredient_slug: slugifyIngredientName(i.name_en || i.name_ru || ""),
    }));
  const currentIngredients = (Array.isArray(d.ingredients) ? d.ingredients : []).map(i => ({
    raw: i.raw || "",
    name_en: i.name_en || null,
    name_ru: i.name_ru || null,
    qty: i.qty ?? null,
    unit: i.unit || null,
    note: i.note || null,
    section: i.section || null,
    ingredient_slug: i.ingredient_slug || slugifyIngredientName(i.name_en || i.name_ru || ""),
  }));
  if (JSON.stringify(draftIngredients) !== JSON.stringify(currentIngredients)) proposed.ingredients = draftIngredients;

  if (!Object.keys(proposed).length) { detailEditMode = false; detailDraft = null; renderDetailOverlay(); return; }

  detailSaving = true; renderDetailOverlay();
  const ok = await applyEvent("recipe_edit_proposed", { recipe_id: d.id, proposed });
  detailSaving = false;
  if (!ok) { renderDetailOverlay(); return; }
  await loadCatalog();
  const fresh = dish(d.id);
  const wentPending = !!(fresh && fresh.pending_edit && fresh.added_by_member_id && fresh.added_by_member_id !== me);
  detailEditMode = false; detailDraft = null;
  toast(wentPending
    ? T("Edit sent - waiting for the owning cook to approve.", "Изменение отправлено - ждём подтверждения от повара.")
    : T("Recipe updated.", "Рецепт обновлён."));
  if (tab === "spin") refreshDeck();
  if (detailOpen) renderDetailOverlay();
}

async function resolvePendingEdit(d, approve) {
  const ok = await applyEvent(approve ? "recipe_edit_accepted" : "recipe_edit_declined", { recipe_id: d.id });
  if (!ok) return;
  await loadCatalog();
  toast(approve ? T("Edit approved.", "Изменение принято.") : T("Edit declined - a new recipe was created.", "Изменение отклонено - создан новый рецепт."));
  if (tab === "spin") refreshDeck();
  if (detailOpen) renderDetailOverlay();
}

// Instant, no-approval toggle (unlike recipe_edit_*/pending_edit above) - this is a
// household preference, not a fact about the recipe, so any family member can flip
// it and see it take effect immediately. See 20260804_food_recipe_active_toggle.sql.
async function toggleRecipeActive(d) {
  if (detailSaving) return;
  const goingActive = !d.is_active;
  detailSaving = true; renderDetailOverlay();
  const ok = await applyEvent("recipe_active_set", { recipe_id: d.id, is_active: goingActive });
  detailSaving = false;
  if (!ok) { renderDetailOverlay(); return; }
  await loadCatalog();
  // Explains both halves of what just happened: (1) what changed for this one
  // recipe, and (2) that it's still showing up in Spin/Wish right now regardless -
  // inactive just means "opted out of the AI weekly fill" - and exactly where to
  // go if they actually want it out of sight (the filter icon by the search bar).
  stickyToast(goingActive
    ? T("Back in the mix - eligible for the AI weekly fill again.", "Снова участвует в автозаполнении ИИ.")
    : T("Hidden from AI weekly planning. Click the eye icon again to unhide. Stays visible in the Spinner - can be hidden completely in \"Filter\" settings above.", "Скрыто из недельного планирования ИИ. Нажмите на значок глаза ещё раз, чтобы вернуть. Всё ещё видно в Крутке - можно скрыть полностью в настройках «Фильтр» выше."));
  if (tab === "spin") refreshDeck();
  if (detailOpen) renderDetailOverlay();
}

// Uploads to the recipe-photos Storage bucket at <family_id>/<recipe_id>/<uuid>.<ext>
// (RLS on storage.objects checks the first path segment against the caller's
// family - 20260804020000 migration), then fires recipe_photo_added so
// food.apply_event decides whether it lands live or waits for the family
// admin (see the migration header for the exact rule).
async function uploadRecipePhoto(dishId, file) {
  const familyId = membership?.family_id;
  if (!familyId) { toast(T("Sign in first.", "Сначала войдите.")); return; }
  const ext = ((file.name || "").split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
  const path = `${familyId}/${dishId}/${crypto.randomUUID()}.${ext}`;
  toast(T("Uploading photo...", "Загружаем фото..."));
  const { error: upErr } = await sb.storage.from("recipe-photos").upload(path, file, {
    contentType: file.type || "image/jpeg",
    upsert: false,
  });
  if (upErr) { toast(T("Upload failed: ", "Ошибка загрузки: ") + upErr.message); return; }
  const { data: pub } = sb.storage.from("recipe-photos").getPublicUrl(path);
  const photoUrl = pub?.publicUrl;
  if (!photoUrl) { toast(T("Upload failed - no URL returned.", "Ошибка загрузки - URL не получен.")); return; }
  const ok = await applyEvent("recipe_photo_added", { recipe_id: dishId, photo_url: photoUrl });
  if (!ok) return;
  await loadCatalog();
  const d = dish(dishId);
  const wentLive = Boolean(d && d.photo_urls.includes(photoUrl));
  photoIdx[dishId] = wentLive ? Math.max(0, d.photo_urls.length - 1) : 0;
  toast(wentLive
    ? T("Photo added!", "Фото добавлено!")
    : T("Photo sent to the family admin for approval.", "Фото отправлено администратору на одобрение."));
  if (tab === "spin") refreshDeck();
  if (detailOpen) renderDetailOverlay();
}
async function resolvePendingPhoto(dishId, approve) {
  const ok = await applyEvent(approve ? "recipe_photo_approved" : "recipe_photo_declined", { recipe_id: dishId });
  if (!ok) return;
  await loadCatalog();
  photoIdx[dishId] = 0;
  toast(approve ? T("Photo approved.", "Фото одобрено.") : T("Photo declined.", "Фото отклонено."));
  if (tab === "spin") refreshDeck();
  if (detailOpen) renderDetailOverlay();
}

// Uploads a per-step photo the same way uploadRecipePhoto() uploads a hero
// photo (same bucket, same family-scoped path prefix so storage RLS applies
// unchanged - see 20260804020000), but returns the URL instead of writing it
// anywhere: the "cook" tab's edit mode stashes it into detailDraft.instructions[i].photo_url,
// and it only actually persists when the user hits "Save changes", riding
// along in the same recipe_edit_proposed{instructions:[...]} write as any
// other step edit. Returns null on failure (toasts the error itself).
async function uploadStepPhoto(dishId, file) {
  const familyId = membership?.family_id;
  if (!familyId) { toast(T("Sign in first.", "Сначала войдите.")); return null; }
  const ext = ((file.name || "").split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
  const path = `${familyId}/${dishId}/steps/${crypto.randomUUID()}.${ext}`;
  toast(T("Uploading photo...", "Загружаем фото..."));
  const { error: upErr } = await sb.storage.from("recipe-photos").upload(path, file, {
    contentType: file.type || "image/jpeg",
    upsert: false,
  });
  if (upErr) { toast(T("Upload failed: ", "Ошибка загрузки: ") + upErr.message); return null; }
  const { data: pub } = sb.storage.from("recipe-photos").getPublicUrl(path);
  if (!pub?.publicUrl) { toast(T("Upload failed - no URL returned.", "Ошибка загрузки - URL не получен.")); return null; }
  return pub.publicUrl;
}

function renderWish() {

function renderDuel() {

function ago(ts) { const s = (Date.now()-ts)/1000; if (s<60) return T("just now", "только что"); if (s<3600) return Math.floor(s/60)+T("m ago", " мин назад"); return Math.floor(s/3600)+T("h ago", " ч назад"); }

function wire() {
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  const pill = document.getElementById("mePill");
  // The "me" pill now opens Settings (which is where sign-out + invite live).

  if (pill) pill.onclick = openSettings;

  if (settings) settings.onclick = openSettings;

  // menu
  document.getElementById("confirm") && (document.getElementById("confirm").onclick = () => {
    game.locked = true;
    game.week.forEach(d => MEALS.forEach(m => { if (d[m.k]) delete d[m.k].proposal; }));
    commitAndSync(`${mem(me).en} confirmed the week`, "week_confirmed", { plan_id: activePlanId });
  });
  document.getElementById("unlock") && (document.getElementById("unlock").onclick = () => {
    game.locked = false;
    commitAndSync(`${mem(me).en} reopened the menu`, "week_unlocked", { plan_id: activePlanId });

  const aiBtn = document.getElementById("aiFill");

  document.querySelectorAll("[data-cookacc]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.cookacc.split("-"); acceptCook(+d,k); });
  document.querySelectorAll("[data-cookrej]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.cookrej.split("-"); declineCook(+d,k); });
  document.querySelectorAll("[data-cookreassign]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.cookreassign.split("-"); openReassignCook(+d,k); });
  document.querySelectorAll("[data-propacc]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.propacc.split("-"); acceptProposal(+d,k); });
  document.querySelectorAll("[data-proprej]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.proprej.split("-"); rejectProposal(+d,k); });
  document.querySelectorAll("[data-spin]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.spin.split("-"); tab="spin"; spinTarget={day:+d,meal:k}; render(); toast(T("Swipe right to fill ", "Свайпни вправо, чтобы заполнить ") + dayN(+d) + " " + MEALS.find(m=>m.k===k).ic); });
  document.querySelectorAll("[data-wish]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.wish.split("-"); wishTarget = { day: +d, meal: k }; tab="wish"; render(); openWish(); });
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    const [d,k]=b.dataset.edit.split("-");
    spinTarget = { day: +d, meal: k };
    tab = "spin"; render();
    toast(T("Swipe right to replace ", "Свайпни вправо, чтобы заменить ") + dayN(+d) + " " + MEALS.find(m=>m.k===k).ic);
  });
  document.querySelectorAll("[data-clearslot]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.clearslot.split("-"); clearSlot(+d,k); });
  document.querySelectorAll("[data-ainote]").forEach(b => b.onclick = () => { const [d,k]=b.dataset.ainote.split("-"); openAiNote(+d,k); });
  document.querySelectorAll("[data-openrecipe]").forEach(el => el.addEventListener("click", e => {
    if (e.target.closest("button")) return; // Accept/Decline/Reassign/Spin/Wish/etc. keep their own action
    openDetail(el.dataset.openrecipe);
  }));

  // spin
  const deckSearchEl = document.getElementById("deckSearch");
  if (deckSearchEl) deckSearchEl.addEventListener("input", e => { deckSearch = e.target.value; refreshDeck(); });
  if (document.getElementById("deckAdvQuick")) wireQuickFilterRow(app, "deckAdv", deckAdv, refreshDeck);
  if (document.getElementById("deckAdvToggle")) wireFilterToggle(app, "deckAdv", deckPanel);
  if (document.getElementById("deckAdvMeal")) wireAdvFilterPanel(app, "deckAdv", deckAdv, refreshDeck);
  wireSearchClear(app, "deckSearch", () => deckSearch, () => { deckSearch = ""; refreshDeck(); });
  wireSearchSuggest(app, "deckSearch", "deckAdv", q => deck(q), id => {
    const idx = deckOrder.indexOf(id);
    if (idx > 0) { deckOrder.splice(idx, 1); deckOrder.unshift(id); }
    deckSearch = "";
    if (deckSearchEl) deckSearchEl.value = "";
    refreshDeck();
  });
  wireStack();

  // wish
  document.getElementById("newWish") && (document.getElementById("newWish").onclick = () => { wishTarget = null; openWish(); });
  document.querySelectorAll("[data-wvote]").forEach(b => b.onclick = () => {
    const w = game.wishes[+b.dataset.wvote];
    w.votes.push(me);
    commitAndSync(`${mem(me).en} voted for a wish`, "wish_voted", { wish_id: w.id });
  });
  document.querySelectorAll("[data-wcommit]").forEach(b => b.onclick = async () => {
    const w = game.wishes[+b.dataset.wcommit];
    const d = w.kind === "dish" ? w.dish : (DISHES.find(x => w.kind !== "cuisine" || x.c === w.cuisine)?.id || DISHES[0]?.id);
    if (!d) return;
    w.committed = me;
    act(`${mem(me).en} granted ${mem(w.by).en}'s wish`);
    render();
    saving = true;
    const ok = await applyEvent("wish_granted", { wish_id: w.id });
    saving = false;
    if (ok) assignToSlot(w.day, w.meal || "dinner", d, me);
    toast(T("Wish granted - added to the menu 🎉", "Желание исполнено - добавлено в меню 🎉"));
  });

  // duel
  document.querySelectorAll("[data-duel]").forEach(c => c.onclick = () => {
    const p = game.duel.proposals[+c.dataset.duel];
    p.votes.push(me);
    if (game.duel.proposals.reduce((n, x) => n + x.votes.length, 0) >= 3) game.duel.open = false;
    commitAndSync(`${mem(me).en} voted in the duel`, "duel_voted", { proposal_id: p.id });
  });
}

// SPEC_AI_PREFILL.md #19: translates food.meal_slots.ai_note's machine-readable
// reason codes into the tap-to-expand explanation shown on a slot's badge.
const DAY_RULE_KIND_LABEL = {
  protein_type: ["protein day", "день белка"],
  cuisine: ["cuisine day", "день кухни"],
  diet_suitability: ["diet day", "день диеты"],
  dish_style: ["style day", "день стиля"],
};
function aiNoteText(note) {
  if (!note) return "";
  if (note.reason === "day_rule_skipped") {
    const kindPair = DAY_RULE_KIND_LABEL[note.rule_kind];
    const kindLabel = kindPair ? T(kindPair[0], kindPair[1]) : note.rule_kind;
    return T(
      `AI skipped this day's ${kindLabel} rule ("${note.rule_value}") to keep the meal safe for everyone attending.`,
      `ИИ пропустил правило "${kindLabel}" ("${note.rule_value}") на этот день, чтобы блюдо оставалось безопасным для всех.`
    );
  }
  if (note.reason === "no_safe_recipe") {
    return T(
      "AI couldn't find a recipe that's safe for everyone attending this meal (or that hasn't already been used this week) — left it empty rather than guess wrong.",
      "ИИ не нашёл рецепт, безопасный для всех участников этого приёма пищи (или ещё не использованный на этой неделе) — оставил слот пустым."
    );
  }
  if (note.reason === "no_qualified_cook") {
    return T(
      "AI found a safe recipe but no available cook whose skill level and Cook Grid match it — left it empty rather than assign the wrong person.",
      "ИИ нашёл безопасный рецепт, но не нашёл доступного повара подходящего уровня — оставил слот пустым."
    );
  }
  return T("AI made a note about this slot.", "ИИ оставил заметку об этом слоте.");
}

function openAssign(dishId) {

    <div style="font-size:11px;color:#999;margin-top:8px">${T("The cook gets pinged and must accept.", "Повар получит пинг и должен принять.")}</div>`);
  const upd = () => { v.querySelectorAll("#D .chip").forEach(c=>c.classList.toggle("on",+c.dataset.d===selDay));
    v.querySelectorAll("#M .chip").forEach(c=>c.classList.toggle("on",c.dataset.m===selMeal));

// Bug found 2026-08-09 (part 3): sb.functions.invoke() internally calls the
// SDK's getSession(), which in this supabase-js version serializes through a
// cross-tab navigator.locks mutex before it will even build the request and
// call fetch(). Confirmed via DevTools that submitting a link produced zero
// network activity at all (not even a pending request) in both a normal
// window and a fresh Incognito window with extensions disabled - the hang is
// inside the SDK, before any fetch is issued, consistent with a stuck lock.
// Fix: bypass sb.functions.invoke() entirely and call fetch() directly with
// the already-cached authSession.access_token, exactly like the existing
// (working) spin-food-invite call above - no getSession(), no lock, no hang.
const CLIENT_INVOKE_TIMEOUT_MS = 45_000;

// Bug found 2026-08-09 (follow-up): the same navigator.locks lock also
// wedges the SDK's silent token refresh path, so autoRefreshToken can go
// dormant while the local `authSession` still looks valid. Symptom: a review
// screen open for a while sends its Save request with an expired JWT and
// the server returns 401 "invalid session" (spin-food-import:478).
//
// We fix this the same way we fixed part 3: bypass the SDK entirely, refresh
// via a raw fetch to /auth/v1/token, and update `authSession` in place. Two
// entry points below: preemptive (if the local token is within 60s of
// expiry) and reactive (retry once after a 401 that looks auth-shaped).
async function refreshAccessTokenRaw() {
  const rt = authSession?.refresh_token;
  if (!rt) return false;
  try {
    const resp = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON,
        "Authorization": "Bearer " + SUPABASE_ANON,
      },
      body: JSON.stringify({ refresh_token: rt }),
    });
    if (!resp.ok) return false;
    const body = await resp.json().catch(() => null);
    if (!body?.access_token) return false;
    // Mirror the shape supabase-js's onAuthStateChange normally sets so
    // every other read of authSession.* stays oblivious to the source.
    authSession = {
      ...(authSession || {}),
      access_token: body.access_token,
      refresh_token: body.refresh_token ?? rt,
      expires_in: body.expires_in,
      expires_at: body.expires_at ?? (Math.floor(Date.now() / 1000) + (body.expires_in || 3600)),
      token_type: body.token_type || "bearer",
      user: body.user ?? authSession?.user,
    };
    return true;
  } catch {
    return false;
  }
}
const REFRESH_TIMEOUT_MS = 5_000;
async function refreshAccessTokenWithTimeout() {
  return await Promise.race([
    refreshAccessTokenRaw(),
    new Promise((resolve) => setTimeout(() => resolve(false), REFRESH_TIMEOUT_MS)),
  ]);
}
async function ensureFreshAccessToken() {
  const expAt = authSession?.expires_at;
  if (!expAt) return;
  const nowSec = Math.floor(Date.now() / 1000);
  if (nowSec >= expAt - 60) await refreshAccessTokenWithTimeout();
}
const AUTH_ERROR_HINT_RE = /invalid session|invalid token|jwt|unauthorized|missing bearer/i;

function invokeWithTimeout(fnName, opts, timeoutMs = CLIENT_INVOKE_TIMEOUT_MS) {
  console.log(`[invoke] -> ${fnName}`, opts?.body);
  const doFetch = (async () => {
    // Preemptive refresh: cheap local expiry check, then a bounded raw-fetch
    // refresh if we're close to expiry. Falls through unchanged if the token
    // is comfortably in the future.
    await ensureFreshAccessToken();
    const send = async () => {
      const accessToken = authSession?.access_token;
      if (!accessToken) {
        return { status: 401, body: { error: T("Session expired - please sign in again.", "Сессия истекла - войдите снова.") } };
      }
      try {
        const resp = await fetch(`${SUPABASE_URL}/functions/v1/${fnName}`, {
          method: "POST",
          headers: { "Authorization": "Bearer " + accessToken, "Content-Type": "application/json" },
          body: JSON.stringify(opts?.body ?? {}),
        });
        const body = await resp.json().catch(() => null);
        return { status: resp.status, body };
      } catch (e) {
        return { status: 0, body: null, networkError: e?.message || String(e) };
      }
    };
    let res = await send();
    // Reactive retry: one refresh + resend on an auth-shaped 401. Covers the
    // corner where the preemptive check said the token was fine but it
    // expired mid-flight, or where a server-side session invalidation
    // happened between the extract and the confirm.
    if (res.status === 401 && (!res.body?.error || AUTH_ERROR_HINT_RE.test(String(res.body?.error || "")))) {
      const refreshed = await refreshAccessTokenWithTimeout();
      if (refreshed) res = await send();
    }
    if (res.networkError) return { data: null, error: { message: res.networkError } };
    if (res.status !== 0 && res.status >= 400) {
      return { data: null, error: { message: res.body?.error || `Request failed (${res.status})` } };
    }
    return { data: res.body, error: null };
  })();
  const timeoutPromise = new Promise((resolve) => {
    setTimeout(() => resolve({ data: null, error: { message: T("Request timed out - please check your connection and try again.", "Превышено время ожидания - проверьте соединение и попробуйте снова.") } }), timeoutMs);
  });
  return Promise.race([doFetch, timeoutPromise]).then((res) => {
    console.log(`[invoke] <- ${fnName}`, res);
    return res;
  });
}
